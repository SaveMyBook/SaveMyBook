name: Generate Project Stats Table

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Stats and Update README
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let stats;

            for (let i = 0; i < 10; i++) {
              stats = await github.rest.repos.getContributorsStats({ owner, repo });
              if (stats.status === 200 && Array.isArray(stats.data) && stats.data.length > 0) break;
              console.log(`等待 GitHub 計算數據... (第 ${i + 1} 次，狀態: ${stats.status})`);
              await new Promise(r => setTimeout(r, 5000));
            }

            if (!stats || !stats.data || stats.data.length === 0) {
              core.setFailed("無法取得貢獻者統計數據");
              return;
            }

            const realUsers = stats.data.filter(u =>
              u.author &&
              u.author.type !== 'Bot' &&
              !u.author.login.toLowerCase().includes('bot') &&
              !u.author.login.toLowerCase().includes('actions')
            );

            const sorted = realUsers.sort((a, b) => b.total - a.total);

            const fmt = (n) => n.toLocaleString('en-US');
            const sum = (u, key) => u.weeks.reduce((s, w) => s + w[key], 0);
            const totalCommits = sorted.reduce((s, u) => s + u.total, 0);
            const totalAdditions = sorted.reduce((s, u) => s + sum(u, 'a'), 0);
            const totalDeletions = sorted.reduce((s, u) => s + sum(u, 'd'), 0);

            // 扁平徽章，配色比照 App：霧藍、成功綠、危險紅
            const badge = (label, value, color) =>
              `<img alt="${label} ${value}" src="https://img.shields.io/badge/${encodeURIComponent(label)}-${encodeURIComponent(value)}-${color}?style=flat-square">`;
            // 占比以等寬文字條呈現，不依賴外部圖片服務
            const bar = (ratio, width = 20) => {
              const full = Math.round(ratio * width);
              return '█'.repeat(full) + '░'.repeat(width - full);
            };

            let content = '\n\n<p align="center">\n';
            content += `  ${badge('貢獻者', String(sorted.length), '627D8D')}\n`;
            content += `  ${badge('提交', fmt(totalCommits), '627D8D')}\n`;
            content += `  ${badge('新增', '+' + fmt(totalAdditions), '2E9E5B')}\n`;
            content += `  ${badge('刪除', '−' + fmt(totalDeletions), 'D64545')}\n`;
            content += '</p>\n\n';

            content += '| 排名 | 貢獻者 | 提交 | 新增行數 | 刪除行數 | 提交占比 |\n';
            content += '| :-: | :-- | --: | --: | --: | :-- |\n';
            sorted.forEach((user, index) => {
              const ratio = totalCommits > 0 ? user.total / totalCommits : 0;
              const avatar = `<img src="${user.author.avatar_url}&s=48" width="20" height="20" alt="">`;
              const name = `[**${user.author.login}**](${user.author.html_url})`;
              content += `| ${index + 1} | ${avatar} ${name} | ${fmt(user.total)} | +${fmt(sum(user, 'a'))} | −${fmt(sum(user, 'd'))} | \`${bar(ratio)}\` ${(ratio * 100).toFixed(1)}% |\n`;
            });

            const taiwanTime = new Date(Date.now() + 8 * 60 * 60 * 1000);
            const timestamp = taiwanTime.toISOString().replace('T', ' ').substring(0, 16);
            content += `\n<p align="center"><sub>資料來源：GitHub 貢獻者統計（已排除機器人帳號）・每日 00:00（UTC+8）自動更新・最後更新 ${timestamp}</sub></p>\n\n`;

            const fs = require('fs');
            const path = 'README.md';
            if (!fs.existsSync(path)) {
              fs.writeFileSync(path, '# Project\n\n## 👥 團隊貢獻\n\n<!-- STATS:START -->\n<!-- STATS:END -->\n');
              console.log('📝 README.md 不存在，已自動建立');
            }

            let readme = fs.readFileSync(path, 'utf8');

            const startTag = '<!-- STATS:START -->';
            const endTag = '<!-- STATS:END -->';

            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);

            if (regex.test(readme)) {
              readme = readme.replace(regex, `${startTag}${content}${endTag}`);
              console.log('✅ 找到標籤，已更新統計表');
            } else {
              const injection = `\n\n## 👥 團隊貢獻\n\n${startTag}${content}${endTag}\n`;
              readme = readme.trimEnd() + injection;
              console.log('⚠️ 未找到標籤，已自動注入到 README 底部');
            }

            fs.writeFileSync(path, readme);

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "沒有需要提交的變更"
          else
            git commit -m "docs: 更新團隊貢獻數據表 [skip ci]"
            git pull --rebase origin main
            git push
          fi
