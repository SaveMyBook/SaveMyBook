name: Generate Project Stats Table

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stats and Update README
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let stats;
            
            for (let i = 0; i < 5; i++) {
              stats = await github.rest.repos.getContributorsStats({ owner, repo });
              if (stats.status === 200 && Array.isArray(stats.data) && stats.data.length > 0) {
                console.log("成功取得數據！");
                break;
              }
              console.log(`GitHub 正在計算數據中，等待 3 秒後重試... (第 ${i + 1} 次)`);
              await new Promise(r => setTimeout(r, 3000));
            }

            if (!stats || !stats.data || !Array.isArray(stats.data) || stats.data.length === 0) {
              console.log("重試失敗：無法取得有效的貢獻者數據。");
              return;
            }

            const realUsers = stats.data.filter(user => 
              user.author.type !== 'Bot' && 
              !user.author.login.toLowerCase().includes('bot')
            );

            const sorted = realUsers.sort((a, b) => b.total - a.total);

            let table = '\n<div align="center">\n\n<table>\n';
            table += '  <thead>\n    <tr>\n      <th>🏆 團隊成員 (Contributor)</th>\n      <th>📦 Commits</th>\n      <th>🟩 新增程式碼</th>\n      <th>🟥 刪除程式碼</th>\n    </tr>\n  </thead>\n  <tbody>\n';

            for (const user of sorted) {
              let additions = 0;
              let deletions = 0;
              user.weeks.forEach(w => {
                additions += w.a;
                deletions += w.d;
              });
              
              const login = user.author.login;
              const avatar = `<img src="${user.author.avatar_url}" width="35" style="border-radius: 50%; vertical-align: middle; margin-right: 8px;"/>`;
              const profile = `<a href="https://github.com/${login}" style="font-weight: bold; color: inherit;">${login}</a>`;
              
              table += `    <tr>\n`;
              table += `      <td align="left">${avatar}${profile}</td>\n`;
              table += `      <td align="center"><strong>${user.total}</strong></td>\n`;
              table += `      <td align="center">🟢 <code>+${additions.toLocaleString()}</code></td>\n`;
              table += `      <td align="center">🔴 <code>-${deletions.toLocaleString()}</code></td>\n`;
              table += `    </tr>\n`;
            }
            table += '  </tbody>\n</table>\n\n</div>\n';

            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            const startTag = '';
            const endTag = '';
            
            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);
            const newContent = `${startTag}${table}${endTag}`;
            
            if (regex.test(readme)) {
              readme = readme.replace(regex, newContent);
              fs.writeFileSync('README.md', readme);
              console.log("README.md 更新成功！");
            } else {
              console.log("錯誤：在 README.md 中找不到標記點！");
            }

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 專業化更新專案貢獻數據表" || echo "No changes to commit"
          git pull --rebase
          git push
