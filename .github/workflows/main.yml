name: Generate Project Stats Table

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stats and Update README
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let stats;
            
            for (let i = 0; i < 5; i++) {
              stats = await github.rest.repos.getContributorsStats({ owner, repo });
              if (stats.status === 200 && Array.isArray(stats.data) && stats.data.length > 0) break;
              console.log(`等待 GitHub 計算數據... (第 ${i + 1} 次)`);
              await new Promise(r => setTimeout(r, 3000));
            }

            if (!stats || !stats.data || stats.data.length === 0) return;

            const realUsers = stats.data.filter(u => 
              u.author.type !== 'Bot' && 
              !u.author.login.toLowerCase().includes('bot') &&
              !u.author.login.toLowerCase().includes('actions')
            );

            const sorted = realUsers.sort((a, b) => b.total - a.total);

            let table = '\n\n<table width="100%">\n  <thead>\n    <tr style="background-color: #f6f8fa;">\n      <th align="left">貢獻者</th>\n      <th>Commits</th>\n      <th>新增行數</th>\n      <th>刪除行數</th>\n    </tr>\n  </thead>\n  <tbody>\n';

            for (const user of sorted) {
              let a = 0, d = 0;
              user.weeks.forEach(w => { a += w.a; d += w.d; });
              const name = user.author.login;
              const avatar = `<img src="${user.author.avatar_url}" width="32" style="border-radius:50%; vertical-align:middle;">`;
              
              table += `    <tr>\n`;
              table += `      <td align="left">${avatar} &nbsp; <b><a href="${user.author.html_url}">${name}</a></b></td>\n`;
              table += `      <td align="center">${user.total}</td>\n`;
              table += `      <td align="center" style="color: #28a745;">+${a.toLocaleString()}</td>\n`;
              table += `      <td align="center" style="color: #d73a49;">-${d.toLocaleString()}</td>\n`;
              table += `    </tr>\n`;
            }
            table += '  </tbody>\n</table>\n\n';

            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            const startTag = '';
            const endTag = '';
            
            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);
            if (regex.test(readme)) {
              readme = readme.replace(regex, `${startTag}${table}${endTag}`);
              fs.writeFileSync('README.md', readme);
              console.log("成功更新統計表");
            } else {
              core.setFailed("在 README.md 中找不到對應的 標籤！");
            }

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 更新團隊貢獻數據表 [skip ci]" || echo "No changes"
          git pull --rebase
          git push
