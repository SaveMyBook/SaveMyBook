name: Generate Project Stats Table

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Stats and Update README
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let stats;

            for (let i = 0; i < 10; i++) {
              stats = await github.rest.repos.getContributorsStats({ owner, repo });
              if (stats.status === 200 && Array.isArray(stats.data) && stats.data.length > 0) break;
              console.log(`等待 GitHub 計算數據... (第 ${i + 1} 次，狀態: ${stats.status})`);
              await new Promise(r => setTimeout(r, 5000));
            }

            if (!stats || !stats.data || stats.data.length === 0) {
              core.setFailed("無法取得貢獻者統計數據");
              return;
            }

            const realUsers = stats.data.filter(u =>
              u.author &&
              u.author.type !== 'Bot' &&
              !u.author.login.toLowerCase().includes('bot') &&
              !u.author.login.toLowerCase().includes('actions')
            );

            const sorted = realUsers.sort((a, b) => b.total - a.total);

            const totalCommits = sorted.reduce((sum, u) => sum + u.total, 0);
            const totalAdditions = sorted.reduce((sum, u) =>
              sum + u.weeks.reduce((s, w) => s + w.a, 0), 0);
            const totalDeletions = sorted.reduce((sum, u) =>
              sum + u.weeks.reduce((s, w) => s + w.d, 0), 0);

            let badges = '\n\n<div align="center">\n\n';
            badges += `![Contributors](https://img.shields.io/badge/Contributors-${sorted.length}-blue?style=for-the-badge&logo=github)`;
            badges += ` ![Commits](https://img.shields.io/badge/Commits-${totalCommits}-green?style=for-the-badge&logo=git)`;
            badges += ` ![Additions](https://img.shields.io/badge/Additions-${totalAdditions.toLocaleString()}-success?style=for-the-badge)`;
            badges += ` ![Deletions](https://img.shields.io/badge/Deletions-${totalDeletions.toLocaleString()}-critical?style=for-the-badge)`;
            badges += '\n\n</div>\n\n';

            let table = '<table align="center" width="100%">\n';
            table += '  <thead>\n';
            table += '    <tr>\n';
            table += '      <th>🏆 排名</th>\n';
            table += '      <th align="left">👤 貢獻者</th>\n';
            table += '      <th>📝 Commits</th>\n';
            table += '      <th>➕ 新增行數</th>\n';
            table += '      <th>➖ 刪除行數</th>\n';
            table += '      <th>📊 貢獻比例</th>\n';
            table += '    </tr>\n';
            table += '  </thead>\n';
            table += '  <tbody>\n';

            const medals = ['🥇', '🥈', '🥉'];

            sorted.forEach((user, index) => {
              let a = 0, d = 0;
              user.weeks.forEach(w => { a += w.a; d += w.d; });

              const name = user.author.login;
              const rank = medals[index] || `#${index + 1}`;
              const percentage = totalCommits > 0
                ? ((user.total / totalCommits) * 100).toFixed(1)
                : 0;

              const progressBar = `<img src="https://progress-bar.xyz/${Math.round(percentage)}/?width=120" alt="${percentage}%">`;

              const userCell = `<a href="${user.author.html_url}"><b>${name}</b></a>`;

              table += '    <tr>\n';
              table += `      <td align="center" valign="middle"><h3>${rank}</h3></td>\n`;
              table += `      <td align="left" valign="middle">${userCell}</td>\n`;
              table += `      <td align="center" valign="middle"><b>${user.total}</b></td>\n`;
              table += `      <td align="center" valign="middle"><code>+${a.toLocaleString()}</code></td>\n`;
              table += `      <td align="center" valign="middle"><code>-${d.toLocaleString()}</code></td>\n`;
              table += `      <td align="center" valign="middle">${progressBar}</td>\n`;
              table += '    </tr>\n';
            });

            table += '  </tbody>\n</table>\n\n';

            const now = new Date();
            const taiwanTime = new Date(now.getTime() + 8 * 60 * 60 * 1000);
            const timestamp = taiwanTime.toISOString().replace('T', ' ').substring(0, 19);
            const footer = `<div align="center">\n\n<sub>📅 最後更新：${timestamp} (UTC+8)</sub>\n\n</div>\n\n`;

            const content = badges + table + footer;

            const fs = require('fs');
            const path = 'README.md';
            if (!fs.existsSync(path)) {
              fs.writeFileSync(path, '# Project\n\n## 👥 團隊貢獻\n\n<!-- STATS:START -->\n<!-- STATS:END -->\n');
              console.log('📝 README.md 不存在，已自動建立');
            }

            let readme = fs.readFileSync(path, 'utf8');

            const startTag = '<!-- STATS:START -->';
            const endTag = '<!-- STATS:END -->';

            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);

            if (regex.test(readme)) {
              readme = readme.replace(regex, `${startTag}${content}${endTag}`);
              console.log('✅ 找到標籤，已更新統計表');
            } else {
              const injection = `\n\n## 👥 團隊貢獻\n\n${startTag}${content}${endTag}\n`;
              readme = readme.trimEnd() + injection;
              console.log('⚠️ 未找到標籤，已自動注入到 README 底部');
            }

            fs.writeFileSync(path, readme);

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "沒有需要提交的變更"
          else
            git commit -m "docs: 更新團隊貢獻數據表 [skip ci]"
            git pull --rebase origin main
            git push
          fi
