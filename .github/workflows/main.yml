name: Generate Project Stats Table

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stats and Update README
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const stats = await github.rest.repos.getContributorsStats({ owner, repo });
            
            if (!stats.data || !Array.isArray(stats.data)) {
              console.log("Waiting for GitHub to compute stats...");
              return;
            }

            const sorted = stats.data.sort((a, b) => b.total - a.total);
            let table = '\n<div align="center">\n\n| 貢獻者 | Commit | 新增程式碼 | 刪除程式碼 |\n| :--- | :---: | :---: | :---: |\n';

            for (const user of sorted) {
              let additions = 0;
              let deletions = 0;
              user.weeks.forEach(w => {
                additions += w.a;
                deletions += w.d;
              });
              
              const login = user.author.login;
              const avatar = `<img src="${user.author.avatar_url}" width="35" style="border-radius:50%"/>`;
              table += `| ${avatar} **[${login}](https://github.com/${login})** | ${user.total} | <font color="#2da44e">+${additions.toLocaleString()}</font> | <font color="#cf222e">-${deletions.toLocaleString()}</font> |\n`;
            }
            table += '\n</div>\n';

            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            const startTag = '<bla>';
            const endTag = '<blabla>';
            
            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);
            const newContent = `${table}`;
            
            if (regex.test(readme)) {
              readme = readme.replace(regex, newContent);
              fs.writeFileSync('README.md', readme);
            } else {
              console.log("錯誤：在 README.md 中找不到標記點！");
            }

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 專業化更新專案貢獻數據表" || echo "No changes"
          git pull --rebase
          git push
