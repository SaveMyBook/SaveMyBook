<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "NotoTC"; font-weight: 500; src: url("../../../../savemybook_app/assets/fonts/NotoSansTC-Medium.ttf"); }
  @font-face { font-family: "NotoTC"; font-weight: 700; src: url("../../../../savemybook_app/assets/fonts/NotoSansTC-Bold.ttf"); }
  @font-face { font-family: "NotoTC"; font-weight: 900; src: url("../../../../savemybook_app/assets/fonts/NotoSansTC-Black.ttf"); }
  :root {
    --stage: #F3F5F7; --text: #151E27; --muted: #5B6770; --brand: #627D8D; --brand-deep: #4A6372;
    --brand-tint: #E8EDF0; --border: #E3E7EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); }
  body { position: relative; font-family: "NotoTC", sans-serif; color: var(--text); }

  /* 舞台：與動畫相同的淺灰底、白色柔光與點陣 */
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 900px 700px at 1420px 560px, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 900px 600px at 420px 520px, rgba(255,255,255,.55), rgba(255,255,255,0) 70%); }
  .grid { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(98,125,141,.22) 1.2px, transparent 1.6px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 1100px 800px at 1300px 540px, #000 20%, transparent 75%); }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(98,125,141,.10); }

  /* 產品主視覺 */
  .feather {
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 7%, #000 93%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .cabinet { position: absolute; left: 930px; top: 118px; width: 700px; }
  .phone { position: absolute; left: 1468px; top: 214px; width: 410px;
    filter: drop-shadow(0 30px 40px rgba(11,26,38,.16)); }
  .badge { position: absolute; left: 1392px; top: 150px; display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1.5px solid var(--border); border-radius: 999px; padding: 12px 24px 12px 16px;
    box-shadow: 0 10px 24px rgba(11,26,38,.08); font-weight: 700; font-size: 28px; color: var(--text); }
  .badge i { width: 34px; height: 34px; border-radius: 50%; background: #2E9E5B; display: grid; place-items: center; }

  /* 左側文字 */
  .copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; font-weight: 700; font-size: 30px;
    letter-spacing: .12em; color: var(--brand); margin-bottom: 34px; }
  .eyebrow::before { content: ""; width: 44px; height: 3px; border-radius: 2px; background: var(--brand); }
  .logo { width: 172px; margin: 0 0 18px -6px; filter: drop-shadow(0 14px 24px rgba(74,99,114,.22)); }
  h1 { font-weight: 900; font-size: 150px; line-height: 1.02; letter-spacing: -.01em; font-feature-settings: "palt"; white-space: nowrap; }
  h1 .b { background: linear-gradient(180deg, #7C97A6 0%, #4A6372 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-weight: 700; font-size: 50px; line-height: 1.3; color: #2B3740; letter-spacing: .01em; }
  .chips { display: flex; gap: 16px; margin-top: 46px; }
  .chip { display: flex; align-items: center; gap: 12px; background: #fff; border: 1.5px solid var(--border); border-radius: 999px;
    padding: 14px 26px 14px 20px; font-weight: 700; font-size: 30px; box-shadow: 0 8px 20px rgba(11,26,38,.06); }
  .chip svg { width: 30px; height: 30px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="ring" style="left:1010px;top:60px;width:960px;height:960px"></div>
  <div class="ring" style="left:1130px;top:180px;width:720px;height:720px"></div>

  <img class="cabinet feather" src=".cache/cabinet.png">
  <img class="phone feather" src=".cache/phone.png">
  <div class="badge"><i><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>存書完成</div>

  <div class="copy">
    <div class="eyebrow">智慧書櫃 × 二手書交易</div>
    <img class="logo" src=".cache/logo.svg">
    <h1>救<span class="b">「舊」</span>我的書</h1>
    <div class="sub">放進書櫃，就能安心賣書</div>
    <div class="chips">
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2v2h-2zM18 14h2v2h-2z" fill="#627D8D"/></svg>掃碼存取</div>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#627D8D"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>款項暫管</div>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M10 2l1.8 5.2L17 9l-5.2 1.8L10 16l-1.8-5.2L3 9l5.2-1.8zM18 13l.9 2.6 2.6.9-2.6.9L18 20l-.9-2.6-2.6-.9 2.6-.9z" fill="#627D8D"/></svg>AI 輔助</div>
    </div>
  </div>
</body>
</html>
