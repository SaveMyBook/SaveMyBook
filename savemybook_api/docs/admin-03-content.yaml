tags:
  - name: admin-content
    x-displayName: 後台：內容管理
    description: |
      書籍稽核與分類維護。本組端點均需 `can_manage_content` 權限。

      違規下架須透過 `PATCH /api/admin/reports/{id}` 並帶入
      `remove_target` 為 true，該操作會同時將書籍設為 `removed`
      並將 `is_approved` 設為 false，使賣家無法自行重新上架。

      本組的 `PATCH /api/admin/books/{id}` 僅異動 `status`，不影響 `is_approved`。

paths:
  /api/admin/books:
    get:
      summary: 書籍列表
      operationId: adminListBooks
      tags: [admin-content]
      description: |
        分頁查詢全站書籍，依上架時間遞減排序。回應採扁平化格式，
        與 `GET /api/books` 的巢狀結構不同。

        `pending_report_count` 為該書籍待處理的檢舉數。由於 `reports` 採
        `target_type` 搭配 `target_id` 的多型設計，未建立指向 `books` 的外鍵關聯，
        此數值由獨立的分組查詢補入。

        回應附帶 `author`、`publisher`、`publish_date`、`condition_note`、`description`
        與 `category_id`，供 `PUT /api/admin/books/{id}` 的編輯表單以現值開場。
        改由 `GET /api/books/{id}` 取得的話，每次開啟編輯畫面都會替賣家的
        瀏覽數加一。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
          description: 同時對書名、ISBN 與賣家暱稱進行比對。
          example: 挪威
        - in: query
          name: status
          schema: { type: string, enum: [on_sale, reserved, sold, removed, all] }
          description: 書籍狀態。帶入 `all` 或未帶入代表不套用此條件。
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        book_id: { type: integer, example: 101 }
                        pending_report_count: { type: integer, description: 待處理的檢舉數, example: 2 }
                        title: { type: string, example: 挪威的森林 }
                        isbn: { type: string, nullable: true }
                        price: { type: string, example: '180.00' }
                        status: { type: string, enum: [on_sale, reserved, sold, removed] }
                        is_approved:
                          type: boolean
                          description: false 表示不公開顯示（違規下架、停止公開顯示或等待上架審核）；`reserved`、`sold` 且為 false 即為經審核停止公開顯示。
                          example: true
                        condition_level: { type: string, enum: [like_new, good, fair, poor] }
                        view_count: { type: integer, example: 42 }
                        created_at: { type: string, format: date-time }
                        seller: { $ref: '#/components/schemas/UserBrief' }
                        category_id: { type: integer, nullable: true }
                        category_name: { type: string, description: 書籍未分類時為空字串。, example: 文學小說 }
                        image_url: { type: string, nullable: true, description: 首張照片的路徑。 }
                        author: { type: string, nullable: true }
                        publisher: { type: string, nullable: true }
                        publish_date: { type: string, nullable: true }
                        condition_note: { type: string, nullable: true }
                        description: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/books/{id}:
    put:
      summary: 修改書籍資料
      operationId: adminUpdateBook
      tags: [admin-content]
      description: |
        供客服代為更正賣家填錯的商品資料（錯字、分類放錯、價格多一個零）。
        部分更新：只有帶入的欄位會被寫入，未帶入的維持原值。

        **與 `PATCH` 分開的原因**：下架是處分，要留原因並通知賣家；
        更正是代為維護。混在同一個端點會讓「只想改個錯字」也送出一則
        「你的書被下架」的通知。

        操作一律通知賣家。書名或售價有變動時，通知會寫出改成什麼——
        商品是賣家的，價格被動過必須讓他知道。稽核紀錄同樣記下異動欄位。

        修改的簡介、作者、出版社與出版日期之後不再由系統依 ISBN 自動補齊。更正 ISBN 時，比照賣家修改：
        依舊 ISBN 自動補齊、且未在同一次請求中修改的這些欄位會清空，並在背景依新的 ISBN 重新補齊；交易中或已完成的書籍不清空。

        照片不由此端點處理，請使用 `POST /api/books/{id}/images`
        與 `DELETE /api/books/{id}/images/{imageId}`。
        上下架請使用同路徑的 `PATCH`。

        需 `can_manage_content` 權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 書籍編號。
          example: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 至少要帶一個欄位。
              properties:
                title: { type: string, maxLength: 255, description: 不可為空字串。, example: 演算法圖鑑 }
                author: { type: string, nullable: true, description: 空字串視為清空為 null。 }
                publisher: { type: string, nullable: true }
                publish_date: { type: string, nullable: true, example: '2020-05-03' }
                isbn:
                  type: string
                  nullable: true
                  pattern: '^\d{10}(\d{3})?$'
                  description: 10 或 13 位數字，空字串視為清空。
                  example: '9789863123456'
                category_id: { type: integer, nullable: true, description: 須為既有分類；null 表示取消分類。 }
                condition_level:
                  type: string
                  enum: [like_new, good, fair, poor]
                condition_note: { type: string, nullable: true }
                price: { type: number, minimum: 0, maximum: 999999, example: 320 }
                description: { type: string, nullable: true }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新 }
        '400':
          description: 欄位不合法，或一個欄位都沒帶。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                書名: { value: { success: false, message: 書名為必填，且不可超過 255 個字元 } }
                售價: { value: { success: false, message: 售價須介於 0 至 999999 } }
                書況: { value: { success: false, message: 不支援的書況 } }
                ISBN: { value: { success: false, message: 'ISBN 必須是 10 或 13 位數字' } }
                分類不存在: { value: { success: false, message: 找不到此分類 } }
                空請求: { value: { success: false, message: 沒有需要修改的欄位 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: 找不到此書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此書籍 }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      summary: 強制上下架書籍
      operationId: adminUpdateBookStatus
      tags: [admin-content]
      description: |
        僅能設為 `on_sale` 或 `removed`。`reserved` 與 `sold` 由交易流程決定，
        不開放手動異動。

        操作會發送通知予賣家，下架時 `reason` 將包含於通知內容中，
        並寫入稽核紀錄。恢復上架時未結的上架審核一併標記為通過；恢復的是背景審核直接駁回的書時，
        計入 AI 品質報表的推翻比例。

        強制下架與檢舉成立、上架審核拒絕一致，一併將 `is_approved` 設為 false：賣家不可自行重新上架
        （`PUT /api/books/{id}` 回 403 `BOOK_NOT_APPROVED`），須由管理員以本端點恢復上架，恢復時 `is_approved` 改回 true。
        書籍的上架審核仍在待審時一併結案為 `rejected`（`reviewed_by` 為執行的管理員，不計入 AI 誤判統計），
        否則待審不視為違規，賣家仍可自行重新上架；管理員恢復上架時審核改為通過。
        管理員以 `PUT /api/books/{id}`（`status: removed`）或 `DELETE /api/books/{id}` 下架時同樣套用本端點的下架流程。

        書籍登記存放於書櫃（訂單成立前存書）時：下架後賣家取回不會自動恢復上架；
        恢復上架已滿 7 天的存書時，存書天數自恢復上架時重新起算，不再提醒賣家取回。
        還原本操作（`POST /api/admin/operation-logs/{id}/undo`）時比照反向操作處理存書紀錄。

        **下架時的交易處理**（與檢舉成立並下架、上架審核拒絕相同）：

        - 待回覆與保留中的預約一律取消，通知買家。
        - 買家尚未取書的訂單（`pending_payment`、`pending_deposit`、未取書的 `deposited`／`pending_pickup`）自動取消並全額退款，
          通知買賣雙方；訂單內其他書籍依一般取消流程恢復販售或留在書櫃，下架的書維持 `removed`，
          仍在櫃中者恢復存書登記、不公開販售，待賣家取回，取回後不自動恢復上架。
          訂單正於書櫃作業中或有待確認的書櫃紀錄時暫不取消，由排程接續或交由管理員處理（見「訂單」說明）。
        - 買家已取書（待完成訂單，以及已取書而爭議處理中）的書比照已完成交易的書：不改狀態，只設為不公開顯示（`is_approved` 為 false），
          訂單照常進行，完成時正常轉為 `sold`；通知賣家「您的書籍已停止公開顯示」，操作紀錄記為「停止公開顯示」，回應訊息為「已停止公開顯示」。
        - 尚未取書而爭議處理中的訂單不自動取消，書籍改為 `removed`；裁決後訂單恢復進行時由排程取消。已完成的訂單不受影響。
        - 已完成交易（`sold`）的書不可下架，回傳 409。
        - 下架時書籍有進行中訂單（`reserved`）者，操作紀錄不提供還原。

        恢復上架時書籍仍有未結束的訂單回傳 409 `BOOK_HAS_OPEN_ORDER`。書籍由無法購買轉為販售中且公開時，
        通知收藏此書的會員（不含賣家；書籍仍有他人保留中的預約時不通知）。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [on_sale, removed] }
                reason:
                  type: string
                  description: 下架原因，將包含於發送給賣家的通知，並寫入稽核紀錄。
                  example: 商品描述與實物不符
            example: { status: removed, reason: 商品描述與實物不符 }
      responses:
        '200':
          description: 已更新。`data` 為處理後的結果，App 可直接更新列表，不必重新查詢。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已下架 }
                  data:
                    type: object
                    properties:
                      book_id: { type: integer, example: 101 }
                      hidden: { type: boolean, description: 為 true 時書籍狀態不變，只停止公開顯示（買家已取書的書）。, example: false }
                      status: { type: string, enum: [on_sale, reserved, removed], description: 處理後的書籍狀態, example: removed }
                      is_approved: { type: boolean, description: 處理後是否公開顯示, example: false }
              examples:
                下架: { value: { success: true, message: 已下架, data: { book_id: 101, hidden: false, status: removed, is_approved: false } } }
                買家已取書而只停止公開顯示: { value: { success: true, message: 已停止公開顯示, data: { book_id: 101, hidden: true, status: reserved, is_approved: false } } }
                恢復上架: { value: { success: true, message: 已恢復上架, data: { book_id: 101, hidden: false, status: on_sale, is_approved: true } } }
        '400':
          description: 狀態值不合法。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅可設定為上架或下架 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 書籍交易狀態不允許此操作。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已完成交易不可下架: { value: { success: false, message: 此書籍已完成交易，無法下架 } }
                交易中不可恢復上架: { value: { success: false, message: 此書籍已售出（訂單進行中），無法恢復上架 } }
                已完成交易不可恢復上架: { value: { success: false, message: 此書籍已完成交易，無法恢復上架 } }
                訂單未結束: { value: { success: false, code: BOOK_HAS_OPEN_ORDER, message: 此書籍尚有進行中的訂單，無法重新上架 } }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除書籍
      operationId: adminDeleteBook
      tags: [admin-content]
      description: |
        永久刪除書籍，用於重複刊登、測試資料等不需保留的商品。此操作不可復原，操作紀錄不提供還原。

        - 書籍狀態為 `reserved`，或有 `pending`、保留期限內 `confirmed` 的預約時回傳 409 `BOOK_IN_TRANSACTION`
        - 已有訂單紀錄時回傳 409 `BOOK_HAS_ORDERS`；為保留交易資料，此類書籍請改用 `PATCH` 強制下架
        - 書籍仍登記存放於書櫃（訂單成立前存書）時回傳 409 `BOOK_DEPOSITED`；請先由人員取出並以
          `POST /api/admin/cabinets/deposits/{bookId}/clear` 登記後再刪除

        刪除時一併移除已結束的預約、購物車項目、收藏、推薦紀錄與書籍照片資料，
        關聯此書籍的聊天室保留並解除關聯。完成後通知賣家（附上 `reason`）並寫入稽核紀錄。
        已上傳的照片檔案不會被刪除。

        需 `can_manage_content` 權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 書籍編號。
          example: 101
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
                  description: 刪除原因，將包含於發送給賣家的通知，並寫入稽核紀錄。
                  example: 重複刊登
            example: { reason: 重複刊登 }
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已刪除書籍 }
        '400':
          description: 書籍編號或原因格式不正確。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 原因不可超過 200 個字 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: 找不到此書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此書籍 }
        '409':
          description: 書籍交易或預約進行中、已有訂單紀錄，或書籍仍存放於書櫃。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                交易或預約進行中:
                  value: { success: false, code: BOOK_IN_TRANSACTION, message: 此書籍交易或預約進行中，請先處理後再刪除 }
                已有訂單:
                  value: { success: false, code: BOOK_HAS_ORDERS, message: 此書籍已有訂單紀錄，為保留交易資料無法刪除，如需停止販售請使用強制下架 }
                仍存放於書櫃:
                  value: { success: false, code: BOOK_DEPOSITED, message: 此書籍仍存放於書櫃，請先於存書列表登記取出後再刪除 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/categories:
    get:
      summary: 分類列表（含書籍數）
      operationId: adminListCategories
      tags: [admin-content]
      description: |
        回傳扁平清單，依排序值排列。各筆包含該分類底下的書籍數，
        供判斷是否可刪除。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        category_id: { type: integer, example: 3 }
                        category_name: { type: string, example: 文學小說 }
                        sort_order: { type: integer, example: 0 }
                        book_count: { type: integer, description: 該分類底下的書籍數, example: 312 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 新增分類
      operationId: adminCreateCategory
      tags: [admin-content]
      description: 建立分類，名稱長度上限 50 字。操作會寫入稽核紀錄。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name: { type: string, maxLength: 50, example: 文學小說 }
                sort_order: { type: integer, default: 0 }
      responses:
        '201':
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      category_id: { type: integer, example: 9 }
        '400':
          description: 名稱為空白或超出長度上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                名稱為空白:
                  value: { success: false, message: 請輸入分類名稱 }
                名稱過長:
                  value: { success: false, message: 分類名稱不可超過 50 個字 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/categories/reorder:
    put:
      summary: 重新排序分類
      operationId: adminReorderCategories
      tags: [admin-content]
      description: |
        重新設定分類排序。請帶入已排序的完整編號陣列，伺服器依陣列索引
        將 `sort_order` 重寫為 0、1、2 等序號。

        整批更新於同一資料庫交易內完成，中途失敗不會產生部分更新的狀態。

        寫入前會驗證所有編號均存在，任一編號無效即整批拒絕。

        > 路由定義順序須置於 `/categories/{id}` 之前，
        > 否則 `reorder` 會被解析為分類編號。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: integer }
                  minItems: 1
                  description: 已排序的分類編號，陣列索引即為新的 `sort_order`。
                  example: [5, 3, 9, 1]
      responses:
        '200':
          description: 已更新排序。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新排序 }
        '400':
          description: 陣列為空、格式錯誤，或包含不存在的分類。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                陣列為空:
                  value: { success: false, message: 請提供排序後的分類順序 }
                格式錯誤:
                  value: { success: false, message: 排序資料格式不正確 }
                包含無效編號:
                  value: { success: false, message: 排序資料含有不存在的分類 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 分類編號。
        example: 3

    put:
      summary: 編輯分類
      operationId: adminUpdateCategory
      tags: [admin-content]
      description: 更新分類名稱與排序值。操作會寫入稽核紀錄。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name: { type: string, maxLength: 50 }
                sort_order: { type: integer, default: 0 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新分類 }
        '400':
          description: 名稱為空白。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請輸入分類名稱 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除分類
      operationId: adminDeleteCategory
      tags: [admin-content]
      description: |
        分類底下仍有書籍時不得刪除，錯誤訊息會回報剩餘書籍數，
        以避免書籍失去分類關聯。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已刪除分類 }
        '400':
          description: 該分類底下仍有書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此分類仍有 312 本書籍，請先調整後再刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
