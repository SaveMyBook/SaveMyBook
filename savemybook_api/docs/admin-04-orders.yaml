tags:
  - name: 後台：訂單管理
    description: |
      訂單查詢與人工調整狀態。本組端點需 `can_manage_orders` 權限。

      > 此處的狀態調整僅異動訂單資料，不連動錢包。
      > 退款須經「後台：檢舉與爭議」的爭議裁決端點執行，該端點才會寫入退款紀錄。

paths:
  /api/admin/orders:
    get:
      summary: 訂單列表
      operationId: adminListOrders
      tags: [後台：訂單管理]
      description: |
        分頁查詢全站訂單，依建立時間遞減排序。

        回應為整併後的扁平格式，與 `GET /api/orders` 的巢狀結構不同：
        買賣雙方分別置於 `buyer` 與 `seller`，書籍項目攤平於 `items`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
          description: 同時對訂單編號、買家暱稱與賣家暱稱進行比對。
          example: SMB20250911
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_payment, pending_deposit, deposited, pending_pickup, completed, cancelled, refunding, refunded, all]
          description: 訂單狀態。帶入 `all` 或未帶入代表不套用此條件。
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/orders/{id}:
    get:
      summary: 訂單詳情
      operationId: adminGetOrder
      tags: [後台：訂單管理]
      description: |
        單筆訂單的完整樣貌。列表為求輕量只帶摘要，這裡補上客服在處理一筆
        爭議時真正需要的細節：錢什麼時候扣的、書放進哪一格、退過款沒有、
        對方申訴了什麼。

        `timeline` 的每個欄位對應流程中的一個節點，`null` 表示尚未走到，
        可用來判斷訂單卡在哪一步。

        `wallet_transactions` 為這筆訂單造成的所有錢包異動（依時間遞增），
        買賣雙方的紀錄都在內，可與 `total_amount` 對帳。

        需 `can_manage_orders` 權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 訂單編號（`order_id`，非 `order_no`）。
          example: 501
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AdminOrder'
                      - type: object
                        properties:
                          payment_method: { type: string, nullable: true, example: wallet }
                          note: { type: string, nullable: true, description: 客服調整狀態時留下的說明。 }
                          updated_at: { type: string, format: date-time }
                          slot:
                            type: object
                            nullable: true
                            description: 指派到的櫃位；未指派時為 null。
                            properties:
                              slot_id: { type: integer, example: 17 }
                              slot_number: { type: string, example: A-03 }
                              status: { type: string, enum: [empty, occupied, reserved, maintenance] }
                          timeline:
                            type: object
                            description: 各節點時間，null 代表尚未發生。
                            properties:
                              created_at: { type: string, format: date-time }
                              payment_at: { type: string, format: date-time, nullable: true }
                              deposited_at: { type: string, format: date-time, nullable: true, description: 賣家放書進櫃的時間。 }
                              picked_up_at: { type: string, format: date-time, nullable: true, description: 買家取書的時間。 }
                              completed_at: { type: string, format: date-time, nullable: true }
                              cancelled_at: { type: string, format: date-time, nullable: true }
                          refunds:
                            type: array
                            description: 退款紀錄，新的在前。
                            items:
                              type: object
                              properties:
                                refund_id: { type: integer }
                                refund_type: { type: string }
                                amount: { type: number }
                                reason: { type: string, nullable: true }
                                status: { type: string }
                                created_at: { type: string, format: date-time }
                                processed_at: { type: string, format: date-time, nullable: true }
                          disputes:
                            type: array
                            description: 這筆訂單的申訴案件，新的在前。
                            items:
                              type: object
                              properties:
                                dispute_id: { type: integer }
                                reason: { type: string }
                                status: { type: string }
                                result: { type: string, nullable: true }
                                admin_note: { type: string, nullable: true }
                                created_at: { type: string, format: date-time }
                                resolved_at: { type: string, format: date-time, nullable: true }
                          wallet_transactions:
                            type: array
                            description: 因這筆訂單產生的錢包異動，依時間遞增。
                            items:
                              type: object
                              properties:
                                txn_id: { type: integer }
                                type: { type: string }
                                amount: { type: number }
                                balance_after: { type: number }
                                description: { type: string, nullable: true }
                                created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: 找不到這筆訂單。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到這筆訂單 }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      summary: 人工調整訂單狀態
      operationId: adminUpdateOrderStatus
      tags: [後台：訂單管理]
      description: |
        接受全部八種訂單狀態，供客服處理流程中斷的訂單。

        設為 `completed` 時補寫完成時間；設為 `cancelled` 時補寫取消時間，
        `cancel_reason` 未帶入時預設寫入「管理員手動取消」。

        操作會通知買家訂單狀態已由客服調整，並寫入稽核紀錄。

        > 本端點不執行退款或撥款，僅異動訂單資料，錢包餘額不受影響。
        > 退款請使用 `PATCH /api/admin/disputes/{id}`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending_payment, pending_deposit, deposited, pending_pickup, completed, cancelled, refunding, refunded]
                note:
                  type: string
                  description: 說明文字，將包含於發送給買家的通知；取消時一併寫入 `cancel_reason`。
                  example: 買家聯繫客服表示已取書
            example: { status: completed, note: 買家聯繫客服表示已取書 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 訂單狀態已更新 }
        '400':
          description: 狀態值不合法。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 不支援的訂單狀態 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
