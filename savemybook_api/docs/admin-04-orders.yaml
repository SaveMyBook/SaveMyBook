tags:
  - name: 後台：訂單管理
    description: |
      訂單查詢與人工調整狀態。本組端點需 `can_manage_orders` 權限。

      > 此處的狀態調整僅異動訂單資料，不連動錢包。
      > 退款須經「後台：檢舉與爭議」的爭議裁決端點執行，該端點才會寫入退款紀錄。

paths:
  /api/admin/orders:
    get:
      summary: 訂單列表
      operationId: adminListOrders
      tags: [後台：訂單管理]
      description: |
        分頁查詢全站訂單，依建立時間遞減排序。

        回應為整併後的扁平格式，與 `GET /api/orders` 的巢狀結構不同：
        買賣雙方分別置於 `buyer` 與 `seller`，書籍項目攤平於 `items`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
          description: 同時對訂單編號、買家暱稱與賣家暱稱進行比對。
          example: SMB20250911
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_payment, pending_deposit, deposited, pending_pickup, completed, cancelled, refunding, refunded, all]
          description: 訂單狀態。帶入 `all` 或未帶入代表不套用此條件。
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        order_id: { type: integer, example: 40 }
                        order_no: { type: string, example: SMB20250911143012517 }
                        status: { type: string, example: pending_deposit }
                        total_amount: { type: string, example: '360.00' }
                        created_at: { type: string, format: date-time }
                        completed_at: { type: string, format: date-time, nullable: true }
                        cancelled_at: { type: string, format: date-time, nullable: true }
                        cancel_reason: { type: string, nullable: true }
                        pickup_code: { type: string, nullable: true, example: '482913' }
                        buyer: { $ref: '#/components/schemas/UserBrief' }
                        seller: { $ref: '#/components/schemas/UserBrief' }
                        cabinet:
                          type: object
                          nullable: true
                          properties:
                            cabinet_id: { type: integer }
                            cabinet_name: { type: string }
                            address: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              book_id: { type: integer, nullable: true }
                              title: { type: string }
                              unit_price: { type: string }
                              subtotal: { type: string }
                              quantity: { type: integer }
                              image_url: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/orders/{id}:
    patch:
      summary: 人工調整訂單狀態
      operationId: adminUpdateOrderStatus
      tags: [後台：訂單管理]
      description: |
        接受全部八種訂單狀態，供客服處理流程中斷的訂單。

        設為 `completed` 時補寫完成時間；設為 `cancelled` 時補寫取消時間，
        `cancel_reason` 未帶入時預設寫入「管理員手動取消」。

        操作會通知買家訂單狀態已由客服調整，並寫入稽核紀錄。

        > 本端點不執行退款或撥款，僅異動訂單資料，錢包餘額不受影響。
        > 退款請使用 `PATCH /api/admin/disputes/{id}`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending_payment, pending_deposit, deposited, pending_pickup, completed, cancelled, refunding, refunded]
                note:
                  type: string
                  description: 說明文字，將包含於發送給買家的通知；取消時一併寫入 `cancel_reason`。
                  example: 買家聯繫客服表示已取書
            example: { status: completed, note: 買家聯繫客服表示已取書 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 訂單狀態已更新 }
        '400':
          description: 狀態值不合法。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 不支援的訂單狀態 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
