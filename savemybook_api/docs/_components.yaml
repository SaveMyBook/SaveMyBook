# 共用元件定義，供 docs/ 目錄下各文件以 $ref 引用。

components:
  parameters:
    Page:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 頁碼，自 1 起算。超出總頁數時回傳空陣列，不視為錯誤。
      example: 1
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, default: 20 }
      description: 每頁筆數。
      example: 20
    VerifyToken:
      in: header
      name: X-Verify-Token
      required: false
      schema: { type: string }
      description: |
        由 `POST /api/security/verify` 取得的 `verify_token`。未帶入或已失效時回傳 403
        `VERIFICATION_REQUIRED`，回應中的 `verification` 指出需要的範圍與可用的驗證方式。
        伺服器尚未執行資料庫更新 007 時不檢查此標頭。
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJ2ZXJpZnkifQ.abc123

  schemas:
    # ---------- 通用外層 ----------
    Pagination:
      type: object
      description: 分頁資訊，位於回應的最外層，並非置於 `data` 之內。
      properties:
        total: { type: integer, description: 符合條件的總筆數, example: 137 }
        page: { type: integer, description: 目前頁碼, example: 2 }
        limit: { type: integer, description: 每頁筆數, example: 20 }
        total_pages: { type: integer, description: 總頁數, example: 7 }

    SuccessMessage:
      type: object
      description: 無回傳內容的操作（刪除、標記已讀等）所使用的格式。
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: 操作成功 }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message:
          type: string
          description: 可直接呈現給使用者的繁體中文訊息。
          example: 伺服器發生錯誤
        code:
          type: string
          nullable: true
          description: |
            僅需用戶端分支處理的錯誤帶此欄位。常見的值包括
            `ACCOUNT_NOT_FOUND`、`ACCOUNT_BLACKLISTED`、`ACCOUNT_INACTIVE`、
            `TOKEN_EXPIRED`、`TOKEN_REVOKED`、`SESSION_REVOKED`、
            `INVALID_PASSWORD`、`INSUFFICIENT_BALANCE`、`BOOK_NOT_APPROVED`、`BOOK_RESERVED`、
            `VERIFICATION_REQUIRED`、`PAYMENT_PIN_NOT_SET`、`INVALID_PIN`、`PIN_LOCKED`，
            完整列表見文件開頭的錯誤代碼一節。

    # ---------- 使用者 ----------
    UserBrief:
      type: object
      description: 巢狀於書籍、訂單、訊息中的精簡使用者資訊。
      properties:
        user_id: { type: integer, example: 12 }
        nickname: { type: string, example: 小明 }
        avatar_url:
          type: string
          nullable: true
          description: 相對路徑，用戶端須自行組合 API origin。
          example: /uploads/avatars/1736512345678-123456789.jpg

    User:
      type: object
      description: 使用者完整資料。`password_hash` 不會出現於任何回應中。
      properties:
        user_id: { type: integer, example: 12 }
        email: { type: string, format: email, example: test@example.com }
        nickname: { type: string, example: 小明 }
        avatar_url: { type: string, nullable: true, example: /uploads/avatars/a.jpg }
        bio: { type: string, nullable: true, example: 喜歡看推理小說 }
        phone: { type: string, nullable: true, example: '0912345678' }
        birthday: { type: string, format: date, nullable: true, example: '1999-09-14' }
        gender:
          type: string
          nullable: true
          enum: [male, female, other, undisclosed]
          example: undisclosed
        role:
          type: string
          enum: [buyer_seller, admin]
          description: '`buyer_seller` 兼具買家與賣家身分；`admin` 具管理後台存取權。'
          example: buyer_seller
        is_active: { type: boolean, description: 值為 false 代表帳號已停權, example: true }
        is_blacklisted: { type: boolean, description: 值為 true 代表帳號已列入黑名單, example: false }
        bonus_points:
          type: integer
          description: 管理員調整的點數補正值，可為負數。實際點數為「完成訂單數 × 10 + 本欄位值」。
          example: 0
        created_at: { type: string, format: date-time, example: '2025-06-01T10:23:00.000Z' }
        updated_at: { type: string, format: date-time, example: '2025-09-01T08:00:00.000Z' }

    # ---------- 書籍 ----------
    BookImage:
      type: object
      properties:
        image_id: { type: integer, example: 88 }
        image_url: { type: string, example: /uploads/books/1736512345678-987654321.jpg }
        image_type:
          type: string
          enum: [cover, back, inside, other]
          description: |
            對應上架時的三個固定欄位：封面為 `cover`、封底為 `back`、
            條碼為 `other`，其餘選填照片為 `inside`。
          example: cover
        sort_order: { type: integer, example: 0 }

    Book:
      type: object
      properties:
        book_id: { type: integer, example: 101 }
        seller_id: { type: integer, example: 12 }
        isbn: { type: string, nullable: true, example: '9789573317249' }
        title: { type: string, example: 挪威的森林 }
        author: { type: string, nullable: true, example: 村上春樹 }
        publisher: { type: string, nullable: true, example: 時報出版 }
        publish_date:
          type: string
          nullable: true
          description: 字串欄位而非日期型別，內容可能僅含年份（`2003`）或年月（`2003-08`）。
          example: '2003-08-01'
        category_id: { type: integer, nullable: true, example: 3 }
        condition_level:
          type: string
          enum: [like_new, good, fair, poor]
          description: 書況分級。`like_new` 近全新、`good` 良好、`fair` 普通、`poor` 較差。
          example: good
        condition_note: { type: string, nullable: true, example: 書角有輕微折痕 }
        price:
          type: string
          description: Decimal(10,2)，序列化為字串以避免浮點誤差。須大於 0 且不超過 99999。
          example: '180.00'
        quantity: { type: integer, example: 1 }
        description: { type: string, nullable: true, example: 只翻過一次，內頁乾淨 }
        cabinet_id: { type: integer, nullable: true, description: 賣家指定的取貨書櫃, example: 2 }
        status:
          type: string
          enum: [on_sale, reserved, sold, removed]
          description: '`on_sale` 販售中、`reserved` 已下單保留、`sold` 已售出、`removed` 已下架。'
          example: on_sale
        view_count: { type: integer, example: 42 }
        is_approved:
          type: boolean
          description: 檢舉成立時設為 false，此時賣家無法自行將狀態改回 `on_sale`。
          example: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        users: { $ref: '#/components/schemas/UserBrief' }
        book_images:
          type: array
          items: { $ref: '#/components/schemas/BookImage' }
        book_categories:
          type: object
          nullable: true
          properties:
            category_name: { type: string, example: 文學小說 }
        smart_cabinets:
          allOf:
            - $ref: '#/components/schemas/CabinetBrief'
          nullable: true

    # ---------- 分類 ----------
    Category:
      type: object
      properties:
        category_id: { type: integer, example: 3 }
        category_name: { type: string, example: 文學小說 }
        parent_id: { type: integer, nullable: true, description: 值為 null 代表頂層分類, example: null }
        sort_order: { type: integer, description: 數字越小越前面, example: 0 }
        created_at: { type: string, format: date-time }

    # ---------- 書櫃 ----------
    CabinetBrief:
      type: object
      properties:
        cabinet_id: { type: integer, example: 2 }
        cabinet_name: { type: string, example: 台北車站站前店 }
        address: { type: string, example: 台北市中正區忠孝西路一段 49 號 }
        open_time: { type: string, nullable: true, example: '1970-01-01T00:00:00.000Z' }
        close_time: { type: string, nullable: true, example: '1970-01-01T23:59:00.000Z' }

    Cabinet:
      type: object
      properties:
        cabinet_id: { type: integer, example: 2 }
        cabinet_name: { type: string, example: 台北車站站前店 }
        address: { type: string, example: 台北市中正區忠孝西路一段 49 號 }
        latitude: { type: string, description: Decimal(10,7), example: '25.0463500' }
        longitude: { type: string, description: Decimal(10,7), example: '121.5170000' }
        total_slots: { type: integer, example: 20 }
        available_slots: { type: integer, example: 17 }
        is_active: { type: boolean, example: true }
        open_time: { type: string, nullable: true }
        close_time: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CabinetSlot:
      type: object
      properties:
        slot_id: { type: integer, example: 31 }
        cabinet_id: { type: integer, example: 2 }
        slot_number: { type: string, description: 建立書櫃時依序自動產生 A01、A02 等編號, example: A03 }
        status:
          type: string
          enum: [empty, occupied, reserved, maintenance]
          description: '`empty` 未使用、`occupied` 已存放書籍、`reserved` 已預約、`maintenance` 維修中。'
          example: empty
        current_book_id: { type: integer, nullable: true }
        current_order_id: { type: integer, nullable: true }
        updated_at: { type: string, format: date-time }

    # ---------- 購物車 ----------
    CartItem:
      type: object
      properties:
        cart_id: { type: integer, example: 55 }
        user_id: { type: integer, example: 12 }
        book_id: { type: integer, example: 101 }
        quantity: { type: integer, example: 1 }
        added_at: { type: string, format: date-time }
        books: { $ref: '#/components/schemas/Book' }

    # ---------- 訂單 ----------
    OrderItem:
      type: object
      properties:
        item_id: { type: integer, example: 71 }
        order_id: { type: integer, example: 40 }
        book_id: { type: integer, example: 101 }
        quantity: { type: integer, example: 1 }
        unit_price: { type: string, description: 下單當時的單價。賣家後續調價不影響已成立的訂單, example: '180.00' }
        subtotal: { type: string, example: '180.00' }
        books: { $ref: '#/components/schemas/Book' }

    AdminOrder:
      type: object
      description: |
        後台訂單的共同欄位，列表與詳情共用。詳情另外附加時間軸、櫃位、
        退款、申訴與錢包異動。
      properties:
        order_id: { type: integer, example: 40 }
        order_no: { type: string, example: SMB20250911143012517 }
        status: { type: string, example: pending_deposit }
        total_amount: { type: string, example: '360.00' }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }
        pickup_code: { type: string, nullable: true, example: '482913' }
        buyer: { $ref: '#/components/schemas/UserBrief' }
        seller: { $ref: '#/components/schemas/UserBrief' }
        cabinet:
          type: object
          nullable: true
          properties:
            cabinet_id: { type: integer }
            cabinet_name: { type: string }
            address: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              book_id: { type: integer, nullable: true }
              title: { type: string }
              unit_price: { type: string }
              subtotal: { type: string }
              quantity: { type: integer }
              image_url: { type: string, nullable: true }

    Order:
      type: object
      properties:
        order_id: { type: integer, example: 40 }
        order_no:
          type: string
          description: '對外顯示的訂單編號，格式為 `SMB` 加年月日時分秒再加三位隨機碼。'
          example: SMB20250911143012517
        buyer_id: { type: integer, example: 12 }
        seller_id: { type: integer, example: 8 }
        total_amount: { type: string, example: '360.00' }
        cabinet_id: { type: integer, nullable: true, example: 2 }
        slot_id: { type: integer, nullable: true }
        pickup_code: { type: string, nullable: true, description: 六位數取貨碼, example: '482913' }
        status:
          type: string
          enum: [pending_payment, pending_deposit, deposited, pending_pickup, completed, cancelled, refunding, refunded]
          example: pending_deposit
        payment_method: { type: string, nullable: true, enum: [wallet, bank_transfer], example: wallet }
        payment_at: { type: string, format: date-time, nullable: true }
        deposited_at: { type: string, format: date-time, nullable: true, description: 賣家完成存書的時間 }
        picked_up_at: { type: string, format: date-time, nullable: true, description: 買家完成取件的時間 }
        completed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        order_items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        smart_cabinets:
          allOf: [{ $ref: '#/components/schemas/CabinetBrief' }]
          nullable: true
        cabinet_slots:
          type: object
          nullable: true
          properties:
            slot_id: { type: integer }
            slot_number: { type: string, example: A03 }
        users_orders_buyer_idTousers:
          allOf: [{ $ref: '#/components/schemas/UserBrief' }]
          description: 買家。欄位名稱源自 Prisma 對雙重外鍵關聯的命名規則。
        users_orders_seller_idTousers:
          allOf: [{ $ref: '#/components/schemas/UserBrief' }]
          description: 賣家。
        transaction_disputes:
          type: array
          description: 本訂單的爭議申請紀錄，無紀錄時為空陣列。
          items:
            type: object
            properties:
              dispute_id: { type: integer }
              status: { type: string, enum: [pending, processing, resolved] }
              result: { type: string, nullable: true, enum: [refund_manual, refund_auto, dismissed, mediated] }

    # ---------- 錢包 ----------
    Wallet:
      type: object
      properties:
        wallet_id: { type: integer, example: 9 }
        user_id: { type: integer, example: 12 }
        balance: { type: string, description: 可用餘額（代幣）, example: '1250.00' }
        frozen_amount: { type: string, description: 凍結中的金額, example: '0.00' }
        total_income: { type: string, description: 歷史總收入, example: '3400.00' }
        total_expense: { type: string, description: 歷史總支出, example: '2150.00' }
        updated_at: { type: string, format: date-time }

    WalletTransaction:
      type: object
      properties:
        txn_id: { type: integer, example: 204 }
        wallet_id: { type: integer, example: 9 }
        type:
          type: string
          enum: [deposit, withdrawal, purchase, sale_income, refund, admin_adjust]
          description: |
            `deposit` 儲值、`withdrawal` 提領、`purchase` 購書扣款、
            `sale_income` 售出入帳、`refund` 退款、`admin_adjust` 管理員調整。
          example: purchase
        amount:
          type: string
          description: 支出為負數，收入為正數。
          example: '-360.00'
        balance_after: { type: string, description: 本次異動後的餘額, example: '890.00' }
        related_order_id: { type: integer, nullable: true, example: 40 }
        description: { type: string, nullable: true, example: 購買訂單 SMB20250911143012517 }
        created_at: { type: string, format: date-time }

    # ---------- 通知 ----------
    Notification:
      type: object
      properties:
        notification_id: { type: integer, example: 512 }
        user_id: { type: integer, example: 12 }
        type:
          type: string
          enum: [system, order, message, promotion, reservation]
          description: 用戶端依此決定顯示的圖示與點擊後的導向目標。
          example: order
        title: { type: string, example: 您的書已售出 }
        content: { type: string, example: 訂單 SMB20250911143012517 已成立，請於七天內至書櫃存書。 }
        related_id:
          type: integer
          nullable: true
          description: 與 `related_type` 搭配使用，決定點擊通知後的導向目標。
          example: 40
        related_type:
          type: string
          nullable: true
          description: '可能的值為 `order`、`book`、`chat_room`、`report`、`ticket`、`legal`、`user`、`wallet`、`security`、`push_test`。`security` 為新裝置登入、交易密碼變更或鎖定等帳號安全通知，無對應的 `related_id`。'
          example: order
        is_read: { type: boolean, example: false }
        created_at: { type: string, format: date-time }

    # ---------- 聊天 ----------
    ChatRoomSummary:
      type: object
      description: 聊天室列表專用的整併格式，非資料表原始欄位。
      properties:
        room_id: { type: integer, example: 7 }
        partner:
          allOf: [{ $ref: '#/components/schemas/UserBrief' }]
          description: 對話對象，伺服器已判定請求者為 user_a 或 user_b 並回傳另一方。
        last_message:
          type: object
          nullable: true
          properties:
            content: { type: string, description: 資料表原始內容，列表顯示請改用 `preview`。, example: 請問這本還在嗎？ }
            message_type: { type: string, enum: [text, image, system] }
            kind:
              type: string
              enum: [text, image, voice, book, reservation, recalled, notice]
              description: 與 `ChatMessage.kind` 相同。
              example: text
            preview:
              type: string
              description: |
                伺服器產生的摘要，可直接顯示於列表。文字訊息取前 100 字；其餘為 `[圖片]`、`[語音]`、
                `[商品] 書名`、`[預約]` 或 `訊息已收回`。
              example: 請問這本還在嗎？
            sender_id: { type: integer, description: 可用來判斷是否顯示「你：」前綴。, example: 12 }
            is_read: { type: boolean, description: 請求者自己發送時，代表對方是否已讀。, example: false }
            created_at: { type: string, format: date-time }
        unread_count: { type: integer, description: 對方發送且尚未讀取的訊息則數, example: 2 }
        updated_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      description: |
        資料表原始欄位加上伺服器解析後的 `kind`、`body`、`payload`。
        用戶端應依 `kind` 渲染，不必自行解析 `content`。
      properties:
        message_id: { type: integer, example: 301 }
        room_id: { type: integer, example: 7 }
        sender_id: { type: integer, example: 12 }
        content:
          type: string
          description: |
            資料表原始內容。語音、商品卡片、預約卡片與已收回的訊息皆以 `system` 型別儲存，
            內容為前綴加 JSON（例如 `[voice]{"url":"/uploads/voice/a.m4a","duration":8}`），
            保留此欄位僅供舊版用戶端使用。
          example: 請問這本還在嗎？
        message_type:
          type: string
          enum: [text, image, system]
          description: 資料表的原始型別。語音訊息為 `system`，請以 `kind` 判斷。
          example: text
        kind:
          type: string
          enum: [text, image, voice, book, reservation, recalled, notice]
          description: |
            | 值 | 說明 | `body` | `payload` |
            | --- | --- | --- | --- |
            | `text` | 文字訊息 | 訊息文字 | `null` |
            | `image` | 圖片 | 圖片相對路徑 | `null` |
            | `voice` | 語音 | `null` | `{ url, duration }`，`duration` 單位為秒 |
            | `book` | 商品卡片 | `null` | `{ book_id, title, price, image_url }` |
            | `reservation` | 預約卡片 | `null` | `Reservation` 物件；超出最近 30 筆時僅含 `reservation_id` |
            | `recalled` | 已收回的訊息 | `null` | `null` |
            | `notice` | 其他系統訊息 | 訊息文字 | `null` |
          example: text
        body:
          type: string
          nullable: true
          description: 文字內容或圖片路徑，依 `kind` 而定。
          example: 請問這本還在嗎？
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: 結構化內容，依 `kind` 而定。
          example: null
        is_read: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        users: { $ref: '#/components/schemas/UserBrief' }

    Reservation:
      type: object
      description: 聊天室中的書籍預約。
      properties:
        reservation_id: { type: integer, example: 14 }
        book:
          type: object
          nullable: true
          properties:
            book_id: { type: integer, example: 101 }
            title: { type: string, example: 挪威的森林 }
            price: { type: string, example: '180.00' }
            status: { type: string, enum: [on_sale, reserved, sold, removed], example: on_sale }
            image_url: { type: string, nullable: true, example: /uploads/books/a.jpg }
        buyer_id: { type: integer, example: 12 }
        seller_id: { type: integer, example: 8 }
        status:
          type: string
          enum: [pending, confirmed, cancelled, expired]
          description: |
            `pending` 等待賣家回覆、`confirmed` 賣家已接受、`cancelled` 已婉拒或取消、
            `expired` 逾時未回覆或保留期限已過。
          example: confirmed
        hours: { type: integer, nullable: true, enum: [24, 48, 72], description: 買家申請的保留時數, example: 48 }
        message: { type: string, nullable: true, description: 買家附上的備註, example: 週六下午可以取書 }
        closed_by:
          type: string
          nullable: true
          enum: [seller, buyer]
          description: 狀態為 `cancelled` 時，執行婉拒或取消的一方。
          example: null
        pickup_deadline:
          type: string
          format: date-time
          nullable: true
          description: 賣家接受後才有值，為接受時間加上 `hours`。
        is_holding:
          type: boolean
          description: 值為 true 代表目前正保留書籍，即狀態為 `confirmed` 且尚未超過 `pickup_deadline`。
          example: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeviceSession:
      type: object
      description: 一次登入所建立的裝置工作階段。
      properties:
        session_id: { type: integer, example: 31 }
        device_name: { type: string, nullable: true, example: iPhone 15 Pro }
        platform: { type: string, nullable: true, example: ios }
        app_version: { type: string, nullable: true, example: 1.4.0 }
        ip_address: { type: string, nullable: true, description: 最近一次使用的 IP, example: 203.0.113.24 }
        created_at: { type: string, format: date-time, description: 登入時間 }
        last_seen_at: { type: string, format: date-time, description: 最近使用時間，約每 5 分鐘更新一次 }
        biometric_pay: { type: boolean, description: 這台裝置是否已啟用生物辨識付款, example: false }
        is_current: { type: boolean, description: 是否為發出本次請求的裝置, example: true }

    # ---------- 檢舉／爭議 ----------
    Report:
      type: object
      properties:
        report_id: { type: integer, example: 18 }
        reporter_id: { type: integer, example: 12 }
        target_type: { type: string, enum: [user, book, message], example: book }
        target_id: { type: integer, description: 依 target_type 分別對應 user_id、book_id 或 message_id, example: 101 }
        reason: { type: string, example: 商品描述與實物不符 }
        evidence_urls:
          type: string
          nullable: true
          description: 多筆路徑以半形逗號串接為單一字串，型別非陣列。
          example: /uploads/evidence/a.jpg,/uploads/evidence/b.jpg
        status: { type: string, enum: [pending, reviewing, resolved, dismissed], example: pending }
        admin_id: { type: integer, nullable: true }
        admin_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    Dispute:
      type: object
      properties:
        dispute_id: { type: integer, example: 5 }
        order_id: { type: integer, example: 40 }
        applicant_id: { type: integer, example: 12 }
        reason: { type: string, example: 書況與描述不符，有大量畫線 }
        evidence_urls: { type: string, nullable: true, description: 以半形逗號串接的路徑字串 }
        status: { type: string, enum: [pending, processing, resolved], example: pending }
        result:
          type: string
          nullable: true
          enum: [refund_manual, refund_auto, dismissed, mediated]
          description: '`refund_manual` 人工退款、`refund_auto` 自動退款、`dismissed` 駁回、`mediated` 協調結案。'
        admin_id: { type: integer, nullable: true }
        admin_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    # ---------- 公告 ----------
    Announcement:
      type: object
      properties:
        announcement_id: { type: integer, example: 4 }
        admin_id: { type: integer, example: 1 }
        title: { type: string, example: 系統維護公告 }
        content: { type: string, example: 本週日凌晨 2:00–4:00 進行系統維護。 }
        type:
          type: string
          enum: [general, maintenance, promotion, policy]
          example: maintenance
        is_published: { type: boolean, example: true }
        published_at: { type: string, format: date-time, nullable: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 到期後不再出現於公開列表。值為 null 代表無到期限制。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        users:
          type: object
          description: 發布的管理員。
          properties:
            user_id: { type: integer }
            nickname: { type: string }

    # ---------- 會員等級 ----------
    MemberLevel:
      type: object
      properties:
        level_id: { type: integer, example: 3 }
        level_name: { type: string, example: 黃金會員 }
        min_points: { type: integer, description: 進入本等級所需的點數門檻, example: 500 }
        max_points: { type: integer, nullable: true, description: 值為 null 代表無上限 }
        benefits: { type: string, nullable: true, example: 每月贈送 50 代幣、專屬客服 }

    # ---------- 客服 ----------
    Faq:
      type: object
      properties:
        faq_id: { type: integer, example: 6 }
        category: { type: string, description: 自由字串，用戶端依此分組呈現, example: trade }
        question: { type: string, example: 買家沒有取書怎麼辦？ }
        answer: { type: string, example: 超過七天未取書，系統會自動取消訂單並退款。 }
        sort_order: { type: integer, example: 0 }
        is_visible: { type: boolean, description: 值為 false 的項目不會出現於前台, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LegalDocument:
      type: object
      properties:
        doc_id: { type: integer, example: 1 }
        doc_key:
          type: string
          description: '文件識別鍵，目前定義 `terms`（服務條款）與 `privacy`（隱私權政策）。'
          example: terms
        title: { type: string, example: 服務條款 }
        content: { type: string, description: 純文字內容，換行字元為 \n。 }
        updated_by: { type: integer, nullable: true, description: 最後編輯的管理員 }
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    SupportTicket:
      type: object
      properties:
        ticket_id: { type: integer, example: 22 }
        subject: { type: string, example: 代幣沒有入帳 }
        category:
          type: string
          enum: [account, trade, wallet, cabinet, bug, other]
          description: 未列於列舉中的值一律儲存為 `other`。
          example: wallet
        status:
          type: string
          enum: [open, pending, resolved, closed]
          description: |
            `open` 待客服處理、`pending` 客服已回覆待使用者確認、
            `resolved` 已解決、`closed` 已結案且無法再回覆。
          example: open
        message_count: { type: integer, example: 3 }
        last_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        user:
          allOf: [{ $ref: '#/components/schemas/UserBrief' }]
          nullable: true

    SupportTicketMessage:
      type: object
      properties:
        message_id: { type: integer, example: 61 }
        content: { type: string, example: 已為您補上代幣，造成不便敬請見諒。 }
        is_staff: { type: boolean, description: 值為 true 代表此則由客服發送, example: true }
        created_at: { type: string, format: date-time }
        sender: { $ref: '#/components/schemas/UserBrief' }

    # ---------- 管理後台 ----------
    AdminPermissions:
      type: object
      description: |
        管理員的 12 項細部權限開關。
        未於資料表建立對應紀錄的管理員，除 `can_manage_system` 外所有項目視為 `true`。
      properties:
        can_manage_members: { type: boolean, example: true }
        can_manage_levels: { type: boolean, example: true }
        can_manage_content: { type: boolean, example: true }
        can_manage_reports: { type: boolean, example: true }
        can_manage_orders: { type: boolean, example: true }
        can_manage_transactions: { type: boolean, example: true }
        can_manage_wallets: { type: boolean, example: false }
        can_manage_cabinets: { type: boolean, example: true }
        can_manage_announcements: { type: boolean, example: true }
        can_manage_support: { type: boolean, example: true }
        can_view_stats: { type: boolean, example: true }
        can_manage_system: { type: boolean, example: false }

    AdminOperationLog:
      type: object
      properties:
        log_id: { type: integer, example: 340 }
        action: { type: string, example: 強制下架書籍 }
        target_type: { type: string, nullable: true, example: book }
        target_id: { type: integer, nullable: true, example: 101 }
        summary: { type: string, example: 修改了《被討厭的勇氣》的售價，並通知賣家 }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: price }
              label: { type: string, example: 售價 }
              from: { type: string, example: 250 代幣 }
              to: { type: string, example: 220 代幣 }
        can_undo: { type: boolean, example: true }
        reverted:
          type: object
          nullable: true
          properties:
            at: { type: string, format: date-time }
            by: { type: integer, description: 執行還原的管理員 }
            log_id: { type: integer, description: 還原紀錄的編號 }
        detail: { type: string, nullable: true, description: 與 summary 相同，保留給舊版用戶端 }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        admin: { $ref: '#/components/schemas/UserBrief' }

  responses:
    BadRequest:
      description: 請求參數不正確，`message` 指出缺漏或錯誤的欄位。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: 請提供 book_id }

    Unauthorized:
      description: |
        未提供 Token，或帳號狀態已失效（停權、列入黑名單、帳號不存在、密碼已變更、裝置已登出）。
        用戶端收到此狀態碼時應清除本機 Token 並導向登入流程。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            未提供 Token:
              value: { success: false, message: 存取被拒，未提供 Token }
            帳號已停權:
              value: { success: false, code: ACCOUNT_INACTIVE, message: 此帳號已被停權，如有疑問請聯絡客服 }
            帳號在黑名單:
              value: { success: false, code: ACCOUNT_BLACKLISTED, message: 此帳號已被列入黑名單，如有疑問請聯絡客服 }
            裝置已登出:
              value: { success: false, code: SESSION_REVOKED, message: 這台裝置已經登出，請重新登入 }

    TokenInvalid:
      description: |
        Token 簽章無效，或已逾 24 小時有效期。過期時 `code` 為 `TOKEN_EXPIRED`，
        用戶端可先呼叫 `POST /api/auth/refresh` 換發新 Token，失敗再導向登入流程。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            已過期:
              value: { success: false, code: TOKEN_EXPIRED, message: 登入已逾時 }
            簽章無效:
              value: { success: false, message: Token 無效或已過期 }

    VerificationRequired:
      description: |
        此操作需要先驗證身分。呼叫 `POST /api/security/verify` 取得 `verify_token`，
        再以 `X-Verify-Token` 標頭重送原請求。`verification.scope` 為需要的範圍，
        `verification.methods` 為該範圍可用的驗證方式。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  verification:
                    type: object
                    properties:
                      scope: { type: string, enum: [payment, sensitive], example: sensitive }
                      methods:
                        type: array
                        items: { type: string, enum: [password, pin, biometric] }
                        example: [password, pin, biometric]
          examples:
            需要驗證:
              value:
                success: false
                code: VERIFICATION_REQUIRED
                message: 請先驗證身分
                verification: { scope: sensitive, methods: [password, pin, biometric] }
            驗證已逾時:
              value:
                success: false
                code: VERIFICATION_REQUIRED
                message: 驗證已逾時，請重新驗證
                verification: { scope: sensitive, methods: [password, pin, biometric] }

    AdminVerificationRequired:
      description: |
        請求者非管理員、缺少此功能的細部權限，或尚未完成身分驗證。
        後者 `code` 為 `VERIFICATION_REQUIRED`，須以 `POST /api/security/verify` 取得
        `sensitive` 範圍的 `verify_token` 後，帶入 `X-Verify-Token` 標頭重送。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            不是管理員:
              value: { success: false, message: 權限不足，僅限管理員執行此操作 }
            缺少細部權限:
              value: { success: false, message: 您沒有這項功能的權限 }
            需要驗證:
              value:
                success: false
                code: VERIFICATION_REQUIRED
                message: 請先驗證身分
                verification: { scope: sensitive, methods: [password, pin, biometric] }

    SecurityUnavailable:
      description: 伺服器尚未執行資料庫更新 007（`user_sessions`、`user_security` 資料表），帳號安全功能暫不可用。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: SECURITY_UNAVAILABLE, message: 伺服器尚未完成資料庫更新，請聯絡管理員 }

    BookReserved:
      description: 書籍已由其他買家預約並保留中，保留期限內僅該買家可加入購物車或結帳。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: BOOK_RESERVED, message: 《挪威的森林》已經被其他買家預約，保留到 9/16 18:30 }

    Forbidden:
      description: 已通過認證，但無權存取該筆資料。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: 存取被拒 }

    AdminForbidden:
      description: 請求者非管理員，或該管理員未具備此功能的細部權限。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            不是管理員:
              value: { success: false, message: 權限不足，僅限管理員執行此操作 }
            缺少細部權限:
              value: { success: false, message: 您沒有這項功能的權限 }

    NotFound:
      description: 指定的資源不存在。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: 找不到該資料 }

    ServerError:
      description: 伺服器發生未預期的錯誤，詳細原因僅記錄於伺服器日誌。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: 伺服器發生錯誤 }

    Conflict:
      description: 資料狀態已被其他請求變更，或目前狀態不允許此操作。重新整理後再試即可。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: 訂單狀態已經變更，請重新整理後再試 }

    TooManyRequests:
      description: 短時間內請求次數過多。回應標頭 `Retry-After` 為建議等待的秒數。
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建議等待秒數。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: RATE_LIMITED, message: 登入嘗試次數過多，請 15 分鐘後再試 }
