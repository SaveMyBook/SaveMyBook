tags:
  - name: 認證 (Auth)
    description: |
      取得與驗證 JWT Token。

      Token 有效期 **24 小時**，payload 包含 `userId`、`role`、`email`。
      過期後沒有 refresh 機制，必須重新登入。

paths:
  /api/auth/login:
    post:
      summary: 登入取得 Token
      operationId: login
      tags: [認證 (Auth)]
      description: |
        用 Email 與密碼換取 JWT Token。密碼以 bcrypt 比對。

        帳號被停權或列入黑名單時**不會**發 Token，會直接回 403，
        前端可以依 `code` 決定要顯示什麼提示。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: test@example.com }
                password: { type: string, format: password, example: your_password123 }
            example: { email: test@example.com, password: your_password123 }
      responses:
        '200':
          description: 登入成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 登入成功 }
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: "放進 `Authorization: Bearer <token>` 標頭使用。"
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEyfQ.abc123
        '400':
          description: 沒有填 Email 或密碼。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請提供 email 與密碼 }
        '401':
          description: 密碼錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: INVALID_PASSWORD, message: 密碼錯誤 }
        '403':
          description: 帳號存在但已被停用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已停權:
                  value: { success: false, code: ACCOUNT_INACTIVE, message: 此帳號已停權，請聯絡客服 }
                黑名單:
                  value: { success: false, code: ACCOUNT_BLACKLISTED, message: 此帳號已被停用，請聯絡客服 }
        '404':
          description: 這個 Email 沒有註冊過。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: ACCOUNT_NOT_FOUND, message: 此 Email 尚未註冊 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/me:
    get:
      summary: 取得目前登入者
      operationId: getCurrentUser
      tags: [認證 (Auth)]
      description: |
        回傳 Token 對應的使用者完整資料，常用來在 App 啟動時
        確認 Token 還有效、順便同步最新的個人資料。

        回傳的是資料表原始欄位（含 `password_hash` 以外的全部）。
        如果只需要暱稱、頭像，用 `GET /api/users/me/stats` 會更輕量。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
