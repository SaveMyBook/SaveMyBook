tags:
  - name: 認證 (Auth)
    description: |
      JWT Token 的簽發與驗證。

      Token 有效期為 24 小時，payload 包含 `userId`、`role`、`email`。
      系統未提供 refresh 機制，Token 到期後須重新登入。

paths:
  /api/auth/login:
    post:
      summary: 登入取得 Token
      operationId: login
      tags: [認證 (Auth)]
      description: |
        以 Email 與密碼換發 JWT Token，密碼採 bcrypt 比對。

        帳號已停權或列入黑名單時不簽發 Token，直接回傳 403，
        用戶端可依 `code` 區分提示內容。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: test@example.com }
                password: { type: string, format: password, example: your_password123 }
            example: { email: test@example.com, password: your_password123 }
      responses:
        '200':
          description: 登入成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 登入成功 }
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: "用於 `Authorization: Bearer <token>` 標頭。"
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEyfQ.abc123
        '400':
          description: 未提供 Email 或密碼。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請提供 email 與密碼 }
        '401':
          description: 密碼錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: INVALID_PASSWORD, message: 密碼錯誤 }
        '403':
          description: 帳號存在但已停用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已停權:
                  value: { success: false, code: ACCOUNT_INACTIVE, message: 此帳號已停權，請聯絡客服 }
                列入黑名單:
                  value: { success: false, code: ACCOUNT_BLACKLISTED, message: 此帳號已被停用，請聯絡客服 }
        '404':
          description: 該 Email 尚未註冊。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: ACCOUNT_NOT_FOUND, message: 此 Email 尚未註冊 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/me:
    get:
      summary: 取得目前登入者
      operationId: getCurrentUser
      tags: [認證 (Auth)]
      description: |
        回傳 Token 對應的使用者完整資料，可用於應用程式啟動時驗證 Token
        有效性並同步個人資料。

        回傳內容為資料表原始欄位，不含 `password_hash`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
