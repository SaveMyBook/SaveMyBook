tags:
  - name: auth-social
    x-displayName: 社群登入
    description: |
      Google、Apple、手機簡訊、LINE 與 Discord 登入，以及帳號的登入方式綁定與解除。

      ## 兩種驗證來源

      | 渠道 | 驗證方式 |
      | --- | --- |
      | `google`、`apple`、`phone` | App 以 Firebase Authentication 完成驗證後，把 ID Token 交給伺服器驗證 |
      | `line`、`discord` | 授權碼流程，由伺服器以自身憑證向服務商換取資料 |

      伺服器自行驗證 Firebase ID Token（RS256、`aud` 為 Firebase 專案編號、
      `iss` 為 `https://securetoken.google.com/<專案編號>`、檢查 `exp` 與 `auth_time`），
      並比對 `firebase.sign_in_provider` 與請求的 `provider`。

      ## 開放與停用

      各渠道是否開放由管理後台控制，App 應先呼叫 `GET /api/auth/providers` 決定顯示哪些按鈕：

      - `enabled`：可用於登入與綁定。伺服器未設定該渠道憑證時一律為 `false`。
      - `signup`：可用該方式直接建立新帳號；為 `false` 時僅限已存在的帳號使用。

      ## 不自動建立帳號

      第三方身分尚未綁定任何帳號時，伺服器不會自動註冊，而是回傳 404
      `NO_ACCOUNT_FOR_PROVIDER`。App 須詢問使用者要登入既有帳號並綁定、
      以此身分建立新帳號，還是取消；選擇建立新帳號時才以 `create: true` 重送，
      選擇登入既有帳號時改呼叫 `POST /api/auth/social/link-login`。

      404 `NO_ACCOUNT_FOR_PROVIDER` 與 409 `ACCOUNT_EXISTS_LINK_REQUIRED` 在第三方提供電子郵件時
      附帶 `provider_email`，供 App 預填登入表單。

      ## 不自動合併既有帳號

      第三方回傳的電子郵件若已有對應帳號，但尚未綁定該登入方式，伺服器回傳 409
      `ACCOUNT_EXISTS_LINK_REQUIRED`，不會自動合併。App 應直接在登入流程中請使用者
      登入該帳號，再以 `POST /api/auth/social/link-login` 完成綁定與登入。

      ## 尚未設定密碼的帳號

      以社群方式建立的帳號 `password_set` 為 `false`：不可使用
      `PUT /api/users/me/password`（回 400 `PASSWORD_NOT_SET`），
      也無法以登入密碼通過敏感操作驗證，App 應先引導使用者呼叫
      `POST /api/auth/password/set` 設定密碼。

paths:
  /api/auth/providers:
    get:
      summary: 取得可用的登入方式
      operationId: listSignInProviders
      tags: [auth-social]
      description: |
        登入頁用來決定顯示哪些第三方登入按鈕。無須 Token。

        `configured` 表示伺服器已設定該渠道所需的憑證；未設定時 `enabled` 必為 `false`。
      security: []
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      social_enabled:
                        type: boolean
                        description: 社群登入總開關。
                        example: true
                      providers:
                        type: array
                        items: { $ref: '#/components/schemas/SignInProvider' }
              example:
                success: true
                data:
                  social_enabled: true
                  providers:
                    - { id: google, enabled: true, signup: true, configured: true }
                    - { id: apple, enabled: true, signup: true, configured: true }
                    - { id: phone, enabled: true, signup: true, configured: true }
                    - { id: line, enabled: false, signup: false, configured: false }
                    - { id: discord, enabled: false, signup: false, configured: false }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/social:
    post:
      summary: 以 Firebase ID Token 登入或註冊
      operationId: socialSignIn
      tags: [auth-social]
      description: |
        適用於 `google`、`apple`、`phone`。成功時的回應與 `POST /api/auth/login` 完全相同。

        處理順序：

        1. 已綁定此第三方身分 → 直接登入，`create` 無作用。
        2. 尚未綁定且請求未帶 `create: true` → 404 `NO_ACCOUNT_FOR_PROVIDER`，不建立任何資料。
        3. 帶 `create: true` 後依序檢查：
           - Token 內含已驗證的電子郵件且已有對應帳號 → 409 `ACCOUNT_EXISTS_LINK_REQUIRED`。
           - 該渠道不允許直接註冊 → 403 `SIGNUP_NOT_ALLOWED`。
           - Token 未提供已驗證的電子郵件（手機登入）→ 400 `EMAIL_REQUIRED`；
             App 收集電子郵件與暱稱後以相同的 `id_token` 重送，若該電子郵件已註冊同樣回 409。
        4. 建立帳號並登入：暱稱取自 Token 的名稱，沒有則自動產生；帳號的 `password_set` 為 `false`；
           手機登入會在使用者尚未填寫時補上手機號碼。

        同 IP 15 分鐘內最多 30 次。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider: { type: string, enum: [google, apple, phone] }
                id_token: { type: string, description: Firebase Authentication 取得的 ID Token。 }
                create:
                  type: boolean
                  description: |
                    使用者已明確選擇「以這個身分建立新帳號」時才送 `true`。
                    省略或為 `false` 時，尚未綁定的身分一律回 404 `NO_ACCOUNT_FOR_PROVIDER`。
                email:
                  type: string
                  format: email
                  description: 僅在收到 `EMAIL_REQUIRED` 後補送。Token 已含已驗證的電子郵件時忽略此欄位。
                nickname: { type: string, minLength: 2, maxLength: 50 }
                accept_legal: { type: boolean, description: 建立新帳號時是否一併記錄同意目前版本的法律文件。 }
                device_id: { type: string, maxLength: 64 }
                device_name: { type: string, maxLength: 100 }
                platform: { type: string, maxLength: 20 }
                app_version: { type: string, maxLength: 20 }
            example:
              provider: google
              id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYyJ9.eyJzdWIiOiJ1aWQifQ.signature
              device_id: 6F9619FF-8B86-D011-B42D-00C04FC964FF
              platform: ios
      responses:
        '200':
          description: 登入成功，格式與密碼登入相同。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 登入成功 }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      pending_deletion:
                        type: object
                        description: 僅在帳號已申請刪除時出現。
                        properties:
                          requested_at: { type: string, format: date-time }
                          purge_at: { type: string, format: date-time }
                          grace_days: { type: integer, example: 30 }
        '400':
          description: 參數不正確、登入方式不符，或需要補送電子郵件。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                登入方式不符:
                  value: { success: false, code: PROVIDER_MISMATCH, message: 登入失敗，請重新操作 }
                需要電子郵件:
                  value: { success: false, code: EMAIL_REQUIRED, message: 請提供電子郵件以建立帳號 }
        '401':
          description: ID Token 無效、過期或簽章不符。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: INVALID_ID_TOKEN, message: 登入逾時，請重新操作 }
        '403':
          description: 渠道停用、不允許直接註冊，或帳號已停用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                渠道停用:
                  value: { success: false, code: SIGN_IN_METHOD_DISABLED, message: 目前未開放以 Google 登入 }
                不允許註冊:
                  value: { success: false, code: SIGNUP_NOT_ALLOWED, message: 此登入方式僅供既有帳號使用 }
                帳號已停權:
                  value: { success: false, code: ACCOUNT_INACTIVE, message: 此帳號已停權，請聯絡客服 }
        '404':
          description: '此第三方身分尚未綁定任何帳號，且請求未帶 `create: true`。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                code: NO_ACCOUNT_FOR_PROVIDER
                message: 此 Google 帳號尚未綁定任何帳號
                provider_email: member@gmail.com
        '409':
          description: 電子郵件已註冊，須登入該帳號並綁定（`POST /api/auth/social/link-login`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                code: ACCOUNT_EXISTS_LINK_REQUIRED
                message: 此電子郵件已註冊，請登入該帳號以綁定此登入方式
                provider_email: member@example.com
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/AuthProviderError' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/auth/social/link-login:
    post:
      summary: 登入既有帳號並綁定第三方身分
      operationId: socialLinkLogin
      tags: [auth-social]
      description: |
        收到 404 `NO_ACCOUNT_FOR_PROVIDER` 或 409 `ACCOUNT_EXISTS_LINK_REQUIRED` 後，使用者選擇登入既有帳號時使用。
        在同一個請求中驗證帳號（密碼或通行密鑰）、綁定尚未綁定的第三方身分並完成登入，
        不需另外呼叫 `POST /api/auth/link`，也不需身分驗證權杖。成功時的回應與 `POST /api/auth/login` 完全相同。

        第三方身分二擇一：

        - `google`、`apple`、`phone`：`provider` 加上原本的 `id_token`。
        - `line`、`discord`：原本的一次性 `code`（不必重新授權；`provider` 可省略，帶入時須與一次性碼相符）。

        帳號憑證二擇一：

        - `email` 與 `password`，錯誤代碼與 `POST /api/auth/login` 相同。
        - `assertion`：以 `POST /api/auth/passkeys/login/options` 取得 options 後由系統回傳的 `AuthenticationResponseJSON`。

        處理順序：確認渠道開放 → 驗證第三方身分 → 驗證帳號與帳號狀態 → 檢查綁定規則 → 寫入綁定並以站內通知告知本人
        → 建立工作階段與登入紀錄（`login_method` 為 `password` 或 `passkey`）。
        驗證未通過時不寫入任何資料；一次性碼只在成功時作廢，密碼錯誤等可補救的失敗可用同一組碼重試。

        綁定規則與 `POST /api/auth/link` 相同：第三方身分已綁定其他帳號回 409 `IDENTITY_TAKEN`，
        帳號已綁定同渠道的另一個身分回 409 `ALREADY_LINKED`；同一個身分已綁定此帳號時直接登入。

        限流：同 IP 15 分鐘 30 次（與其他社群登入端點合計），另與 `POST /api/auth/login` 共用
        「同 IP 與 Email 組合 15 分鐘 10 次」及「同 IP 15 分鐘 100 次」的上限。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [google, apple, phone, line, discord] }
                id_token: { type: string, description: '`google`、`apple`、`phone` 的 Firebase ID Token。' }
                code: { type: string, description: '`line`、`discord` 的一次性碼。' }
                email: { type: string, format: email }
                password: { type: string }
                assertion: { type: object, description: 通行密鑰的 `AuthenticationResponseJSON`。 }
                device_id: { type: string, maxLength: 64 }
                device_name: { type: string, maxLength: 100 }
                platform: { type: string, maxLength: 20 }
                app_version: { type: string, maxLength: 20 }
            examples:
              密碼:
                value:
                  provider: google
                  id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYyJ9.eyJzdWIiOiJ1aWQifQ.signature
                  email: member@example.com
                  password: Passw0rd123
                  platform: ios
              通行密鑰:
                value:
                  code: 3f2a9c0e5b7d41e8a6c2f09b1d4e7a53
                  assertion: { id: KEDetxZcUfinhVi6Za5nZQ, rawId: KEDetxZcUfinhVi6Za5nZQ, type: public-key, response: {} }
                  platform: android
      responses:
        '200':
          description: 綁定並登入成功，格式與密碼登入相同。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 登入成功 }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      pending_deletion:
                        type: object
                        description: 僅在帳號已申請刪除時出現。
                        properties:
                          requested_at: { type: string, format: date-time }
                          purge_at: { type: string, format: date-time }
                          grace_days: { type: integer, example: 30 }
        '400':
          description: 參數不正確、一次性碼失效、登入方式不符，或通行密鑰驗證未通過。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少帳號憑證:
                  value: { success: false, message: 請提供 Email 與密碼 }
                一次性碼失效:
                  value: { success: false, code: OAUTH_CODE_INVALID, message: 登入逾時，請重新操作 }
                通行密鑰驗證失敗:
                  value: { success: false, code: PASSKEY_VERIFICATION_FAILED, message: 通行密鑰驗證失敗，請重新操作 }
        '401':
          description: 密碼錯誤，或 ID Token 無效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                密碼錯誤:
                  value: { success: false, code: INVALID_PASSWORD, message: 密碼錯誤 }
                ID Token 無效:
                  value: { success: false, code: INVALID_ID_TOKEN, message: 登入逾時，請重新操作 }
        '403':
          description: 渠道停用，或帳號已停用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                渠道停用:
                  value: { success: false, code: SIGN_IN_METHOD_DISABLED, message: 目前未開放以 Google 登入 }
                帳號已停權:
                  value: { success: false, code: ACCOUNT_INACTIVE, message: 此帳號已停權，請聯絡客服 }
        '404':
          description: 此電子郵件尚未註冊。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: ACCOUNT_NOT_FOUND, message: 此 Email 尚未註冊 }
        '409':
          description: 綁定規則不允許。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已綁定其他帳號:
                  value: { success: false, code: IDENTITY_TAKEN, message: 此登入方式已綁定其他帳號 }
                已綁定同渠道:
                  value: { success: false, code: ALREADY_LINKED, message: 此帳號已綁定此登入方式 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/AuthProviderError' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/auth/link:
    post:
      summary: 綁定 Firebase 系列的登入方式
      operationId: linkSignInMethod
      tags: [auth-social]
      description: |
        為目前登入的帳號新增 `google`、`apple` 或 `phone` 登入方式，須通過敏感操作驗證。

        手機綁定會在使用者尚未填寫時一併補上手機號碼。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VerifyToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider: { type: string, enum: [google, apple, phone] }
                id_token: { type: string }
      responses:
        '200':
          description: 已綁定，回傳最新的登入方式列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已綁定此登入方式 }
                  data: { $ref: '#/components/schemas/SignInMethodList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TokenInvalid' }
        '409':
          description: 此第三方身分已被使用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已綁在其他帳號:
                  value: { success: false, code: IDENTITY_TAKEN, message: 此登入方式已綁定其他帳號 }
                本帳號已綁定:
                  value: { success: false, code: ALREADY_LINKED, message: 此帳號已綁定此登入方式 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/auth/link/{provider}:
    delete:
      summary: 解除綁定登入方式
      operationId: unlinkSignInMethod
      tags: [auth-social]
      description: |
        須通過敏感操作驗證。解除後若該帳號既沒有密碼、通行密鑰，也沒有其他登入方式，
        回傳 400 `LAST_SIGN_IN_METHOD`，資料不會變更。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VerifyToken' }
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, apple, phone, line, discord] }
      responses:
        '200':
          description: 已解除綁定，回傳最新的登入方式列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已解除綁定 }
                  data: { $ref: '#/components/schemas/SignInMethodList' }
        '400':
          description: 這是帳號唯一的登入方式。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                code: LAST_SIGN_IN_METHOD
                message: 這是此帳號唯一的登入方式，請先設定密碼或綁定其他登入方式
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/auth/password/set:
    post:
      summary: 為尚未設定密碼的帳號設定密碼
      operationId: setAccountPassword
      tags: [auth-social]
      description: |
        僅適用 `password_set` 為 `false` 的帳號（以社群方式建立者）；已有密碼時回 400
        `PASSWORD_ALREADY_SET`，變更密碼請改用 `PUT /api/users/me/password`。

        密碼規則與註冊相同：至少 8 個字元，須含英文字母與數字，僅可使用半形字元。

        設定成功後密碼版本改變，其他裝置的 Token 立即失效，回應會帶目前裝置的新 Token。
        帳號已設定交易密碼時，此端點要求敏感操作驗證；尚未設定交易密碼時無從驗證，
        僅檢查登入 Token 並套用每位使用者 15 分鐘 20 次的限制。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VerifyToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, example: my_password123 }
      responses:
        '200':
          description: 已設定密碼。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 密碼已設定，其他裝置須重新登入 }
                  data:
                    type: object
                    properties:
                      token: { type: string, description: 目前裝置可繼續使用的新 Token。 }
        '400':
          description: 密碼不符規則，或帳號已有密碼。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: PASSWORD_ALREADY_SET, message: 此帳號已設定密碼，請改用變更密碼 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TokenInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/users/me/identities:
    get:
      summary: 取得本人的登入方式
      operationId: listMySignInMethods
      tags: [auth-social]
      description: |
        帳號安全頁使用。電子郵件與手機號碼一律遮罩後回傳，不含任何流水號。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SignInMethodList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TokenInvalid' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/auth/oauth/{provider}/start:
    post:
      summary: 開始 LINE 或 Discord 授權
      operationId: startOauth
      tags: [auth-social]
      description: |
        回傳授權網址與一次性的 `state`。App 以外部瀏覽器開啟該網址，
        使用者完成授權後伺服器會導回深層連結 `savemybook://auth/oauth`。

        `mode` 為 `link` 時須帶登入 Token 並通過敏感操作驗證；`login` 則無須登入。
        `state` 10 分鐘內有效且僅能使用一次。
      security: []
      parameters:
        - { $ref: '#/components/parameters/VerifyToken' }
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [line, discord] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [login, link], default: login }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url: { type: string, description: 要開啟的授權網址。 }
                      state: { type: string, description: 32 個十六進位字元，供 App 核對回呼來源。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 渠道停用或伺服器未設定該渠道憑證。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: SIGN_IN_METHOD_DISABLED, message: 目前未開放以 LINE 登入 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

  /api/auth/oauth/{provider}/callback:
    get:
      summary: 第三方授權回呼
      operationId: oauthCallback
      tags: [auth-social]
      description: |
        由 LINE 或 Discord 於使用者完成授權後導向，不由 App 直接呼叫。

        伺服器以自身憑證換取存取權杖並取得使用者資料，接著依 `state` 記錄的模式完成登入或綁定，
        最後以 302 導向 `savemybook://auth/oauth?code=<一次性碼>`；
        失敗時導向 `savemybook://auth/oauth?error=<錯誤代碼>`。

        此階段不會建立帳號：第三方身分尚未綁定任何帳號時一樣回傳一次性碼，
        由 `POST /api/auth/oauth/exchange` 回報 404 `NO_ACCOUNT_FOR_PROVIDER`，讓 App 詢問使用者。

        回應內容為純文字，不含任何權杖。一次性碼須於 5 分鐘內以
        `POST /api/auth/oauth/exchange` 兌換。

        可能出現的 `error`：`OAUTH_STATE_INVALID`、`SIGN_IN_METHOD_DISABLED`、
        `IDENTITY_TAKEN`、`ALREADY_LINKED`、`ACCOUNT_INACTIVE`、`ACCOUNT_BLACKLISTED`、
        `AUTH_PROVIDER_ERROR`、`AUTH_SOCIAL_UNAVAILABLE`、`OAUTH_FAILED`。
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [line, discord] }
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        '302':
          description: 導向 App 深層連結。
          headers:
            Location:
              schema: { type: string }
              example: savemybook://auth/oauth?code=8f14e45fceea167a5a36dedd4bea2543

  /api/auth/oauth/exchange:
    post:
      summary: 兌換第三方授權結果
      operationId: exchangeOauthCode
      tags: [auth-social]
      description: |
        以回呼深層連結帶回的一次性碼換取登入結果。一次性碼 5 分鐘內有效且成功後即失效。

        登入模式的回應與 `POST /api/auth/login` 相同；綁定模式回傳 `{ linked: true, provider }`。
        建議一併帶入裝置資訊，工作階段與登入紀錄於此步驟建立。

        第三方身分尚未綁定任何帳號時回 404 `NO_ACCOUNT_FOR_PROVIDER`，不建立任何資料；
        使用者選擇建立新帳號後，以**同一組**一次性碼加上 `create: true` 重送即可。
        收到 404 `NO_ACCOUNT_FOR_PROVIDER`、400 `EMAIL_REQUIRED` 或 409 `ACCOUNT_EXISTS_LINK_REQUIRED` 時
        一次性碼保留待用（仍受 5 分鐘期限限制），可再用於 `create: true` 或 `POST /api/auth/social/link-login`；
        其餘失敗會立即作廢。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                create:
                  type: boolean
                  description: |
                    使用者已明確選擇「以這個身分建立新帳號」時才送 `true`。
                    省略或為 `false` 時，尚未綁定的身分一律回 404 `NO_ACCOUNT_FOR_PROVIDER`。
                email:
                  type: string
                  format: email
                  description: 僅在收到 `EMAIL_REQUIRED` 後補送（LINE 未開通電子郵件權限時）。
                nickname: { type: string, minLength: 2, maxLength: 50 }
                accept_legal: { type: boolean, description: 建立新帳號時是否一併記錄同意目前版本的法律文件。 }
                device_id: { type: string, maxLength: 64 }
                device_name: { type: string, maxLength: 100 }
                platform: { type: string, maxLength: 20 }
                app_version: { type: string, maxLength: 20 }
      responses:
        '200':
          description: 登入成功或綁定成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 登入成功 }
                  data:
                    type: object
                    properties:
                      token: { type: string, description: 登入模式才有。 }
                      linked: { type: boolean, description: 綁定模式才有。 }
                      provider: { type: string, description: 綁定模式才有。 }
              examples:
                登入:
                  value: { success: true, message: 登入成功, data: { token: eyJhbGciOiJIUzI1NiJ9.abc.def } }
                綁定:
                  value: { success: true, message: 已綁定此登入方式, data: { linked: true, provider: line } }
        '400':
          description: 一次性碼不存在、已使用或已逾時。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                一次性碼失效:
                  value: { success: false, code: OAUTH_CODE_INVALID, message: 登入逾時，請重新操作 }
                需要電子郵件:
                  value: { success: false, code: EMAIL_REQUIRED, message: 請提供電子郵件以建立帳號 }
        '403':
          description: 帳號已停權、列入黑名單，或該渠道不允許直接註冊。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                帳號已停權:
                  value: { success: false, code: ACCOUNT_INACTIVE, message: 此帳號已停權，請聯絡客服 }
                不允許註冊:
                  value: { success: false, code: SIGNUP_NOT_ALLOWED, message: 此登入方式僅供既有帳號使用 }
        '404':
          description: '此第三方身分尚未綁定任何帳號，且請求未帶 `create: true`。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                code: NO_ACCOUNT_FOR_PROVIDER
                message: 此 LINE 帳號尚未綁定任何帳號
        '409':
          description: 電子郵件已註冊，須登入該帳號並綁定（`POST /api/auth/social/link-login`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                code: ACCOUNT_EXISTS_LINK_REQUIRED
                message: 此電子郵件已註冊，請登入該帳號以綁定此登入方式
                provider_email: member@example.com
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AuthSocialUnavailable' }

components:
  schemas:
    SignInProvider:
      type: object
      properties:
        id: { type: string, enum: [google, apple, phone, line, discord] }
        enabled: { type: boolean, description: 可用於登入與綁定。 }
        signup: { type: boolean, description: 可用該方式直接建立新帳號。 }
        configured: { type: boolean, description: 伺服器已設定該渠道所需的憑證。 }

    SignInMethod:
      type: object
      properties:
        provider: { type: string, enum: [google, apple, phone, line, discord] }
        display_name: { type: string, nullable: true, example: 小明 }
        masked_email: { type: string, nullable: true, example: ab***@gmail.com }
        masked_phone: { type: string, nullable: true, example: 09**-***-678 }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    SignInMethodList:
      type: object
      properties:
        password_set:
          type: boolean
          description: 為 `false` 時代表帳號尚未設定密碼，App 應顯示「設定密碼」而非「變更密碼」。
          example: true
        identities:
          type: array
          items: { $ref: '#/components/schemas/SignInMethod' }

  responses:
    AuthSocialUnavailable:
      description: 伺服器尚未設定 Firebase 專案參數，Google、Apple 與手機號碼登入暫時無法使用。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            code: AUTH_SOCIAL_UNAVAILABLE
            message: 社群登入暫時無法使用，請稍後再試

    AuthProviderError:
      description: 無法連線至第三方登入服務或其回應不正確。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            code: AUTH_PROVIDER_ERROR
            message: 目前無法完成第三方登入驗證，請稍後再試
