tags:
  - name: 客服中心 (Support)
    description: |
      應用程式內的說明與客服功能，包含常見問題、服務條款與隱私權政策，
      以及站內客服工單。

      平台未提供支援信箱，客服往來一律透過工單進行，
      由管理員於「後台：客服與條款」回覆。

paths:
  /api/support/faqs:
    get:
      summary: 取得常見問題
      operationId: listFaqs
      tags: [客服中心 (Support)]
      description: |
        僅回傳 `is_visible` 為 true 的項目，依分類、排序值、編號依序排序，
        可直接依 `category` 分組呈現。無須登入。
      security: []
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Faq' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/support/legal/{key}:
    get:
      summary: 取得法律文件
      operationId: getLegalDocument
      tags: [客服中心 (Support)]
      description: |
        取得服務條款或隱私權政策的內容。文件儲存於資料庫，
        管理員可隨時更新而無須發布新版應用程式。無須登入。
      security: []
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string, enum: [terms, privacy] }
          description: '`terms` 為服務條款，`privacy` 為隱私權政策。'
          example: terms
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/LegalDocument' }
        '404':
          description: 指定的 key 無對應文件。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到這份文件 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/support/tickets:
    get:
      summary: 取得我的工單
      operationId: listMyTickets
      tags: [客服中心 (Support)]
      description: |
        列出請求者開立的工單，依最後更新時間遞減排序。

        `last_message` 為工單的第一則訊息，即原始問題描述，供列表摘要使用。
        無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 開立工單
      operationId: createTicket
      tags: [客服中心 (Support)]
      description: |
        建立新工單。問題描述將成為工單的第一則訊息，初始狀態為 `open`。

        單一使用者同時最多保有 5 張處理中（`open` 或 `pending`）的工單，
        超出上限時回傳 400。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, content]
              properties:
                subject: { type: string, maxLength: 100, example: 代幣沒有入帳 }
                content: { type: string, description: 問題描述，將成為工單的第一則訊息。, example: 訂單完成三天，代幣仍未入帳。 }
                category:
                  type: string
                  enum: [account, trade, wallet, cabinet, bug, other]
                  default: other
                  description: 未列於列舉的值一律儲存為 `other`。
            example: { subject: 代幣沒有入帳, content: 訂單已完成三日，代幣尚未入帳。, category: wallet }
      responses:
        '201':
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      ticket_id: { type: integer, example: 22 }
        '400':
          description: 欄位不符合限制，或處理中的工單已達上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未填主旨:
                  value: { success: false, message: 請填寫問題主旨 }
                主旨太長:
                  value: { success: false, message: 主旨不可超過 100 字 }
                未填內容:
                  value: { success: false, message: 請描述你遇到的問題 }
                工單數達上限:
                  value: { success: false, message: 你已有 5 張處理中的工單，請等客服回覆後再開新的 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/support/tickets/{id}:
    get:
      summary: 取得工單內容
      operationId: getTicket
      tags: [客服中心 (Support)]
      description: |
        回傳工單及其完整對話，訊息由舊至新排序。
        僅開單者本人或管理員可查詢。

        各則訊息的 `is_staff` 用於區分發送方為客服或使用者。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 22
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/SupportTicket'
                      - type: object
                        properties:
                          messages:
                            type: array
                            description: 對話內容，由舊至新排序。
                            items: { $ref: '#/components/schemas/SupportTicketMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/support/tickets/{id}/messages:
    post:
      summary: 回覆工單
      operationId: replyTicket
      tags: [客服中心 (Support)]
      description: |
        使用者與管理員共用此端點回覆，`is_staff` 由伺服器依角色判定，
        用戶端無須帶入。

        回覆後工單狀態隨之變更：

        - 管理員回覆後轉為 `pending`，等待使用者確認，並發送通知予使用者
        - 使用者回覆後轉回 `open`，等待客服處理

        狀態為 `closed` 的工單不接受回覆。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, example: 已為您補上代幣，造成不便敬請見諒。 }
      responses:
        '201':
          description: 已送出。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已送出 }
        '400':
          description: 內容為空白，或工單已結案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                內容為空白:
                  value: { success: false, message: 請輸入內容 }
                已結案:
                  value: { success: false, message: 這張工單已結案，請開立新的工單 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/support/tickets/{id}/close:
    patch:
      summary: 結束工單
      operationId: closeTicket
      tags: [客服中心 (Support)]
      description: |
        將工單標記為 `closed` 並記錄結案時間，開單者本人或管理員皆可執行。

        結案後不接受回覆，如需續談須另行開立工單。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 22
      responses:
        '200':
          description: 已結案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 工單已結案 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
