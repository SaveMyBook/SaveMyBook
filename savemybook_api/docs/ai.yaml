        - $ref: '#/components/parameters/AiMessageNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: string, nullable: true, enum: [helpful, unhelpful, null] }
                reason: { type: string, nullable: true, enum: [books_mismatch, inaccurate, off_topic, other, null] }
      responses:
        '200':
          description: 已記錄。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiFeedbackResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/ai/book-chat/session/close:
    post:
      summary: 開始新的書籍顧問對話
      operationId: closeAiBookChatSession
      tags: [ai]
      description: 將進行中的對話標記為 `closed`，下一則訊息會建立新對話。沒有進行中的對話時同樣回傳 200。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/listing-assist:
    post:
      summary: 上架輔助
      operationId: aiListingAssist
      tags: [ai]
      description: |
        依 ISBN、書名或照片整理書目資料、建議分類、判斷書況並估算二手售價。`mode` 決定處理範圍：

        - `full`（預設，未帶 `mode` 的舊版 App 一律如此）：至少須提供 ISBN、書名或照片其中一項，處理順序如下。
          1. 先查詢 ISBN 共用快取，其次是免費的結構化來源：有 ISBN 時查 Google Books 與 Open Library，只有書名時以書名搜尋候選。
          2. 管理員開啟網路搜尋且服務商支援時，模型以網路搜尋補齊缺少的欄位與新書定價。簡介與定價在快取中都已有資料
             或 30 天內搜尋過仍查不到，或快取記錄此 ISBN 查無結果（30 天內）時不再搜尋。
          3. 模型辨識照片中的封面、書背與版權頁，從分類清單選擇分類，依照片與書況說明判斷書況，並估算售價。
        - `condition`（上架第二步）：書目已在第一步確認，只判斷書況與售價，不查書目、不寫簡介；須提供照片或 `condition_note`。
          App 帶入第一步確認過的書目與 `original_price`。沒有定價時先查 ISBN 快取；仍沒有定價而可使用網路搜尋時只搜尋定價
          （回應的 `mode` 為 `price`），否則改用完整模式（回應的 `mode` 為 `full`），不只憑書名估價；此時模型呼叫失敗會回傳錯誤，
          不會只回傳書目資料。只搜尋定價時，查到的網頁書名與此書不符或沒有書名，該定價與依它算出的售價都不採用；
          查不到定價、模型沒有實際搜尋，或搜尋失敗而改以不搜尋重試時，只回傳書況，`price` 為 null 並於 `warnings` 提示賣家自行填寫售價。

        **每日次數**：`full` 成功時回傳 `followup_token`。第二步以 `condition` 帶回時該次不另計每日次數，一次上架只算一次；
        權杖只能折抵一次、24 小時內有效，沒有或已使用過的權杖照常計次。權杖只免除成功次數：當日已計費的失敗達上限時照樣回傳 429
        `AI_DAILY_LIMIT`；第二步失敗且已產生費用時權杖作廢，未產生費用時歸還。

        **ISBN 共用快取**：同一個 ISBN 的書目欄位、簡介、定價與來源保存 30 至 180 天，供其他賣家上架與書目補齊沿用，
        避免重複付費搜尋；查無結果保存 30 天，網路搜尋過仍查不到的簡介、定價或出版日期 30 天內不再為該欄位搜尋（只在服務商確實執行了搜尋時才記錄）。
        只保存可查證的結果：書目來源（已比對 ISBN 與書名）、依來源整理的簡介，以及有服務商引用來源且模型輸出的書名與書目相符的
        網路搜尋結果。有書目來源時提示詞改用書目的書名；請求附有書況說明、照片，或只有賣家輸入的書名可對照時，模型整理的簡介、
        查到的定價與「查無結果」都不保存（可能受其中夾帶的指示影響）。快取的書名與這次輸入的書名不符時不沿用。
        產生書目、簡介與定價的提示詞規則變更後舊快取一律失效（書況與售價規則不影響），管理員可清除單一 ISBN 的快取。

        **售價**：已知定價時由伺服器依書況比例（近全新 5 至 6.5 成、良好 3.5 至 5 成、普通 2 至 3.5 成、待修補 1 至 2 成）
        算出四種書況的建議價放在 `price.by_condition`，App 切換書況時直接換價；模型只能依出版年份、熱門程度或站內行情在比例中位數的
        ±20% 內微調。尚未判斷書況時 `suggested` 以「良好」計算。站內同 ISBN 至少 3 筆刊登時，售價中位數會提供給模型並列入 `reasons`。
        建議價一律低於價格送審門檻（站內同書行情的 3 倍與行情加 300 代幣兩者中較高者，沒有行情時為 3,000 代幣）。
        `price.original_price_verified` 為 true 時，定價來自快取、App 帶入或有引用來源且書名相符的網路搜尋；
        App 只應把查證過、且賣家採用了建議售價的定價帶到第二步。

        使用者尚未同意 AI 資料處理時回傳 403 `AI_CONSENT_REQUIRED`，不查詢外部書庫也不呼叫服務商。

        簡介（`fields.description`）由模型整理成可直接放上架頁的繁體中文內容，並清除 HTML、書店促銷與活動訊息、
        重複書名、外部網址與電話；`description_source` 說明簡介來自書目來源、模型撰寫或兩者混合。
        沒有書目簡介、網路搜尋來源、照片或候選書目簡介可依據時，不採用模型撰寫的簡介。

        輸入的 ISBN 檢查碼錯誤時不查詢外部書庫，並於 `warnings` 提示。同時輸入 ISBN 與書名、而書目的書名不符時不採用該書目，
        於 `warnings` 提示「ISBN 與書名不一致，請確認版本」。未輸入 ISBN、由模型從照片或網路辨識出 ISBN 時，
        以該 ISBN 查詢書目：書名與賣家輸入（或模型辨識）的書名相符時以書目來源為準，簡介直接採用書目簡介
        （模型撰寫時沒有看到這份書目）；不相符時保留模型的欄位，並於 `warnings` 提示「照片辨識的 ISBN 與書名不一致，請確認版本」
        （未提供照片時為「ISBN 與書名不一致，請確認版本」）。兩種不一致的情況 `isbn_mismatch` 皆為 true。
        `sources` 以服務商實際引用的網頁為準，沒有引用標註時才列出模型回報的網頁。
        出版日期盡量給到日，`fields.publish_date_precision` 標示實際確認到的精度，精度不足時不會補上未經確認的日或月。

        照片只在記憶體中處理，不會儲存；送出前移除 EXIF、XMP 等中繼資料。無法移除中繼資料的格式（HEIC、HEIF、AVIF）不會送出，
        並於 `warnings` 提示；只提供這類照片且沒有 ISBN 與書名時回傳 400。書目欄位以外部書庫為優先；無法確認的欄位為空字串。
        售價以 10 代幣為單位（代幣等值新臺幣），最低 20 代幣，`suggested` 介於 `min` 與 `max` 之間，且不高於已知的定價；
        定價低於 20 時以定價為準。書況依賣家說明下修時，調整後的售價依相同規則處理。
        未提供照片與書況說明時 `condition` 為 null。

        指定的服務商不支援照片辨識時，改用已設定金鑰的 Gemini 或 OpenAI；皆未設定時僅依文字判斷並於 `warnings` 提示。
        內容遭服務商阻擋且沒有可用的書目資料時回傳 422 `AI_CONTENT_BLOCKED`；有書目資料時改回傳書目資料並於 `warnings` 提示。

        **整體時限**：自收到請求起 75 秒（短於 App 上傳請求的 90 秒逾時），備援服務商與不搜尋的重試共用剩餘時間。
        網路搜尋失敗時改以不搜尋重試；不搜尋的呼叫輸出格式錯誤且時間足夠時，附上錯誤說明重試一次。
        剩餘時間不足或重試仍失敗時，有書目資料就回傳書目資料並於 `warnings` 提示，否則回傳 502。
        需要網路搜尋的請求不會改由不支援搜尋的備援服務商處理；只有實際使用網路搜尋時，`sources` 才列出模型提供的參考網頁。

        `suggestion_token` 為這次建議的權杖（沒有任何建議值時為 null）。建立書籍時以 `ai_suggestion_tokens` 帶回
        （見 `POST /api/books`），伺服器比對書目欄位、分類、書況與售價是否採用建議值，用於統計各欄位的採用率；
        與請求中賣家輸入的 ISBN、書名相同的值不列為建議；售價等於建議價，或等於 `price.by_condition` 中賣家所選書況的建議價，都算採用。
        權杖 24 小時內有效、只能使用一次；簡介只保存雜湊值，未使用的建議值 24 小時後刪除。建立書籍算出採用結果後即清除建議值，
        只保留各欄位是否採用的紀錄 90 天；列入個資匯出，撤回 AI 資料處理同意或帳號刪除時一併刪除。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [full, condition], default: full }
                isbn: { type: string, description: 10 或 13 碼，可含連字號。, example: '9789573317241' }
                title: { type: string, maxLength: 255, example: 挪威的森林 }
                condition_note: { type: string, maxLength: 500, example: 書角有輕微折痕 }
                author: { type: string, maxLength: 255, description: 僅 `condition` 使用，第一步確認過的作者。 }
                publisher: { type: string, maxLength: 255, description: 僅 `condition` 使用。 }
                publish_date: { type: string, maxLength: 20, description: 僅 `condition` 使用。 }
                category_id: { type: integer, description: 僅 `condition` 使用，第一步選擇的分類。 }
                original_price: { type: integer, minimum: 1, maximum: 99999, description: 僅 `condition` 使用，第一步查到的新書定價（新臺幣）。 }
                followup_token: { type: string, maxLength: 100, description: 僅 `condition` 使用，第一步回傳的 `followup_token`。 }
                images:
                  type: array
                  maxItems: 4
                  items: { type: string, format: binary }
                  description: 最多 4 張，單張 5 MB 以內，接受 JPG、PNG、GIF、WebP；HEIC、HEIF、AVIF 可上傳但不會送交服務商。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AiListingAssist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AiConsentRequired' }
        '413':
          description: 單張照片超過 5 MB。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 檔案大小超過上限 }
        '422': { $ref: '#/components/responses/AiContentBlocked' }
        '429': { $ref: '#/components/responses/AiDailyLimit' }
        '502': { $ref: '#/components/responses/AiProviderError' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/ai/recommendations:
    get:
      summary: AI 個人推薦
      operationId: listAiRecommendations
      tags: [ai]
      description: |
        從最多 60 本販售中、已審核、非本人上架的候選書籍中，依使用者的收藏、購買、購物車與最近瀏覽紀錄排序並附上推薦理由。
        候選書籍結合個人化排序，與使用者最強的 6 筆紀錄（購買、收藏、購物車、最近瀏覽依序）各自內容相似的書
        （以已存的語意向量找鄰近的書，並以書名、作者、分類、簡介做關鍵字比對），各清單交錯合併，同時出現在多份清單的書排在最前面。
        熱門書補位最多 10 本，並在提示詞中標示為熱門補位；只由熱門書補進候選的書最多只能比其候選順序往前移 3 名，
        避免書名或簡介夾帶指令的書被排到最前面；書名、作者、簡介放入提示詞前也會攤平成單行並替換分隔符號。
        推薦理由含電話、電子郵件、通訊軟體帳號或站外網址時改為 null。
        書櫃維修中與其他買家預約保留中的書結帳時會被擋下，AI 推薦與改回傳的既有推薦都不列入；請求者本人預約保留的書照常列出。
        購買紀錄不含已取消或已退款的訂單，但這些訂單中的書不會再推薦給同一位買家；收藏、購物車與最近瀏覽只採用已核准且未下架的書。
        結果依使用者快取 6 小時；收藏、購買或購物車有變動時提前重新產生。
        快取期間已售出、下架、書櫃維修中或被其他買家保留的書籍會被濾除；只有實際呼叫模型才計入每日次數，
        今日次數在檢索候選書之前檢查。

        **背景產生**：此端點不等待模型。需要重新產生時，有舊推薦先回傳舊推薦，沒有時先回傳既有推薦，
        同時在背景產生；同一使用者同時只產生一次。`meta.refreshing` 為 true 表示背景正在產生，用戶端稍後重新讀取即可取得新結果。
        產生失敗或沒有結果時，15 到 30 分鐘內不再重試，期間沿用舊推薦或既有推薦。

        AI 無法使用（未開放、預算用盡、今日次數用完、服務商錯誤）、使用者尚未同意 AI 資料處理，或使用者沒有任何紀錄時，
        改回傳既有推薦（`meta.source` 為 `fallback`，`reason` 與 `basis` 為 null），此端點不會因 AI 問題回傳錯誤。
        每位使用者每分鐘最多 30 次請求，超過時回傳 429 `RATE_LIMITED`。

        使用者標示「不感興趣」的書（`POST /api/ai/recommendations/dismissals`）不會出現在 AI 推薦與既有推薦中。
        回傳的書籍記為推薦曝光，同一來源 6 小時內每本書只記一次：`meta.source` 為 `ai` 且附有 `reason` 或 `basis` 的書記為 AI 推薦，
        其餘（含模型未選而補在後面的書與改回傳的既有推薦）記為規則式推薦；`viewed_ids` 中的書首頁不顯示，不記曝光。
        曝光紀錄保存 90 天，並列入個資匯出與帳號刪除。

        **分組**：伺服器先算出每本候選書可查證的關聯（與某筆紀錄同作者、與某筆紀錄的書籍向量相似度達門檻且接近最相近的一本，或屬於常看分類），
        模型只能從該書列出的關聯中選一個作為依據，清單外的代號一律視為沒有依據；書名與分類名稱由伺服器依紀錄帶入，不採用模型寫的文字。
        依據為同作者或同分類時，推薦理由由伺服器依模板產生（例如「同為東野圭吾的作品」「屬於您常看的「推理小說」分類」；
        多位作者時取第一位並加註「等人」，名稱過長或含聯絡資訊時改為「同一作者的其他作品」「屬於您常看的分類」）。
        模型最多挑選 20 本，其餘候選書依候選順序補在後面且不附理由；輸出被截斷時採用已完整輸出的項目。`groups` 依推薦順序列出：同一依據至少 2 本才成一組，最多 3 組，每組最多 10 本；
        其餘書籍（含依據不明與熱門補位）歸入 `kind` 為 `more` 的最後一組。依據的書籍已下架或退回審核時，該書的 `basis` 改為 null。
        App 依 `kind` 與 `relation` 組出標題，例如「因為您收藏了《白夜行》」「您常看的「推理小說」」。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 30 }
        - in: query
          name: viewed_ids
          schema: { type: string }
          description: App 端最近瀏覽的書籍編號，以逗號分隔，最多採用 20 筆，作為較弱的興趣訊號；已下架或未核准的書不採用。
          example: '12,45,7'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        book: { $ref: '#/components/schemas/Book' }
                        reason: { type: string, nullable: true, maxLength: 30, example: 與您收藏的《白夜行》同屬推理小說 }
                        basis:
                          type: object
                          nullable: true
                          description: 推薦依據；依據不明或一般推薦時為 null。
                          properties:
                            kind: { type: string, enum: [book, category] }
                            relation: { type: string, enum: [purchase, favorite, cart, viewed], description: 僅 `book` 提供 }
                            book_id: { type: integer, nullable: true, description: 僅 `book` 提供 }
                            title: { type: string, description: 僅 `book` 提供，例如 白夜行 }
                            name: { type: string, description: 僅 `category` 提供，分類名稱 }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [book, category, more] }
                        relation: { type: string, enum: [purchase, favorite, cart, viewed], description: 僅 `book` 提供 }
                        book_id: { type: integer, nullable: true, description: 僅 `book` 提供，依據的書籍編號 }
                        title: { type: string, description: 僅 `book` 提供，依據的書名 }
                        category: { type: string, description: 僅 `category` 提供 }
                        book_ids:
                          type: array
                          items: { type: integer }
                          description: 此組的書籍，皆在 `data` 中
                    example:
                      - { kind: book, relation: favorite, book_id: 12, title: 白夜行, book_ids: [31, 8] }
                      - { kind: category, category: 考試用書, book_ids: [44, 19, 27] }
                      - { kind: more, book_ids: [5, 61] }
                  meta:
                    type: object
                    properties:
                      source: { type: string, enum: [ai, fallback] }
                      generated_at: { type: string, format: date-time }
                      refreshing: { type: boolean, example: false, description: 背景正在產生新的推薦 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/ai/recommendations/clicks:
    post:
      summary: 記錄推薦點擊
      operationId: clickAiRecommendation
      tags: [ai]
      description: |
        使用者從首頁推薦開啟書籍時呼叫，將 7 天內這本書最近一次的推薦曝光標記為已點擊（AI 推薦與規則式推薦皆適用）。
        沒有對應的曝光或已記錄過時 `recorded` 為 false。此端點不呼叫模型。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 31 }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      recorded: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/ai/recommendations/dismissals:
    post:
      summary: 標示推薦書籍不感興趣
      operationId: dismissAiRecommendation
      tags: [ai]
      description: |
        之後的 AI 推薦（含快取中的結果與熱門補位）與 `GET /api/books/recommended` 都不再列出這本書。重複標示同樣回傳 200。
        紀錄列入個資匯出，帳號刪除或書籍刪除時一併刪除。書籍不存在時回傳 404。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 31 }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  schemas:
    AiStatus:
      type: object
      properties:
        support: { type: boolean, example: true }
        listing_assist: { type: boolean, example: true }
        recommend: { type: boolean, example: true }
        book_chat: { type: boolean, example: true }
        web_search: { type: boolean, example: true }
        consented: { type: boolean, example: false }
        consent_outdated: { type: boolean, example: false }
        providers_in_use:
          type: array
          items: { type: string, enum: [DeepSeek, Google Gemini, OpenAI] }
          example: [DeepSeek, OpenAI]
        embedding_provider:
          type: string
          nullable: true
          enum: [Google Gemini, OpenAI]
          example: OpenAI

    AiClientId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: 用戶端為每則訊息產生的識別碼，重送同一則訊息時沿用。未提供時不防止重複處理。
      example: 3f9c2a7b41d84e0c9a6b5d2e8f1a0c7d

    AiMessageFeedback:
      type: object
      nullable: true
      description: 使用者對這則助理訊息的評價；未評價或使用者訊息時為 null。
      properties:
        rating: { type: string, enum: [helpful, unhelpful] }
        reason: { type: string, nullable: true, example: inaccurate }

    AiFeedbackResult:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: 已記錄評價 }
        data:
          type: object
          properties:
            message_no: { type: string, example: AS3K9QX2M }
            feedback: { $ref: '#/components/schemas/AiMessageFeedback' }

    AiSupportMessage:
      type: object
      properties:
        message_id: { type: integer, example: 101 }
        message_no: { type: string, description: 評價用的加密編號，僅助理訊息提供, example: AS3K9QX2M }
        feedback: { $ref: '#/components/schemas/AiMessageFeedback' }
        role: { type: string, enum: [user, assistant] }
        content: { type: string, example: 您可至書櫃掃描機台上的 QR Code 取件。 }
        client_id: { type: string, nullable: true, description: 僅使用者訊息提供，見 `AiClientId` }
        suggest_handoff: { type: boolean, example: false, description: 僅助理訊息提供，建議轉由客服人員處理 }
        degraded: { type: boolean, example: false, description: 僅助理訊息提供，回覆為檢索到的說明原文 }
        suggestions:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 60 }
          description: 僅助理訊息提供。可直接點擊送出的追問建議（30 字內，`locale` 為 `en` 時 60 字元內）；降級、固定說明與舊訊息為空陣列。
          example: [取書期限是幾天？]
        created_at: { type: string, format: date-time }
        order_nos:
          type: array
          description: 回覆中提到、且請求者為買方或賣方的訂單編號（僅助理訊息，最多 3 筆）
          items: { type: string, example: SMB20260928143015123456 }

    AiSupportSession:
      type: object
      properties:
        session_id: { type: integer, example: 12 }
        status: { type: string, enum: [open, closed, escalated] }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AiSupportMessage' }

    AiBookChatBook:
      type: object
      properties:
        book: { $ref: '#/components/schemas/Book' }
        reason: { type: string, nullable: true, maxLength: 30, example: 節奏明快，適合通勤閱讀 }

    AiBookChatMessage:
      type: object
      properties:
        message_id: { type: integer, example: 101 }
        message_no: { type: string, description: 評價用的加密編號，僅助理訊息提供, example: AC7H2WQ4N }
        feedback: { $ref: '#/components/schemas/AiMessageFeedback' }
        role: { type: string, enum: [user, assistant] }
        content: { type: string, example: 以下是適合通勤閱讀的推理小說。 }
        client_id: { type: string, nullable: true, description: 僅使用者訊息提供，見 `AiClientId` }
        books:
          type: array
          items: { $ref: '#/components/schemas/AiBookChatBook' }
        suggestions:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 40 }
          description: 僅助理訊息提供。可直接點擊送出的追問建議。
          example: [有沒有更輕薄好攜帶的, 換成日系作家呢]
        degraded:
          type: boolean
          example: false
          description: 僅助理訊息提供。至少一次模型呼叫失敗或未送出。第一次呼叫失敗時書單以使用者原話檢索；第二次呼叫失敗時書單為檢索排序，不附推薦理由。
        created_at: { type: string, format: date-time }

    AiBookChatReply:
      allOf:
        - $ref: '#/components/schemas/AiBookChatMessage'

    AiBookChatSession:
      type: object
      properties:
        session_id: { type: integer, example: 8 }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AiBookChatMessage' }

    AiListingAssist:
      type: object
      properties:
        mode:
          type: string
          enum: [full, condition, price]
          description: 實際執行的處理：`full` 完整整理書目；`condition` 只判斷書況與售價；`price` 另以網路搜尋查詢定價。`condition` 與 `price` 的 `fields` 為空物件。
          example: full
        followup_token:
          type: string
          nullable: true
          description: 僅 `full` 成功時提供，上架第二步以 `condition` 帶回時不另計每日次數。
        fields:
          type: object
          properties:
            title: { type: string, example: 挪威的森林 }
            subtitle: { type: string, example: '' }
            author: { type: string, example: 村上春樹 }
            publisher: { type: string, example: 時報出版 }
            publish_date: { type: string, description: 精度不足時只給到 YYYY-MM 或 YYYY。, example: '2003-08-01' }
            publish_date_precision:
              type: string
              enum: [day, month, year, '']
              description: 出版日期實際確認到的精度；非 `day` 時用戶端應標示僅確認到月或年。
              example: day
            isbn: { type: string, example: '9789573317241' }
            description:
              type: string
              description: 已清除 HTML、書店促銷字樣、贈品與活動訊息、外部網址與電話的繁體中文簡介，約 150 至 400 字。
              example: ''
            page_count: { type: integer, nullable: true, example: 384 }
            language: { type: string, description: BCP 47 標記，無法確認時為空字串。, example: zh-Hant }
        description_source:
          type: string
          enum: [sources, ai, mixed, '']
          description: |
            簡介的來源：`sources` 為書目來源原文整理、`mixed` 為模型整理書目來源的文字、
            `ai` 為模型依網路搜尋、照片或候選書目撰寫（用戶端不應預設採用）；沒有簡介時為空字串。
          example: mixed
        category:
          type: object
          nullable: true
          properties:
            category_id: { type: integer, example: 3 }
            name: { type: string, example: 文學小說 }
            confidence: { type: number, minimum: 0, maximum: 1, example: 0.82 }
        condition:
          type: object
          nullable: true
          properties:
            level: { type: string, enum: [like_new, good, fair, poor] }
            confidence: { type: number, minimum: 0, maximum: 1, example: 0.7 }
            reasons:
              type: array
              items: { type: string }
              description: 看到的具體瑕疵與位置；賣家書況說明提到的瑕疵比模型判斷更嚴重時，等級會往下調並在第一點說明。
              example: [封面邊角輕微磨損]
            unseen:
              type: array
              items: { type: string }
              description: 照片中看不到、無法確認書況的部位，同時會列入 warnings 提醒賣家補拍。
              example: [內頁, 書口]
        price:
          type: object
          nullable: true
          properties:
            suggested: { type: integer, example: 180 }
            min: { type: integer, example: 150 }
            max: { type: integer, example: 220 }
            original_price: { type: integer, nullable: true, example: 380 }
            original_price_verified:
              type: boolean
              description: 定價來自 ISBN 快取、App 帶入，或有引用來源且書名相符的網路搜尋；false 表示定價未經查證或為模型估計，不應當成已知定價帶到第二步。
              example: true
            currency: { type: string, example: TWD }
            reasons:
              type: array
              items: { type: string }
              description: 計算依據，例如採用的定價與書況比例、站內同書行情。
              example: [依定價 380 元與書況「良好」約 3.5 至 5 成的比例計算]
            by_condition:
              type: object
              nullable: true
              description: 已知定價時四種書況各自的建議價；定價未知、由模型估價時為 null。
              properties:
                like_new: { $ref: '#/components/schemas/AiPriceRange' }
                good: { $ref: '#/components/schemas/AiPriceRange' }
                fair: { $ref: '#/components/schemas/AiPriceRange' }
                poor: { $ref: '#/components/schemas/AiPriceRange' }
        sources:
          type: array
          items:
            type: object
            properties:
              title: { type: string, example: Open Library }
              url: { type: string, description: Gemini 的引用網址為轉址連結，開啟後導向實際網頁。, example: 'https://openlibrary.org/isbn/9789573317241' }
              domain: { type: string, description: 實際網站的網域，用於顯示；取自服務商的引用資料或網址本身，不採用模型輸出的網域。, example: openlibrary.org }
        isbn_mismatch:
          type: boolean
          description: ISBN 查到的書目與書名不一致，無法確認欄位屬於哪一本書；用戶端不應預設採用書目欄位。
          example: false
        warnings:
          type: array
          items: { type: string }
          example: [照片未能辨識書況，建議補充封面與書背照片]
        provider: { type: string, enum: [deepseek, gemini, openai] }
        model: { type: string, example: gemini-3.1-flash-lite }
        suggestion_token:
          type: string
          nullable: true
          description: 建立書籍時以 `ai_suggestion_tokens` 帶回，用於統計採用率；沒有任何建議值時為 null。
          example: 3f9a0c1e5b7d42a8961e0f2c4b6d8a10

    AiPriceRange:
      type: object
      properties:
        suggested: { type: integer, example: 160 }
        min: { type: integer, example: 130 }
        max: { type: integer, example: 190 }

  parameters:
    AiMessageNo:
      in: path
      name: messageNo
      required: true
      schema: { type: string }
      description: 助理訊息的加密編號（`message_no`）。
      example: AS3K9QX2M

  responses:
    AiUnavailable:
      description: AI 功能無法使用：未開放、未設定金鑰或本月預算用盡。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            未開放:
              value: { success: false, code: AI_DISABLED, message: AI 功能目前未開放 }
            預算用盡:
              value: { success: false, code: AI_BUDGET_EXCEEDED, message: AI 功能本月用量已達上限，請稍後再試 }
            未設定金鑰:
              value: { success: false, code: AI_NOT_CONFIGURED, message: AI 服務尚未完成設定 }

    AiConsentRequired:
      description: 使用者尚未同意將資料提供給 AI 服務商處理。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: AI_CONSENT_REQUIRED, message: 使用 AI 功能前，請先同意將相關資料提供給 AI 服務商處理 }

    AiDailyLimit:
      description: 今日使用次數已達上限。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: AI_DAILY_LIMIT, message: 今日 AI 使用次數已達上限，請明日再試 }

    AiContentBlocked:
      description: 服務商的安全機制拒絕處理這段內容，重送相同內容仍會失敗。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: AI_CONTENT_BLOCKED, message: 此內容無法由 AI 處理，請調整內容後再試 }

    AiRequestInProgress:
      description: 相同 `client_id` 的訊息仍在處理中。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: AI_REQUEST_IN_PROGRESS, message: 這則訊息仍在處理中，請稍後再試 }

    AiProviderError:
      description: 服務商錯誤、逾時或回應格式不正確，且沒有可降級的內容。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: AI_PROVIDER_ERROR, message: AI 服務暫時無法使用，請稍後再試 }
