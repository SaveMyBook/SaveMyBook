        `reason` 只適用於 `unhelpful`：`inaccurate`（內容不正確）、`off_topic`（未回答問題）、`incomplete`（資訊不足）、`other`。
        `messageNo` 為訊息的加密編號（`message_no`）；不是本人的訊息、使用者訊息或已刪除的訊息回傳 404。
        此端點不呼叫模型，不檢查 AI 同意與功能開關。每位使用者每分鐘最多 30 次，與書籍顧問評價、推薦點擊及不感興趣共用。
