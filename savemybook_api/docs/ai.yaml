  /api/ai/book-chat/messages:
    post:
      summary: 傳送訊息給 AI 書籍顧問
      operationId: sendAiBookChatMessage
      tags: [ai]
      description: |
        附加到進行中的對話，沒有時自動建立。每則訊息最多呼叫模型兩次：

        1. 依最近 10 則對話、分類清單與可用的篩選條件，判斷使用者的需求並產生查詢條件。
           條件不足時只回覆釐清問題（`books` 為空陣列），且不再呼叫第二次。
           前一輪有搜尋條件時，提示詞另附前一輪的搜尋條件與當時展示書籍的價格，由模型判斷這則訊息是延續前一輪還是換新主題；
           模型判斷延續、卻沒有給出任何關鍵字與分類時，伺服器沿用前一輪的關鍵字與分類（價格與書況不沿用）。
        2. 伺服器以關鍵字與語意混合檢索取最多 30 本販售中、已審核、非本人上架的書（語意檢索無法使用或相關的書少於 5 本時，另補最多 6 本其他在售書，不附簡介），
           再請模型從中挑選最多 6 本並附上推薦理由。需求含 ISBN（可含連字號、全形數字或「ISBN」前綴，10 碼與 13 碼互通）時，ISBN 相符的書排在最前面。

        書櫃維修中與其他買家預約保留中的書結帳時會被擋下，每個步驟（含補位、熱門書退路與書卡）都不列入；
        請求者本人預約保留的書照常列出。

        兩次呼叫都依固定規格輸出（推薦理由為 `{"id","reason"}` 陣列），支援嚴格模式的服務商（OpenAI）由服務商保證格式，
        所有輸出都再經伺服器驗證；格式不符（例如缺少書單或搜尋條件、書單項目全部格式不符）且剩餘時間足夠時，附上錯誤說明重試一次，重試仍失敗才依下方的降級處理。
        回覆中的《書名》須與本輪的書卡相符，且不得提及價格，有書卡時不得回覆沒有相關書籍；目前只在決策紀錄中記錄違規，不替換回覆。

        書籍一律來自伺服器查詢的候選清單，模型回傳的書籍代號不在清單內時直接捨棄，
        因此不會出現不存在的書籍或價格。書名、作者、簡介等賣家撰寫的文字放入提示詞前會攤平成單行並替換分隔符號；
        回覆含電話、電子郵件、通訊軟體帳號或站外網址時刪除該句，推薦理由含這類內容時改為 null，追問建議含這類內容時不列出。
        模型明確回傳空的書單時 `books` 為空陣列；
        相關的書全是請求者自己上架時，回覆會說明此情況。完全查無在售書時改回傳站上熱門書籍。

        **降級**（`reply.degraded` 為 true，錯誤仍計入用量紀錄）：
        - 第一次呼叫失敗（內容遭阻擋除外）時改以使用者原話檢索。失敗原因屬服務中斷（服務商錯誤、逾時、限流、金鑰或額度問題、
          模型不存在、剩餘時間不足）時不再呼叫第二次，直接以相關度前 6 本書搭配中性說明回覆；格式錯誤時仍請模型挑書。
        - 第二次呼叫失敗（含內容遭阻擋、剩餘時間不足），或書單格式不正確、代號全部無效時，改以檢索結果的前 6 本回覆並附上中性說明。
        - 第一次呼叫會保留約 9 秒給檢索與第二次呼叫；檢索只使用已建立的語意向量，缺少的在背景補齊，不在請求中等待。
        第一次呼叫的內容遭服務商阻擋時回傳 422 `AI_CONTENT_BLOCKED`。

        使用者尚未同意 AI 資料處理時回傳 403 `AI_CONSENT_REQUIRED`，不呼叫服務商也不寫入對話。
        每日次數上限計算第一次呼叫成功的訊息數：第一次成功、第二次失敗時仍計入；第一次失敗時即使第二次成功也不計入，
        但失敗的呼叫已計費時計入每日 10 次的已計費失敗上限。第二次呼叫在用量報表記為 `book_chat_pick`。
        每位使用者每分鐘另有 20 次的請求頻率限制，與 AI 客服、轉接、上架輔助共用。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 500, example: 想找適合通勤看的推理小說，300 元以內 }
                client_id: { $ref: '#/components/schemas/AiClientId' }
      responses:
        '201':
          description: 成功；以相同 `client_id` 重送時回傳第一次的結果（書卡依目前的販售狀態重新查詢）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      session_id: { type: integer, example: 8 }
                      user_message: { $ref: '#/components/schemas/AiBookChatMessage' }
                      reply: { $ref: '#/components/schemas/AiBookChatReply' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AiConsentRequired' }
        '409': { $ref: '#/components/responses/AiRequestInProgress' }
        '422': { $ref: '#/components/responses/AiContentBlocked' }
        '429': { $ref: '#/components/responses/AiDailyLimit' }
        '502': { $ref: '#/components/responses/AiProviderError' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/ai/book-chat/messages/{messageNo}/feedback:
    put:
      summary: 評價 AI 書籍顧問回覆
