        規則同 `PUT /api/ai/support/messages/{messageNo}/feedback`。`reason` 可為 `books_mismatch`（推薦的書不符合需求）、
        `inaccurate`、`off_topic`、`other`。
      security: [{ bearerAuth: [] }]
