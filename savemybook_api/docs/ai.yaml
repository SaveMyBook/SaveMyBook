        以一般客服工單流程建立工單（通知具客服權限的管理員），第一則訊息為 AI 客服對話紀錄，
        並將對話標記為 `escalated`。未提供主旨時以最後一則實質提問產生（略過「謝謝」「轉接真人客服」這類訊息）。
        工單類別優先採用最近一則助理訊息建議轉接時標示的分類（`other` 除外）；沒有時依最近 3 則實質提問判斷：
        提到閃退、當機、系統錯誤等為 `bug`，其餘依對應的平台說明主題歸入
        `account`、`trade`、`wallet` 或 `cabinet`，無法判斷時為 `other`（僅提到訂單編號時為 `trade`）。此判斷不呼叫模型。

        沒有進行中的對話、或處理中的工單已達 5 張時回傳 400。此端點不呼叫模型，AI 功能關閉時仍可使用；
        使用者撤回 AI 資料處理同意時對話已刪除，回傳 400。
