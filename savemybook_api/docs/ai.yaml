tags:
  - name: ai
    x-displayName: AI 功能
    description: |
      AI 客服、書籍顧問、上架輔助與個人推薦。上架審核在上架與編輯書籍時於伺服器端執行，使用者端沒有對應端點。

      模型服務商（DeepSeek、Google Gemini、OpenAI）的 API 金鑰只存放於伺服器環境變數，
      不寫入資料庫，也不會回傳給任何用戶端。管理員於「後台：AI 設定」選擇服務商、模型、單價與用量上限。

      用戶端應先呼叫 `GET /api/ai/status`，只顯示值為 `true` 的功能入口。

      AI 客服、書籍顧問、上架輔助與個人推薦會將使用者的資料提供給外部 AI 服務商處理，須先取得使用者明確同意
      （`PUT /api/ai/consent`），同意可隨時撤回。未同意時 AI 客服、書籍顧問與上架輔助回傳 403 `AI_CONSENT_REQUIRED`，
      個人推薦改回傳既有推薦。同意以當時的隱私權政策版本記錄：隱私權政策經後台發布重大更新（版本加一）後，
      先前的同意即失效，須重新同意。
      上架審核只處理公開的商品內容，交易爭議分析為處理爭議所必要，一般書籍搜尋的關鍵字會送往嵌入服務商計算語意向量，
      這三項已揭露於隱私權政策，不以使用者同意為前提。送交服務商的照片會先移除 EXIF、XMP 等中繼資料（含拍攝位置）。

      AI 客服與書籍顧問的對話在最後一則訊息滿 90 天後由排程刪除（結束或轉接對話不會重新起算）；使用者撤回同意時立即刪除。
      使用者對助理訊息的評價存在訊息上，隨對話一併刪除，並列入個資匯出；評價只保存在本平台，不會送交 AI 服務商。

      **決策紀錄**：AI 客服與書籍顧問的每則助理訊息附帶一段處理紀錄（檢索到的段落代號與分數、服務商與模型、各階段耗時、
      轉接建議、處理路徑；書籍顧問另含模型產生的搜尋條件、候選書與補位數量、推薦理由、追問建議與當時的書價），
      重新讀取對話時據此還原推薦理由、追問建議與轉接建議。AI 客服、書籍顧問、個人推薦與上架輔助每次處理另寫入一筆決策紀錄，
      只含代號、計數與布林值。兩者都不含使用者訊息原文、完整提示詞或照片，滿 90 天由每日排程刪除（助理訊息本身依對話的保存規則），
      使用者撤回同意或帳號匿名化時一併刪除，並列入個人資料匯出。後台只提供彙總統計（見「後台：AI 設定」）。

      | `code` | HTTP | 意義 |
      | --- | --- | --- |
      | `AI_DISABLED` | 503 | 管理員未開放此功能 |
      | `AI_NOT_CONFIGURED` | 503 | 此功能使用的服務商尚未設定 API 金鑰 |
      | `AI_BUDGET_EXCEEDED` | 503 | 本月 AI 費用已達會員功能可用的額度（管理員設定的每月預算扣除上架審核與管理輔助的保留額度） |
      | `AI_CONSENT_REQUIRED` | 403 | 使用者尚未同意將資料提供給 AI 服務商處理，或隱私權政策重大更新後尚未重新同意 |
      | `AI_CONSENT_NOTICE_OUTDATED` | 409 | 同意請求未附上目前的說明版本（舊版 App），須更新 App 後再同意 |
      | `AI_DAILY_LIMIT` | 429 | 使用者今日使用次數已達上限 |
      | `AI_CONTENT_BLOCKED` | 422 | 服務商的安全機制拒絕處理這段內容，重送相同內容仍會失敗，用戶端不應提供重試 |
      | `AI_PROVIDER_ERROR` | 502 | 服務商錯誤、逾時或回應格式不正確，且沒有可降級的內容 |
      | `AI_REQUEST_IN_PROGRESS` | 409 | 相同 `client_id` 的訊息仍在處理中，用戶端可稍後以相同 `client_id` 重送或重新讀取對話 |

      每日次數只計成功的呼叫。已計費但失敗的呼叫（例如內容遭阻擋、輸出被截斷或格式不正確）每人每日每項功能另有 10 次上限，
      達上限同樣回傳 429 `AI_DAILY_LIMIT`；管理員將該功能的每日次數設為 0 時兩者都不限制。

      模型輸出一律由伺服器驗證與清理（數值範圍、分類是否存在、書況列舉、網址格式），不會原樣轉交。
      清理後沒有可用內容的回應記為格式錯誤（計入已計費失敗的上限），不計入每日次數。

      **整體時限與降級**：AI 客服與書籍顧問從收到請求起算有 25 秒的整體時限（短於 App 的 30 秒請求逾時）。
      每次模型呼叫的逾時取「剩餘時間減去後續步驟所需的時間」，剩餘時間不足時不送出請求，直接改用降級內容；
      語意檢索的查詢向量最多等待 2.5 秒，逾時只改用關鍵字檢索。
      `degraded` 為 true 表示至少一次模型呼叫失敗或未送出，回覆有部分由檢索結果或固定說明補足；是否計入每日次數依各功能說明。

      **防止重複**：AI 客服與書籍顧問的訊息可附上用戶端產生的 `client_id`。伺服器開始處理時先登記這個識別碼，
      同一使用者以相同 `client_id` 重送時回傳第一次的結果，不重複呼叫模型、扣次數或寫入對話；第一次仍在處理中時回傳 409
      `AI_REQUEST_IN_PROGRESS`。處理失敗時登記隨即取消，可用同一個識別碼重送。登記只含訊息編號與重建回應所需的推薦理由、追問建議，
      不含訊息內容，建立滿 24 小時後由每日排程刪除，撤回同意時一併刪除。讀取對話時使用者訊息附上 `client_id`。
      用戶端逾時後應以相同 `client_id` 重送：已處理完成時取得第一次的完整回應（含轉接建議、推薦理由與追問建議），
      伺服器未收到時照常處理；收到 409 時可重新讀取對話，確認是否已有回覆。

      **備援服務商**：管理員可為各功能設定備援服務商（見後台 AI 設定）。主要服務商發生服務中斷類錯誤，
      或連續失敗而暫停呼叫時，改由備援服務商處理；備援服務商列入 `providers_in_use`。

paths:
  /api/ai/status:
    get:
      summary: AI 功能開放狀態
      operationId: getAiStatus
      tags: [ai]
      description: |
        功能可用的條件：總開關與該功能皆開啟、該功能使用的服務商已設定金鑰、本月費用未達預算。
        `web_search` 表示上架輔助會以網路搜尋補齊書目與定價。

        `consented` 為請求者是否已同意目前版本的 AI 資料處理說明；`consent_outdated` 為 true 表示曾經同意，
        但隱私權政策已有重大更新，須重新同意（此時 `consented` 為 false）。

        `providers_in_use` 為目前可用的使用者功能實際會使用的服務商顯示名稱（含上架輔助辨識照片時改用的服務商、
        已設定金鑰的備援服務商，以及 AI 客服、書籍顧問或個人推薦可用時的嵌入服務商），供同意說明列出資料接收者。
        `embedding_provider` 為語意檢索使用的嵌入服務商；上述三項功能皆不可用或未設定嵌入金鑰時為 null。

        功能狀態與服務商於伺服器快取約 30 秒，`consented` 與 `consent_outdated` 每次即時查詢。每日次數上限因人而異，不反映在此端點。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AiStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/consent:
    put:
      summary: 同意或撤回 AI 資料處理
      operationId: setAiConsent
      tags: [ai]
      description: |
        `granted: true` 表示使用者同意將下列資料提供給 `providers_in_use` 所列的服務商處理，並記錄目前的隱私權政策版本：

        - AI 客服：使用者輸入的訊息與同一對話的歷史紀錄，以及本人的訂單（含存書、取書、完成時間與據此計算的期限，
          以及訊息中提到且本人為買方或賣方的訂單）、預約、上架書籍（含審核狀態與審核原因）、最近 3 筆交易爭議的狀態與結果、
          錢包餘額與最近 5 筆收支、最近 3 張客服工單的主旨及狀態
        - 書籍顧問：使用者輸入的需求與同一對話的歷史紀錄
        - 上架輔助：ISBN、書名、書況說明、使用者選擇的照片，以及使用者填寫的作者、出版社、出版日期、分類與定價
        - 個人推薦：收藏、購買紀錄、購物車與最近瀏覽中的書籍資訊

        AI 客服的提問、書籍顧問的需求與個人推薦依據的書籍資訊另會送往 `embedding_provider` 計算語意向量。

        同意時須以 `notice_version` 附上用戶端顯示的同意說明版本（目前為 4）；未附上或不相符時回傳 409
        `AI_CONSENT_NOTICE_OUTDATED`，不記錄同意，避免舊版 App 以未列出上述資料的舊說明取得新版政策的同意。
        伺服器記錄同意時的說明版本；以第 3 版之前的說明同意、之後未重新同意的使用者，AI 客服不送出交易爭議、錢包收支
        與訊息中提到的訂單。

        `granted: false` 撤回同意（不檢查 `notice_version`），並刪除該使用者的 AI 客服對話、書籍顧問對話、AI 推薦快取、決策紀錄與上架輔助建議紀錄；
        之後的 AI 客服、書籍顧問與上架輔助請求回傳 403 `AI_CONSENT_REQUIRED`，個人推薦改回傳既有推薦。
        回應為更新後的 `GET /api/ai/status` 內容。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted: { type: boolean, example: true }
                notice_version: { type: integer, description: 用戶端顯示的同意說明版本，同意時必填, example: 4 }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已同意 AI 資料處理 }
                  data: { $ref: '#/components/schemas/AiStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 同意說明版本不符，須更新 App。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: AI_CONSENT_NOTICE_OUTDATED, message: 請更新 App 後再同意 AI 資料處理 }

  /api/ai/support/session:
    get:
      summary: 目前的 AI 客服對話
      operationId: getAiSupportSession
      tags: [ai]
      description: |
        回傳進行中（`open`）的對話與全部訊息；沒有進行中的對話時 `data` 為 null。
        24 小時內以 `client_id` 送出的使用者訊息附上該識別碼，其餘為 null。
        助理訊息附上當時的 `suggest_handoff`、`degraded` 與 `suggestions`，用戶端據此在最後一則助理訊息下方還原轉接提示與追問建議；
        訊息滿 90 天或本功能上線前的訊息兩者皆為 false，`suggestions` 為空陣列。
        最後一則訊息已超過 6 小時的對話視為過期，會標記為 `closed` 並回傳 null，下一則訊息自動開始新對話；
        已結束的對話不提供查詢。
        助理訊息的 `order_nos` 為回覆中提到、且請求者為買方或賣方的訂單編號（最多 3 筆），
        用戶端可據此以 `GET /api/orders/by-no/{orderNo}` 開啟訂單詳情；使用者訊息一律為空陣列。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/AiSupportSession'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/support/messages:
    post:
      summary: 傳送訊息給 AI 客服
      operationId: sendAiSupportMessage
      tags: [ai]
      description: |
        附加到進行中的對話，沒有進行中的對話或最後一則訊息已超過 6 小時時自動建立新對話。模型參考平台知識、常見問題、法律文件摘要，
        以及請求者本人的資料（不含交易對象的個人資料）：最近各 5 筆購買與售出訂單、5 筆預約、8 本上架書籍（含審核狀態與審核原因）、
        最近 3 筆交易爭議（本人或交易對象申請，只含狀態、結果與時間）、錢包餘額與最近 5 筆收支（類型、金額、時間與相關訂單編號，
        不含說明文字）、最近 3 張客服工單的主旨及狀態，並帶入最近 6 小時內、至多 12 則的對話紀錄。

        訂單另附存書、取書、完成或取消時間，以及由伺服器依政策常數算好的存書期限、取書期限、預計自動完成並撥款的時間，
        與能否申請爭議（取書前不限期；取書後須於期限內且訂單完成前申請；已完成、已取消、已退款或爭議處理中的訂單不可申請）。
        本則或對話中的使用者訊息提到訂單編號（`SMB` 加 20 位數字，早期訂單為 17 位）時，另查詢最多 3 筆，限請求者為買方或賣方；
        查無資料或非本人訂單時只告知模型查無資料。以第 3 版之前的同意說明同意的使用者（見 `PUT /api/ai/consent`），
        不帶入交易爭議、錢包收支與訊息中提到的訂單。

        `locale` 為 App 介面語系，只接受 `zh-Hant`、`zh-Hans`、`en`、`ja`、`ko`（大小寫不拘，底線視同連字號），
        其他值或未提供時以繁體中文回覆。模型以該語系回覆，功能名稱沿用 App 的顯示文字。

        模型只回答 SaveMyBook 相關問題，不自行編造政策。無法解決時 `suggest_handoff` 為 true，
        用戶端可提示使用者以 `POST /api/ai/support/session/escalate` 轉由客服人員處理。

        **結構化輸出**：模型依固定規格輸出回覆、回答類型（依資料回答、澄清問題、無法確認、與平台無關）、實際引用的參考段落編號、
        是否依據平台概要或本人資料、轉接建議與分類，以及最多 3 則追問建議（`reply.suggestions`，每則 30 字內，`locale` 為 `en` 時 60 字元內，含聯絡方式或網址者不列出）。
        支援嚴格模式的服務商（OpenAI）由服務商保證格式，其他服務商以 JSON 模式輸出，所有輸出都經伺服器依同一份規格驗證。
        格式不符且剩餘時間足夠時，附上錯誤說明（只列欄位名稱）重試一次。
        回覆中的參考編號（例如 [1]）與「參考資料」字樣在儲存前移除。
        以下情況由伺服器將 `suggest_handoff` 設為 true，不論模型的判斷：模型表示無法確認、使用者訊息提到客服人員、
        問到錢包儲值或提領，或回覆已建議轉接或聯絡客服。沒有依據任何參考段落、平台概要或本人資料的回答，在決策紀錄中標記為依據不足。

        書名、書櫃名稱等他人撰寫的文字放入提示詞前會攤平成單行並替換分隔符號，提問紀錄只提供主旨與狀態、不含編號。
        回覆含電話、電子郵件、通訊軟體帳號或站外網址（含不帶 http 的網域）時刪除該句。本站主網域與子網域的網址與信箱，
        以及未附帳號字串的 LINE／Discord 帳號登入說明除外；網址以解析後的主機比對，含帳密或內嵌其他網址時視為站外網址。
        刪除後保留的內容不到原文一半時改為固定說明（依 `locale` 的語言），且 `suggest_handoff` 為 true。
        回覆中出現的訂單編號若不在上述使用者資料內、也不是使用者在本則或對話中自己輸入的，直接移除；
        移除編號不計入上述「不到原文一半」的判斷。`reply.order_nos` 的意義同 `GET /api/ai/support/session`。

        **降級**：服務商無法回應（服務商錯誤、逾時、限流、金鑰或額度問題等）、回應格式錯誤、截斷或回覆清理後為空，
        以及剩餘時間不足而未送出請求時，
        改以檢索第一名的平台說明、常見問題或條款段落原文回覆（開頭依 `locale` 的語言標示為相關說明，例如「以下是相關說明：」），`suggest_handoff` 與 `degraded` 為 true，
        不計入每日次數。檢索不到任何段落時回傳 502，這則訊息不會寫入對話。

        使用者尚未同意 AI 資料處理時回傳 403 `AI_CONSENT_REQUIRED`，不呼叫服務商也不寫入對話。
        內容遭服務商阻擋時回傳 422 `AI_CONTENT_BLOCKED`，不寫入對話。每日次數上限計算成功送出的訊息數。
        每位使用者每分鐘另有 20 次的請求頻率限制，與上架輔助、轉接、書籍顧問訊息共用。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 1000, example: 請問買到的書要怎麼取件？ }
                client_id: { $ref: '#/components/schemas/AiClientId' }
                locale: { type: string, enum: [zh-Hant, zh-Hans, en, ja, ko], description: App 介面語系；其他值視為未提供, example: zh-Hant }
      responses:
        '201':
