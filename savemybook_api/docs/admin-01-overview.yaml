tags:
  - name: 後台：總覽與報表
    description: |
      管理後台的總覽數字、營運報表與操作稽核紀錄。

      `/api/admin` 底下所有端點均要求 `role` 為 `admin`，多數另檢查細部權限。
      本組端點中僅 `/stats` 需 `can_view_stats` 權限；`/overview` 與兩組
      紀錄查詢僅需管理員身分。

paths:
  /api/admin/overview:
    get:
      summary: 後台首頁總覽數字
      operationId: adminOverview
      tags: [後台：總覽與報表]
      description: |
        一次回傳後台首頁所需的六項統計數字。今日訂單數自當日 00:00 起算。

        僅需管理員身分，不檢查細部權限。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      member_count: { type: integer, description: 會員總數，含已停權帳號, example: 1284 }
                      pending_report_count: { type: integer, description: 待處理檢舉數, example: 3 }
                      pending_dispute_count: { type: integer, description: 待處理與處理中的爭議數, example: 1 }
                      active_cabinet_count: { type: integer, description: 啟用中的書櫃數, example: 8 }
                      today_order_count: { type: integer, description: 今日建立的訂單數, example: 27 }
                      open_ticket_count: { type: integer, description: 待處理工單數, example: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/stats:
    get:
      summary: 營運報表
      operationId: adminStats
      tags: [後台：總覽與報表]
      description: |
        回傳每日趨勢資料。需 `can_view_stats` 權限。

        `series` 固定包含 `days` 筆資料，無資料的日期補 0，用戶端無須自行補齊。
        日期格式為 `YYYY-MM-DD`。

        `completed_revenue` 統計期間內完成的訂單金額，與依建立日期彙總的
        `series[].revenue` 計算基準不同，兩者數值不相等。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: 統計期間天數，含當日。超出範圍時夾限於 1 至 90。
          example: 30
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      days: { type: integer, example: 7 }
                      series:
                        type: array
                        description: 每日統計，由舊至新排序，無資料的日期補 0。
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date, example: '2025-09-11' }
                            orders: { type: integer, description: 當日建立的訂單數, example: 12 }
                            revenue: { type: number, description: 當日建立的訂單金額總和, example: 3420 }
                            new_users: { type: integer, example: 5 }
                            new_books: { type: integer, example: 18 }
                      completed_order_count: { type: integer, description: 期間內完成的訂單數, example: 86 }
                      completed_revenue: { type: number, description: 期間內完成的訂單金額, example: 24180 }
                      top_categories:
                        type: array
                        description: 書籍數最多的前 5 個分類。分類已刪除或書籍未分類時顯示為「未分類」。
                        items:
                          type: object
                          properties:
                            category_name: { type: string, example: 文學小說 }
                            book_count: { type: integer, example: 312 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/operation-logs:
    get:
      summary: 管理員操作紀錄
      operationId: adminOperationLogs
      tags: [後台：總覽與報表]
      description: |
        管理員的異動稽核軌跡，依時間遞減排序。

        後台多數寫入操作皆會產生紀錄，包含停權會員、調整錢包、強制下架書籍
        與編輯法律文件等。紀錄為唯讀，不提供刪除端點。

        僅需管理員身分，不檢查細部權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
          description: 每頁筆數。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminOperationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/maintenance-logs:
    get:
      summary: 書櫃維修紀錄
      operationId: adminMaintenanceLogs
      tags: [後台：總覽與報表]
      description: |
        操作紀錄的子集，篩選 `target_type` 為 `cabinet` 或 `cabinet_slot`
        的項目，即書櫃與櫃位的異動歷史。

        僅需管理員身分，不檢查細部權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: limit
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/AdminOperationLog'
                        - type: object
                          properties:
                            users:
                              type: object
                              description: 執行操作的管理員。
                              properties:
                                user_id: { type: integer }
                                nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
