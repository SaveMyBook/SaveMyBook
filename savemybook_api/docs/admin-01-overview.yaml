tags:
  - name: admin-overview
    x-displayName: 後台：總覽與報表
    description: |
      管理後台的總覽數字、營運報表與操作稽核紀錄。

      `/api/admin` 底下所有端點均要求 `role` 為 `admin`，多數另檢查細部權限。
      本組端點中僅 `/stats` 需 `can_view_stats` 權限；`/overview` 與兩組
      紀錄查詢僅需管理員身分。

paths:
  /api/admin/overview:
    get:
      summary: 後台首頁總覽數字
      operationId: adminOverview
      tags: [admin-overview]
      description: |
        一次回傳後台首頁所需的六項統計數字。今日訂單數自當日 00:00 起算。

        僅需管理員身分，不檢查細部權限。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      member_count: { type: integer, description: 會員總數，含已停權帳號, example: 1284 }
                      pending_report_count: { type: integer, description: 待處理檢舉數, example: 3 }
                      pending_listing_review_count: { type: integer, description: 待人工審核的上架書籍數（規則或 AI 攔下）；未執行 011 時為 0, example: 2 }
                      open_risk_alert_count: { type: integer, description: 未處理的聊天防詐警示數；未執行 023 時為 0, example: 1 }
                      pending_dispute_count: { type: integer, description: 待處理與處理中的爭議數, example: 1 }
                      active_cabinet_count: { type: integer, description: 啟用中的書櫃數, example: 8 }
                      today_order_count: { type: integer, description: 今日建立的訂單數, example: 27 }
                      open_ticket_count: { type: integer, description: 待處理工單數, example: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/stats:
    get:
      summary: 營運報表
      operationId: adminStats
      tags: [admin-overview]
      description: |
        回傳每日趨勢資料。需 `can_view_stats` 權限。

        `series` 固定包含 `days` 筆資料，無資料的日期補 0，用戶端無須自行補齊。
        日期格式為 `YYYY-MM-DD`。

        `completed_revenue` 統計期間內完成的訂單金額，與依建立日期彙總的
        `series[].revenue` 計算基準不同，兩者數值不相等。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: 統計期間天數，含當日。超出範圍時夾限於 1 至 90。
          example: 30
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      days: { type: integer, example: 7 }
                      series:
                        type: array
                        description: 每日統計，由舊至新排序，無資料的日期補 0。
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date, example: '2025-09-11' }
                            orders: { type: integer, description: 當日建立的訂單數, example: 12 }
                            revenue: { type: number, description: 當日建立的訂單金額總和, example: 3420 }
                            new_users: { type: integer, example: 5 }
                            new_books: { type: integer, example: 18 }
                      completed_order_count: { type: integer, description: 期間內完成的訂單數, example: 86 }
                      completed_revenue: { type: number, description: 期間內完成的訂單金額, example: 24180 }
                      top_categories:
                        type: array
                        description: 書籍數最多的前 5 個分類。分類已刪除或書籍未分類時顯示為「未分類」。
                        items:
                          type: object
                          properties:
                            category_name: { type: string, example: 文學小說 }
                            book_count: { type: integer, example: 312 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/operation-logs:
    get:
      summary: 管理員操作紀錄
      operationId: adminOperationLogs
      tags: [admin-overview]
      description: |
        管理員的異動稽核軌跡，依時間遞減排序。後台所有寫入操作都會產生紀錄，紀錄不可刪除。

        每筆紀錄包含：

        - `summary`：一句話說明做了什麼、對誰做
        - `changes`：每個有變動的欄位與改前、改後的值（已轉成可讀文字）
        - `can_undo`：能不能一鍵還原。涉及金流、密碼、匿名化、備份檔案的操作不能還原
        - `reverted`：已被還原時記錄還原時間與執行者

        舊版紀錄沒有結構化內容，`summary` 為原本的文字、`changes` 為空陣列。

        僅需管理員身分，不檢查細部權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
          description: 每頁筆數。
        - in: query
          name: target_type
          schema: { type: string, enum: [user, book, category, level, faq, legal, announcement, cabinet, cabinet_slot, wallet, ticket, report, dispute, order, backup] }
          description: 只看某一類對象。
        - in: query
          name: admin_id
          schema: { type: integer }
          description: 只看某位管理員的操作。
        - in: query
          name: keyword
          schema: { type: string, maxLength: 100 }
          description: 搜尋動作名稱與內容。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminOperationLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/operation-logs/{id}/undo:
    post:
      summary: 還原一筆操作
      operationId: adminUndoOperation
      tags: [admin-overview]
      description: |
        把紀錄中變動過的資料改回操作前的值，並寫一筆新的「還原：…」紀錄。

        - 需要具備原操作所屬功能的權限（例如還原書籍下架需要內容管理權限）
        - 資料在這次操作之後又被修改過時拒絕還原（409），避免蓋掉之後的修改
        - 每筆紀錄只能還原一次；還原本身不能再還原，請手動調整
        - 已送出的通知與推播不會收回
        - 錢包調整的還原是寫一筆反向的調整交易，不刪除原本的帳務紀錄
        - 新增書櫃的還原是停用該書櫃，不刪除（可能已被書籍或訂單引用）

        需 `admin` 範圍的身分驗證（`X-Verify-Token` 標頭，只接受帳號的登入密碼或通行密鑰）。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/VerifyToken'
      responses:
        '200':
          description: 已還原。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已還原 }
                  data:
                    type: object
                    properties:
                      log_id: { type: integer, description: 新寫入的還原紀錄編號 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminVerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 無法自動還原、已還原過，或資料之後又被修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: UNDO_CONFLICT, message: 無法還原：資料之後又被修改過（書名目前是《新書名》）。請直接到對應的管理頁面手動調整。 }

  /api/admin/maintenance-logs:
    get:
      summary: 書櫃維修紀錄
      operationId: adminMaintenanceLogs
      tags: [admin-overview]
      description: |
        操作紀錄的子集，篩選 `target_type` 為 `cabinet` 或 `cabinet_slot`
        的項目，即書櫃與櫃位的異動歷史。

        僅需管理員身分，不檢查細部權限。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: limit
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/AdminOperationLog'
                        - type: object
                          properties:
                            users:
                              type: object
                              description: 執行操作的管理員。
                              properties:
                                user_id: { type: integer }
                                nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
