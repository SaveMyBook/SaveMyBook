tags:
  - name: 分類 (Categories)
    description: |
      書籍分類，支援父子兩層結構，以 `parent_id` 建立關聯。

      新增、編輯與刪除僅限管理員。管理後台另有一組支援排序的端點，
      路徑為 `/api/admin/categories`。

paths:
  /api/categories:
    get:
      summary: 取得分類
      operationId: listCategories
      tags: [分類 (Categories)]
      description: |
        預設回傳樹狀結構，僅含頂層分類，子分類置於 `other_book_categories`
        欄位內。該欄位名稱源自 Prisma 對自我關聯的命名規則。

        帶入 `flat=true` 時改回傳平面清單，包含所有層級，適用於下拉選單。

        無須登入。
      security: []
      parameters:
        - in: query
          name: flat
          schema: { type: string, enum: ['true'] }
          description: 帶入 `true` 時回傳不分層的完整清單。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Category'
                        - type: object
                          properties:
                            other_book_categories:
                              type: array
                              description: 子分類。`flat=true` 時不含此欄位。
                              items: { $ref: '#/components/schemas/Category' }
              examples:
                樹狀:
                  value:
                    success: true
                    data:
                      - category_id: 1
                        category_name: 文學
                        parent_id: null
                        sort_order: 0
                        other_book_categories:
                          - { category_id: 3, category_name: 文學小說, parent_id: 1, sort_order: 0 }
                平面:
                  value:
                    success: true
                    data:
                      - { category_id: 1, category_name: 文學, parent_id: null, sort_order: 0 }
                      - { category_id: 3, category_name: 文學小說, parent_id: 1, sort_order: 0 }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 新增分類
      operationId: createCategory
      tags: [分類 (Categories)]
      description: 建立分類。未帶入 `parent_id` 時建立為頂層分類。僅限管理員。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name: { type: string, maxLength: 50, example: 文學小說 }
                parent_id: { type: integer, nullable: true, description: 父分類編號，未填代表建立為頂層分類。, example: 1 }
                sort_order: { type: integer, default: 0, description: 數值越小排序越前。 }
      responses:
        '201':
          description: 建立成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 分類建立成功 }
                  data: { $ref: '#/components/schemas/Category' }
        '400':
          description: 未填寫分類名稱。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: '缺少必要欄位：分類名稱(category_name)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 分類編號。
        example: 1

    get:
      summary: 取得單一分類
      operationId: getCategory
      tags: [分類 (Categories)]
      description: 回傳指定分類及其子分類。無須登入。
      security: []
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Category'
                      - type: object
                        properties:
                          other_book_categories:
                            type: array
                            items: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      summary: 編輯分類
      operationId: updateCategory
      tags: [分類 (Categories)]
      description: |
        僅限管理員。`parent_id` 帶入 `null` 可將子分類提升為頂層分類。

        父分類不可指向自身，否則回傳 400。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category_name: { type: string, maxLength: 50 }
                parent_id: { type: integer, nullable: true }
                sort_order: { type: integer }
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 分類更新成功 }
                  data: { $ref: '#/components/schemas/Category' }
        '400':
          description: 父分類指向自身。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 父分類不能設定為自己 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除分類
      operationId: deleteCategory
      tags: [分類 (Categories)]
      description: |
        僅限管理員。分類底下仍有子分類或書籍時將因外鍵限制而失敗，
        須先轉移或刪除關聯資料。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 分類已成功刪除 }
        '400':
          description: 仍存在關聯資料。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 無法刪除！此分類下可能還有子分類或書籍，請先轉移或刪除關聯資料 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
