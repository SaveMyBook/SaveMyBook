tags:
  - name: cart
    x-displayName: 購物車
    description: |
      購物車。二手書一筆商品即一本實體書，每個項目的數量固定為 1；重複加入同一本書不會新增資料列，也不會累加數量。
      舊資料的數量若大於 1，列表、合計與結帳一律以 1 本計算。

      結帳端點為 `POST /api/orders/checkout`，支援僅結帳部分選取的項目。

paths:
  /api/cart:
    get:
      summary: 取得購物車
      operationId: getCart
      tags: [cart]
      description: |
        回傳購物車項目及全部項目的合計金額。各項目包含完整書籍資料
        （含賣家與取貨書櫃），可直接依賣家分組呈現。結帳依「賣家＋書籍指定的書櫃」拆單，
        同一賣家於同一書櫃的書籍每筆訂單最多 2 本，超過時結帳回 400 `ORDER_BOOK_LIMIT`，App 可於購物車事先提示。

        書籍目前被保留時，`books.reservation` 帶 `reserved_until` 與 `reserved_for_me`；
        被其他買家保留的書結帳時會回 409 `BOOK_RESERVED`。

        `total_amount` 為購物車全部項目的總額（每個項目以 1 本計價），各項目的 `quantity` 一律為 1。使用者僅選取部分項目時，
        小計須由用戶端自行計算。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  total_amount: { type: number, description: 購物車全部項目的合計金額, example: 540 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CartItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 加入購物車
      operationId: addToCart
      tags: [cart]
      description: |
        `quantity` 可省略，省略時視為 1；帶入 1 以外的值回 400 `QUANTITY_FIXED`。

        | 狀況 | HTTP | 說明 |
        | --- | --- | --- |
        | 新加入 | 201 | `already_in_cart` 為 false |
        | 已在購物車 | 200 | 不寫入資料，`already_in_cart` 為 true，`data` 僅含 `book_id` 與 `quantity` |

        下列情形會被拒絕：

        - 數量不是 1（400 `QUANTITY_FIXED`）
        - 加入本人上架的書籍（400）
        - 書籍狀態非 `on_sale`，即已下單保留、已售出或已下架（400）
        - 購物車已有 100 項商品（400）
        - 書籍已由其他買家透過聊天室預約保留中（409 `BOOK_RESERVED`）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 101 }
                quantity: { type: integer, enum: [1], default: 1, description: 固定為 1，可省略。, example: 1 }
      responses:
        '200':
          description: 書籍已在購物車中，本次未寫入。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 此書籍已在購物車中 }
                  already_in_cart: { type: boolean, description: 值為 true 代表書籍已在購物車中、本次未寫入, example: true }
                  data:
                    type: object
                    properties:
                      cart_id: { type: integer, description: '`already_in_cart` 為 true 時不含此欄位。', example: 55 }
                      book_id: { type: integer, example: 101 }
                      quantity: { type: integer, example: 1 }
              examples:
                已在購物車:
                  value: { success: true, message: 此書籍已在購物車中, already_in_cart: true, data: { book_id: 101, quantity: 1 } }
        '201':
          description: 已加入。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已加入購物車 }
                  already_in_cart: { type: boolean, example: false }
                  data:
                    type: object
                    properties:
                      cart_id: { type: integer, example: 55 }
                      user_id: { type: integer, example: 12 }
                      book_id: { type: integer, example: 101 }
                      quantity: { type: integer, example: 1 }
                      added_at: { type: string, format: date-time }
        '400':
          description: 參數錯誤，或該書籍目前無法購買。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少參數:
                  value: { success: false, message: 請指定書籍 }
                數量不是 1:
                  value: { success: false, code: QUANTITY_FIXED, message: 每筆書籍僅有一本，數量僅能為 1 }
                本人上架的書籍:
                  value: { success: false, message: 無法將自己上架的書籍加入購物車 }
                已被買走:
                  value: { success: false, message: 此書籍目前無法購買 }
                購物車已滿:
                  value: { success: false, message: 購物車最多可放入 100 項商品 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BookReserved' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/cart/book-ids:
    get:
      summary: 取得購物車中的書籍編號
      operationId: getCartBookIds
      tags: [cart]
      description: |
        僅回傳購物車中所有書籍的 `book_id`，不含書籍資料。供書籍列表與詳情頁
        標示「已在購物車」使用，比 `GET /api/cart` 輕量。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: integer }
                    example: [101, 118, 240]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/cart/{cartId}:
    parameters:
      - in: path
        name: cartId
        required: true
        schema: { type: integer }
        description: 購物車項目編號，即 `cart_id`，非 `book_id`。
        example: 55

    patch:
      summary: 調整數量
      operationId: updateCartItem
      tags: [cart]
      description: |
        書籍數量固定為 1，此端點僅保留供舊版 App 相容：`quantity` 可省略（視為 1），帶入 1 以外的值回 400 `QUANTITY_FIXED`。
        成功時將該項目的數量設為 1（可用於修正舊資料）。移除項目請使用 DELETE。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, enum: [1], default: 1, example: 1 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已更新數量 }
                  data:
                    type: object
                    properties:
                      cart_id: { type: integer }
                      quantity: { type: integer, example: 1 }
        '400':
          description: 數量不是 1。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: QUANTITY_FIXED, message: 每筆書籍僅有一本，數量僅能為 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 移除項目
      operationId: removeCartItem
      tags: [cart]
      description: |
        自購物車移除指定項目。

        僅能移除請求者自身的項目，帶入他人的 `cart_id` 將回傳 404。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已移除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已從購物車移除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
