tags:
  - name: 購物車 (Cart)
    description: |
      購物車。重複加入同一本書將累加數量，不會新增資料列。

      結帳端點為 `POST /api/orders/checkout`，支援僅結帳部分選取的項目。

paths:
  /api/cart:
    get:
      summary: 取得購物車
      operationId: getCart
      tags: [購物車 (Cart)]
      description: |
        回傳購物車項目及全部項目的合計金額。各項目包含完整書籍資料
        （含賣家與取貨書櫃），可直接依賣家分組呈現。

        `total_amount` 為購物車全部項目的總額。使用者僅選取部分項目時，
        小計須由用戶端自行計算。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  total_amount: { type: number, description: 購物車全部項目的合計金額, example: 540 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CartItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 加入購物車
      operationId: addToCart
      tags: [購物車 (Cart)]
      description: |
        購物車中已存在的書籍將累加數量。

        下列兩種情形會被拒絕：

        - 加入本人上架的書籍
        - 書籍狀態非 `on_sale`，即已下單保留、已售出或已下架
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 101 }
                quantity: { type: integer, minimum: 1, default: 1, example: 1 }
      responses:
        '201':
          description: 已加入。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已加入購物車 }
                  data:
                    type: object
                    properties:
                      cart_id: { type: integer, example: 55 }
                      user_id: { type: integer, example: 12 }
                      book_id: { type: integer, example: 101 }
                      quantity: { type: integer, example: 1 }
                      added_at: { type: string, format: date-time }
        '400':
          description: 參數錯誤，或該書籍目前無法購買。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少參數:
                  value: { success: false, message: 請提供 book_id }
                本人上架的書籍:
                  value: { success: false, message: 無法將自己上架的書籍加入購物車 }
                已被買走:
                  value: { success: false, message: 此書籍目前無法購買 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/cart/{cartId}:
    parameters:
      - in: path
        name: cartId
        required: true
        schema: { type: integer }
        description: 購物車項目編號，即 `cart_id`，非 `book_id`。
        example: 55

    patch:
      summary: 調整數量
      operationId: updateCartItem
      tags: [購物車 (Cart)]
      description: 將數量設為指定值，非增減操作。數量帶入 0 會被拒絕，移除項目請使用 DELETE。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, example: 2 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已更新數量 }
                  data:
                    type: object
                    properties:
                      cart_id: { type: integer }
                      quantity: { type: integer }
        '400':
          description: 數量小於 1。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: quantity 必須大於 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 移除項目
      operationId: removeCartItem
      tags: [購物車 (Cart)]
      description: |
        自購物車移除指定項目。

        僅能移除請求者自身的項目，帶入他人的 `cart_id` 將回傳 404。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已移除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已從購物車移除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
