tags:
  - name: admin-levels
    x-displayName: 後台：會員等級
    description: |
      會員等級制度的維護。本組端點均需 `can_manage_levels` 權限。

      等級依點數門檻判定：使用者點數所達到的最高 `min_points` 即為其等級。
      點數的計算與調整位於「後台：會員管理」的
      `PATCH /api/admin/members/{id}/level`。

      > 等級不儲存於使用者資料，而是每次查詢時即時計算，
      > 因此異動 `min_points` 會立即影響全體會員的等級判定。

      伺服器會拒絕以下設定：

      - 名稱與其他等級相同（不分大小寫），回傳 409 `LEVEL_NAME_TAKEN`
      - 門檻與其他等級相同，回傳 409 `LEVEL_THRESHOLD_TAKEN`
      - 儲存或刪除後沒有門檻為 0 點的起始等級，回傳 400／409 `LEVEL_BASE_REQUIRED`

      `max_points` 一律由下一個等級的門檻推算，用戶端送出的值會被忽略。

paths:
  /api/admin/levels:
    get:
      summary: 等級列表
      operationId: adminListLevels
      tags: [admin-levels]
      description: |
        依 `min_points` 遞增排序，並附上各等級目前的會員人數 `member_count`。
        前台的 `GET /api/users/me/level` 回傳相同清單（不含 `member_count`）。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MemberLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 新增等級
      operationId: adminCreateLevel
      tags: [admin-levels]
      description: |
        建立新等級。第一個等級的 `min_points` 須為 0，其餘等級的門檻不可與既有等級相同。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_name]
              properties:
                level_name: { type: string, maxLength: 50, example: 黃金會員 }
                min_points: { type: integer, default: 0, description: 進入本等級所需的點數門檻。, example: 500 }
                benefits: { type: string, nullable: true, example: 每月贈送 50 代幣、專屬客服 }
      responses:
        '201':
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      level_id: { type: integer, example: 6 }
        '400':
          description: 未填寫等級名稱，或缺少 0 點的起始等級。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請輸入等級名稱 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409':
          description: 名稱或門檻與其他等級相同。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: LEVEL_THRESHOLD_TAKEN, message: 「白銀會員」已使用 500 點作為門檻，每個等級的門檻須不同 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/levels/reorder:
    put:
      summary: 調整等級順序
      operationId: adminReorderLevels
      tags: [admin-levels]
      description: |
        `order` 須包含全部等級，由低到高排列。既有的門檻數值不變，
        依新順序重新分配給各等級，名稱與福利隨等級移動。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order: { type: array, items: { type: integer }, example: [1, 3, 2] }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新順序 }
        '400':
          description: 排序資料缺漏或格式不正確。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 排序資料須包含所有等級 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/levels/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 等級編號。
        example: 3

    put:
      summary: 編輯等級
      operationId: adminUpdateLevel
      tags: [admin-levels]
      description: |
        整筆覆蓋而非部分更新：未帶入的欄位將寫入預設值，
        即 `min_points` 為 0、`benefits` 為 null。請務必送出完整內容。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_name]
              properties:
                level_name: { type: string, maxLength: 50 }
                min_points: { type: integer, default: 0 }
                benefits: { type: string, nullable: true }
            example: { level_name: 黃金會員, min_points: 500, benefits: 每月贈送 50 代幣 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新等級 }
        '400':
          description: 未填寫等級名稱，或缺少 0 點的起始等級。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請輸入等級名稱 }
        '409':
          description: 名稱或門檻與其他等級相同。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: LEVEL_NAME_TAKEN, message: 已有名為「黃金會員」的等級 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除等級
      operationId: adminDeleteLevel
      tags: [admin-levels]
      description: |
        永久刪除。由於等級為即時計算，刪除後原屬該等級的會員將自動歸入
        次一較低等級，回應的 `moved_members` 與 `moved_to` 說明影響範圍。

        仍有其他等級時，不可刪除唯一門檻為 0 點的起始等級（409 `LEVEL_BASE_REQUIRED`）。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已刪除等級 }
                  data:
                    type: object
                    properties:
                      moved_members: { type: integer, example: 12 }
                      moved_to: { type: string, nullable: true, example: 一般會員 }
        '409':
          description: 起始等級無法刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
