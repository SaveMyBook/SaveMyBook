tags:
  - name: 後台：會員等級
    description: |
      會員等級制度的維護。本組端點均需 `can_manage_levels` 權限。

      等級依點數門檻判定：使用者點數所達到的最高 `min_points` 即為其等級。
      點數的計算與調整位於「後台：會員管理」的
      `PATCH /api/admin/members/{id}/level`。

      > 等級不儲存於使用者資料，而是每次查詢時即時計算，
      > 因此異動 `min_points` 會立即影響全體會員的等級判定。

paths:
  /api/admin/levels:
    get:
      summary: 等級列表
      operationId: adminListLevels
      tags: [後台：會員等級]
      description: 依 `min_points` 遞增排序。前台的 `GET /api/users/me/level` 回傳相同清單。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MemberLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 新增等級
      operationId: adminCreateLevel
      tags: [後台：會員等級]
      description: |
        建立新等級。`max_points` 帶入 `null` 或空字串代表無上限，
        最高等級應採此設定。

        系統不會檢查門檻是否與既有等級重疊，新增前須自行確認
        `min_points` 未與既有等級衝突。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_name]
              properties:
                level_name: { type: string, maxLength: 50, example: 黃金會員 }
                min_points: { type: integer, default: 0, description: 進入本等級所需的點數門檻。, example: 500 }
                max_points: { type: integer, nullable: true, description: 點數上限，帶入 null 代表無上限。, example: 999 }
                benefits: { type: string, nullable: true, example: 每月贈送 50 代幣、專屬客服 }
      responses:
        '201':
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      level_id: { type: integer, example: 6 }
        '400':
          description: 未填寫等級名稱。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請輸入等級名稱 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/levels/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 等級編號。
        example: 3

    put:
      summary: 編輯等級
      operationId: adminUpdateLevel
      tags: [後台：會員等級]
      description: |
        整筆覆蓋而非部分更新：未帶入的欄位將寫入預設值，
        即 `min_points` 為 0、`max_points` 為 null、`benefits` 為 null。
        請務必送出完整內容。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level_name]
              properties:
                level_name: { type: string, maxLength: 50 }
                min_points: { type: integer, default: 0 }
                max_points: { type: integer, nullable: true }
                benefits: { type: string, nullable: true }
            example: { level_name: 黃金會員, min_points: 500, max_points: 999, benefits: 每月贈送 50 代幣 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新等級 }
        '400':
          description: 沒填等級名稱。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請輸入等級名稱 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除等級
      operationId: adminDeleteLevel
      tags: [後台：會員等級]
      description: |
        永久刪除。由於等級為即時計算，刪除後原屬該等級的會員將自動歸入
        次一較低等級，不會出現無等級的狀態。

        刪除最低等級時，點數低於所有門檻的會員將歸入清單中的第一個等級。
        建議至少保留一個 `min_points` 為 0 的等級。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已刪除等級 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
