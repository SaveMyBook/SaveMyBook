tags:
  - name: notifications
    x-displayName: 通知
    description: |
      站內通知。訂單成立、狀態變更、新聊天訊息、檢舉結果、客服回覆
      與條款更新等事件皆寫入此處。

      通知由系統產生，不提供用戶端建立通知的端點。

      點擊通知後的導向目標由 `related_type` 與 `related_id` 決定：

      | `related_type` | 導向 |
      | --- | --- |
      | `order` | 訂單詳情 |
      | `book` | 書籍詳情 |
      | `chat_room` | 聊天室 |
      | `ticket` | 客服工單（使用者端） |
      | `admin_ticket` | 客服工單（管理後台）；使用者建立工單或回覆時，通知所有具客服權限的管理員 |
      | `book_review` | 書籍上架審核（管理後台）；書籍因價格異常、非正規來源或 AI 判定送交人工審核時，通知所有具內容管理權限的管理員，`related_id` 為書籍編號 |
      | `risk_alert` | 聊天防詐警示（管理後台）；會員 24 小時內累積 3 則高風險訊息時，通知所有具檢舉管理權限的管理員，`related_id` 為該會員編號 |
      | `report` | 檢舉紀錄 |
      | `legal` | 服務條款／隱私權政策 |
      | `wallet` | 錢包 |
      | `user` | 個人頁 |

      每則通知依 `type` 與 `related_type` 歸入一個分類（`category`），規則集中於
      `services/notification-categories.js`。`type` 為 `order`、`reservation`、`message`、`promotion`
      時依 `type` 判斷，其餘依 `related_type` 判斷：

      | `category` | 名稱 | 涵蓋 |
      | --- | --- | --- |
      | `trade` | 交易 | type `order`、`reservation`；related_type `order`、`wallet`、`book`、`reservation` |
      | `chat` | 聊天 | type `message`；related_type `chat_room` |
      | `account` | 帳號 | related_type `security`、`password`、`legal`、`member_level`、`user`、`push_test`，以及無 related_type 或未列出的值 |
      | `service` | 客服 | related_type `ticket`、`report`、`admin_ticket`、`book_review`、`risk_alert` |
      | `promotion` | 優惠 | type `promotion`；related_type `announcement` |

paths:
  /api/notifications:
    get:
      summary: 取得通知列表
      operationId: listNotifications
      tags: [notifications]
      description: |
        依建立時間遞減排序。

        `unread_count` 統計全部未讀通知，不受 `type` 與 `category` 篩選影響。
        `category` 可與分頁並用，亦可與 `type` 同時指定。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: type
          schema:
            type: string
            enum: [system, order, message, promotion, reservation]
          description: 限定通知類型。
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/NotificationCategory' }
          description: 限定通知分類；不帶時處理全部通知。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  unread_count: { type: integer, description: 全部未讀通知數，不受 type 與 category 篩選影響, example: 3 }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/unread-count:
    get:
      summary: 取得未讀數
      operationId: getUnreadNotificationCount
      tags: [notifications]
      description: 回傳未讀通知總數與各分類的未讀數，以單一查詢完成，適合定期輪詢。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer, example: 3 }
                      by_category:
                        type: object
                        description: 各分類的未讀數，五個分類皆會回傳。
                        properties:
                          trade: { type: integer, example: 1 }
                          chat: { type: integer, example: 2 }
                          account: { type: integer, example: 0 }
                          service: { type: integer, example: 0 }
                          promotion: { type: integer, example: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/read-all:
    patch:
      summary: 全部標為已讀
      operationId: markAllNotificationsRead
      tags: [notifications]
      description: |
        將請求者的未讀通知標記為已讀；帶 `category` 時僅處理該分類。無未讀通知時仍回傳 200。

        此操作不可復原，建議用戶端於執行前確認。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/NotificationCategory' }
          description: 限定通知分類；不帶時處理全部通知。
      responses:
        '200':
          description: 已全部標為已讀。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已全部標為已讀 }
                  data:
                    type: object
                    properties:
                      updated: { type: integer, example: 4 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/all:
    delete:
      summary: 清除全部通知
      operationId: deleteAllNotifications
      tags: [notifications]
      description: |
        永久刪除請求者的通知，並非標記已讀；帶 `category` 時僅刪除該分類。回應包含實際刪除的筆數。

        > 路由定義順序須置於 `DELETE /api/notifications/{id}` 之前，
        > 否則 `all` 會被解析為 `{id}` 參數。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/NotificationCategory' }
          description: 限定通知分類；不帶時處理全部通知。
      responses:
        '200':
          description: 已清除。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已清除 12 則通知 }
                  data:
                    type: object
                    properties:
                      deleted: { type: integer, example: 12 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/{id}/read:
    patch:
      summary: 標記單則已讀
      operationId: markNotificationRead
      tags: [notifications]
      description: 僅能標記請求者自身的通知，帶入他人的編號將回傳 404。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 512
      responses:
        '200':
          description: 已標為已讀。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已標為已讀 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/{id}:
    delete:
      summary: 刪除單則通知
      operationId: deleteNotification
      tags: [notifications]
      description: 永久刪除，僅能刪除請求者自身的通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 512
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 通知已刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
