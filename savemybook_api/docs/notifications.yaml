tags:
  - name: 通知 (Notifications)
    description: |
      站內通知。訂單成立、狀態變更、新聊天訊息、檢舉結果、客服回覆
      與條款更新等事件皆寫入此處。

      通知由系統產生，不提供用戶端建立通知的端點。

      點擊通知後的導向目標由 `related_type` 與 `related_id` 決定：

      | `related_type` | 導向 |
      | --- | --- |
      | `order` | 訂單詳情 |
      | `book` | 書籍詳情 |
      | `chat_room` | 聊天室 |
      | `ticket` | 客服工單 |
      | `report` | 檢舉紀錄 |
      | `legal` | 服務條款／隱私權政策 |
      | `wallet` | 錢包 |
      | `user` | 個人頁 |

paths:
  /api/notifications:
    get:
      summary: 取得通知列表
      operationId: listNotifications
      tags: [通知 (Notifications)]
      description: |
        依建立時間遞減排序。

        `unread_count` 統計全部未讀通知，不受 `type` 篩選影響，
        因此切換分類時未讀計數仍為全站數值。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: type
          schema:
            type: string
            enum: [system, order, message, promotion, reservation]
          description: 限定通知類型。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  unread_count: { type: integer, description: 全部未讀通知數，不受 type 篩選影響, example: 3 }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/unread-count:
    get:
      summary: 取得未讀數
      operationId: getUnreadNotificationCount
      tags: [通知 (Notifications)]
      description: 僅回傳未讀通知數量，負載極低，適合定期輪詢。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/read-all:
    patch:
      summary: 全部標為已讀
      operationId: markAllNotificationsRead
      tags: [通知 (Notifications)]
      description: |
        將請求者的全部未讀通知標記為已讀。無未讀通知時仍回傳 200。

        此操作不可復原，建議用戶端於執行前確認。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已全部標為已讀。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已全部標為已讀 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/all:
    delete:
      summary: 清除全部通知
      operationId: deleteAllNotifications
      tags: [通知 (Notifications)]
      description: |
        永久刪除請求者的全部通知，並非標記已讀。回應包含實際刪除的筆數。

        > 路由定義順序須置於 `DELETE /api/notifications/{id}` 之前，
        > 否則 `all` 會被解析為 `{id}` 參數。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已清除。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已清除 12 則通知 }
                  data:
                    type: object
                    properties:
                      deleted: { type: integer, example: 12 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/{id}/read:
    patch:
      summary: 標記單則已讀
      operationId: markNotificationRead
      tags: [通知 (Notifications)]
      description: 僅能標記請求者自身的通知，帶入他人的編號將回傳 404。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 512
      responses:
        '200':
          description: 已標為已讀。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已標為已讀 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/notifications/{id}:
    delete:
      summary: 刪除單則通知
      operationId: deleteNotification
      tags: [通知 (Notifications)]
      description: 永久刪除，僅能刪除請求者自身的通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 512
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 通知已刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
