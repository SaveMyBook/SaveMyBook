tags:
  - name: 收藏 (Favorites)
    description: |
      書籍收藏。同一本書重複收藏不會產生重複資料，亦不回傳錯誤。

paths:
  /api/favorites:
    get:
      summary: 取得收藏清單
      operationId: listFavorites
      tags: [收藏 (Favorites)]
      description: |
        回傳收藏的書籍本體而非收藏紀錄，已包含賣家、照片與分類等關聯資料。
        依收藏時間遞減排序，無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 加入收藏
      operationId: addFavorite
      tags: [收藏 (Favorites)]
      description: |
        以 upsert 實作：重複收藏同一本書仍回傳 201 且不會產生第二筆紀錄，
        用戶端無須先行查詢。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 101 }
      responses:
        '201':
          description: 已加入收藏。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已加入收藏 }
                  data:
                    type: object
                    properties:
                      favorite_id: { type: integer, example: 44 }
                      user_id: { type: integer, example: 12 }
                      book_id: { type: integer, example: 101 }
                      created_at: { type: string, format: date-time }
        '400':
          description: 未帶入 `book_id`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請提供 book_id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/favorites/ids:
    get:
      summary: 取得收藏的書籍編號
      operationId: listFavoriteIds
      tags: [收藏 (Favorites)]
      description: |
        僅回傳書籍編號陣列。

        建議於應用程式啟動時呼叫一次並快取，供列表判斷各書籍的收藏狀態，
        避免逐筆查詢。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: integer }
                    example: [101, 105, 132]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/favorites/{bookId}:
    delete:
      summary: 取消收藏
      operationId: removeFavorite
      tags: [收藏 (Favorites)]
      description: |
        以書籍編號刪除，而非收藏紀錄編號。

        該書籍原本未被收藏時仍回傳 200，以利用戶端實作樂觀更新。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: integer }
          example: 101
      responses:
        '200':
          description: 已取消收藏。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已取消收藏 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
