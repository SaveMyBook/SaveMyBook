tags:
  - name: 檢舉 (Reports)
    description: |
      檢舉違規的使用者、商品或訊息。

      審核作業由管理員於「後台：檢舉與爭議」執行。
      檢舉審核期間商品維持正常販售，僅於違規成立後始行下架。

paths:
  /api/reports:
    get:
      summary: 取得我送出的檢舉
      operationId: listMyReports
      tags: [檢舉 (Reports)]
      description: 列出請求者送出的檢舉及其處理狀態，依建立時間遞減排序。無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 送出檢舉
      operationId: createReport
      tags: [檢舉 (Reports)]
      description: |
        送出檢舉。系統會同步通知被檢舉方已受理檢舉並進入審核，
        審核期間商品仍可販售。

        限制條件：

        - 不得檢舉本人上架的商品，亦不得檢舉自身帳號
        - 同一對象若已存在狀態為 `pending` 或 `reviewing` 的檢舉，回傳 409
        - 佐證圖片須先經 `POST /api/uploads` 上傳後，再帶入其路徑
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type:
                  type: string
                  enum: [user, book, message]
                  description: 檢舉對象的類型。
                  example: book
                target_id:
                  type: integer
                  description: 依 `target_type` 分別對應 user_id、book_id 或 message_id。
                  example: 101
                reason: { type: string, description: 檢舉原因，不可空白。, example: 商品描述與實物不符 }
                evidence_urls:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                  description: |
                    佐證圖片路徑。可帶入陣列，伺服器將以半形逗號串接後儲存；
                    亦可直接帶入已串接的字串。
                  example: [/uploads/evidence/a.jpg, /uploads/evidence/b.jpg]
            example:
              target_type: book
              target_id: 101
              reason: 商品描述與實物不符
              evidence_urls: [/uploads/evidence/a.jpg]
      responses:
        '201':
          description: 已送出。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 檢舉已送出，我們會盡快處理 }
                  data: { $ref: '#/components/schemas/Report' }
        '400':
          description: 參數錯誤，或檢舉對象不符合限制。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                類型錯誤:
                  value: { success: false, message: 'target_type 僅接受：user, book, message' }
                未填原因:
                  value: { success: false, message: 請填寫檢舉原因 }
                檢舉本人商品:
                  value: { success: false, message: 無法檢舉自己上架的商品 }
                檢舉自身帳號:
                  value: { success: false, message: 無法檢舉自己 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同一對象已有尚未處理完成的檢舉。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 你已經檢舉過了，我們正在處理中 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/reports/against-me:
    get:
      summary: 取得我的商品被檢舉的紀錄
      operationId: listReportsAgainstMe
      tags: [檢舉 (Reports)]
      description: |
        列出請求者上架書籍所收到的檢舉，供賣家於書籍管理介面顯示標註。

        僅回傳必要欄位，不含佐證圖片與檢舉人身分。
        請求者無任何上架書籍時回傳空陣列。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        report_id: { type: integer, example: 18 }
                        target_id: { type: integer, description: 被檢舉書籍的編號, example: 101 }
                        status: { type: string, enum: [pending, reviewing, resolved, dismissed] }
                        reason: { type: string }
                        created_at: { type: string, format: date-time }
                        resolved_at: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
