tags:
  - name: 後台：會員管理
    description: |
      會員查詢、停權、黑名單、角色、會員等級與管理員細部權限。
      本組端點均需 `can_manage_members` 權限。

      停權為即時生效：驗證中介層於每次請求查詢資料庫確認帳號狀態，
      因此 `is_active` 設為 false 後，該帳號持既有 Token 呼叫任何端點
      均立即收到 401 `ACCOUNT_INACTIVE`，無須等待 Token 到期。

paths:
  /api/admin/members:
    get:
      summary: 會員列表
      operationId: adminListMembers
      tags: [後台：會員管理]
      description: |
        分頁查詢會員，依註冊時間遞減排序。
        各筆資料包含上架書籍數與買賣訂單數。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
          description: 同時對暱稱與 Email 進行模糊比對。
          example: 小明
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive, blacklisted] }
          description: |
            `active` 為正常帳號，即未停權且未列入黑名單；`inactive` 為已停權；
            `blacklisted` 為已列入黑名單。未帶入代表不套用此條件。
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: integer, example: 12 }
                        email: { type: string, example: test@example.com }
                        nickname: { type: string, example: 小明 }
                        avatar_url: { type: string, nullable: true }
                        phone: { type: string, nullable: true }
                        role: { type: string, enum: [buyer_seller, admin] }
                        is_active: { type: boolean }
                        is_blacklisted: { type: boolean }
                        created_at: { type: string, format: date-time }
                        _count:
                          type: object
                          description: 關聯資料的筆數統計。
                          properties:
                            books: { type: integer, description: 上架過的書籍數, example: 14 }
                            orders_orders_buyer_idTousers: { type: integer, description: 以買家身分的訂單數, example: 32 }
                            orders_orders_seller_idTousers: { type: integer, description: 以賣家身分的訂單數, example: 9 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/members/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 會員編號。
        example: 12

    get:
      summary: 會員細節
      operationId: adminGetMember
      tags: [後台：會員管理]
      description: |
        回傳單一會員的完整後台資料，包含基本資料、點數組成、目前等級，
        以及管理員帳號的 11 項細部權限狀態。

        點數組成：

        - `base_points` 為完成訂單數乘以 10，由系統自動計算
        - `bonus_points` 為管理員調整的補正值，可為負數
        - `points` 為 `max(0, base_points + bonus_points)`

        未於 `admin_permissions` 建立對應紀錄的管理員，`permissions`
        全部回傳 `true`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer, example: 12 }
                      nickname: { type: string, example: 小明 }
                      email: { type: string, example: test@example.com }
                      phone: { type: string, nullable: true }
                      avatar_url: { type: string, nullable: true }
                      role: { type: string, enum: [buyer_seller, admin] }
                      is_active: { type: boolean }
                      is_blacklisted: { type: boolean }
                      created_at: { type: string, format: date-time }
                      book_count: { type: integer, example: 14 }
                      completed_orders: { type: integer, description: 以買家身分完成的訂單數, example: 32 }
                      base_points: { type: integer, description: 完成訂單數乘以 10, example: 320 }
                      bonus_points: { type: integer, description: 管理員調整的補正值，可為負數, example: 0 }
                      points: { type: integer, description: 實際點數, example: 320 }
                      current_level:
                        allOf: [{ $ref: '#/components/schemas/MemberLevel' }]
                        nullable: true
                      levels:
                        type: array
                        items: { $ref: '#/components/schemas/MemberLevel' }
                      permissions: { $ref: '#/components/schemas/AdminPermissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      summary: 停權 / 黑名單 / 變更角色
      operationId: adminUpdateMemberStatus
      tags: [後台：會員管理]
      description: |
        部分更新：僅異動請求中帶入的欄位。操作會寫入稽核紀錄。

        不得變更請求者自身的帳號狀態，否則回傳 400。

        `role` 僅接受 `buyer_seller` 與 `admin`，其他值一律忽略。
        降級為一般會員後，該帳號的管理權限立即失效。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active: { type: boolean, description: 值為 false 代表停權。 }
                is_blacklisted: { type: boolean, description: 值為 true 代表列入黑名單。 }
                role: { type: string, enum: [buyer_seller, admin] }
            example: { is_active: false }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 會員狀態已更新 }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer }
                      nickname: { type: string }
                      role: { type: string }
                      is_active: { type: boolean }
                      is_blacklisted: { type: boolean }
        '400':
          description: 嘗試變更請求者自身的狀態。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 無法變更自己的帳號狀態 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/members/{id}/level:
    patch:
      summary: 調整會員等級 / 點數
      operationId: adminAdjustMemberLevel
      tags: [後台：會員管理]
      description: |
        點數由系統依完成訂單數自動計算。本端點透過調整 `bonus_points`
        補正值改變結果，不會異動訂單資料。

        三種模式擇一使用，優先序為 `reset`、`delta`、`level_id`：

        | 帶的欄位 | 行為 |
        | --- | --- |
        | `reset: true` | 補正值歸零，回到純自動計算 |
        | `delta: 50` | 補正值加減，可為負數（不可為 0） |
        | `level_id: 3` | 把補正值算到剛好踩在該等級的門檻上 |

        調整後總點數若為負數，將自動夾限為 0。
        操作完成後會發送通知予該會員，並寫入稽核紀錄。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reset: { type: boolean, description: 帶入 true 代表恢復自動計算。 }
                delta: { type: integer, description: 點數增減量，不可為 0。, example: 50 }
                level_id: { type: integer, description: 指定目標等級。, example: 3 }
            examples:
              指定等級: { value: { level_id: 3 } }
              增加點數: { value: { delta: 50 } }
              扣除點數: { value: { delta: -30 } }
              恢復自動計算: { value: { reset: true } }
      responses:
        '200':
          description: 已調整。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已調整等級 }
                  data:
                    type: object
                    properties:
                      points: { type: integer, description: 調整後的實際點數, example: 500 }
                      bonus_points: { type: integer, description: 調整後的補正值, example: 180 }
        '400':
          description: "`delta` 為 0 或非數值。"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請輸入非零的點數 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: 會員或指定等級不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到這個等級 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/members/{id}/permissions:
    put:
      summary: 設定管理員細部權限
      operationId: adminSetMemberPermissions
      tags: [後台：會員管理]
      description: |
        逐項設定指定管理員的 11 項權限。採部分更新，僅異動請求中帶入的欄位。

        限制條件：

        - 對象須為 `role` 等於 `admin` 的帳號，一般會員回傳 400
        - 不得變更請求者自身的權限，否則回傳 400
        - 至少須帶入一個權限欄位，全數為空時回傳 400

        該帳號若尚未建立權限紀錄，系統會自動建立；此時未帶入的欄位
        將採用資料表預設值 `true`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPermissions' }
            example:
              can_manage_members: true
              can_manage_wallets: false
              can_view_stats: true
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新權限 }
        '400':
          description: 對象非管理員、嘗試變更自身權限，或未帶入任何欄位。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                變更自身權限:
                  value: { success: false, message: 無法變更自己的權限 }
                對象非管理員:
                  value: { success: false, message: 只有管理員帳號才需要設定細部權限 }
                未帶入欄位:
                  value: { success: false, message: 沒有要更新的權限 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
