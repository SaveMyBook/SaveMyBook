tags:
  - name: 公開頁面 (Public)
    description: |
      對外的 HTML 頁面，非 JSON API。供未安裝應用程式的使用者
      透過連結檢視基本資訊。

paths:
  /u/{id}:
    get:
      summary: 個人公開頁（HTML）
      operationId: publicProfilePage
      tags: [公開頁面 (Public)]
      description: |
        掃描個人分享 QR Code 後開啟的頁面，回應為 HTML 而非 JSON。

        QR Code 編碼的是 `https://` 連結而非自訂 scheme，以確保裝置內建相機
        可正常辨識。頁面提供的按鈕再以 `savemybook://user/{id}` 進行 deep link；
        觸發後 1.5 秒內頁面若未進入背景，則判定應用程式未安裝並顯示安裝提示。

        頁面呈現暱稱、頭像、簡介、上架書籍數與加入日期，支援淺色與深色模式，
        所有使用者輸入均經 HTML 跳脫處理。

        帳號已停權或列入黑名單時回傳 404 頁面，以避免由連結反推帳號狀態。
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 使用者編號。
          example: 12
      responses:
        '200':
          description: 個人頁 HTML。
          content:
            text/html:
              schema: { type: string }
        '404':
          description: 使用者不存在或帳號已停用，同樣回傳 HTML 頁面。
          content:
            text/html:
              schema: { type: string }
        '500':
          description: 載入失敗時回傳的錯誤頁 HTML。
          content:
            text/html:
              schema: { type: string }
