tags:
  - name: public
    x-displayName: 公開頁面
    description: |
      對外的 HTML 頁面，非 JSON API。供未安裝應用程式的使用者
      透過連結檢視基本資訊；另含測試期間使用的模擬書櫃頁面（`/kiosk`）。

paths:
  /u/{token}:
    get:
      summary: 個人公開頁（HTML）
      operationId: publicProfilePage
      tags: [public]
      description: |
        掃描個人分享 QR Code 後開啟的頁面，回應為 HTML 而非 JSON。

        路徑帶的是 32 字元隨機權杖而非 `user_id`。用流水號的話任何人都能從
        1 枚舉到 N 把全站使用者的公開頁掃出來。舊的 `/u/<流水號>` 一律視為
        無效，否則等於沒加密。

        QR Code 編碼的是 `https://` 連結而非自訂 scheme，以確保裝置內建相機
        可正常辨識。頁面提供的按鈕再以 `savemybook://u/{token}` 進行 deep link（同樣使用權杖，不帶流水號）；
        觸發後 1.5 秒內頁面若未進入背景，則判定應用程式未安裝並顯示安裝提示。

        頁面呈現暱稱、頭像、簡介、上架書籍數與加入日期，支援淺色與深色模式，
        所有使用者輸入均經 HTML 跳脫處理。

        帳號已停權或列入黑名單時回傳 404 頁面，以避免由連結反推帳號狀態。
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: 分享權杖，取自 `GET /api/users/me/qrcode` 回傳的網址。
          example: 4f3c2b1a9e8d7c6b5a4f3e2d1c0b9a87
      responses:
        '200':
          description: 個人頁 HTML。
          content:
            text/html:
              schema: { type: string }
        '404':
          description: 權杖無效、使用者不存在、帳號已停用或已匿名化，同樣回傳 HTML 頁面。
          content:
            text/html:
              schema: { type: string }
        '500':
          description: 載入失敗時回傳的錯誤頁 HTML。
          content:
            text/html:
              schema: { type: string }

  /b/{token}:
    get:
      summary: 書籍公開頁（HTML）
      operationId: publicBookPage
      tags: [public]
      description: |
        分享單本書籍時開啟的頁面，回應為 HTML 而非 JSON。

        與 `/u/{token}` 同樣採 32 字元隨機權杖：舊的 `savemybook://book/<流水號>`
        只能在裝了 App 的裝置上開啟，且流水號可被從 1 枚舉出全站書籍。
        權杖由 `GET /api/books/{id}/share-link` 首次索取時產生，此後固定不變。

        頁面呈現封面、書名、作者、售價、分類、書況與賣家，並提供
        `savemybook://b/{token}` 的 deep link 按鈕；觸發後 1.5 秒內頁面若未
        進入背景，則判定應用程式未安裝並顯示提示。支援淺色與深色模式，
        所有使用者輸入均經 HTML 跳脫處理。

        下列情形一律回傳 404 頁面，以避免由連結反推書籍或帳號狀態：
        權杖格式不符、查無此書、書籍已下架、賣家已停權、列入黑名單或已匿名化。
        已售出或保留中的書籍仍可檢視，並標示對應狀態。
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: 書籍分享權杖，取自 `GET /api/books/{id}/share-link`。
          example: 3f5a1c9e7b2d4086a1c3e5f7b9d0246a
      responses:
        '200':
          description: 書籍頁 HTML。
          content:
            text/html:
              schema: { type: string }
        '404':
          description: 權杖無效、查無書籍、書籍已下架或賣家帳號不可用，同樣回傳 HTML 頁面。
          content:
            text/html:
              schema: { type: string }
        '500':
          description: 載入失敗時回傳的錯誤頁 HTML。
          content:
            text/html:
              schema: { type: string }

  /terms:
    get:
      summary: 服務條款公開頁（HTML）
      operationId: publicTermsPage
      tags: [public]
      description: |
        以 HTML 呈現目前的服務條款，供 App Store、Google Play 審核與網站連結使用，不需登入。
        內容即時讀取資料庫，管理員於後台更新後約 5 分鐘內生效（`Cache-Control: max-age=300`）。
        段落開頭為「1.」「一、」「第一條」的行會呈現為章節標題；支援深色模式與列印。
      security: []
      responses:
        '200': { description: HTML 頁面。, content: { text/html: { schema: { type: string } } } }
        '404': { description: 文件不存在或內容為空。, content: { text/html: { schema: { type: string } } } }

  /privacy:
    get:
      summary: 隱私權政策公開頁（HTML）
      operationId: publicPrivacyPage
      tags: [public]
      description: 以 HTML 呈現目前的隱私權政策，行為同 `GET /terms`。
      security: []
      responses:
        '200': { description: HTML 頁面。, content: { text/html: { schema: { type: string } } } }
        '404': { description: 文件不存在或內容為空。, content: { text/html: { schema: { type: string } } } }

  /about:
    get:
      summary: 關於我們公開頁（HTML）
      operationId: publicAboutPage
      tags: [public]
      description: 以 HTML 呈現「關於我們」，行為同 `GET /terms`。
      security: []
      responses:
        '200': { description: HTML 頁面。, content: { text/html: { schema: { type: string } } } }
        '404': { description: 文件不存在或內容為空。, content: { text/html: { schema: { type: string } } } }

  /legal/{key}:
    get:
      summary: 任一法律文件公開頁（HTML）
      operationId: publicLegalPage
      tags: [public]
      description: 依 `doc_key` 呈現法律文件，行為同 `GET /terms`。
      security: []
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string, pattern: '^[a-z0-9_-]{1,50}$' }
      responses:
        '200': { description: HTML 頁面。, content: { text/html: { schema: { type: string } } } }
        '404': { description: 文件不存在或內容為空。, content: { text/html: { schema: { type: string } } } }

  /kiosk:
    get:
      summary: 模擬書櫃頁面（HTML）
      operationId: publicKioskPage
      tags: [public]
      description: |
        以瀏覽器模擬一台智慧書櫃，供測試掃碼存取流程。頁面左側為書櫃正面，比照實機：上方左側為標誌貼紙、右側為
        2.8 吋 320×240 橫向顯示螢幕，其下由上而下為 A01–A04 四扇櫃門（鉸鏈在右側、電磁鎖在左側）。
        螢幕畫面與 ESP32-S3 韌體相同，只負責顯示，沒有可操作的元素。
        頁面右側為模擬控制台，可模擬離線、重新開機、網路延遲、櫃門故障與門磁感測器，實體書櫃沒有這些功能；
        開啟模擬門磁感測器後，書櫃正面的各扇櫃門另提供開門與關門操作。

        - **開關**：僅在環境變數 `CABINET_SIMULATOR=true` 時提供，否則本路徑與 `/kiosk/assets/*` 一律回 404（純文字「找不到此頁面」）。
          關閉後，所有模擬書櫃的裝置憑證同時失效。
        - **權限**：頁面本身沒有任何權限。第一次開啟時以 `POST /api/device/v1/pair/request` 申請配對碼並顯示於模擬螢幕，
          管理員於後台輸入配對碼後，頁面以 `POST /api/device/v1/pair/poll` 取得裝置憑證；之後與 ESP32-S3 實機使用同一組裝置 API。
        - **本機資料**：裝置憑證、事件佇列、事件序號與開門中紀錄存放於瀏覽器 localStorage（`smb.device.*`）。
          同一瀏覽器只允許一個分頁執行書櫃（`navigator.locks`），其他分頁只顯示「模擬書櫃已在其他分頁執行」。
        - **安全標頭**：`Content-Security-Policy` 只允許同源的腳本、樣式與連線（`default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'`），
          頁面沒有行內腳本或樣式；另加 `Cache-Control: no-store`、`Referrer-Policy: no-referrer`、`X-Robots-Tag: noindex, nofollow`、
          `Permissions-Policy: camera=(), microphone=(), geolocation=()`、`X-Frame-Options: DENY`。
        - **測試期間接受的風險**：本頁與 `/api-docs` 同源，接上實機、正式營運前應關閉 `CABINET_SIMULATOR`，或改由獨立子網域提供。
      security: []
      responses:
        '200':
          description: 模擬書櫃頁面 HTML。
          content:
            text/html:
              schema: { type: string }
        '404':
          description: 模擬器未開啟。
          content:
            text/plain:
              schema: { type: string, example: 找不到此頁面 }

  /kiosk/assets/{file}:
    get:
      summary: 模擬書櫃頁面的靜態資產
      operationId: publicKioskAsset
      tags: [public]
      description: |
        提供模擬書櫃頁面使用的腳本、樣式與圖示，只接受白名單內的檔名；其他檔名、含 `..`、`/` 或 `%2F` 的路徑一律回 404。
        回應帶 `Cache-Control: no-cache` 與頁面相同的安全標頭；模擬器未開啟時同樣回 404。

        | 檔案 | 內容 |
        | --- | --- |
        | `device-core.js` | 書櫃核心邏輯（輪詢、事件佇列、開鎖時序、本機開門模式），同時是 ESP32-S3 韌體的參考實作；UMD 格式，Node 端對端腳本 `scripts/simulate-cabinet-flow.js` 共用同一份程式 |
        | `kiosk.js` | 以 canvas 繪製書櫃螢幕（僅顯示，版面與韌體相同）、書櫃正面的櫃門與模擬控制台 |
        | `qrcode.js` | 內嵌的 QR Code 產生程式（Kazuhiko Arase，MIT 授權），不從外部網站載入 |
        | `kiosk.css` | 頁面樣式（支援深色模式） |
        | `book-slate-128.png` | 書櫃正面標誌貼紙的圖示，由 `kiosk.css` 載入 |
      security: []
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
            enum: [device-core.js, kiosk.js, qrcode.js, kiosk.css, book-slate-128.png]
      responses:
        '200':
          description: 資產內容。
          content:
            text/javascript:
              schema: { type: string }
            text/css:
              schema: { type: string }
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: 檔名不在白名單內，或模擬器未開啟。
          content:
            text/plain:
              schema: { type: string, example: 找不到此頁面 }
