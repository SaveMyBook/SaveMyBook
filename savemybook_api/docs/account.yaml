tags:
  - name: account
    x-displayName: 帳號與隱私
    description: |
      刪除帳號、匯出個人資料與分享連結權杖。

      刪除採 30 天緩衝：申請後帳號仍可登入，期間內隨時可取消；
      逾期由伺服器排程執行匿名化。匿名化並非實際刪除資料列，
      而是清除個資並停用帳號，訂單與錢包異動等帳務資料保留，
      否則交易對象的紀錄會出現破洞。AI 客服與書籍顧問對話、AI 推薦快取、AI 資料處理同意紀錄、推薦曝光與點擊紀錄、不感興趣的書與上架輔助權杖於匿名化時刪除。
      匿名化時上架中的書籍一律下架；仍登記存放於書櫃的書保留存書紀錄並立即通知具書櫃管理權限的管理員安排取出，
      不再提醒賣家取回。

paths:
  /api/users/me/export:
    get:
      summary: 匯出個人資料
      operationId: exportMyData
      tags: [account]
      description: |
        以 JSON 檔下載個人資料、上架書籍、買賣訂單、錢包與交易紀錄、
        爭議、檢舉、客服工單，AI 資料處理同意紀錄、AI 客服與書籍顧問對話（含助理訊息的處理紀錄與使用者對回覆的評價）、AI 推薦快取與 AI 決策紀錄，
        以及 90 天內的推薦曝光與點擊紀錄、標示不感興趣的書與上架輔助建議的採用紀錄。

        回應帶 `Content-Disposition: attachment`，檔名為
        `savemybook-<YYYY-MM-DD>.json`（日期以 UTC 計）。

        需 `sensitive` 範圍的身分驗證，將 `POST /api/security/verify` 取得的 `verify_token`
        帶入 `X-Verify-Token` 標頭。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      responses:
        '200':
          description: 下載檔案。
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at: { type: string, format: date-time }
                  format_version: { type: integer, example: 1 }
                  profile: { $ref: '#/components/schemas/User' }
                  books:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
                  orders_as_buyer:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  orders_as_seller:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  wallet: { $ref: '#/components/schemas/Wallet' }
                  disputes:
                    type: array
                    items: { $ref: '#/components/schemas/Dispute' }
                  reports:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
                  support_tickets:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTicket' }
                  ai:
                    type: object
                    nullable: true
                    properties:
                      consent:
                        type: object
                        nullable: true
                        properties:
                          granted: { type: boolean }
                          policy_version: { type: integer, description: 同意或撤回時的隱私權政策版本, example: 2 }
                          notice_version: { type: integer, description: 同意時用戶端顯示的同意說明版本，撤回或未記錄時為 0, example: 4 }
                          updated_at: { type: string, format: date-time }
                      book_chat_sessions:
                        type: array
                        description: 書籍顧問對話。最後一則訊息滿 90 天或撤回 AI 同意時即刪除。
                        items:
                          type: object
                          properties:
                            status: { type: string, enum: [open, closed] }
                            created_at: { type: string, format: date-time }
                            updated_at: { type: string, format: date-time }
                            messages:
                              type: array
                              items:
                                type: object
                                properties:
                                  role: { type: string, enum: [user, assistant] }
                                  content: { type: string }
                                  meta:
                                    type: object
                                    nullable: true
                                    description: 僅助理訊息提供。處理紀錄（處理路徑、檢索段落代號、服務商與模型、推薦理由等），不含使用者訊息原文；滿 90 天後為 null。
                                  feedback:
                                    type: object
                                    description: 使用者對這則助理訊息的評價，未評價時不提供此欄位。
                                    properties:
                                      rating: { type: string, enum: [helpful, unhelpful] }
                                      reason: { type: string, nullable: true }
                                  created_at: { type: string, format: date-time }
                      support_sessions:
                        type: array
                        description: AI 客服對話，保存規則同 `book_chat_sessions`。
                        items:
                          type: object
                          properties:
                            status: { type: string, enum: [open, closed, escalated] }
                            created_at: { type: string, format: date-time }
                            updated_at: { type: string, format: date-time }
                            messages:
                              type: array
                              items:
                                type: object
                                properties:
                                  role: { type: string, enum: [user, assistant] }
                                  content: { type: string }
                                  meta:
                                    type: object
                                    nullable: true
                                    description: 僅助理訊息提供。處理紀錄（處理路徑、檢索段落代號、服務商與模型、推薦理由等），不含使用者訊息原文；滿 90 天後為 null。
                                  feedback:
                                    type: object
                                    description: 使用者對這則助理訊息的評價，未評價時不提供此欄位。
                                    properties:
                                      rating: { type: string, enum: [helpful, unhelpful] }
                                      reason: { type: string, nullable: true }
                                  created_at: { type: string, format: date-time }
                      recommendations:
                        type: object
                        nullable: true
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                book_id: { type: integer }
                                reason: { type: string, nullable: true }
                          created_at: { type: string, format: date-time }
                      decision_logs:
                        type: array
                        description: |
                          AI 客服、書籍顧問、個人推薦與上架輔助的決策紀錄，只含代號、計數與布林值，保存 90 天。
                          管理員帳號另含執行爭議分析（`admin_assist`）的紀錄。
                        items:
                          type: object
                          properties:
                            feature: { type: string, enum: [support, book_chat, recommend, listing_assist, admin_assist] }
                            outcome: { type: string, enum: [ok, repaired, degraded, empty, refused, failed] }
                            path: { type: string, nullable: true, example: picked }
                            stats: { type: object, example: { flags: { degraded: false }, counts: { books: 3 } } }
                            created_at: { type: string, format: date-time }
                  recommendations:
                    type: object
                    properties:
                      impressions:
                        type: array
                        description: 推薦曝光與點擊，保存 90 天。
                        items:
                          type: object
                          properties:
                            book_id: { type: integer }
                            source: { type: string, enum: [ai, rules] }
                            is_clicked: { type: boolean }
                            clicked_at: { type: string, format: date-time, nullable: true }
                            created_at: { type: string, format: date-time }
                      not_interested:
                        type: array
                        items:
                          type: object
                          properties:
                            book_id: { type: integer }
                            created_at: { type: string, format: date-time }
                  listing_assist:
                    type: array
                    description: 上架輔助建議的採用紀錄，保存 90 天。
                    items:
                      type: object
                      properties:
                        created_at: { type: string, format: date-time, description: 取得建議的時間 }
                        used_at: { type: string, format: date-time, nullable: true, description: 建立書籍時帶回權杖的時間 }
                        suggested:
                          type: object
                          nullable: true
                          description: 尚未建立書籍的建議值（簡介只有雜湊值）；建立書籍算出採用結果後即清除，此時為 null。
                          example: { author: 村上春樹, price: '170' }
                        adopted:
                          type: object
                          nullable: true
                          description: 各欄位是否採用建議值（1 為採用），尚未使用或合併到同一本書的其他紀錄時為 null。
                          additionalProperties: { type: integer, enum: [0, 1] }
                          example: { title: 1, price: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/deletion:
    get:
      summary: 查詢刪除申請狀態
      operationId: getDeletionStatus
      tags: [account]
      description: 回傳是否有進行中的刪除申請，以及預計執行匿名化的時間。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      pending: { type: boolean, description: 是否有進行中的刪除申請, example: false }
                      requested_at: { type: string, format: date-time, nullable: true }
                      purge_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 逾此時間後執行匿名化。
                      grace_days: { type: integer, example: 30 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 申請刪除帳號
      operationId: requestAccountDeletion
      tags: [account]
      description: |
        需以密碼確認身分。申請成立後帳號**仍可登入**，因為登入是取消刪除的唯一入口。

        手上若有進行中的訂單（`pending_payment`、`pending_deposit`、`deposited`、
        `pending_pickup`、`refunding`）會被拒絕，否則交易對象會卡在半途。
        仍有書籍登記存放於書櫃（訂單成立前存書）時回傳 400 `BOOKS_IN_CABINET`，須先至書櫃以 App 掃描 QR Code 取回（書櫃無法掃碼時改以手動回報，經客服確認後生效）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: 已受理。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已受理，30 天內重新登入即可取消 }
                  data:
                    type: object
                    properties:
                      purge_at: { type: string, format: date-time }
                      grace_days: { type: integer, example: 30 }
        '400':
          description: 未填密碼、仍有進行中的訂單，或仍有書籍存放於書櫃。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未填密碼:
                  value: { success: false, message: 請輸入密碼以確認身分 }
                有未完成訂單:
                  value: { success: false, code: OPEN_ORDERS, message: 尚有 2 筆進行中的訂單，請先完成或取消後再申請刪除 }
                書籍仍在書櫃:
                  value: { success: false, code: BOOKS_IN_CABINET, message: 尚有 1 本書籍存放於書櫃，請先至書櫃以 App 掃描 QR Code 取回後再申請刪除 }
                密碼錯誤:
                  value: { success: false, message: 密碼錯誤 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 取消刪除申請
      operationId: cancelAccountDeletion
      tags: [account]
      description: 在緩衝期內取消刪除。逾期已完成匿名化者無法復原。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已取消。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已取消刪除帳號 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/share-token/rotate:
    post:
      summary: 重新產生分享連結
      operationId: rotateShareToken
      tags: [account]
      description: |
        產生新的分享權杖，舊連結立即失效。連結外流時使用。

        個人公開頁的路徑帶的是 32 字元隨機權杖而非 `user_id`，
        以避免從流水號枚舉出全站使用者。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已產生新連結。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已產生新連結，舊連結立即失效 }
                  data:
                    type: object
                    properties:
                      qr_data:
                        type: string
                        example: https://api.savemybook.today/u/4f3c2b1a9e8d7c6b5a4f3e2d1c0b9a87
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/notification-settings:
    get:
      summary: 取得推播偏好
      operationId: getNotificationSettings
      tags: [account]
      description: |
        三種通知類型的推播開關，未設定過時全部為 true。只影響手機推播，站內通知列表照樣會收到。
        系統通知（客服回覆、密碼重設、條款更新、維護公告等）一律推送，無法關閉。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      order: { type: boolean, example: true, description: 訂單進度 }
                      message: { type: boolean, example: true, description: 聊天訊息 }
                      promotion: { type: boolean, example: false, description: 優惠活動公告 }
        '401': { $ref: '#/components/responses/Unauthorized' }

    put:
      summary: 更新推播偏好
      operationId: updateNotificationSettings
      tags: [account]
      description: 部分更新，只帶要改的欄位。值必須是布林值。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: boolean }
                message: { type: boolean }
                promotion: { type: boolean }
            example: { promotion: false }
      responses:
        '200':
          description: 已更新，回傳更新後的完整設定。
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/me/legal-consents/pending:
    get:
      summary: 待同意的法律文件
      operationId: getPendingLegalConsents
      tags: [account]
      description: |
        服務條款、隱私權政策做了重大更新後，使用者尚未同意的新版本（含全文）。
        App 開啟時呼叫，清單不為空就擋住畫面要求同意，不同意則登出。

        上線前註冊、沒有同意紀錄的使用者視為已同意第 1 版。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。沒有待同意的文件時為空陣列。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        doc_id: { type: integer }
                        doc_key: { type: string, example: terms }
                        title: { type: string, example: 服務條款 }
                        content: { type: string }
                        version: { type: integer, example: 3 }
                        updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/me/legal-consents:
    post:
      summary: 同意法律文件
      operationId: acceptLegalDocument
      tags: [account]
      description: 版本必須等於文件目前的版本；文件在使用者閱讀期間又更新時回傳 409，App 應重新載入。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_key, version]
              properties:
                doc_key: { type: string, example: terms }
                version: { type: integer, example: 3 }
      responses:
        '200':
          description: 已記錄。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已同意 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件版本已變更。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: LEGAL_VERSION_CHANGED, message: 此文件已更新，請重新閱讀後再同意 }
