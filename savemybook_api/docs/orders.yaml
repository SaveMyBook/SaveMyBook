tags:
  - name: orders
    x-displayName: 訂單
    description: |
      結帳、查詢與訂單狀態流轉。

      結帳時即自買家錢包扣款，款項由平台保管；買家取書後點選「完成訂單」（`completed`），
      或取書滿 24 小時未申請爭議由排程自動完成，款項才撥入賣家錢包，期間於賣家端顯示為待撥款項（`GET /api/wallet/pending`）。

      **排程（每 10 分鐘）**

      | 條件 | 處理 |
      | --- | --- |
      | 已取書（`picked_up_at` 有值）滿 24 小時，且狀態仍為 `deposited`／`pending_pickup` | 自動完成並撥款，通知買賣雙方 |
      | `pending_payment`／`pending_deposit` 且訂單成立滿 7 天 | 自動取消、全額退款，書籍改為下架（`removed`），通知雙方；已在櫃中（`pre_deposited`）的書恢復存書登記，通知賣家至書櫃以 App 掃描 QR Code 取回（書櫃無法掃碼時改以手動回報，經客服確認後生效）。`cancel_reason` 與通知為「賣家逾 7 天未存書」，已部分存入（有 `pre_deposited` 的書）者為「賣家逾 7 天未存齊書籍」 |
      | `deposited`／`pending_pickup` 未取書且存書滿 7 天 | 自動取消、全額退款，書籍改為下架，通知賣家至書櫃取回書籍；訂單的每本書都恢復存書登記，須至書櫃以 App 掃描 QR Code 取回（書櫃無法掃碼時改以手動回報，經客服確認後生效） |
      | 尚未取書（`pending_payment`、`pending_deposit`，或未取書的 `deposited`／`pending_pickup`），且訂單內有書籍為 `removed` | 視為書籍經審核下架，自動取消（`cancel_reason` 為「書籍經審核下架」）、全額退款並通知雙方；其餘書籍依一般取消流程處理，下架的書維持 `removed` |

      上述自動取消前會檢查書櫃紀錄：訂單正於書櫃作業中（含開門中）時留待下次排程；開門後未完成取書、曾有無法辦理的紀錄、
      櫃門故障或待確認、有待確認的手動回報時不取消也不退款，通知具硬體維護權限的管理員一次（書櫃事件 `overdue_review`，
      書籍下架者為 `delist_review`），待紀錄排除後由排程再處理，或由管理員調整訂單狀態。

      書籍經檢舉成立並下架、管理員強制下架（`PATCH /api/admin/books/{id}`，或管理員以 `PUT`／`DELETE /api/books/{id}` 下架）、
      背景上架審核判定拒絕或管理員拒絕上架審核時，即時執行上述下架取消，未能取消者由排程接續。
      買家已取書的訂單（`deposited`／`pending_pickup` 且 `picked_up_at` 有值，或已取書而爭議處理中）不自動取消，有問題請申請交易爭議；
      這類訂單的書比照已完成交易（`sold`）的書不改狀態，只設為不公開顯示（`is_approved` 為 false），訂單照常進行，完成時轉為 `sold`；
      訂單改為退款或取消時書籍改為下架（`removed`），不恢復販售。書籍下架時若買家正於書櫃取書而未能取消訂單，取書後訂單完成時書籍同樣轉為 `sold` 並維持不公開。

      爭議處理中（`refunding`）的訂單不受排程影響。

      賣家可在訂單成立前至書櫃以 App 掃描 QR Code 先行存書（見「書櫃作業」；書櫃無法掃碼時改以 `POST /api/books/{id}/deposit`
      手動回報，經客服確認後生效）。訂單中每本書都已存於該訂單的書櫃時，
      訂單直接成立為 `deposited`，`deposited_at` 為下單時間，買家取書期限自下單起算 7 天，且買賣雙方即無法自行取消，
      如有問題須申請交易爭議；其餘訂單照常以 `pending_deposit` 成立，由賣家依書櫃作業存書。
      訂單項目的 `pre_deposited` 標示已在訂單書櫃中的書：下單時已先行存書，或訂單部分存書時已存入者。
      依訂單存書時空門不足，賣家可先存入部分書籍（每本一扇櫃門），訂單在全部書籍存入前維持 `pending_deposit`，
      全部存入後才轉為 `deposited` 並通知買家取書；訂單成立滿 7 天仍未存齊時依排程自動取消並全額退款（見「書櫃作業」）。
      訂單在買家取書前取消或退款時，仍在櫃中的書恢復存書登記
      （存書時間自取消時重新起算），逾期提醒與後台存書列表照常追蹤：訂單已存書（`deposited`、`pending_pickup`，
      爭議處理中則為已有 `deposited_at`）時訂單的每本書都恢復登記於訂單書櫃，書籍的書櫃一併改為訂單書櫃；
      尚未存書時僅 `pre_deposited` 的書恢復登記。訂單原為爭議處理中（`refunding`）時，因無法確認書是否仍在櫃中，
      恢復登記的書改為下架，待賣家至書櫃以 App 掃描 QR Code 取回後自行重新上架。已取消或已退款的訂單再調整狀態時不再恢復存書登記。

      結帳依「賣家＋書籍指定的書櫃」拆分為多筆訂單，每筆訂單在書籍原本指定的書櫃取書，每筆訂單最多 2 本，
      因此 `POST /api/orders/checkout` 的回應為陣列。

paths:
  /api/orders:
    get:
      summary: 取得訂單列表
      operationId: listOrders
      tags: [orders]
      description: |
        App「訂單紀錄」的購買訂單與銷售訂單共用此端點，以 `role` 參數切換。

        `tab` 對應用戶端的狀態篩選，伺服器會將其展開為查詢條件。「待確認」指已取書（`picked_up_at` 有值）、
        狀態仍為 `deposited` 或 `pending_pickup` 的訂單。

        **訂單紀錄（買賣雙方通用）**

        | `tab` | 條件 | 購買訂單 | 銷售訂單 |
        | --- | --- | --- | --- |
        | `awaiting_pickup` | `deposited`, `pending_pickup`（含待確認） | 待取書 | 待買家取書 |
        | `awaiting_deposit` | `pending_payment`, `pending_deposit` | 待賣家存書 | 待存書 |
        | `disputing` | `refunding` | 爭議處理中 | 爭議處理中 |
        | `finished` | `completed` | 已完成 | 已完成 |
        | `cancelled` | `cancelled`, `refunded` | 已取消 | 已取消 |

        以下為舊版 App 購買紀錄與銷售紀錄的頁籤，條件維持不變：

        **買家（`role=buyer`）**

        | `tab` | 條件 |
        | --- | --- |
        | `pending_pickup` | `pending_payment`, `pending_deposit`, `deposited`, `pending_pickup`，且尚未取書 |
        | `completed` | `completed`，以及待確認的訂單 |

        **賣家（`role=seller`）**

        | `tab` | 條件 |
        | --- | --- |
        | `pending_deposit` | `pending_payment`, `pending_deposit` |
        | `deposited` | `deposited`, `pending_pickup`（含待確認） |
        | `on_sale` | 同 `deposited` |
        | `completed` | `completed` |

        列表的 `pagination.total` 為符合條件的總筆數，App 以 `limit=1` 查詢取得頁籤數量徽章。
        未帶入 `tab` 時不套用狀態條件。帶入未定義的 `tab` 將回傳 400。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [buyer, seller], default: buyer }
          description: 查詢身分。非 `seller` 的值一律視為 `buyer`。
        - in: query
          name: tab
          schema: { type: string }
          description: 狀態篩選名稱，詳見上表。
          example: awaiting_pickup
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400':
          description: "`tab` 未定義於該角色的頁籤清單。"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請求內容不正確 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/checkout:
    post:
      summary: 結帳
      operationId: checkout
      tags: [orders]
      description: |
        將購物車轉換為訂單。整個流程封裝於單一資料庫交易，任一步驟失敗即全部回滾。

        執行步驟：

        1. 取出購物車項目；帶入 `cart_ids` 時僅取指定項目
        2. 確認每本書籍狀態為 `on_sale` 且售價大於 0
        3. 確認買家代幣餘額足夠；交易內會再次檢查，以防併發請求重複扣款
        4. 依「賣家＋書籍指定的書櫃」分組，訂單書櫃為該組書籍的書櫃；任一組超過 2 本時回 400 `ORDER_BOOK_LIMIT`，不扣款；否則將書籍狀態更新為 `reserved`
        5. 移除這些書的存書登記並以 `pre_deposited` 標示；該組每本書都已存於訂單書櫃時，訂單直接成立為 `deposited`（`deposited_at` 為下單時間），否則為 `pending_deposit`
        6. 建立訂單並產生訂單編號，自買家錢包扣款並寫入一筆 `purchase` 交易紀錄
        7. 通知賣家訂單成立：`pending_deposit` 請賣家於七天內存書（部分書已在櫃中時請存入其餘書籍）；`deposited` 不需再存書，並通知買家即可前往書櫃取書
        8. 移除已結帳的購物車項目

        因跨賣家或跨書櫃會拆分訂單，回應為訂單陣列。存書登記的書櫃與書籍指定的書櫃不一致（資料異常）時，
        該書不視為已在訂單書櫃，仍移除存書登記，訂單以 `pending_deposit` 成立。

        同一賣家於同一書櫃的書籍超過 2 本時回 400 `ORDER_BOOK_LIMIT`（附 `max_books` 與該組的 `book_ids`），
        請使用者分次結帳；直接購買（`POST /api/orders/buy-now`）為單本，不受影響。

        二手書一筆商品即一本實體書，每個購物車項目一律以 1 本計價並計入每筆訂單的本數上限，訂單明細的 `quantity` 為 1；
        舊資料的購物車數量大於 1 時同樣以 1 本成立訂單。

        成立即為 `deposited` 的訂單（書已先行存書）買家無法自行取消，App 應於結帳前提示；如有問題須申請交易爭議。

        ## Payment Verification

        需 `payment` 範圍的身分驗證：先以交易密碼或生物辨識呼叫 `POST /api/security/verify`，
        再將取得的 `verify_token` 帶入 `X-Verify-Token` 標頭。該 token 僅能使用一次；
        結帳失敗（回應狀態碼大於等於 400）時 token 恢復可用，可直接重試。
        使用者尚未設定交易密碼時，驗證端點回傳 403 `PAYMENT_PIN_NOT_SET`，App 應先引導設定。

        購物車中有書籍已由其他買家預約保留時，回傳 409 `BOOK_RESERVED`。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cart_ids:
                  type: array
                  items: { type: integer }
                  description: 欲結帳的購物車項目編號。未帶入或帶入空陣列時結帳全部項目。
                  example: [55, 56]
            example: { cart_ids: [55, 56] }
      responses:
        '201':
          description: 結帳成功，回傳建立的訂單，筆數可能大於 1。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 結帳成功 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400':
          description: 無法完成結帳。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                購物車是空的:
                  value: { success: false, message: 購物車沒有可結帳的項目 }
                書已被買走:
                  value: { success: false, message: 《挪威的森林》已無法購買，請先移除 }
                售價異常:
                  value: { success: false, message: 《挪威的森林》的售價異常，請聯絡賣家或先移除 }
                代幣不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣不足，此訂單需 540 代幣，目前餘額 200 }
                同一賣家同一書櫃超過本數上限:
                  value: { success: false, code: ORDER_BOOK_LIMIT, message: 同一賣家於同一書櫃之書籍，每筆訂單最多 2 本，請分次結帳, max_books: 2, book_ids: [101, 102, 103] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '409': { $ref: '#/components/responses/BookReserved' }
        '500':
          description: 結帳過程發生錯誤，交易已回滾，代幣不會遭扣除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 系統發生錯誤，請稍後再試 }

  /api/orders/buy-now:
    post:
      summary: 直接購買單本書
      operationId: buyNow
      tags: [orders]
      description: |
        不經購物車直接購買一本書，檢查項目、扣款、書籍狀態、訂單初始狀態（書已存入書櫃時為 `deposited`，買家即無法自行取消）與通知皆與 `POST /api/orders/checkout` 相同；
        該書若也在請求者的購物車中會一併移除。需 `payment` 範圍的身分驗證（方式同結帳）。

        `quantity` 可省略（視為 1），帶入其他值回傳 400 `QUANTITY_FIXED`。

        書籍不存在或未公開回傳 404；已被買走、為自己上架的書或售價異常回傳 400；
        代幣不足回傳 400 `INSUFFICIENT_BALANCE`；由其他買家預約保留中回傳 409 `BOOK_RESERVED`；
        同時有人結帳同一本書時，其中一方回傳 409。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 101 }
                quantity: { type: integer, enum: [1], default: 1, description: 固定為 1，可省略。 }
      responses:
        '201':
          description: 購買成功，回傳建立的訂單。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 購買成功 }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: 無法購買。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已被買走:
                  value: { success: false, message: 《挪威的森林》已無法購買 }
                代幣不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣不足，此訂單需 180 代幣，目前餘額 50 }
                數量不是 1:
                  value: { success: false, code: QUANTITY_FIXED, message: 每筆書籍僅有一本，數量僅能為 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BookReserved' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/by-no/{orderNo}:
    get:
      summary: 以訂單編號取得訂單詳情
      operationId: getOrderByNo
      tags: [orders]
      description: |
        以使用者看得到的訂單編號（`SMB` 加 20 位數字，早期訂單為 17 位，大小寫不拘）查詢，供 AI 客服回覆中的訂單連結使用。
        僅該訂單的買家、賣家或管理員可查詢；訂單不存在或請求者不是當事人時一律回傳 404，不透露訂單是否存在。
        回應內容與 `GET /api/orders/{id}` 相同。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderNo
          required: true
          schema: { type: string, pattern: '^[Ss][Mm][Bb][0-9]{17}([0-9]{3})?$' }
          example: SMB20260928143015123456
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}:
    get:
      summary: 取得訂單詳情
      operationId: getOrder
      tags: [orders]
      description: |
        僅該訂單的買家、賣家或管理員可查詢。
        回應包含書櫃、櫃位與爭議狀態。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}/status:
    patch:
      summary: 更新訂單狀態
      operationId: updateOrderStatus
      tags: [orders]
      description: |
        推進訂單流程。每個目標狀態限定由誰呼叫、從哪個狀態出發，管理員不受身分限制：

        | 目標狀態 | 呼叫者 | 目前狀態須為 |
        | --- | --- | --- |
        | `deposited` | 賣家 | `pending_payment`、`pending_deposit` |
        | `pending_pickup` | 賣家 | `deposited` |
        | `picked_up` | 買家 | `deposited`、`pending_pickup`，且尚未取書 |
        | `completed` | 買家 | `deposited`、`pending_pickup`，且已取書 |

        更新以「狀態仍為讀取時的值」為條件，兩個請求同時送出時只有一個會成功，
        另一個回傳 409，賣家不會重複入帳。
        取消訂單請使用 `PATCH /api/orders/{id}/cancel`。

        **書櫃掃碼存取**：書櫃為掃碼模式時（含裝置離線或故障未滿 2 分鐘，及裝置自行解除配對或疑遭複製而撤銷後 2 分鐘內），
        `deposited`、`picked_up`（以及尚未取書時的 `completed`）須至書櫃以 App 掃描 QR Code 辦理（見「書櫃作業」），
        一般使用者呼叫本端點回 409 `CABINET_SCAN_REQUIRED`；已配對裝置的書櫃停用或維修中時回 409 `CABINET_UNAVAILABLE`、`CABINET_MAINTENANCE`。
        書櫃沒有有效裝置（含從未配對），或裝置離線、故障持續 2 分鐘以上時，本端點一律建立待客服確認的手動回報，
        回 202 並附 `manual_report`，訂單狀態不變；管理員確認後才生效並通知對方，駁回時通知回報者。
        同一項目已有待確認的回報時回 409 `MANUAL_REPORT_PENDING`。App 須把 202 顯示為「待客服確認」，不得視為已完成。
        具書櫃管理權限、且不是當事人的管理員不受上述限制，立即生效；身為當事人的管理員只能以本人的身分（買家或賣家）操作。

        `picked_up` 只寫入 `picked_up_at`，訂單狀態維持不變、不撥款，並通知賣家。
        尚未取書時送出 `completed`（舊版 App 的行為）一律視為 `picked_up`。

        狀態設為 `completed` 時，於同一交易內執行下列動作：

        - 將書籍狀態更新為 `sold`
        - 將訂單金額匯入賣家錢包並累加 `total_income`
        - 寫入一筆 `sale_income` 錢包交易紀錄
        - 寫入 `completed_at`，通知賣家

        完成後不再受理交易爭議。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [deposited, pending_pickup, picked_up, completed]
                  description: '`deposited` 賣家已存書、`pending_pickup` 等待取件、`picked_up` 買家已取書、`completed` 完成訂單並撥款。'
            example: { status: completed }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訂單狀態已更新 }
                  data: { $ref: '#/components/schemas/Order' }
        '202':
          description: 已送出待客服確認的手動回報，狀態尚未變更。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已送出手動回報，待客服確認後生效 }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                      - type: object
                        properties:
                          manual_report: { $ref: '#/components/schemas/CabinetManualReport' }
        '400':
          description: 狀態值未列於允許清單，或目前狀態不能推進到目標狀態。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                狀態值錯誤:
                  value: { success: false, message: 訂單狀態不正確 }
                尚未存書:
                  value: { success: false, message: 賣家尚未存書，無法確認取書 }
                尚未存書時完成訂單:
                  value: { success: false, message: 賣家尚未存書，無法完成訂單 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 呼叫者不是該步驟的執行方（例如賣家嘗試設為 completed；身為當事人的管理員亦同）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                非買家:
                  value: { success: false, message: 僅買家可確認取書或完成訂單 }
                非賣家:
                  value: { success: false, message: 僅賣家可執行此操作 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 訂單已是目標狀態、在處理期間被其他請求變更，或書櫃須掃碼辦理。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                狀態已變更:
                  value: { success: false, message: 訂單狀態已變更，請重新整理後再試 }
                已是目標狀態:
                  value: { success: false, message: 訂單已是此狀態 }
                已確認取書:
                  value: { success: false, message: 已確認取書 }
                須掃碼辦理:
                  value: { success: false, code: CABINET_SCAN_REQUIRED, message: 此書櫃已啟用掃碼存取，請至書櫃以 App 掃描 QR Code 辦理, cabinet_id: 3 }
                已有待確認回報:
                  value: { success: false, code: MANUAL_REPORT_PENDING, message: 此項目已有待客服確認的手動回報 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}/cancel:
    patch:
      summary: 取消訂單
      operationId: cancelOrder
      tags: [orders]
      description: |
        賣家存書前（`pending_payment`、`pending_deposit`）買賣雙方皆可取消；存書後雙方都不能自行取消，
        回傳 400 `ORDER_NOT_CANCELLABLE`，須改為申請交易爭議。書已先行存書的訂單成立即為 `deposited`，
        因此自下單起即無法自行取消。狀態已為 `completed`、`cancelled` 或 `refunded`
        的訂單不得取消；爭議處理中（`refunding`）的訂單僅管理員可取消。
        訂單正於書櫃辦理中（書櫃作業在數字比對、開門中或櫃門已開啟）時雙方都不能取消，回傳 409 `ORDER_IN_CABINET_SESSION`，
        管理員不受此限。同時送出的取消請求只有一個會成功，其餘回傳 409，不會重複退款。

        取消時於同一交易內執行下列動作：

        - 將訂單狀態更新為 `cancelled`，並記錄時間與原因
        - 將保留中的書籍改回 `on_sale`，重新開放購買
        - 仍在櫃中的書恢復存書登記（買家可再下單直接取書）：管理員取消已存書的訂單時為訂單的每本書，
          其餘為 `pre_deposited` 的書；爭議處理中的訂單由管理員取消時，恢復登記的書改為下架
        - 依錢包帳本退回買家實際支付的代幣，寫入一筆 `refund` 交易紀錄並發送通知
        - 通知交易對象訂單已取消；管理員取消時通知買家。有書恢復存書登記時（買家或管理員取消）一併通知賣家：
          公開販售中的書將繼續販售，未公開販售的書請賣家至書櫃以 App 掃描 QR Code 取回
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 取消原因，將寫入訂單並包含於發送給交易對象的通知中。
                  example: 臨時不需要了
      responses:
        '200':
          description: 已取消。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訂單已取消 }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: 目前狀態不允許取消。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已結束:
                  value: { success: false, message: 此訂單狀態無法取消 }
                已存書:
                  value: { success: false, code: ORDER_NOT_CANCELLABLE, message: 賣家已存書，無法取消訂單；如有問題請申請爭議 }
                爭議處理中:
                  value: { success: false, message: 此訂單爭議處理中，無法自行取消，請等候客服裁決 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 訂單正於書櫃辦理中，或在處理期間被其他請求變更。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                書櫃辦理中:
                  value: { success: false, code: ORDER_IN_CABINET_SESSION, message: 此訂單正於書櫃辦理中，請稍後再試 }
                狀態已變更:
                  value: { success: false, message: 訂單狀態已變更，請重新整理後再試 }
        '500': { $ref: '#/components/responses/ServerError' }
