tags:
  - name: orders
    x-displayName: 訂單
    description: |
      結帳、查詢與訂單狀態流轉。

      結帳時即自買家錢包扣款，賣方款項於訂單狀態轉為 `completed` 後始行入帳，
      期間於賣家端顯示為待定收益（`GET /api/wallet/pending`）。

      購物車涵蓋多位賣家時，結帳會依賣家拆分為多筆訂單，
      因此 `POST /api/orders/checkout` 的回應為陣列。

paths:
  /api/orders:
    get:
      summary: 取得訂單列表
      operationId: listOrders
      tags: [orders]
      description: |
        購買紀錄與銷售紀錄共用此端點，以 `role` 參數切換。

        `tab` 對應用戶端的頁籤，伺服器會將其展開為一組訂單狀態。
        買賣雙方的頁籤定義不同：

        **買家（`role=buyer`）**

        | `tab` | 對應狀態 |
        | --- | --- |
        | `pending_pickup` | `pending_payment`, `pending_deposit`, `deposited`, `pending_pickup` |
        | `completed` | `completed` |
        | `cancelled` | `cancelled`, `refunded` |
        | `disputing` | `refunding` |

        **賣家（`role=seller`）**

        | `tab` | 對應狀態 |
        | --- | --- |
        | `pending_deposit` | `pending_payment`, `pending_deposit` |
        | `on_sale` | `deposited`, `pending_pickup` |
        | `completed` | `completed` |
        | `cancelled` | `cancelled`, `refunded` |

        未帶入 `tab` 時不套用狀態條件。帶入未定義的 `tab` 將回傳 400。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [buyer, seller], default: buyer }
          description: 查詢身分。非 `seller` 的值一律視為 `buyer`。
        - in: query
          name: tab
          schema: { type: string }
          description: 頁籤名稱，可用值依 `role` 而異，詳見上表。
          example: pending_pickup
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400':
          description: "`tab` 未定義於該角色的頁籤清單。"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: '不支援的 tab：foo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/checkout:
    post:
      summary: 結帳
      operationId: checkout
      tags: [orders]
      description: |
        將購物車轉換為訂單。整個流程封裝於單一資料庫交易，任一步驟失敗即全部回滾。

        執行步驟：

        1. 取出購物車項目；帶入 `cart_ids` 時僅取指定項目
        2. 確認每本書籍狀態為 `on_sale` 且售價大於 0
        3. 確認買家代幣餘額足夠；交易內會再次檢查，以防併發請求重複扣款
        4. 依賣家分組，各建立一筆訂單，產生訂單編號與六位數取貨碼
        5. 自買家錢包扣款並寫入一筆 `purchase` 交易紀錄
        6. 將書籍狀態更新為 `reserved`
        7. 發送存書通知予賣家
        8. 移除已結帳的購物車項目

        因跨賣家會拆分訂單，回應為訂單陣列。

        ## Payment Verification

        需 `payment` 範圍的身分驗證：先以交易密碼或生物辨識呼叫 `POST /api/security/verify`，
        再將取得的 `verify_token` 帶入 `X-Verify-Token` 標頭。該 token 僅能使用一次；
        結帳失敗（回應狀態碼大於等於 400）時 token 恢復可用，可直接重試。
        使用者尚未設定交易密碼時，驗證端點回傳 403 `PAYMENT_PIN_NOT_SET`，App 應先引導設定。

        購物車中有書籍已由其他買家預約保留時，回傳 409 `BOOK_RESERVED`。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cart_ids:
                  type: array
                  items: { type: integer }
                  description: 欲結帳的購物車項目編號。未帶入或帶入空陣列時結帳全部項目。
                  example: [55, 56]
                payment_method:
                  type: string
                  enum: [wallet, bank_transfer]
                  default: wallet
                  description: 目前扣款一律以站內代幣執行，此欄位僅供記錄。
            example: { cart_ids: [55, 56], payment_method: wallet }
      responses:
        '201':
          description: 結帳成功，回傳建立的訂單，筆數可能大於 1。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 結帳成功 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400':
          description: 無法完成結帳。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                購物車是空的:
                  value: { success: false, message: 購物車沒有可結帳的項目 }
                書已被買走:
                  value: { success: false, message: 《挪威的森林》已無法購買，請先移除 }
                售價異常:
                  value: { success: false, message: 《挪威的森林》的售價異常，請聯絡賣家或先移除 }
                代幣不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣不足，這筆訂單需要 540 代幣，目前只有 200 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '409': { $ref: '#/components/responses/BookReserved' }
        '500':
          description: 結帳過程發生錯誤，交易已回滾，代幣不會遭扣除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 結帳失敗，請稍後再試 }

  /api/orders/{id}:
    get:
      summary: 取得訂單詳情
      operationId: getOrder
      tags: [orders]
      description: |
        僅該訂單的買家、賣家或管理員可查詢。
        回應包含取貨碼、書櫃、櫃位與爭議狀態。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}/status:
    patch:
      summary: 更新訂單狀態
      operationId: updateOrderStatus
      tags: [orders]
      description: |
        推進訂單流程。每個目標狀態限定由誰呼叫、從哪個狀態出發，管理員不受身分限制：

        | 目標狀態 | 呼叫者 | 目前狀態須為 |
        | --- | --- | --- |
        | `deposited` | 賣家 | `pending_payment`、`pending_deposit` |
        | `pending_pickup` | 賣家 | `deposited` |
        | `completed` | 買家 | `deposited`、`pending_pickup` |

        更新以「狀態仍為讀取時的值」為條件，兩個請求同時送出時只有一個會成功，
        另一個回傳 409，賣家不會重複入帳。
        取消訂單請使用 `PATCH /api/orders/{id}/cancel`。

        狀態設為 `completed` 時，於同一交易內執行下列動作：

        - 將書籍狀態更新為 `sold`
        - 將訂單金額匯入賣家錢包並累加 `total_income`
        - 寫入一筆 `sale_income` 錢包交易紀錄
        - 補寫 `picked_up_at`（若尚未寫入）與 `completed_at`
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [deposited, pending_pickup, completed]
                  description: '`deposited` 賣家已存書、`pending_pickup` 等待取件、`completed` 交易完成。'
            example: { status: completed }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訂單狀態已更新 }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: 狀態值未列於允許清單，或目前狀態不能推進到目標狀態。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                狀態值錯誤:
                  value: { success: false, message: 'status 僅接受：deposited, pending_pickup, completed' }
                尚未存書:
                  value: { success: false, message: 賣家還沒把書放進書櫃，無法完成取貨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 呼叫者不是該步驟的執行方（例如賣家嘗試設為 completed）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 只有買家可以確認取貨 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 訂單已是目標狀態，或在處理期間被其他請求變更。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 訂單狀態已經變更，請重新整理後再試 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}/cancel:
    patch:
      summary: 取消訂單
      operationId: cancelOrder
      tags: [orders]
      description: |
        買賣雙方皆可取消。狀態已為 `completed`、`cancelled` 或 `refunded`
        的訂單不得取消；爭議處理中（`refunding`）的訂單僅管理員可取消。
        同時送出的取消請求只有一個會成功，其餘回傳 409，不會重複退款。

        取消時於同一交易內執行下列動作：

        - 將訂單狀態更新為 `cancelled`，並記錄時間與原因
        - 將保留中的書籍改回 `on_sale`，重新開放購買
        - 依錢包帳本退回買家實際支付的代幣，寫入一筆 `refund` 交易紀錄並發送通知
        - 通知交易對象訂單已取消
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 取消原因，將寫入訂單並包含於發送給交易對象的通知中。
                  example: 臨時不需要了
      responses:
        '200':
          description: 已取消。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訂單已取消 }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: 目前狀態不允許取消。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此訂單狀態無法取消 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
