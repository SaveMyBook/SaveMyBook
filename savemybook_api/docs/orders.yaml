tags:
  - name: orders
    x-displayName: 訂單
    description: |
      結帳、查詢與訂單狀態流轉。

      結帳時即自買家錢包扣款，款項由平台保管；買家取書後點選「完成訂單」（`completed`），
      或取書滿 24 小時未提出申訴由排程自動完成，款項才撥入賣家錢包，期間於賣家端顯示為待定收益（`GET /api/wallet/pending`）。

      **排程（每 10 分鐘）**

      | 條件 | 處理 |
      | --- | --- |
      | 已取書（`picked_up_at` 有值）滿 24 小時，且狀態仍為 `deposited`／`pending_pickup` | 自動完成並撥款，通知買賣雙方 |
      | `pending_payment`／`pending_deposit` 且訂單成立滿 7 天 | 自動取消、全額退款，書籍改為下架（`removed`），通知雙方；下單前已存書的書恢復存書登記，通知賣家取回並於 App 中回報 |
      | `deposited`／`pending_pickup` 未取書且存書滿 7 天 | 自動取消、全額退款，書籍改為下架，通知賣家至書櫃取回書籍；訂單的每本書都恢復存書登記，須於 App 中回報取回 |

      爭議處理中（`refunding`）的訂單不受排程影響。

      賣家可在訂單成立前先將書存入書櫃（`POST /api/books/{id}/deposit`）。訂單中每本書都已存於該訂單的書櫃時，
      訂單直接成立為 `deposited`，`deposited_at` 為下單時間，買家取書期限自下單起算 7 天，且買賣雙方即無法自行取消，
      如有問題須提出交易申訴；其餘訂單照常以 `pending_deposit` 成立，由賣家存書後回報。
      訂單項目的 `pre_deposited` 標示下單時已在櫃中的書。訂單在買家取書前取消或退款時，仍在櫃中的書恢復存書登記
      （存書時間自取消時重新起算），逾期提醒與後台存書列表照常追蹤：訂單已存書（`deposited`、`pending_pickup`，
      申訴中則為已有 `deposited_at`）時訂單的每本書都恢復登記於訂單書櫃，書籍的書櫃一併改為訂單書櫃；
      尚未存書時僅 `pre_deposited` 的書恢復登記。訂單原為爭議處理中（`refunding`）時，因無法確認書是否仍在櫃中，
      恢復登記的書改為下架，待賣家取回並回報後自行重新上架。已取消或已退款的訂單再調整狀態時不再恢復存書登記。

      購物車涵蓋多位賣家時，結帳會依賣家拆分為多筆訂單，
      因此 `POST /api/orders/checkout` 的回應為陣列。

paths:
  /api/orders:
    get:
      summary: 取得訂單列表
      operationId: listOrders
      tags: [orders]
      description: |
        購買紀錄與銷售紀錄共用此端點，以 `role` 參數切換。

        `tab` 對應用戶端的頁籤，伺服器會將其展開為查詢條件。「待確認」指已取書（`picked_up_at` 有值）、
        狀態仍為 `deposited` 或 `pending_pickup` 的訂單。買賣雙方的頁籤定義不同：

        **買家（`role=buyer`）**

        | `tab` | 條件 |
        | --- | --- |
        | `pending_pickup` | `pending_payment`, `pending_deposit`, `deposited`, `pending_pickup`，且尚未取書 |
        | `completed` | `completed`，以及待確認的訂單 |
        | `cancelled` | `cancelled`, `refunded` |
        | `disputing` | `refunding` |

        **賣家（`role=seller`）**

        | `tab` | 條件 |
        | --- | --- |
        | `pending_deposit` | `pending_payment`, `pending_deposit` |
        | `deposited` | `deposited`, `pending_pickup`（含待確認） |
        | `on_sale` | 同 `deposited`，保留給舊版 App |
        | `completed` | `completed` |
        | `cancelled` | `cancelled`, `refunded` |

        未帶入 `tab` 時不套用狀態條件。帶入未定義的 `tab` 將回傳 400。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [buyer, seller], default: buyer }
          description: 查詢身分。非 `seller` 的值一律視為 `buyer`。
        - in: query
          name: tab
          schema: { type: string }
          description: 頁籤名稱，可用值依 `role` 而異，詳見上表。
          example: pending_pickup
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400':
          description: "`tab` 未定義於該角色的頁籤清單。"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: '不支援的 tab：foo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/checkout:
    post:
      summary: 結帳
      operationId: checkout
      tags: [orders]
      description: |
        將購物車轉換為訂單。整個流程封裝於單一資料庫交易，任一步驟失敗即全部回滾。

        執行步驟：

        1. 取出購物車項目；帶入 `cart_ids` 時僅取指定項目
        2. 確認每本書籍狀態為 `on_sale` 且售價大於 0
        3. 確認買家代幣餘額足夠；交易內會再次檢查，以防併發請求重複扣款
        4. 依賣家分組，將書籍狀態更新為 `reserved`
        5. 移除這些書的存書登記並以 `pre_deposited` 標示；該組每本書都已存於訂單書櫃時，訂單直接成立為 `deposited`（`deposited_at` 為下單時間），否則為 `pending_deposit`
        6. 建立訂單並產生訂單編號，自買家錢包扣款並寫入一筆 `purchase` 交易紀錄
        7. 通知賣家訂單成立：`pending_deposit` 請賣家於七天內存書（部分書已在櫃中時請存入其餘書籍，存於其他書櫃時請移至訂單書櫃）；`deposited` 不需再存書，並通知買家即可前往書櫃取書
        8. 移除已結帳的購物車項目

        因跨賣家會拆分訂單，回應為訂單陣列。

        成立即為 `deposited` 的訂單（書已預先存入書櫃）買家無法自行取消，App 應於結帳前提示；如有問題須提出交易申訴。

        ## Payment Verification

        需 `payment` 範圍的身分驗證：先以交易密碼或生物辨識呼叫 `POST /api/security/verify`，
        再將取得的 `verify_token` 帶入 `X-Verify-Token` 標頭。該 token 僅能使用一次；
        結帳失敗（回應狀態碼大於等於 400）時 token 恢復可用，可直接重試。
        使用者尚未設定交易密碼時，驗證端點回傳 403 `PAYMENT_PIN_NOT_SET`，App 應先引導設定。

        購物車中有書籍已由其他買家預約保留時，回傳 409 `BOOK_RESERVED`。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cart_ids:
                  type: array
                  items: { type: integer }
                  description: 欲結帳的購物車項目編號。未帶入或帶入空陣列時結帳全部項目。
                  example: [55, 56]
            example: { cart_ids: [55, 56] }
      responses:
        '201':
          description: 結帳成功，回傳建立的訂單，筆數可能大於 1。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 結帳成功 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400':
          description: 無法完成結帳。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                購物車是空的:
                  value: { success: false, message: 購物車沒有可結帳的項目 }
                書已被買走:
                  value: { success: false, message: 《挪威的森林》已無法購買，請先移除 }
                售價異常:
                  value: { success: false, message: 《挪威的森林》的售價異常，請聯絡賣家或先移除 }
                代幣不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣不足，這筆訂單需要 540 代幣，目前只有 200 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '409': { $ref: '#/components/responses/BookReserved' }
        '500':
          description: 結帳過程發生錯誤，交易已回滾，代幣不會遭扣除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 結帳失敗，請稍後再試 }

  /api/orders/buy-now:
    post:
      summary: 直接購買單本書
      operationId: buyNow
      tags: [orders]
      description: |
        不經購物車直接購買一本書，檢查項目、扣款、書籍狀態、訂單初始狀態（書已存入書櫃時為 `deposited`，買家即無法自行取消）與通知皆與 `POST /api/orders/checkout` 相同；
        該書若也在請求者的購物車中會一併移除。需 `payment` 範圍的身分驗證（方式同結帳）。

        書籍不存在或未公開回傳 404；已被買走、為自己上架的書或售價異常回傳 400；
        代幣不足回傳 400 `INSUFFICIENT_BALANCE`；由其他買家預約保留中回傳 409 `BOOK_RESERVED`；
        同時有人結帳同一本書時，其中一方回傳 409。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer, example: 101 }
      responses:
        '201':
          description: 購買成功，回傳建立的訂單。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 購買成功 }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: 無法購買。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已被買走:
                  value: { success: false, message: 《挪威的森林》已無法購買 }
                代幣不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣不足，此訂單需 180 代幣，目前餘額 50 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/VerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BookReserved' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}:
    get:
      summary: 取得訂單詳情
      operationId: getOrder
      tags: [orders]
      description: |
        僅該訂單的買家、賣家或管理員可查詢。
        回應包含書櫃、櫃位與爭議狀態。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}/status:
    patch:
      summary: 更新訂單狀態
      operationId: updateOrderStatus
      tags: [orders]
      description: |
        推進訂單流程。每個目標狀態限定由誰呼叫、從哪個狀態出發，管理員不受身分限制：

        | 目標狀態 | 呼叫者 | 目前狀態須為 |
        | --- | --- | --- |
        | `deposited` | 賣家 | `pending_payment`、`pending_deposit` |
        | `pending_pickup` | 賣家 | `deposited` |
        | `picked_up` | 買家 | `deposited`、`pending_pickup`，且尚未取書 |
        | `completed` | 買家 | `deposited`、`pending_pickup`，且已取書 |

        更新以「狀態仍為讀取時的值」為條件，兩個請求同時送出時只有一個會成功，
        另一個回傳 409，賣家不會重複入帳。
        取消訂單請使用 `PATCH /api/orders/{id}/cancel`。

        **書櫃掃碼存取**：書櫃已配對裝置時，`deposited`、`picked_up`（以及尚未取書時的 `completed`）須至書櫃以 App 掃描 QR Code 辦理（見「書櫃作業」），
        一般使用者呼叫本端點回 409 `CABINET_SCAN_REQUIRED`；已配對裝置的書櫃停用或維修中時回 409 `CABINET_UNAVAILABLE`、`CABINET_MAINTENANCE`。
        裝置離線或故障持續 2 分鐘以上，或書櫃曾配對裝置而目前沒有有效裝置時，本端點改為建立待客服確認的手動回報，
        回 202 並附 `manual_report`，管理員確認後才生效；同一項目已有待確認的回報時回 409 `MANUAL_REPORT_PENDING`。
        具書櫃管理權限、且不是當事人的管理員不受上述限制。從未配對裝置的書櫃維持原有行為。

        `picked_up` 只寫入 `picked_up_at`，訂單狀態維持不變、不撥款，並通知賣家。
        尚未取書時送出 `completed`（舊版 App 的行為）一律視為 `picked_up`。

        狀態設為 `completed` 時，於同一交易內執行下列動作：

        - 將書籍狀態更新為 `sold`
        - 將訂單金額匯入賣家錢包並累加 `total_income`
        - 寫入一筆 `sale_income` 錢包交易紀錄
        - 寫入 `completed_at`，通知賣家

        完成後不再受理交易申訴。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [deposited, pending_pickup, picked_up, completed]
                  description: '`deposited` 賣家已存書、`pending_pickup` 等待取件、`picked_up` 買家已取書、`completed` 完成訂單並撥款。'
            example: { status: completed }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訂單狀態已更新 }
                  data: { $ref: '#/components/schemas/Order' }
        '202':
          description: 已送出待客服確認的手動回報，狀態尚未變更。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已送出手動回報，待客服確認後生效 }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                      - type: object
                        properties:
                          manual_report: { $ref: '#/components/schemas/CabinetManualReport' }
        '400':
          description: 狀態值未列於允許清單，或目前狀態不能推進到目標狀態。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                狀態值錯誤:
                  value: { success: false, message: 訂單狀態不正確 }
                尚未存書:
                  value: { success: false, message: 賣家還沒把書放進書櫃，無法完成取貨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 呼叫者不是該步驟的執行方（例如賣家嘗試設為 completed）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 只有買家可以確認取貨 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 訂單已是目標狀態、在處理期間被其他請求變更，或書櫃須掃碼辦理。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                狀態已變更:
                  value: { success: false, message: 訂單狀態已經變更，請重新整理後再試 }
                須掃碼辦理:
                  value: { success: false, code: CABINET_SCAN_REQUIRED, message: 此書櫃已啟用掃碼存取，請至書櫃以 App 掃描 QR Code 辦理, cabinet_id: 3 }
                已有待確認回報:
                  value: { success: false, code: MANUAL_REPORT_PENDING, message: 此項目已有待客服確認的手動回報 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/orders/{id}/cancel:
    patch:
      summary: 取消訂單
      operationId: cancelOrder
      tags: [orders]
      description: |
        賣家存書前（`pending_payment`、`pending_deposit`）買賣雙方皆可取消；存書後雙方都不能自行取消，
        回傳 400 `ORDER_NOT_CANCELLABLE`，須改提交易申訴。書已預先存入書櫃的訂單成立即為 `deposited`，
        因此自下單起即無法自行取消。狀態已為 `completed`、`cancelled` 或 `refunded`
        的訂單不得取消；爭議處理中（`refunding`）的訂單僅管理員可取消。
        同時送出的取消請求只有一個會成功，其餘回傳 409，不會重複退款。

        取消時於同一交易內執行下列動作：

        - 將訂單狀態更新為 `cancelled`，並記錄時間與原因
        - 將保留中的書籍改回 `on_sale`，重新開放購買
        - 仍在櫃中的書恢復存書登記（買家可再下單直接取書）：管理員取消已存書的訂單時為訂單的每本書，
          其餘為 `pre_deposited` 的書；爭議處理中的訂單由管理員取消時，恢復登記的書改為下架
        - 依錢包帳本退回買家實際支付的代幣，寫入一筆 `refund` 交易紀錄並發送通知
        - 通知交易對象訂單已取消；管理員取消時通知買家。有書恢復存書登記時（買家或管理員取消）一併通知賣家書籍維持存書登記，
          書籍公開販售中者告知可繼續販售，未公開販售者請賣家至書櫃取回並於 App 中回報
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 40
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 取消原因，將寫入訂單並包含於發送給交易對象的通知中。
                  example: 臨時不需要了
      responses:
        '200':
          description: 已取消。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訂單已取消 }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: 目前狀態不允許取消。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已結束:
                  value: { success: false, message: 此訂單狀態無法取消 }
                已存書:
                  value: { success: false, code: ORDER_NOT_CANCELLABLE, message: 賣家已存書，無法取消訂單；如有問題請提出申訴 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
