tags:
  - name: books
    x-displayName: 書籍
    description: |
      二手書的上架、查詢、編輯與照片管理。

      上架時包含三張固定照片：封面（`cover_image`）、封底（`back_image`）、
      條碼（`barcode_image`），另可附加最多 7 張選填照片（`optional_images`）。

      檢舉成立時，管理員會將 `is_approved` 設為 false 並下架該書籍。
      此狀態下賣家無法自行將狀態改回 `on_sale`，將收到 403 `BOOK_NOT_APPROVED`。

paths:
  /api/books:
    get:
      summary: 查詢書籍列表
      operationId: listBooks
      tags: [books]
      description: |
        首頁、搜尋與賣家書籍管理共用此端點，差異僅在 query 參數。無須登入。

        兩項須留意的行為：

        1. `status` 預設為 `on_sale`。查詢全部狀態時須明確帶入 `status=all`。
        2. 帶入 `seller_id` 時不套用 `is_approved` 條件，賣家方能查得自身
           待審核或已下架的書籍；未帶入時僅回傳 `is_approved` 為 true 的書籍。

        ## Popular Ranking

        `sort=popular` 且未帶入 `seller_id` 時，依推薦分數排序（帶入 `seller_id` 時改為瀏覽數遞減）。
        候選範圍為符合其他查詢條件、最新上架的至多 2000 本書，`pagination.total` 以此為上限。

        分數由下列訊號相乘組成：

        | 項目 | 內容 |
        | --- | --- |
        | 互動熱度 | 瀏覽數（取對數）、近 7 天收藏數、總收藏數、加入購物車數、聊天詢問數 |
        | 刊登品質 | 照片 3 張以上加分、沒有照片扣分；書況 `like_new`、`good` 加分 |
        | 新鮮度 | 隨上架天數遞減，約兩週後明顯下降 |
        | 分類需求 | 該分類近 30 天的成交數 |
        | 個人偏好 | 帶入 Bearer Token 時，依請求者收藏、購買、購物車中的分類比重加權 |

        排序後再做賣家分散：任意連續 10 本中同一賣家至多 2 本，超出的書往後遞延。
        帶入 Bearer Token 時排除請求者自己上架的書。本端點不要求登入，Token 無效時視同未登入。

        排序結果依查詢條件與請求者快取 60 秒，期間翻頁的順序保持一致。
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: keyword
          schema: { type: string }
          description: 關鍵字，同時對書名、作者、出版社進行模糊比對。
          example: 村上春樹
        - in: query
          name: status
          schema:
            type: string
            enum: [on_sale, reserved, sold, removed, all]
            default: on_sale
          description: 書籍狀態。帶入 `all` 代表不套用狀態條件。
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular]
            default: newest
          description: '`newest` 依上架時間遞減、`price_asc` 價格遞增、`price_desc` 價格遞減、`popular` 依推薦分數排序（見上方說明）。'
        - in: query
          name: seller_id
          schema: { type: integer }
          description: 限定賣家。帶入此參數時不套用審核狀態條件。
          example: 12
        - in: query
          name: category_ids
          schema: { type: string }
          description: 分類編號，多筆以半形逗號分隔。
          example: 3,5,8
      responses:
        '200':
          description: 成功。`pagination` 位於回應最外層。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 上架書籍
      operationId: createBook
      tags: [books]
      description: |
        以 `multipart/form-data` 上傳，文字欄位與照片一併送出。
        建立完成後書籍狀態為 `on_sale`。

        售價須大於 0 且不超過 99999，否則回傳 400。結帳流程另有一道相同檢查，
        以攔截既有資料中售價為 0 的書籍。

        照片欄位與 `book_images.image_type` 的對應關係：

        | 表單欄位 | 張數 | `image_type` |
        | --- | --- | --- |
        | `cover_image` | 1 | `cover` |
        | `back_image` | 1 | `back` |
        | `barcode_image` | 1 | `other` |
        | `optional_images` | 最多 7 | `inside` |
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, price]
              properties:
                title: { type: string, maxLength: 255, example: 挪威的森林 }
                price:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 99999
                  description: 售價，單位為代幣。須大於 0。
                  example: 180
                author: { type: string, example: 村上春樹 }
                publisher: { type: string, example: 時報出版 }
                publish_date:
                  type: string
                  description: 字串欄位。結尾多餘的連字號將被移除，亦可僅填年份。
                  example: '2003-08-01'
                isbn: { type: string, maxLength: 13, example: '9789573317249' }
                category_id: { type: integer, example: 3 }
                condition_level:
                  type: string
                  enum: [like_new, good, fair, poor]
                  default: good
                cabinet_id: { type: integer, description: 指定的取貨書櫃編號, example: 2 }
                description: { type: string, example: 只翻過一次，內頁乾淨 }
                cover_image: { type: string, format: binary, description: 封面照片 }
                back_image: { type: string, format: binary, description: 封底照片 }
                barcode_image: { type: string, format: binary, description: 條碼照片 }
                optional_images:
                  type: array
                  items: { type: string, format: binary }
                  description: 選填照片，上限 7 張。
      responses:
        '201':
          description: 上架成功。`data` 僅含書籍本體，不包含照片。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 書籍上架成功 }
                  data: { $ref: '#/components/schemas/Book' }
        '400':
          description: 欄位缺漏，或售價不符合限制。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少欄位:
                  value: { success: false, message: '缺少必要欄位：書名(title) 或 價格(price)' }
                售價為零:
                  value: { success: false, message: 售價必須大於 0 元 }
                售價過高:
                  value: { success: false, message: 售價不可超過 99999 元 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/share-link:
    get:
      summary: 取得書籍分享連結
      operationId: getBookShareLink
      tags: [books]
      description: |
        回傳可在瀏覽器直接開啟的公開網址，形如 `https://<host>/b/<token>`。

        `token` 為 16 位元組的密碼學亂數（`crypto.randomBytes`）轉成 32 個十六進位字元，
        首次索取時產生並寫回該書，之後固定不變——同一本書重複索取會拿到同一個連結。
        舊版的 `savemybook://book/<流水號>` 只能在裝了 App 的裝置上開啟，
        而且流水號可被從 1 開始枚舉，已不再使用。

        公開頁見 `GET /b/{token}`。不需登入。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url: { type: string, example: 'https://api.savemybook.today/b/3f5a1c9e7b2d4086a1c3e5f7b9d0246a' }
                      title: { type: string, example: 演算法圖鑑 }
        '400':
          description: 書籍編號不是數字。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 書籍編號不正確 }
        '404':
          description: 找不到這本書。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到這本書 }
        '409':
          description: |
            書籍已下架。公開頁不會顯示下架的書，發出去的連結只會得到 404，
            因此直接拒絕產生。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 這本書已下架，無法分享 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 書籍編號。
        example: 101

    get:
      summary: 取得書籍詳情
      operationId: getBook
      tags: [books]
      description: |
        回傳單一書籍的完整資料，包含全部照片、賣家資訊與取貨書櫃。無須登入；
        帶入 Bearer Token 時可辨識請求者，用於瀏覽數計算與 `reservation.reserved_for_me`。

        呼叫時將 `view_count` 遞增 1，但同一位瀏覽者（已登入以使用者、未登入以 IP 區分）
        每小時僅計一次，賣家瀏覽自己的書不計入。該累加以非同步方式執行，
        不阻塞回應，因此回傳的 `view_count` 為遞增前的數值。

        書籍正由買家透過聊天室預約保留時，`reservation` 帶保留期限；否則為 null。
      security: []
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Book'
                      - type: object
                        properties:
                          reservation:
                            type: object
                            nullable: true
                            description: 保留中的預約。其他使用者在期限內加入購物車或結帳會收到 409 `BOOK_RESERVED`。
                            properties:
                              reserved_until: { type: string, format: date-time, description: 保留期限 }
                              reserved_for_me: { type: boolean, description: 是否保留給請求者本人, example: false }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      summary: 編輯書籍
      operationId: updateBook
      tags: [books]
      description: |
        僅能異動自身上架的書籍，管理員不受此限。採部分更新，僅須帶入欲異動的欄位。

        書籍若因檢舉成立而下架（`is_approved` 為 false），將 `status` 改為
        `on_sale` 的請求會被拒絕，回傳 403 並帶 `code: BOOK_NOT_APPROVED`，
        僅管理員可解除該限制。

        照片不透過此端點處理，請使用 `POST /api/books/{id}/images` 與
        `DELETE /api/books/{id}/images/{imageId}`。

        調降售價且書籍狀態為 `on_sale` 時，伺服器以 `promotion` 類型的站內通知告知收藏此書的使用者
        （賣家本人除外），通知的 `related_type` 為 `book`。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                author: { type: string }
                publisher: { type: string }
                publish_date: { type: string }
                isbn: { type: string }
                category_id: { type: integer }
                price: { type: number, minimum: 0.01, maximum: 99999 }
                quantity: { type: integer }
                condition_level: { type: string, enum: [like_new, good, fair, poor] }
                condition_note: { type: string }
                description: { type: string }
                cabinet_id: { type: integer }
                status: { type: string, enum: [on_sale, reserved, sold, removed] }
            example: { price: 160, description: 降價出清, status: on_sale }
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 書籍資料更新成功 }
                  data: { $ref: '#/components/schemas/Book' }
        '400':
          description: 售價不符合限制。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 售價必須大於 0 元 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非本人上架的書籍，或嘗試重新上架違規書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                他人的書:
                  value: { success: false, message: 存取被拒，您無權限修改他人的商品 }
                違規下架:
                  value: { success: false, code: BOOK_NOT_APPROVED, message: 這本書因違規被下架，無法自行重新上架，請聯絡客服 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 下架書籍
      operationId: deleteBook
      tags: [books]
      description: |
        軟刪除：僅將 `status` 改為 `removed`，資料與照片均予保留，
        以維持已成立訂單的關聯完整性。後續可再改回 `on_sale`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已下架。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 書籍已成功下架 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非本人上架的書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 存取被拒，您無權限刪除他人的書籍 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/images:
    post:
      summary: 為書籍加照片
      operationId: addBookImages
      tags: [books]
      description: |
        單次上限 8 張，`image_type` 一律儲存為 `other`。
        回應包含該書籍的全部照片，含既有照片。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 101
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 8
                image_types:
                  type: string
                  description: 以逗號分隔、與 images 順序對應的照片類型（cover、back、inside、other），缺少或不合法的位置視為 other。
                  example: cover,inside
      responses:
        '201':
          description: 新增成功，回傳該書籍的全部照片。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 圖片已新增 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookImage' }
        '400':
          description: 未帶入檔案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請選擇要上傳的圖片 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/images/{imageId}:
    delete:
      summary: 刪除書籍照片
      operationId: deleteBookImage
      tags: [books]
      description: |
        刪除資料列，實體檔案保留於磁碟。

        `imageId` 須隸屬於路徑指定的書籍，否則回傳 404，
        以避免跨書籍誤刪照片。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 書籍編號。
          example: 101
        - in: path
          name: imageId
          required: true
          schema: { type: integer }
          description: 照片編號，取自 `book_images[].image_id`。
          example: 88
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 圖片已刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 書籍不存在，或該照片不隸屬於此書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到該圖片 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/isbn/{isbn}:
    get:
      summary: 用 ISBN 查外部書籍資料
      operationId: lookupIsbn
      tags: [books]
      description: |
        代理查詢 Google Books API，供上架流程自動帶入書名、作者等欄位。

        此端點不寫入資料庫。伺服器若已設定 `GOOGLE_BOOKS_API_KEY`，查詢時會一併帶入。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: isbn
          required: true
          schema: { type: string }
          description: 10 碼或 13 碼 ISBN。
          example: '9789573317249'
      responses:
        '200':
          description: 查詢成功。外部書庫未提供的欄位回傳空字串，而非 null。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      title: { type: string, example: 挪威的森林 }
                      author: { type: string, description: 多位作者以半形逗號串接。, example: 村上春樹 }
                      publisher: { type: string, example: 時報出版 }
                      publish_date: { type: string, example: '2003-08-01' }
                      description: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 外部書庫查無此 ISBN 的資料。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 外部書庫找不到此 ISBN 的書籍資訊 }
        '500':
          description: 外部 API 連線失敗。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 查詢外部書籍資訊發生錯誤 }
