tags:
  - name: books
    x-displayName: 書籍
    description: |
      二手書的上架、查詢、編輯與照片管理。

      上架時包含三張固定照片：封面（`cover_image`）、封底（`back_image`）、
      條碼（`barcode_image`），另可附加最多 7 張選填照片（`optional_images`）。

      檢舉成立並勾選下架時，管理員會將 `is_approved` 設為 false 並下架該書籍。
      書籍 `is_approved` 為 false，或有任一檢舉審核結果為 `resolved`（違規成立）時，
      賣家無法自行將狀態改回 `on_sale`，將收到 403 `BOOK_NOT_APPROVED`。

      書籍經審核下架（檢舉成立並下架、管理員強制下架、上架審核拒絕）時，進行中的預約一律取消，
      買家尚未取書的訂單自動取消並全額退款，詳見 `PATCH /api/admin/books/{id}` 與「訂單」說明。

      書籍由無法購買轉為販售中且公開（賣家重新上架、管理員恢復上架、逾期暫停販售的存書取回後自動恢復上架、上架審核核准）時，
      以站內通知「收藏的書籍已可購買」告知收藏此書的會員（賣家本人除外，`related_type` 為 `book`）；
      書籍仍有他人保留中的預約時不通知。書櫃作業或手動回報期間暫時停售後恢復者不通知。

      ## Pre-order Deposit

      書籍上架後，賣家不必等訂單成立即可將書存入該書指定的書櫃。存入與取回都在書櫃前以 App 掃描 QR Code 辦理（見「書櫃作業」）；
      書櫃無法掃碼時（沒有有效裝置，或裝置離線、故障持續 2 分鐘以上），才以 `POST /api/books/{id}/deposit`、`POST /api/books/{id}/retrieve`
      送出待客服確認的手動回報，管理員確認後生效。每位賣家在同一台書櫃最多 1 本先行存書。

      | 階段 | 處理 |
      | --- | --- |
      | 存書期間有人下單 | 訂單中每本書都已存於該訂單的書櫃（且書櫃啟用中）時，訂單直接成立為 `deposited`，買家即可取書，取書期限自下單起算 7 天，雙方即無法自行取消；其餘情況維持 `pending_deposit`，請賣家至書櫃以 App 掃描 QR Code 存入其餘書籍。結帳依賣家與書籍指定的書櫃拆單，訂單書櫃即為書籍的書櫃。已存書紀錄都會移除，訂單項目以 `pre_deposited` 標示下單時已在櫃中的書 |
      | 訂單在取書前取消或退款 | 書仍在櫃中者恢復存書登記（存書時間自取消時重新起算），買家可再下單直接取書：訂單已存書（`deposited`、`pending_pickup`，爭議處理中則為已有 `deposited_at`）時訂單的每本書都恢復登記於訂單書櫃，書籍的書櫃一併改為訂單書櫃；尚未存書時僅 `pre_deposited` 的書恢復登記。逾期未存書或未取書自動取消時書籍改為下架；訂單原為爭議處理中（`refunding`）時恢復登記的書改為下架；兩者賣家皆須至書櫃以 App 掃描 QR Code 取回 |
      | 存書滿 7 天仍未售出 | 上架中的書改為 `removed`（暫停販售），通知賣家至書櫃取回；賣家自行下架的書只通知取回。聊天室預約保留中的書待保留結束後才暫停 |
      | 暫停後每 3 天 | 再次提醒賣家取回 |
      | 存書滿 14 天仍未取回 | 通知具書櫃管理權限的管理員（僅一次），由人員取出後於後台登記 |

      書櫃維修中時不暫停販售、不提醒取回、不通知管理員（維修結束後仍逾期者於下次排程通知），`in_cabinet` 為 false（維修中無法購買）；有存書的書櫃無法停用。

      存書期間的限制：

      - 不可變更書櫃（`cabinet_id`），回傳 409 `BOOK_DEPOSITED`；管理員也無法刪除書籍
      - 賣家可自行下架（`DELETE /api/books/{id}`），存書紀錄保留，逾期提醒照常進行
      - 書仍登記存放於書櫃時，賣家須先至書櫃以 App 掃描 QR Code 取回才能重新上架（書櫃無法掃碼時改以手動回報，經客服確認後生效），
        否則回傳 409 `RETRIEVAL_REQUIRED`（不論是否已滿 7 天）。
        取回後，因逾期而由系統暫停販售的書自動恢復上架（等待 AI 審核中的書恢復為上架中，審核通過後公開）；
        因違規、檢舉成立、管理員下架或賣家自行下架的書維持下架，需自行重新上架
      - 管理員恢復上架（變更書籍狀態、編輯書籍、核准先前駁回的 AI 審核，或還原下架操作）已逾期的存書時，存書天數自恢復上架時重新起算，不再提醒賣家取回；
        管理員下架（含還原上架操作）後，取回時不會自動恢復上架
      - 賣家申請刪除帳號前須先取回，否則回傳 400 `BOOKS_IN_CABINET`

      書籍列表與詳情（含推薦、相似書籍、分享連結）、購物車與收藏清單的書籍物件附 `in_cabinet`，
      為 true 表示書已存放於書櫃且可購買，下單後即可取書；
      賣家本人取得的書籍物件另附 `deposit`（存書時間、是否已滿 7 天、已存放天數、櫃門）、`cabinet_access`（指定書櫃的存取方式）、
      `location`（書目前所在的書櫃與櫃門）與 `manual_report`（待客服確認的手動回報）。

paths:
  /api/books:
    get:
      summary: 查詢書籍列表
      operationId: listBooks
      tags: [books]
      description: |
        首頁、搜尋與賣家書籍管理共用此端點，差異僅在 query 參數。無須登入。

        兩項須留意的行為：

        1. `status` 預設為 `on_sale`。查詢全部狀態時須明確帶入 `status=all`。
        2. 帶入的 `seller_id` 為請求者本人（須帶 Bearer Token）時不套用 `is_approved` 條件，
           賣家方能查得自身待審核或已下架的書籍；其餘情況僅回傳 `is_approved` 為 true
           且狀態不為 `removed` 的書籍，帶入 `status=removed` 回傳 400。
           查詢自己的書籍時，預約保留中的書另附 `reservation.reserved_until`，書籍管理據此列入「已預定」；
           每本書另附 `deposit`（未登記存書時為 null）。

        ## Popular Ranking

        `sort=popular` 且未帶入 `seller_id` 時，依推薦分數排序（帶入 `seller_id` 時改為瀏覽數遞減）。
        候選範圍為符合其他查詢條件、最新上架的至多 2000 本書，`pagination.total` 以此為上限。

        分數由下列訊號相乘組成：

        | 項目 | 內容 |
        | --- | --- |
        | 互動熱度 | 瀏覽數（取對數）、近 7 天收藏數、總收藏數、加入購物車數、聊天詢問數 |
        | 刊登品質 | 照片 3 張以上加分、沒有照片扣分；書況 `like_new`、`good` 加分 |
        | 新鮮度 | 隨上架天數遞減，約兩週後明顯下降 |
        | 分類需求 | 該分類近 30 天的成交數 |

        熱門排序不含個人偏好，所有使用者看到的順序一致；依個人偏好挑選的書籍請改用
        `GET /api/books/recommended`。

        排序後再做賣家分散：任意連續 10 本中同一賣家至多 2 本，超出的書往後遞延。
        帶入 Bearer Token 時排除請求者自己上架的書。本端點不要求登入，Token 無效時視同未登入。

        排序結果依查詢條件與請求者快取 60 秒，期間翻頁的順序保持一致。
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: keyword
          schema: { type: string }
          description: |
            關鍵字，同時對書名、作者、出版社進行模糊比對。關鍵字含 ISBN（可含連字號、空白、全形數字或「ISBN」前綴）時，
            另比對 ISBN 欄位（10 碼與 13 碼互通），適用所有排序方式。
          example: 村上春樹
        - in: query
          name: status
          schema:
            type: string
            enum: [on_sale, reserved, sold, removed, all]
            default: on_sale
          description: 書籍狀態。帶入 `all` 代表不套用狀態條件。
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, relevance, price_asc, price_desc, popular]
            default: newest
          description: |
            `newest` 依上架時間遞減、`price_asc` 價格遞增、`price_desc` 價格遞減、`popular` 依推薦分數排序（見上方說明）。
            `relevance` 需搭配 `keyword`、未帶 `seller_id` 且狀態為 `on_sale`：以關鍵字（BM25）與語意向量混合檢索排序，
            再補上書名、作者或出版社字面包含關鍵字的其餘書籍，最多 200 本；AI 關閉或未建立語意索引時只用關鍵字排序。
            關鍵字會送往嵌入服務商（OpenAI 或 Google Gemini）計算語意向量，已揭露於隱私權政策，不以 AI 資料處理同意為前提。
            關鍵字含 ISBN（可含連字號、全形數字或「ISBN」前綴，10 碼與 13 碼互通）時，ISBN 相符的書排在最前面。
            條件不符時同 `newest`。
        - in: query
          name: seller_id
          schema: { type: integer }
          description: 限定賣家。帶入此參數時不套用審核狀態條件。
          example: 12
        - in: query
          name: category_ids
          schema: { type: string }
          description: 分類編號，多筆以半形逗號分隔。
          example: 3,5,8
      responses:
        '200':
          description: 成功。`pagination` 位於回應最外層。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 上架書籍
      operationId: createBook
      tags: [books]
      description: |
        以 `multipart/form-data` 上傳，文字欄位與照片一併送出。
        建立完成後書籍狀態為 `on_sale`。

        售價須大於 0 且不超過 99999，否則回傳 400。結帳流程另有一道相同檢查，
        以攔截既有資料中售價為 0 的書籍。

        二手書一筆商品即一本實體書，數量固定為 1：`quantity` 可省略（視為 1），帶入其他值回傳 400 `QUANTITY_FIXED`。

        照片欄位與 `book_images.image_type` 的對應關係：

        | 表單欄位 | 張數 | `image_type` |
        | --- | --- | --- |
        | `cover_image` | 1 | `cover` |
        | `back_image` | 1 | `back` |
        | `barcode_image` | 1 | `other` |
        | `optional_images` | 最多 7 | `inside` |

        **即時規則審核**：不經 AI、在回應前完成，符合任一條件即送交人工審核（書籍照常建立但 `is_approved` 為 false，
        `review_status` 為 `pending`，回應附帶 `moderation`，並通知賣家與具「商品管理」權限的管理員）：

        | 條件 | 說明 |
        | --- | --- |
        | 售價異常 | 站上有同 ISBN 的其他書籍時，售價 ≥ 其售價中位數的 3 倍且高出 300 代幣以上；無同書資料時售價 ≥ 3,000 代幣 |
        | 非正規來源 | 描述或書況說明提及館藏章、館藏條碼等館藏標記、索書號、除籍、影印本，或圖書館淘汰、報廢。只出現在書名、前面緊接「無」「非」「沒有」「不是」「未」等否定詞（例如「無館藏章、索書號」「正版，非影印本」；除籍不適用），或只提及圖書館、借閱、PDF、非賣品、贈閱、樣書、盜版、電子檔等一般字詞時改由 AI 判斷，並在送交 AI 的內容附上規則提示；AI 上架審核關閉、未設定金鑰或預算用盡時仍依此規則送審 |
        | 站外交易或聯絡資訊 | 書名、作者、出版社、描述或書況說明含實際的聯絡或付款資訊（手機或市話號碼、電子郵件、「LINE：@id」等通訊軟體帳號、匯款帳號或銀行代碼）、站外網址（含帶路徑或 .com.tw 等網域）或可疑連結，或提及面交、私下交易；只提及「IG 帳號」「存款帳戶」等字詞不算。比對前會先正規化，可辨識全形、拆字與插入空白或標點的寫法 |

        **AI 上架審核**：管理員開啟時於回應之後在背景執行，不延長上架等待時間。以書名、作者、出版社、ISBN、分類、書況與書況說明、
        售價、站上同 ISBN 書籍的售價中位數、描述與前 4 張照片判斷（Gemini 與 OpenAI 以高解析度判讀照片）：

        | 結果 | 處理 |
        | --- | --- |
        | 通過 | 維持上架 |
        | 需人工確認（含照片可見館藏章、索書號標籤等非正規來源跡象） | 書籍改為不公開並送審，通知賣家與管理員 |
        | 明確違規（管理員設定為直接拒絕且信心 ≥ 0.85） | 書籍下架、審核紀錄為 `rejected`，通知賣家原因 |
        | 服務商拒絕處理此內容 | 視同需人工確認 |

        每次審核的結果都會留下紀錄：通過記為已審核；服務商錯誤、逾時、輸出格式錯誤或本月預算用盡時書籍維持上架，
        記為「暫時放行」並註記原因，由排程補審。背景審核遇到輸出格式錯誤時會先重送一次。上架審核可使用管理員保留的預算額度，
        會員使用的 AI 功能因預算停用時仍會審核。已由即時規則送審的書籍在背景仍執行 AI 審核，判定只附在審核紀錄上供管理員參考，
        不改變送審狀態。

        **補審**：伺服器每 10 分鐘補審一批（最多 20 本）仍在販售中的書：7 天內上架、超過 15 分鐘仍沒有任何審核紀錄的書
        （例如背景審核進行中伺服器重新啟動）優先，其次為暫時放行且距離上次嘗試超過 10 分鐘的書，依上次嘗試時間由舊到新。
        已下架、交易中或已售出的書不補審。補審以書籍資料、封面與最新加入的 3 張照片判斷，結果的處理與上架時相同。
        服務商無法使用或預算用盡時該批停止，下一輪再試；輸出格式錯誤或服務商不接受該書的請求時略過該書繼續，
        同一本書因此連續 3 次無法完成時改送人工審核。審核期間賣家修改了書籍或新增照片而留下較新的審核紀錄時，以較新的紀錄為準。
        AI 上架審核關閉或未設定金鑰時不補審。

        審核狀態每次變更（送審、駁回、核准）都寫入一筆只新增不修改的審核事件，記錄執行者（系統、賣家修改、管理員、重新上架）、
        原判定與類別，供後台品質報表計算管理員推翻的比例。

        **上架輔助採用率**：使用上架輔助時，把 `POST /api/ai/listing-assist` 回傳的 `suggestion_token` 以 `ai_suggestion_tokens`
        帶回（兩步驟各有權杖時以逗號分隔，最多 3 個）。建立後在背景比對各欄位是否採用建議值，不影響回應；
        權杖無效、逾期、已使用或不屬於請求者時直接忽略。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, price]
              properties:
                title: { type: string, maxLength: 255, example: 挪威的森林 }
                price:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 99999
                  description: 售價，單位為代幣。須大於 0。
                  example: 180
                author: { type: string, example: 村上春樹 }
                publisher: { type: string, example: 時報出版 }
                publish_date:
                  type: string
                  description: 字串欄位。結尾多餘的連字號將被移除，亦可僅填年份。
                  example: '2003-08-01'
                isbn: { type: string, maxLength: 13, example: '9789573317249' }
                category_id: { type: integer, example: 3 }
                condition_level:
                  type: string
                  enum: [like_new, good, fair, poor]
                  default: good
                cabinet_id: { type: integer, description: 指定的取貨書櫃編號, example: 2 }
                description: { type: string, example: 只翻過一次，內頁乾淨 }
                quantity: { type: integer, enum: [1], default: 1, description: 固定為 1，可省略。 }
                cover_image: { type: string, format: binary, description: 封面照片 }
                back_image: { type: string, format: binary, description: 封底照片 }
                barcode_image: { type: string, format: binary, description: 條碼照片 }
                optional_images:
                  type: array
                  items: { type: string, format: binary }
                  description: 選填照片，上限 7 張。
                ai_suggestion_tokens:
                  type: string
                  description: 上架輔助回傳的 `suggestion_token`，多個以逗號分隔，最多採用 3 個。
                  example: 3f9a0c1e5b7d42a8961e0f2c4b6d8a10
      responses:
        '201':
          description: 上架成功。`data` 僅含書籍本體，不包含照片。送交審核時另帶 `moderation`。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 書籍上架成功 }
                  data: { $ref: '#/components/schemas/Book' }
                  moderation: { $ref: '#/components/schemas/ListingModeration' }
        '400':
          description: 欄位缺漏，或售價、數量不符合限制。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少欄位:
                  value: { success: false, message: 請填寫書名與售價 }
                數量不是 1:
                  value: { success: false, code: QUANTITY_FIXED, message: 每筆書籍僅有一本，數量僅能為 1 }
                售價為零:
                  value: { success: false, message: 售價必須大於 0 }
                售價過高:
                  value: { success: false, message: '售價不可超過 99,999 代幣' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/recommended:
    get:
      summary: 取得個人推薦書籍
      operationId: listRecommendedBooks
      tags: [books]
      description: |
        首頁「為您推薦」使用。依請求者的收藏、購買、購物車，以及 `viewed_ids` 帶入的最近瀏覽書籍，
        統計偏好的分類與作者，從中挑選其他在架書籍。

        | 訊號 | 權重 |
        | --- | --- |
        | 購買 | 3 |
        | 收藏 | 2 |
        | 購物車 | 1 |
        | 最近瀏覽 | 1 |

        購買紀錄不含已取消或已退款的訂單；`viewed_ids` 中已下架或未核准的書不列入訊號。

        候選書籍須同時符合：

        1. 狀態為 `on_sale` 且 `is_approved` 為 true。
        2. 分類屬於偏好分類，或作者屬於偏好作者。
        3. 不是請求者自己上架的書，也不是上述訊號中已收藏、購買、加入購物車或瀏覽過的書；已取消或已退款訂單中的書同樣不列入。

        分數以 `sort=popular` 的熱門分數為基礎，再乘上分類比重與作者比重，並套用相同的賣家分散規則。

        沒有任何訊號時（新使用者、未登入且未帶入 `viewed_ids`）回傳空陣列，
        由用戶端改為顯示熱門書籍，不以熱門排序結果補位。

        不要求登入，Token 無效時視同未登入，僅依 `viewed_ids` 推薦。結果不快取，收藏或加入購物車後重新整理即反映。

        已登入時，請求者標示「不感興趣」的書（`POST /api/ai/recommendations/dismissals`）不列入；
        回傳的書籍記為規則式推薦的曝光，同一本書 6 小時內只記一次，保存 90 天。
      security: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 30, default: 12 }
          description: 回傳筆數上限。
        - in: query
          name: viewed_ids
          schema: { type: string }
          description: 最近瀏覽的書籍編號，多筆以半形逗號分隔，最多採計 20 筆。
          example: 42,17,8
      responses:
        '200':
          description: 成功。依推薦分數排序，不分頁。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/briefs:
    get:
      summary: 依編號批次取得書籍現況
      operationId: listBookBriefs
      tags: [books]
      description: |
        App 以此更新本機保存的書籍資料（例如最近瀏覽）。只回傳仍存在、未下架且 `is_approved` 為 true 的書籍，
        依 `ids` 的順序排列；未出現在結果中的編號代表書籍已刪除、下架或不公開，用戶端應自本機移除。不需登入。
      security: []
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string }
          description: 書籍編號，多筆以半形逗號分隔，最多採計 50 筆。
          example: 42,17,8
      responses:
        '200':
          description: 成功。不分頁。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/share/{token}:
    get:
      summary: 以分享權杖取得書籍
      operationId: getBookByShareToken
      tags: [books]
      description: |
        App 開啟 `https://<host>/b/<token>` 或 `savemybook://b/<token>` 時，以權杖換取書籍資料，
        回應格式與 `GET /api/books/{id}` 相同。已下架或 `is_approved` 為 false 的書籍回傳 404。不需登入。
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/similar:
    get:
      summary: 取得相似的書
      operationId: listSimilarBooks
      tags: [books]
      description: |
        書籍詳情頁「相似的書」。以該書已建立的語意向量找內容相近的在售書籍（不產生嵌入費用），並與書名、作者、分類的關鍵字比對合併排名；
        該書尚未建立向量或不在販售中時，改以其書名、作者、分類與簡介查詢。不含該書本身，登入時也不含請求者自己上架的書。最多 10 本。
        書籍不存在或未公開回傳 404 `BOOK_NOT_FOUND`。不需登入。
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 101
      responses:
        '200':
          description: 成功。依相似程度排序，可能為空陣列。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/share-link:
    get:
      summary: 取得書籍分享連結
      operationId: getBookShareLink
      tags: [books]
      description: |
        回傳可在瀏覽器直接開啟的公開網址，形如 `https://<host>/b/<token>`。

        `token` 為 16 位元組的密碼學亂數（`crypto.randomBytes`）轉成 32 個十六進位字元，
        首次索取時產生並寫回該書，之後固定不變——同一本書重複索取會拿到同一個連結。
        舊版的 `savemybook://book/<流水號>` 只能在裝了 App 的裝置上開啟，
        而且流水號可被從 1 開始枚舉，已不再使用。

        公開頁見 `GET /b/{token}`。不需登入。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url: { type: string, example: 'https://api.savemybook.today/b/3f5a1c9e7b2d4086a1c3e5f7b9d0246a' }
                      title: { type: string, example: 演算法圖鑑 }
        '400':
          description: 書籍編號不是數字。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 書籍編號格式不正確 }
        '404':
          description: 找不到此書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此書籍 }
        '409':
          description: |
            書籍已下架。公開頁不會顯示下架的書，發出去的連結只會得到 404，
            因此直接拒絕產生。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此書籍已下架，無法分享 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 書籍編號。
        example: 101

    get:
      summary: 取得書籍詳情
      operationId: getBook
      tags: [books]
      description: |
        回傳單一書籍的完整資料，包含全部照片、賣家資訊與取貨書櫃。無須登入；
        帶入 Bearer Token 時可辨識請求者，用於瀏覽數計算與 `reservation.reserved_for_me`。

        呼叫時將 `view_count` 遞增 1，但同一位瀏覽者（已登入以使用者、未登入以 IP 區分）
        每小時僅計一次，賣家瀏覽自己的書不計入。該累加以非同步方式執行，
        不阻塞回應，因此回傳的 `view_count` 為遞增前的數值。

        書籍正由買家透過聊天室預約保留時，`reservation` 帶保留期限；否則為 null。

        `in_cabinet` 為 true 表示書已存放於書櫃且販售中，下單後即可取書。請求者為賣家本人時另附 `deposit`。

        `is_approved` 為 false 的書籍僅賣家本人可查詢，其他請求者回傳 404。
      security: []
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Book'
                      - type: object
                        properties:
                          reservation:
                            type: object
                            nullable: true
                            description: 保留中的預約。其他使用者在期限內加入購物車或結帳會收到 409 `BOOK_RESERVED`。
                            properties:
                              reserved_until: { type: string, format: date-time, description: 保留期限 }
                              reserved_for_me: { type: boolean, description: 是否保留給請求者本人, example: false }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      summary: 編輯書籍
      operationId: updateBook
      tags: [books]
      description: |
        僅能異動自身上架的書籍，管理員不受此限。採部分更新，僅須帶入欲異動的欄位。
        聊天室預約保留中的書籍，賣家不能編輯、下架或增刪照片，回傳 409 `BOOK_HELD`；
        訂單已成立（`reserved`）或已完成（`sold`）的書籍不能編輯內容或增刪照片，已完成的書也不能下架，回傳 409 `BOOK_LOCKED`。

        書籍若因檢舉成立、審核拒絕或管理員強制下架而下架（`is_approved` 為 false），或有任一檢舉審核結果為 `resolved`，
        將狀態非 `on_sale` 的書籍改為 `on_sale` 的請求會被拒絕，回傳 403 並帶
        `code: BOOK_NOT_APPROVED`。管理員不受此限，且管理員將 `status` 設為 `on_sale` 時
        會一併將 `is_approved` 設為 true。

        管理員將 `status` 設為 `removed`（原狀態不是 `removed`）時，與 `PATCH /api/admin/books/{id}` 強制下架相同：
        立即取消賣家尚未存書、已存書而買家尚未取書的訂單並全額退款，取消進行中的預約，將 `is_approved` 設為 false（賣家不可自行重新上架），
        並通知賣家、寫入操作紀錄；買家已取書（待完成訂單、爭議處理中）的書不改狀態，只停止公開顯示。
        已完成交易（`sold`）的書回傳 409 `BOOK_LOCKED`「此書籍已完成交易，無法下架」。

        `quantity` 可省略；帶入時僅接受 1，其他值回傳 400 `QUANTITY_FIXED`。

        將非 `on_sale` 的書籍改為 `on_sale` 時，書籍仍有未結束的訂單（例如下架時訂單正於書櫃作業中而尚未取消）回傳 409 `BOOK_HAS_OPEN_ORDER`，
        管理員亦同。書籍因此轉為販售中且公開時通知收藏此書的會員。

        書籍已登記存放於書櫃時（見 Pre-order Deposit），變更 `cabinet_id` 回傳 409 `BOOK_DEPOSITED`；
        賣家將下架中的書改回 `on_sale` 前須先至書櫃以 App 掃描 QR Code 取回（書櫃無法掃碼時改以手動回報，經客服確認後生效），
        否則回傳 409 `RETRIEVAL_REQUIRED`。
        系統因逾期暫停販售的書取回後自動恢復上架；賣家自行下架者取回後不會自動上架，需再以本端點改回 `on_sale`。
        管理員將 `status` 改為 `on_sale` 時，已逾期的存書重新起算存書天數；改為其他狀態時，取回後不會自動恢復上架。

        修改 ISBN（10 碼與 13 碼互換不算修改）時，系統依舊 ISBN 自動補齊、且賣家未在同一次請求中修改的簡介、作者、出版社或出版日期會清空，
        並在背景依新的 ISBN 重新補齊（同一本書 24 小時內只立即重新補齊一次，其餘由排程處理）；賣家修改或清空過的這些欄位之後不再自動補齊，
        但先前清空或修改過的舊 ISBN 自動補齊欄位會恢復補齊。交易中或已完成的書籍不清空。

        照片不透過此端點處理，請使用 `POST /api/books/{id}/images` 與
        `DELETE /api/books/{id}/images/{imageId}`。

        調降售價且書籍狀態為 `on_sale` 時，伺服器以 `promotion` 類型的站內通知告知收藏此書的使用者
        （賣家本人除外），通知的 `related_type` 為 `book`。

        賣家修改售價、書名、作者、出版社、描述或書況說明時先套用即時規則審核（規則同 `POST /api/books`），符合時送審；
        修改售價以外的欄位且未觸發規則時，同步執行 AI 上架審核：明確違規回傳 422 `LISTING_REJECTED` 且不套用任何變更；
        需人工確認時書籍改為不公開並送審，回應附帶 `moderation`；審核中的書籍修改後判定通過則恢復公開，
        AI 服務失敗時維持審核中。AI 服務失敗、逾時、輸出格式錯誤或預算用盡時公開中的書維持公開，由排程補審（見 `POST /api/books`）。
        同步審核的總時限約 25 秒，輸出格式錯誤時不重送。因違規下架的書籍不會轉為審核中。等待審核（`review_status: pending`）不視為違規，賣家仍可自行下架與重新上架，
        但審核通過前不會公開；審核駁回（`review_status: rejected`）視為違規。管理員編輯不執行審核。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                author: { type: string }
                publisher: { type: string }
                publish_date: { type: string }
                isbn: { type: string }
                category_id: { type: integer }
                price: { type: number, minimum: 0.01, maximum: 99999 }
                quantity: { type: integer, enum: [1], description: 固定為 1，可省略。 }
                condition_level: { type: string, enum: [like_new, good, fair, poor] }
                condition_note: { type: string }
                description: { type: string }
                cabinet_id: { type: integer }
                status: { type: string, enum: [on_sale, reserved, sold, removed] }
            example: { price: 160, description: 降價出清, status: on_sale }
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 書籍資料更新成功 }
                  data: { $ref: '#/components/schemas/Book' }
                  moderation: { $ref: '#/components/schemas/ListingModeration' }
        '400':
          description: 售價或數量不符合限制。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                售價:
                  value: { success: false, message: 售價必須大於 0 }
                數量不是 1:
                  value: { success: false, code: QUANTITY_FIXED, message: 每筆書籍僅有一本，數量僅能為 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非本人上架的書籍，或嘗試重新上架違規書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                他人的書:
                  value: { success: false, message: 無權限修改此書籍 }
                違規下架:
                  value: { success: false, code: BOOK_NOT_APPROVED, message: 此書籍因違規遭下架，無法自行重新上架，請聯絡客服 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 書籍預約保留中、訂單已成立或已完成，或存書期間變更書櫃、未取回即重新上架。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                存書期間變更書櫃:
                  value: { success: false, code: BOOK_DEPOSITED, message: 此書籍已存放於書櫃，無法變更書櫃；請先至書櫃取回書籍後再變更 }
                須先取回:
                  value: { success: false, code: RETRIEVAL_REQUIRED, message: 此書籍仍存放於書櫃，請先至書櫃以 App 掃描 QR Code 取回後再重新上架 }
                預約保留中:
                  value: { success: false, code: BOOK_HELD, message: 此書籍已被預約，保留期間無法編輯或取消上架 }
                訂單已成立:
                  value: { success: false, code: BOOK_LOCKED, message: 此書籍已售出，無法編輯 }
                訂單未結束:
                  value: { success: false, code: BOOK_HAS_OPEN_ORDER, message: 此書籍尚有進行中的訂單，無法重新上架 }
                管理員下架已完成的書:
                  value: { success: false, code: BOOK_LOCKED, message: 此書籍已完成交易，無法下架 }
        '422': { $ref: '#/components/responses/ListingRejected' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 下架書籍
      operationId: deleteBook
      tags: [books]
      description: |
        軟刪除：僅將 `status` 改為 `removed`，資料與照片均予保留，
        以維持已成立訂單的關聯完整性。後續可再改回 `on_sale`。

        書籍已登記存放於書櫃時仍可下架，存書紀錄保留，逾期提醒照常進行；請至書櫃以 App 掃描 QR Code 取回
        （書櫃無法掃碼時改以 `POST /api/books/{id}/retrieve` 手動回報，經客服確認後生效）。

        賣家不可下架預約保留中（409 `BOOK_HELD`）、訂單已成立（409）或已完成交易（409 `BOOK_LOCKED`）的書籍。
        管理員呼叫時與 `PATCH /api/admin/books/{id}` 強制下架相同：立即取消尚未取書的訂單並全額退款、取消進行中的預約，
        將 `is_approved` 設為 false（賣家不可自行重新上架），並通知賣家、寫入操作紀錄；買家已取書的書只停止公開顯示；
        已完成交易（`sold`）的書回傳 409 `BOOK_LOCKED`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已下架。管理員下架買家已取書的書時只停止公開顯示，訊息為「已停止公開顯示」。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              examples:
                已下架:
                  value: { success: true, message: 書籍已取消上架 }
                只停止公開顯示:
                  value: { success: true, message: 已停止公開顯示 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非本人上架的書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 無權限刪除此書籍 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 書籍預約保留中、訂單已成立，或已完成交易。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                訂單已成立:
                  value: { success: false, message: 此書籍已售出（訂單進行中），請先處理訂單再取消上架 }
                已完成交易:
                  value: { success: false, code: BOOK_LOCKED, message: 此書籍已完成交易，無法取消上架 }
                管理員下架已完成的書:
                  value: { success: false, code: BOOK_LOCKED, message: 此書籍已完成交易，無法下架 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/deposit:
    post:
      summary: 回報先行存書（故障備援，待客服確認）
      operationId: depositBook
      tags: [books]
      description: |
        賣家將上架中的書存入該書指定的書櫃後呼叫，不需等訂單成立。本端點只在書櫃無法掃碼時作為故障備援：
        回報一律成為待客服確認的手動回報（HTTP 202），管理員確認並指定櫃門後才登記存書。
        存書期間的訂單、逾期提醒與限制見本組說明的 Pre-order Deposit 一節。

        僅賣家本人可呼叫，且須同時符合：

        | 條件 | 不符合時 |
        | --- | --- |
        | 狀態為 `on_sale` 且 `is_approved` 為 true | 409 `DEPOSIT_NOT_ALLOWED` |
        | 沒有進行中的訂單（狀態不是 `completed`、`cancelled`、`refunded` 的訂單） | 409 `DEPOSIT_NOT_ALLOWED` |
        | 已指定書櫃 | 400 `CABINET_REQUIRED` |
        | 書櫃未停用 | 400 `CABINET_UNAVAILABLE` |
        | 書櫃未維修中 | 400 `CABINET_MAINTENANCE` |
        | 尚未登記存書 | 409 `BOOK_DEPOSITED` |
        | 同一本書沒有待確認的回報 | 409 `MANUAL_REPORT_PENDING` |
        | 賣家在此書櫃的先行存書未達上限（計入已登記、待確認回報與進行中作業） | 409 `PREDEPOSIT_LIMIT` |
        | 書櫃已配對裝置時，可用櫃門扣除保留給依訂單存書的櫃門後仍有空門 | 409 `CABINET_FULL` |

        聊天室預約保留中的書仍可存書。

        **書櫃掃碼存取**：書櫃為掃碼模式時（含裝置離線或故障未滿 2 分鐘，及裝置自行解除配對或疑遭複製而撤銷後 2 分鐘內），
        存書、取書與取回須至書櫃以 App 掃描 QR Code 辦理（見「書櫃作業」），呼叫本端點回 409 `CABINET_SCAN_REQUIRED`。
        書櫃停用或維修中時依上表回 400。
        書櫃沒有有效裝置（含從未配對），或裝置離線、故障持續 2 分鐘以上時，本端點建立待客服確認的手動回報，回 202 並附 `manual_report`。
        App 須把 202 顯示為「待客服確認」，存書登記要到管理員確認後才成立。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 書籍編號。
          example: 101
      responses:
        '202':
          description: 已送出待客服確認的手動回報，狀態尚未變更。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已送出手動回報，待客服確認後生效 }
                  data:
                    type: object
                    properties:
                      book_id: { type: integer, example: 101 }
                      in_cabinet: { type: boolean, example: false }
                      cabinet: { $ref: '#/components/schemas/CabinetBrief' }
                      deposit: { type: object, nullable: true, example: null }
                      manual_report: { $ref: '#/components/schemas/CabinetManualReport' }
        '400':
          description: 未指定書櫃，或書櫃停用、維修中。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未指定書櫃:
                  value: { success: false, code: CABINET_REQUIRED, message: 請先於書籍資料中指定存放的書櫃 }
                書櫃停用:
                  value: { success: false, code: CABINET_UNAVAILABLE, message: 此書櫃已停用，請先變更存放的書櫃 }
                書櫃維修中:
                  value: { success: false, code: CABINET_MAINTENANCE, message: 此書櫃維修中，暫時無法存書 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非本人上架的書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅賣家本人可登記存書 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 書籍狀態不允許存書、已登記存書、已有待確認回報，或超過先行存書的容量限制。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                先行存書上限:
                  value: { success: false, code: PREDEPOSIT_LIMIT, message: 您在此書櫃的先行存書已達上限，請待售出或取回後再存入 }
                櫃門保留給依訂單存書:
                  value: { success: false, code: CABINET_FULL, message: 此書櫃可用的櫃門不足，請減少存書項目或稍後再試, available_doors: 1, required_doors: 2 }
                未上架:
                  value: { success: false, code: DEPOSIT_NOT_ALLOWED, message: 書籍須為販售中且已公開，才能存入書櫃 }
                已有訂單:
                  value: { success: false, code: DEPOSIT_NOT_ALLOWED, message: 此書籍已有進行中的訂單，請依訂單流程存書 }
                已登記:
                  value: { success: false, code: BOOK_DEPOSITED, message: 此書籍已登記存放於書櫃 }
                須掃碼辦理:
                  value: { success: false, code: CABINET_SCAN_REQUIRED, message: 此書櫃已啟用掃碼存取，請至書櫃以 App 掃描 QR Code 辦理, cabinet_id: 3 }
                已有待確認回報:
                  value: { success: false, code: MANUAL_REPORT_PENDING, message: 此項目已有待客服確認的手動回報 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/retrieve:
    post:
      summary: 回報取回書籍（故障備援，待客服確認）
      operationId: retrieveBook
      tags: [books]
      description: |
        賣家自書櫃取回尚未售出的書後呼叫。僅賣家本人可呼叫。本端點只在書櫃無法掃碼時作為故障備援：
        回報一律成為待客服確認的手動回報（HTTP 202），管理員確認後才移除存書紀錄。

        待確認期間，上架中的書暫停販售（回應的 `status` 為 `removed`），避免被當成仍在書櫃而售出；
        駁回或回報失效時恢復上架，確認後依下列規則處理：上架中的書取回後維持上架；
        因存書逾期而由系統暫停販售、且未因違規、檢舉成立或管理員下架而下架的書恢復上架；其餘維持原狀態。
        待確認期間被管理員、檢舉或審核下架的書，不會因回報結束而恢復上架。

        書籍已售出並轉入進行中的訂單時回傳 409 `BOOK_SOLD_IN_CABINET`，
        書須留在書櫃（或放回書櫃）由買家取書，或由賣家以書櫃作業辦理訂單存書；書存放的書櫃與訂單書櫃不同時
        （依書櫃拆單前成立的舊訂單），`message` 請賣家取回後存入訂單書櫃。訂單爭議處理中（`refunding`）而書仍在櫃中
        （訂單已有 `deposited_at`，或此書為 `pre_deposited`）時同樣回傳 409 `BOOK_SOLD_IN_CABINET`，請賣家勿取回。

        **書櫃掃碼存取**：書櫃為掃碼模式時（含裝置離線或故障未滿 2 分鐘，及裝置自行解除配對或疑遭複製而撤銷後 2 分鐘內），
        取回須至書櫃以 App 掃描 QR Code 辦理（見「書櫃作業」），呼叫本端點回 409 `CABINET_SCAN_REQUIRED`；
        已配對裝置的書櫃停用或維修中時回 409 `CABINET_UNAVAILABLE`、`CABINET_MAINTENANCE`。
        書櫃沒有有效裝置（含從未配對），或裝置離線、故障持續 2 分鐘以上時，本端點建立待客服確認的手動回報，回 202 並附 `manual_report`；
        同一項目已有待確認的回報時回 409 `MANUAL_REPORT_PENDING`。App 須把 202 顯示為「待客服確認」。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 書籍編號。
          example: 101
      responses:
        '202':
          description: 已送出待客服確認的手動回報，狀態尚未變更。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已送出手動回報，待客服確認後生效 }
                  data:
                    type: object
                    properties:
                      book_id: { type: integer, example: 101 }
                      status: { type: string, enum: [on_sale, reserved, sold, removed], description: 目前的書籍狀態；上架中的書於待確認期間為 removed, example: removed }
                      restored: { type: boolean, example: false }
                      manual_report: { $ref: '#/components/schemas/CabinetManualReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非本人上架的書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅賣家本人可回報取回書籍 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 書籍目前未登記存書、已售出轉入訂單，或已有待確認的回報。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未登記存書:
                  value: { success: false, code: NOT_DEPOSITED, message: 此書籍目前未登記存放於書櫃 }
                已售出待買家取書:
                  value: { success: false, code: BOOK_SOLD_IN_CABINET, message: 此書籍已售出（訂單 SMB20250911143012517384），買家將至書櫃取書，請勿取回；如已取出，請儘速放回書櫃 }
                已售出待辦理存書:
                  value: { success: false, code: BOOK_SOLD_IN_CABINET, message: 此書籍已售出（訂單 SMB20250911143012517384），請將書籍留在書櫃，並以 App 掃描 QR Code 辦理訂單存書 }
                已售出須移至訂單書櫃:
                  value: { success: false, code: BOOK_SOLD_IN_CABINET, message: 此書籍已售出（訂單 SMB20250911143012517384），請至書櫃以 App 掃描 QR Code 取回，再存入「台大書櫃」 }
                訂單爭議處理中:
                  value: { success: false, code: BOOK_SOLD_IN_CABINET, message: 此書籍已售出（訂單 SMB20250911143012517384），訂單爭議處理中，請勿取回；如已取出，請儘速放回書櫃 }
                須掃碼辦理:
                  value: { success: false, code: CABINET_SCAN_REQUIRED, message: 此書櫃已啟用掃碼存取，請至書櫃以 App 掃描 QR Code 辦理, cabinet_id: 3 }
                已有待確認回報:
                  value: { success: false, code: MANUAL_REPORT_PENDING, message: 此項目已有待客服確認的手動回報 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/images:
    post:
      summary: 為書籍加照片
      operationId: addBookImages
      tags: [books]
      description: |
        單次上限 8 張，`image_type` 一律儲存為 `other`。
        回應包含該書籍的全部照片，含既有照片。

        賣家新增照片時以新照片執行上架審核（規則同 `POST /api/books`）：明確違規回傳 422 且照片不儲存；
        需人工確認時照片照常新增、書籍改為不公開並送審，回應附帶 `moderation`；AI 服務失敗、逾時、輸出格式錯誤或預算用盡時
        照片照常新增，由排程補審。同步審核的總時限約 25 秒，輸出格式錯誤時不重送。
        新照片通過審核不代表整本書已完成審核：原本等待補審或沒有審核紀錄的書仍由排程補審。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 101
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 8
                image_types:
                  type: string
                  description: 以逗號分隔、與 images 順序對應的照片類型（cover、back、inside、other），缺少或不合法的位置視為 other。
                  example: cover,inside
      responses:
        '201':
          description: 新增成功，回傳該書籍的全部照片。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 圖片已新增 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookImage' }
                  moderation: { $ref: '#/components/schemas/ListingModeration' }
        '400':
          description: 未帶入檔案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請選擇要上傳的圖片 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ListingRejected' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/{id}/images/{imageId}:
    delete:
      summary: 刪除書籍照片
      operationId: deleteBookImage
      tags: [books]
      description: |
        刪除資料列，實體檔案保留於磁碟。

        `imageId` 須隸屬於路徑指定的書籍，否則回傳 404，
        以避免跨書籍誤刪照片。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 書籍編號。
          example: 101
        - in: path
          name: imageId
          required: true
          schema: { type: integer }
          description: 照片編號，取自 `book_images[].image_id`。
          example: 88
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 圖片已刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 書籍不存在，或該照片不隸屬於此書籍。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到該圖片 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/books/isbn/{isbn}:
    get:
      summary: 用 ISBN 查外部書籍資料
      operationId: lookupIsbn
      tags: [books]
      description: |
        同時查詢 Google Books API 與 Open Library，逐欄位採用第一個有值的來源（Google Books 優先），供上架流程自動帶入書名、作者等欄位。
        Open Library 會一併以對應的 10 碼與 13 碼 ISBN 查詢；兩者皆未提供簡介時，再向 Open Library 查詢版本與作品簡介。
        兩個來源都只採用登錄的 ISBN（10 碼與 13 碼互通）屬於同一本書的結果；Google Books 回傳多筆時略過 ISBN 不符的項目，而非直接採用第一筆。

        此端點不寫入資料庫。伺服器若已設定 `GOOGLE_BOOKS_API_KEY`，查詢 Google Books 時會一併帶入。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: isbn
          required: true
          schema: { type: string }
          description: 10 碼或 13 碼 ISBN。
          example: '9789573317249'
      responses:
        '200':
          description: 查詢成功。外部書庫未提供的欄位回傳空字串，而非 null。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      title: { type: string, example: 挪威的森林 }
                      author: { type: string, description: 多位作者以半形逗號串接。, example: 村上春樹 }
                      publisher: { type: string, example: 時報出版 }
                      publish_date: { type: string, example: '2003-08-01' }
                      description: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 外部書庫查無此 ISBN 的資料。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此 ISBN 的書籍資訊 }
        '502':
          description: 查不到資料且有外部書庫連線失敗或被限流（例如 Google Books 回 429），無法確定是否真的查無此書，稍後可再試。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 查詢外部書籍資訊發生錯誤 }

components:
  schemas:
    ListingModeration:
      type: object
      description: 僅在書籍送交人工審核時出現。
      properties:
        status: { type: string, enum: [pending_review] }
        reasons:
          type: array
          items: { type: string }
          example: [描述含站外聯絡方式]

  responses:
    ListingRejected:
      description: 編輯書籍或新增照片時，上架審核判定明確違規，變更未套用。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, code: LISTING_REJECTED, message: 此商品未通過上架審核：非書籍商品、含站外聯絡資訊 }
