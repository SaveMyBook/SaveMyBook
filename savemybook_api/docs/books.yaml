tags:
  - name: 商品書籍 (Books)
    description: 處理二手書商品的 API 端點

components:
  schemas:
    Book:
      type: object
      properties:
        book_id:
          type: integer
        seller_id:
          type: integer
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        isbn:
          type: string
        price:
          type: number
        condition_level:
          type: string
        description:
          type: string

paths:
  /api/books/isbn/{isbn}:
    get:
      summary: 透過 ISBN 查詢外部書籍資訊
      tags: [商品書籍 (Books)]
      description: 以 ISBN 向 Google Books API 查詢書籍基本資訊，可用於上架時自動帶入書名、作者等欄位。需要 JWT Token。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: isbn
          schema:
            type: string
          required: true
          description: 書籍的 ISBN 編號
      responses:
        '200':
          description: 成功取得書籍資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      title:
                        type: string
                      author:
                        type: string
                      publisher:
                        type: string
                      publish_date:
                        type: string
                      description:
                        type: string
        '401':
          description: 存取被拒，未提供 Token
        '404':
          description: 外部書庫找不到此 ISBN 的書籍資訊
        '500':
          description: 查詢外部書籍資訊發生錯誤

  /api/books:
    get:
      summary: 取得所有書籍列表
      tags: [商品書籍 (Books)]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: category_ids
          schema:
            type: string
          description: 支援多選分類，以逗號分隔 (例：1,2,3)
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, popular, price_asc, price_desc]
      responses:
        '200':
          description: 成功取得書籍列表
        '500':
          description: 伺服器發生錯誤
          
    post:
      summary: 新增/上架書籍
      tags: [商品書籍 (Books)]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - price
              properties:
                title:
                  type: string
                author:
                  type: string
                publisher:
                  type: string
                isbn:
                  type: string
                price:
                  type: number
                category_id:
                  type: integer
                condition_level:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: 書籍上架成功
        '400':
          description: 請求失敗
        '401':
          description: 未提供 Token
        '500':
          description: 伺服器發生錯誤

  /api/books/{id}:
    get:
      summary: 取得單一書籍詳細資訊
      tags: [商品書籍 (Books)]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 成功取得書籍資料
        '404':
          description: 找不到該書籍
          
    put:
      summary: 更新書籍資訊
      tags: [商品書籍 (Books)]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
                publisher:
                  type: string
                isbn:
                  type: string
                price:
                  type: number
                category_id:
                  type: integer
                condition_level:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: 成功更新
        '401':
          description: 未提供 Token
        '403':
          description: 無權修改
        '404':
          description: 找不到該書籍
          
    delete:
      summary: 刪除/下架書籍
      tags: [商品書籍 (Books)]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 書籍刪除成功
        '401':
          description: 未提供 Token
        '403':
          description: 無權刪除
        '404':
          description: 找不到該書籍