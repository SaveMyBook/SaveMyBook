tags:
  - name: 智慧書櫃 (Cabinets)
    description: |
      智慧書櫃為平台的交付機制：賣家將書籍存入櫃位，買家憑六位數取貨碼取件，
      雙方無須當面交付。

      本組僅提供前台查詢端點，書櫃與櫃位的維運端點位於「後台：書櫃管理」。

paths:
  /api/cabinets:
    get:
      summary: 取得可用書櫃列表
      operationId: listCabinets
      tags: [智慧書櫃 (Cabinets)]
      description: |
        僅回傳 `is_active` 為 true 的書櫃，依編號排序，供上架時選擇取貨點
        與地圖標示使用。

        回傳欄位經過精簡並包含經緯度。需取得完整資料（含櫃位狀態統計）時，
        請使用 `GET /api/admin/cabinets`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cabinet_id: { type: integer, example: 2 }
                        cabinet_name: { type: string, example: 台北車站站前店 }
                        address: { type: string, example: 台北市中正區忠孝西路一段 49 號 }
                        available_slots: { type: integer, description: 目前可用的櫃位數, example: 17 }
                        latitude: { type: string, example: '25.0463500' }
                        longitude: { type: string, example: '121.5170000' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 查詢書櫃列表失敗。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 伺服器發生錯誤，無法取得書櫃列表 }
