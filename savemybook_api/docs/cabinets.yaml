tags:
  - name: 智慧書櫃 (Cabinets)
    description: |
      智慧書櫃是這個平台的核心：賣家把書放進櫃位，買家憑六位數取貨碼
      取書，雙方不需要碰面。

      這裡只有給 App 用的查詢端點。書櫃與櫃位的維運在
      **後台：書櫃管理**。

paths:
  /api/cabinets:
    get:
      summary: 取得可用書櫃列表
      operationId: listCabinets
      tags: [智慧書櫃 (Cabinets)]
      description: |
        只回傳 `is_active = true` 的書櫃，依編號排序。
        上架書籍時選取貨點、以及地圖顯示都用這一支。

        回傳欄位刻意精簡，含經緯度可直接標在地圖上。
        要完整資料（含櫃位狀態統計）請用 `GET /api/admin/cabinets`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cabinet_id: { type: integer, example: 2 }
                        cabinet_name: { type: string, example: 台北車站站前店 }
                        address: { type: string, example: 台北市中正區忠孝西路一段 49 號 }
                        available_slots: { type: integer, description: 目前可用櫃位數, example: 17 }
                        latitude: { type: string, example: '25.0463500' }
                        longitude: { type: string, example: '121.5170000' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 查詢失敗。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 伺服器發生錯誤，無法取得書櫃列表 }
