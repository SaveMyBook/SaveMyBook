tags:
  - name: 交易爭議 (Disputes)
    description: |
      訂單交易爭議的申訴管道，適用書況不符、未收到書籍等情形。

      申請送出後訂單立即轉為 `refunding`，待管理員於「後台：檢舉與爭議」裁決。
      裁決結果為退款時訂單轉為 `refunded`；駁回或協調結案則轉回 `completed`。

paths:
  /api/disputes:
    get:
      summary: 取得我的爭議申請
      operationId: listMyDisputes
      tags: [交易爭議 (Disputes)]
      description: |
        列出請求者送出的爭議申請，包含關聯訂單與首本書籍的書名與封面。
        依建立時間遞減排序，無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Dispute'
                        - type: object
                          properties:
                            orders:
                              type: object
                              properties:
                                order_id: { type: integer }
                                order_no: { type: string }
                                total_amount: { type: string }
                                status: { type: string }
                                order_items:
                                  type: array
                                  items: { $ref: '#/components/schemas/OrderItem' }
                            users_transaction_disputes_applicant_idTousers:
                              $ref: '#/components/schemas/UserBrief'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 提出爭議申請
      operationId: createDispute
      tags: [交易爭議 (Disputes)]
      description: |
        買賣雙方皆可對自身參與的訂單提出爭議。

        送出後訂單狀態立即轉為 `refunding`。建立申請與更新訂單狀態
        於同一資料庫交易內完成。

        同一訂單若已存在狀態為 `pending` 或 `processing` 的申請，回傳 409。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, reason]
              properties:
                order_id: { type: integer, example: 40 }
                reason: { type: string, description: 爭議說明，不可為空白。, example: 書況與描述不符，有大量畫線 }
                evidence_urls:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                  description: 佐證圖片路徑，須先經 `POST /api/uploads` 上傳取得。
                  example: [/uploads/evidence/c.jpg]
      responses:
        '201':
          description: 已送出。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 爭議申請已送出 }
                  data: { $ref: '#/components/schemas/Dispute' }
        '400':
          description: 欄位缺漏。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未帶訂單編號:
                  value: { success: false, message: 請提供 order_id }
                未填爭議說明:
                  value: { success: false, message: 請填寫爭議說明 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者非該訂單的關係人。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 存取被拒 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 該訂單已有處理中的爭議申請。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此訂單已有處理中的爭議申請 }
        '500': { $ref: '#/components/responses/ServerError' }
