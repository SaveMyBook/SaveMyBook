tags:
  - name: 檔案上傳 (Uploads)
    description: |
      通用檔案上傳，目前供檢舉與交易爭議的佐證圖片使用。

      書籍照片與個人頭像不使用此端點，另有專屬端點：`POST /api/books`、
      `POST /api/books/{id}/images` 與 `POST /api/users/me/avatar`。

paths:
  /api/uploads:
    post:
      summary: 上傳佐證檔案
      operationId: uploadFiles
      tags: [檔案上傳 (Uploads)]
      description: |
        單次上限 5 個檔案，單檔大小上限 8 MB。檔案存放於 `/uploads/evidence/`，
        檔名由時間戳與隨機碼組成以避免衝突。

        回應為相對路徑陣列，可帶入 `POST /api/reports` 或
        `POST /api/disputes` 的 `evidence_urls` 欄位。

        上傳後的檔案不會自動清理。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 5
                  description: 欲上傳的檔案，欄位名稱固定為 `files`。
      responses:
        '201':
          description: 上傳成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 上傳成功 }
                  data:
                    type: object
                    properties:
                      urls:
                        type: array
                        items: { type: string }
                        example: [/uploads/evidence/1736512345678-123456789.jpg]
        '400':
          description: 未選擇任何檔案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請選擇要上傳的檔案 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
