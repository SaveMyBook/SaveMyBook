tags:
  - name: uploads
    x-displayName: 檔案上傳
    description: |
      檢舉與交易爭議的佐證圖片，以及聊天室的圖片與語音。

      | 用途 | 端點 | 欄位 | 格式 | 單檔上限 | 存放位置 |
      | --- | --- | --- | --- | --- | --- |
      | 檢舉與爭議佐證 | `POST /api/uploads` | `files`，最多 5 個 | 圖片 | 8 MB | `/uploads/evidence/` |
      | 聊天圖片 | `POST /api/uploads/chat-image` | `file` | 圖片 | 10 MB | `/uploads/chat/` |
      | 聊天語音 | `POST /api/uploads/voice` | `file` | M4A、AAC、MP3 | 5 MB | `/uploads/voice/` |
      | 客服工單圖片 | `POST /api/uploads/support-image` | `file` | 圖片 | 10 MB | `/uploads/support/`（不開放直接存取） |

      書籍照片與個人頭像不使用本組端點，另有專屬端點：`POST /api/books`、
      `POST /api/books/{id}/images` 與 `POST /api/users/me/avatar`。

paths:
  /api/uploads:
    post:
      summary: 上傳佐證檔案
      operationId: uploadFiles
      tags: [uploads]
      description: |
        單次上限 5 個檔案，單檔大小上限 8 MB。僅接受 JPG、PNG、GIF、WebP、HEIC 圖片，
        伺服器會檢查檔頭，副檔名與內容不符的檔案回傳 400。每位使用者 10 分鐘內最多上傳 30 次。

        檔案存放於 `/uploads/evidence/`，檔名完全由伺服器產生。

        回應為相對路徑陣列，可帶入 `POST /api/reports` 或
        `POST /api/disputes` 的 `evidence_urls` 欄位。

        上傳後的檔案不會自動清理。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 5
                  description: 欲上傳的檔案，欄位名稱固定為 `files`。
      responses:
        '201':
          description: 上傳成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 上傳成功 }
                  data:
                    type: object
                    properties:
                      urls:
                        type: array
                        items: { type: string }
                        example: [/uploads/evidence/1736512345678-123456789.jpg]
        '400':
          description: 未選擇任何檔案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請選擇要上傳的檔案 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/uploads/chat-image:
    post:
      summary: 上傳聊天圖片
      operationId: uploadChatImage
      tags: [uploads]
      description: |
        上傳聊天室要傳送的圖片，單檔上限 10 MB。僅接受 JPG、PNG、GIF、WebP、HEIC，
        伺服器會檢查檔頭，內容不符的檔案回傳 400。

        檔案存放於 `/uploads/chat/`。取得 `url` 後，以 `message_type: image` 將其帶入
        `POST /api/chat/rooms/{roomId}/messages` 的 `content`；其他來源的路徑不會被聊天室接受。

        與語音上傳合計，每位使用者 10 分鐘內最多 60 次。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 欲上傳的檔案，欄位名稱固定為 `file`，單次一個檔案。
      responses:
        '201':
          description: 上傳成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url: { type: string, example: /uploads/chat/1736512345678-9f86d081884c7d65.jpg }
        '400':
          description: 未選擇檔案，或檔案格式不符。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未選擇檔案:
                  value: { success: false, message: 請選擇要傳送的圖片 }
                格式不符:
                  value: { success: false, message: 只接受圖片檔（JPG、PNG、GIF、WebP、HEIC） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 檔案超過大小上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 檔案太大了 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/uploads/support-image:
    post:
      summary: 上傳客服工單圖片
      operationId: uploadSupportImage
      tags: [uploads]
      description: |
        上傳開立或回覆工單要附加的圖片，單檔上限 10 MB。僅接受 JPG、PNG、GIF、WebP、HEIC，
        伺服器會檢查檔頭。

        回傳的 `url` 僅供帶入 `POST /api/support/tickets` 或
        `POST /api/support/tickets/{id}/messages` 的 `attachments`，只能由上傳者本人使用一次；
        圖片須透過工單內容回應中的簽章網址讀取。

        未送出的圖片保留 24 小時後自動刪除，每位使用者同時最多 20 張。
        與佐證檔案上傳合計，10 分鐘內最多 30 次。尚未執行遷移 017 時回傳 503。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 欲上傳的圖片，欄位名稱固定為 `file`，單次一個檔案。
      responses:
        '201':
          description: 上傳成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url: { type: string, example: /uploads/support/1736512345678-9f86d081884c7d65.jpg }
        '400':
          description: 未選擇檔案、格式不符，或未送出的圖片過多。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未選擇檔案:
                  value: { success: false, message: 請選擇要上傳的圖片 }
                待送出過多:
                  value: { success: false, code: SUPPORT_ATTACHMENTS_PENDING_LIMIT, message: 尚未送出的圖片過多，請先送出或稍後再試 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 檔案超過大小上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: 伺服器尚未執行遷移 017。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: SUPPORT_ATTACHMENTS_UNAVAILABLE, message: 圖片附件暫時無法使用，請稍後再試 }

  /api/uploads/voice:
    post:
      summary: 上傳語音訊息
      operationId: uploadVoice
      tags: [uploads]
      description: |
        上傳聊天室要傳送的語音，單檔上限 5 MB。僅接受 M4A、AAC、MP3，
        伺服器會檢查檔頭，內容不符的檔案回傳 400。語音長度由用戶端於送出訊息時以 `duration` 提供，
        上限 120 秒。

        檔案存放於 `/uploads/voice/`。取得 `url` 後，以 `message_type: voice` 將其帶入
        `POST /api/chat/rooms/{roomId}/messages` 的 `content`。

        與聊天圖片上傳合計，每位使用者 10 分鐘內最多 60 次。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 欲上傳的檔案，欄位名稱固定為 `file`，單次一個檔案。
      responses:
        '201':
          description: 上傳成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url: { type: string, example: /uploads/voice/1736512345678-9f86d081884c7d65.m4a }
        '400':
          description: 未選擇檔案，或檔案格式不符。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未選擇檔案:
                  value: { success: false, message: 請選擇要傳送的語音 }
                格式不符:
                  value: { success: false, message: 只接受語音檔（M4A、AAC、MP3） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 檔案超過大小上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 檔案太大了 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
