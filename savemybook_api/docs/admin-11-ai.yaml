tags:
  - name: admin-ai
    x-displayName: 後台：AI 設定
    description: |
      AI 服務商、模型、單價、功能開關、用量上限、用量報表與上架審核。

      | 端點 | 權限 |
      | --- | --- |
      | 設定、連線測試 | `can_manage_system` |
      | 用量報表 | `can_view_stats` 或 `can_manage_system` |
      | 上架審核 | `can_manage_content` |

      API 金鑰只能在伺服器環境變數設定（`DEEPSEEK_API_KEY`、`GEMINI_API_KEY`、`OPENAI_API_KEY`），
      後台僅能看到 `key_configured`。服務商會更改模型名稱與價格，因此模型與單價可由管理員修改；
      是否支援照片辨識與網路搜尋由程式固定。

      **語意檢索**：書籍顧問、個人推薦與 AI 客服以「關鍵字（BM25）＋語意向量」混合檢索，兩份排名以 RRF 合併。
      向量模型依序使用 OpenAI `text-embedding-3-small`（512 維）或 Gemini `gemini-embedding-001`（768 維），
      取決於伺服器設定了哪一把金鑰，不受各功能選用的服務商影響。向量存於 `ai_embeddings`，
      伺服器每 10 分鐘在背景補齊新增或變更的書籍與客服知識，少量新書也會在查詢時即時補算；更換向量模型時自動重建。
      嵌入費用記入用量報表的 `embedding` 功能。AI 總開關關閉、未設定上述金鑰或嵌入服務無法使用時，自動改用純關鍵字檢索。
      嵌入服務發生系統性錯誤（`AUTH`、`QUOTA`、`SERVER`、`TIMEOUT`、`NETWORK`、`RATE_LIMITED`、`MODEL_NOT_FOUND`，
      或回傳的向量筆數、維度不符）時暫停呼叫 5 分鐘；背景同步與使用者查詢分開計算，其中一邊暫停不影響另一邊。
      其他錯誤（例如 `BAD_REQUEST`、個別文件得到零向量）只讓該次改用關鍵字檢索，同一邊連續 3 次才暫停；
      背景同步失敗的那批文件 30 分鐘內不再重送，其餘文件照常同步。

      **書籍資料補齊**（`enrich`）：賣家未填簡介、作者、出版社或出版日期時，上架後在背景依 ISBN 查詢書目補上；
      簡介在 AI 與「上架輔助」開啟時由上架輔助的服務商依書目來源整理成繁體中文，否則使用清理過的來源文字。
      Google Books 與 Open Library 查無簡介（或暫時無法查詢）且上架輔助開啟網路搜尋時，改由模型依 ISBN 上網查詢；
      模型須確認網頁上的 ISBN 相符並附上來源網頁才會採用，每本書計一次網路搜尋費用。
      寫入書籍頁前，簡介中含手機或市話號碼、電子郵件、通訊軟體帳號或站外網址（含 cite.com.tw 這類不帶 http 的網域）的句子會被刪除，
      作者與出版社含這類內容時不採用。
      既有書籍由排程每 30 分鐘補齊一批（每批 20 本）；查無資料的書 30 天後再查一次，外部服務暫時無法使用時下一批重試。

      **爭議分析**（`admin_assist`）：`POST /api/admin/disputes/{id}/ai-analysis`，見該端點說明。

paths:
  /api/admin/ai/settings:
    get:
      summary: 取得 AI 設定
      operationId: adminGetAiSettings
      tags: [admin-ai]
      description: 資料庫沒有設定時回傳預設值（總開關預設關閉）。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminAiSettingsPayload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }

    put:
      summary: 更新 AI 設定
      operationId: adminUpdateAiSettings
      tags: [admin-ai]
      description: |
        整份取代。未知欄位會被捨棄，未提供的欄位使用預設值；提供了但不合法的值回傳 400：

        - 單價（`input_per_m`、`cached_input_per_m`、`output_per_m`、`search_price_per_k`）為 0 ~ 1000 的數值
        - `search_free_per_month` 為 0 ~ 1000000 的整數
        - `limits.daily_per_user.*` 為 0 ~ 10000 的整數，0 代表不限制。只計成功的呼叫；書籍顧問以訊息數計算，
          第二段選書的呼叫（`book_chat_pick`）不計入。另外，已計費但失敗的呼叫（例如內容遭阻擋、輸出被截斷或格式不正確）
          每人每日每項功能最多 10 次，達上限同樣回傳 429 `AI_DAILY_LIMIT`；上限為 0 時兩者都不限制
        - `limits.monthly_budget_usd` 為 0 ~ 100000，0 代表不設上限
        - 模型名稱符合 `^[A-Za-z0-9._:\-/]{1,80}$`
        - `features.*.provider` 為 `deepseek`、`gemini`、`openai` 或 null（null 代表使用 `default_provider`）

        需 `X-Verify-Token`（`admin` 範圍，只接受帳號的登入密碼或通行密鑰），並寫入管理員操作紀錄（列出變更的欄位）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: '#/components/schemas/AiSettings' }
      responses:
        '200':
          description: 已更新，回傳內容與 GET 相同。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已更新 AI 設定 }
                  data: { $ref: '#/components/schemas/AdminAiSettingsPayload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminVerificationRequired' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/admin/ai/test:
    post:
      summary: 測試服務商連線
      operationId: adminTestAiProvider
      tags: [admin-ai]
      description: |
        同時送出三項極短的請求，用量記錄為 `test`（每項各一筆）：

        | `checks[].name` | 內容 | 通過條件 |
        | --- | --- | --- |
        | `text` | 要求回覆「連線成功」 | 有回覆文字 |
        | `json` | 要求輸出 `{"status":"ok"}` | 回傳可解析的 JSON 物件且內容相符 |
        | `image` | 附上一張紅色方塊圖片，詢問顏色 | 回覆含「紅」或 red；服務商不支援照片辨識時為 `skipped` |

        `model` 可帶入尚未儲存的模型名稱（例如管理員剛修改、尚未按儲存），規則與設定相同（`^[A-Za-z0-9._:\-/]{1,80}$`），
        不符合時回傳 400；未提供時使用已儲存的模型。測試不會改動設定，費用依已儲存的單價計算。

        服務商失敗時仍回傳 200：`ok` 為所有未略過的項目皆通過，`error` 為第一個失敗項目的名稱與原因
        （例如「JSON：回應格式不正確」「純文字：模型名稱不存在」「圖片辨識：回覆與測試圖片不符」）。`latency_ms` 與 `reply` 為文字項目的結果。
        未設定金鑰時不送出請求，`checks` 為空陣列。每位管理員 10 分鐘最多 20 次。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [deepseek, gemini, openai] }
                model: { type: string, maxLength: 80, description: 尚未儲存的模型名稱；未提供時使用已儲存的模型。, example: gemini-3.1-flash-lite }
      responses:
        '200':
          description: 測試完成。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean, example: true }
                      provider: { type: string, example: gemini }
                      model: { type: string, example: gemini-3.1-flash-lite }
                      latency_ms: { type: integer, example: 820 }
                      reply: { type: string, example: 連線成功 }
                      error: { type: string, example: 圖片辨識：回覆與測試圖片不符 }
                      checks:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string, enum: [text, json, image] }
                            status: { type: string, enum: [ok, failed, skipped] }
                            latency_ms: { type: integer, example: 820 }
                            error: { type: string, nullable: true, example: 回應格式不正確 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/ai/usage:
    get:
      summary: AI 用量報表
      operationId: adminGetAiUsage
      tags: [admin-ai]
      description: |
        期間以伺服器當地時間計算：`today` 為今日、`7d` 與 `30d` 含今日往前推、`month` 為本月 1 日起。

        費用於呼叫當下依設定的單價計算並記錄；網路搜尋只計超出每月免費額度的次數。
        服務商已計費的失敗（內容遭阻擋、輸出被截斷或格式不正確）也記錄用量與費用，所有錯誤都記錄實際等待的時間。
        `daily` 一定包含期間內每一天（無用量的日期為 0）。`top_users` 最多 5 位，只提供公開會員編號。
        `projected_month_cost_usd` 依本月已經過的時間比例推估整月費用。
        `by_provider` 的 `avg_latency_ms` 與 `p95_latency_ms` 只計算成功的呼叫，期間內沒有成功的呼叫時為 `null`。

        書籍顧問每則訊息的第一段（理解需求）記為 `book_chat`，第二段（選書）記為 `book_chat_pick`。
        格式錯誤的 `error_detail` 只記錄輸出長度與結束原因，不含模型輸出內容。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, 7d, 30d, month], default: month }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminAiUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/admin/ai/reviews:
    get:
      summary: 上架審核列表
      operationId: adminListAiReviews
      tags: [admin-ai]
      description: |
        AI 判定需人工確認的書籍。書籍在審核期間 `is_approved` 為 false，不會出現在公開列表；
        賣家端的書籍物件帶 `review_status: pending`。最多回傳 200 筆，依建立時間遞減。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAiReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/admin/ai/reviews/{bookId}:
    patch:
      summary: 處理上架審核
      operationId: adminDecideAiReview
      tags: [admin-ai]
      description: |
        - `approve`：`is_approved` 設為 true 並通知賣家。先前駁回而下架的書籍一併恢復上架；
          書籍登記存放於書櫃且已逾期時，存書天數自恢復上架時重新起算，不再提醒賣家取回（與管理員恢復上架相同）。
        - `reject`：`is_approved` 維持 false，販售中的書籍改為 `removed`，通知賣家並附上 `note`。
          駁回視同違規，賣家無法自行重新上架，須由管理員恢復上架；存書的書回報取回後不會自動恢復上架。

        透過「強制下架／恢復上架」恢復上架時，未結的審核會一併標記為通過。
        重複相同的處理回傳 409。寫入管理員操作紀錄。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string, maxLength: 500, example: 請勿於描述留下站外聯絡方式 }
      responses:
        '200':
          description: 已處理。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已核准上架 }
                  data:
                    type: object
                    properties:
                      book_id: { type: integer }
                      status: { type: string, enum: [approved, rejected] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

components:
  schemas:
    AiProviderPrices:
      type: object
      properties:
        model: { type: string, example: gemini-3.1-flash-lite }
        input_per_m: { type: number, description: 每百萬輸入 token 的美元單價, example: 0.25 }
        cached_input_per_m: { type: number, description: 每百萬快取輸入 token 的美元單價, example: 0.025 }
        output_per_m: { type: number, description: 每百萬輸出 token 的美元單價, example: 1.5 }
        search_price_per_k: { type: number, description: 每千次網路搜尋的美元單價, example: 14 }
        search_free_per_month: { type: integer, description: 每月免費搜尋次數, example: 5000 }

    AiSettings:
      type: object
      properties:
        enabled: { type: boolean, example: false }
        default_provider: { type: string, enum: [deepseek, gemini, openai], example: deepseek }
        providers:
          type: object
          properties:
            deepseek: { $ref: '#/components/schemas/AiProviderPrices' }
            gemini: { $ref: '#/components/schemas/AiProviderPrices' }
            openai: { $ref: '#/components/schemas/AiProviderPrices' }
        features:
          type: object
          properties:
            support:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, nullable: true, enum: [deepseek, gemini, openai] }
            listing_assist:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, nullable: true, enum: [deepseek, gemini, openai], example: gemini }
                web_search: { type: boolean, example: true }
            recommend:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, nullable: true, enum: [deepseek, gemini, openai] }
            moderation:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, nullable: true, enum: [deepseek, gemini, openai] }
                action:
                  type: string
                  enum: [review, block]
                  description: '`review` 可疑商品一律送人工審核；`block` 明確違規（信心 ≥ 0.85）直接拒絕上架，其餘送審。'
            book_chat:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, nullable: true, enum: [deepseek, gemini, openai] }
        limits:
          type: object
          properties:
            monthly_budget_usd: { type: number, description: 0 代表不設上限, example: 10 }
            daily_per_user:
              type: object
              properties:
                support: { type: integer, example: 30 }
                listing_assist: { type: integer, example: 15 }
                recommend: { type: integer, example: 5 }
                book_chat: { type: integer, description: 以訊息數計算, example: 20 }

    AdminAiSettingsPayload:
      type: object
      properties:
        settings: { $ref: '#/components/schemas/AiSettings' }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [deepseek, gemini, openai] }
              name: { type: string, example: Google Gemini }
              key_configured: { type: boolean }
              vision: { type: boolean }
              web_search: { type: boolean }
              default_model: { type: string, example: gemini-3.1-flash-lite }
              docs_url: { type: string, example: 'https://ai.google.dev/gemini-api/docs' }
        retrieval:
          type: object
          description: 語意檢索狀態。
          properties:
            ready: { type: boolean, description: 已設定 OpenAI 或 Gemini 金鑰且已執行 020。 }
            provider: { type: string, nullable: true, enum: [openai, gemini, null] }
            model: { type: string, nullable: true, example: text-embedding-3-small }
            counts:
              type: object
              description: 目前向量模型已建立的向量數，依種類區分（`book` 書籍、`knowledge` 客服知識段落）。
              additionalProperties: { type: integer }
              example: { book: 1240, knowledge: 86 }
            coverage:
              type: object
              description: |
                最近一次同步或查詢時，已建立最新向量的文件數與應建立的文件數，依種類區分。
                以下四個欄位為伺服器啟動後的狀態，重新啟動後清空。
              additionalProperties:
                type: object
                properties:
                  indexed: { type: integer, example: 1238 }
                  total: { type: integer, example: 1240 }
              example: { book: { indexed: 1238, total: 1240 }, knowledge: { indexed: 86, total: 86 } }
            last_sync_at: { type: string, format: date-time, nullable: true, description: 最近一次背景同步順利完成的時間。 }
            last_error:
              type: object
              nullable: true
              description: 最近一次嵌入服務錯誤。
              properties:
                at: { type: string, format: date-time }
                purpose: { type: string, enum: [sync, query], description: '`sync` 背景同步、`query` 使用者查詢' }
                code: { type: string, example: TIMEOUT }
                detail: { type: string, nullable: true, example: 連線逾時 }
            cooldown_until:
              type: object
              description: 因系統性錯誤或連續錯誤暫停呼叫嵌入服務的到期時間；未暫停時為 null。
              properties:
                sync: { type: string, format: date-time, nullable: true }
                query: { type: string, format: date-time, nullable: true }

    AdminAiUsage:
      type: object
      properties:
        period: { type: string, enum: [today, 7d, 30d, month] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        summary:
          type: object
          properties:
            requests: { type: integer }
            errors: { type: integer }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            search_calls: { type: integer }
            cost_usd: { type: number }
            month_cost_usd: { type: number }
            monthly_budget_usd: { type: number }
            budget_used_ratio: { type: number, example: 0.42 }
            projected_month_cost_usd: { type: number }
        by_feature:
          type: array
          items:
            type: object
            properties:
              feature: { type: string, enum: [support, listing_assist, recommend, moderation, book_chat, book_chat_pick, embedding, enrich, admin_assist, test] }
              requests: { type: integer }
              cost_usd: { type: number }
              input_tokens: { type: integer }
              output_tokens: { type: integer }
              errors: { type: integer }
        by_provider:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              model: { type: string }
              requests: { type: integer }
              cost_usd: { type: number }
              avg_latency_ms: { type: integer, nullable: true, description: 成功呼叫的平均延遲（毫秒）；沒有成功的呼叫時為 null。 }
              p95_latency_ms: { type: integer, nullable: true, description: 成功呼叫的第 95 百分位延遲（毫秒，最近排名法）；沒有成功的呼叫時為 null。 }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, example: '2026-09-01' }
              requests: { type: integer }
              cost_usd: { type: number }
              by_feature:
                type: object
                additionalProperties: { type: number }
                example: { support: 0.0123 }
        top_users:
          type: array
          items:
            type: object
            properties:
              user_public_id: { type: string, example: MB3K9QX7A }
              nickname: { type: string }
              requests: { type: integer }
              cost_usd: { type: number }
        recent_errors:
          type: array
          items:
            type: object
            properties:
              created_at: { type: string, format: date-time }
              feature: { type: string }
              provider: { type: string }
              model: { type: string, nullable: true }
              error_code: { type: string, example: QUOTA, description: 'AUTH、MODEL_NOT_FOUND、QUOTA、RATE_LIMITED、BAD_REQUEST、SERVER、TIMEOUT、NETWORK、INVALID_OUTPUT、INCOMPLETE、BLOCKED、NOT_CONFIGURED、INTERNAL，以及上架審核因預算用盡而略過時的 BUDGET_EXCEEDED' }
              error_detail: { type: string, nullable: true, description: 服務商回傳的錯誤說明（已遮蔽金鑰，最多 400 字）；格式錯誤與截斷只記錄輸出長度與結束原因。 }
        pending_reviews: { type: integer }

    AdminAiReview:
      type: object
      properties:
        book_id: { type: integer }
        book: { $ref: '#/components/schemas/Book' }
        seller: { $ref: '#/components/schemas/UserBrief' }
        verdict: { type: string, enum: [allow, review, reject] }
        reasons:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string, enum: [not_book, prohibited, adult, contact, misleading, price] }
        status: { type: string, enum: [pending, approved, rejected] }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
