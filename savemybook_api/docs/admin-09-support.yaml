tags:
  - name: 後台：客服與條款
    description: |
      法律文件、常見問題與客服工單。

      | 功能 | 所需權限 |
      | --- | --- |
      | 法律文件、常見問題 | `can_manage_announcements` |
      | 客服工單 | `can_manage_support` |

      管理員回覆工單使用 `POST /api/support/tickets/{id}/messages`，
      該端點依角色自動將 `is_staff` 設為 true，後台無須另設回覆端點。

paths:
  /api/admin/legal:
    get:
      summary: 法律文件列表
      operationId: adminListLegalDocs
      tags: [後台：客服與條款]
      description: |
        回傳全部法律文件，目前包含服務條款（`terms`）與隱私權政策（`privacy`），
        內容完整並附最後編輯者。需 `can_manage_announcements` 權限。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LegalDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/legal/{key}:
    put:
      summary: 更新法律文件
      operationId: adminUpdateLegalDoc
      tags: [後台：客服與條款]
      description: |
        以 upsert 寫入：`doc_key` 不存在時建立新文件。
        需 `can_manage_announcements` 權限。

        `notify` 為 true 時會逐一通知每位使用者。條款變更涉及全體使用者權益，
        因此採逐帳號寫入通知而非僅發布公告。為避免長時間鎖表，寫入以每 500 筆
        為一批分次執行。

        通知僅在內容確實變更時發送，判定方式為與既有 `content` 比對。
        僅異動標題或重複送出相同內容均不會發送通知。
        通知對象限 `is_active` 為 true 且未列入黑名單的帳號。

        > 此操作不可復原且影響全站，建議於用戶端加入二次確認。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string, enum: [terms, privacy] }
          description: '`terms` 為服務條款，`privacy` 為隱私權政策。'
          example: terms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 255, example: 服務條款 }
                content: { type: string, description: 純文字內容。 }
                notify:
                  type: boolean
                  default: false
                  description: 是否通知全體使用者。僅在內容確實變更時實際發送。
            example: { title: 服務條款, content: 第一條 ..., notify: true }
      responses:
        '200':
          description: 更新成功。`notified` 為實際通知的人數，未發送通知時為 0。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已更新並通知 1284 位使用者 }
                  data:
                    type: object
                    properties:
                      notified: { type: integer, description: 實際收到通知的人數, example: 1284 }
        '400':
          description: 標題或內容為空白。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未填標題:
                  value: { success: false, message: 請填寫標題 }
                未填內容:
                  value: { success: false, message: 請填寫內容 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/faqs:
    get:
      summary: 常見問題列表（含隱藏）
      operationId: adminListFaqs
      tags: [後台：客服與條款]
      description: |
        包含 `is_visible` 為 false 的項目，依分類、排序值、編號依序排序。
        需 `can_manage_announcements` 權限。

        前台的公開端點為 `GET /api/support/faqs`，僅回傳顯示中的項目。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Faq' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 新增常見問題
      operationId: adminCreateFaq
      tags: [後台：客服與條款]
      description: |
        `category` 為自由字串而非列舉，前台依此分組呈現，
        因此同組項目須填入相同值。未填時預設為 `general`。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer]
              properties:
                question: { type: string, maxLength: 255, example: 買家沒有取書怎麼辦？ }
                answer: { type: string, example: 超過七天未取書，系統會自動取消訂單並退款。 }
                category: { type: string, default: general, description: 自由字串，供分組使用。, example: trade }
                sort_order: { type: integer, default: 0 }
                is_visible: { type: boolean, default: true }
      responses:
        '201':
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      faq_id: { type: integer, example: 12 }
        '400':
          description: 問題或答案為空白。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 問題與答案都要填寫 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/faqs/reorder:
    put:
      summary: 調整常見問題順序
      operationId: adminReorderFaqs
      tags: [後台：客服與條款]
      description: |
        依 `order` 陣列的位置重寫 `sort_order`，第一筆為 0、依序遞增。
        整批寫在同一個交易中，中途失敗不會留下一半新一半舊的順序。

        **限同一分類**：前台依 `category` 分區呈現，排序值只在分區內比較，
        因此送出的項目必須同屬一個分類；混入其他分類會回傳 400。
        欲調整分類本身的前後關係，請改用 `PUT /api/admin/faqs/{id}` 修改 `category`。

        需 `can_manage_announcements` 權限。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  minItems: 1
                  description: 該分類全部常見問題的編號，依想要的顯示順序排列。
                  items: { type: integer }
                  example: [12, 9, 15, 3]
      responses:
        '200':
          description: 已更新順序。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新順序 }
        '400':
          description: |
            `order` 非陣列或為空、含有重複或非整數的編號、
            含有不存在的問題，或混入了不同分類的問題。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                空陣列: { value: { success: false, message: 請提供排序後的問題順序 } }
                格式錯誤: { value: { success: false, message: 排序資料格式不正確 } }
                編號不存在: { value: { success: false, message: 排序資料含有不存在的問題 } }
                跨分類: { value: { success: false, message: 一次只能排序同一個分類 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/faqs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 常見問題編號。
        example: 12

    put:
      summary: 編輯常見問題
      operationId: adminUpdateFaq
      tags: [後台：客服與條款]
      description: |
        整筆覆蓋：未帶入的欄位將回復為預設值，即 `category` 為 `general`、
        `sort_order` 為 0、`is_visible` 為 true。請務必送出完整內容。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer]
              properties:
                question: { type: string, maxLength: 255 }
                answer: { type: string }
                category: { type: string, default: general }
                sort_order: { type: integer, default: 0 }
                is_visible: { type: boolean, default: true }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新 }
        '400':
          description: 問題或答案空白。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 問題與答案都要填寫 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除常見問題
      operationId: adminDeleteFaq
      tags: [後台：客服與條款]
      description: |
        永久刪除。如僅需暫時隱藏，建議改將 `is_visible` 設為 false。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/tickets:
    get:
      summary: 客服工單列表
      operationId: adminListTickets
      tags: [後台：客服與條款]
      description: |
        依最後更新時間遞減排序，上限 100 筆，無分頁機制。
        需 `can_manage_support` 權限。

        `last_message` 為最新一則訊息。前台的 `GET /api/support/tickets`
        回傳的是第一則訊息，兩者定義不同。

        完整對話請查詢 `GET /api/support/tickets/{id}`，
        回覆請使用 `POST /api/support/tickets/{id}/messages`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, pending, resolved, closed, all] }
          description: |
            篩選狀態。`open` 待處理、`pending` 已回覆待使用者確認、
            `resolved` 已解決、`closed` 已結案。
            帶入 `all` 或未帶入代表不套用此條件。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/SupportTicket'
                        - type: object
                          properties:
                            last_message:
                              type: string
                              nullable: true
                              description: 最新一則訊息的內容。
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/tickets/{id}/status:
    patch:
      summary: 調整工單狀態
      operationId: adminUpdateTicketStatus
      tags: [後台：客服與條款]
      description: |
        手動變更工單狀態。需 `can_manage_support` 權限。
        操作會通知開單者並寫入稽核紀錄。

        設為 `closed` 時寫入結案時間；設為其他狀態時將結案時間清為 null，
        等同重新開啟工單，使用者可繼續回覆。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, pending, resolved, closed] }
            example: { status: resolved }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已更新 }
        '400':
          description: 狀態值不合法。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 不支援的工單狀態 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
