tags:
  - name: users
    x-displayName: 使用者
    description: |
      註冊、個人檔案、頭像、密碼、會員等級與個人 QR Code。

      端點分為兩組：

      - `/api/users/me/*` 一律操作請求者自身的資料，身分取自 Token，無須帶入 ID。
      - `/api/users/{id}` 為早期的泛用端點，僅本人或管理員可異動。

paths:
  /api/users:
    post:
      summary: 註冊新帳號
      operationId: register
      tags: [users]
      description: |
        建立帳號，密碼以 bcrypt（10 rounds）雜湊後儲存。身分一律為 `buyer_seller`，
        請求中帶入的 `role` 會被忽略；管理員身分只能由後台授予。

        | 欄位 | 規則 |
        | --- | --- |
        | `email` | 合法 Email 格式，儲存前轉為小寫 |
        | `password` | 8 字元以上，須同時包含英文字母與數字，UTF-8 不超過 72 位元組 |
        | `nickname` | 2 ~ 50 字 |

        同一 IP 每小時最多註冊 30 次，超過回傳 429。

        帶入 `accept_legal: true`（使用者已勾選同意條款）時，會記錄當下服務條款與隱私權政策的版本，
        之後文件有重大更新才會再要求同意。

        註冊成功不會自動登入，用戶端須另行呼叫 `POST /api/auth/login` 取得 Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname]
              properties:
                email:
                  type: string
                  format: email
                  description: 須為尚未註冊的 Email。
                  example: newuser@example.com
                password: { type: string, format: password, minLength: 8, example: my_password123 }
                nickname: { type: string, minLength: 2, maxLength: 50, example: 小明 }
                accept_legal: { type: boolean, example: true, description: 使用者已勾選同意服務條款與隱私權政策。 }
      responses:
        '201':
          description: 建立成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 使用者建立成功 }
                  data: { $ref: '#/components/schemas/User' }
        '400':
          description: 欄位缺漏、格式錯誤，或 Email 已被註冊。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                欄位缺漏:
                  value: { success: false, message: '缺少必要欄位：email, password或 nickname' }
                Email 重複:
                  value: { success: false, message: 該 Email 已經被註冊過了 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

    get:
      summary: 取得所有使用者
      operationId: listUsers
      tags: [users]
      description: |
        回傳使用者清單（最多 1000 筆），不含密碼雜湊等內部欄位。此為早期開發階段保留的端點，
        僅限具備 `can_manage_members` 權限的管理員呼叫。

        > 管理後台請改用 `GET /api/admin/members`，該端點提供分頁、搜尋
        > 與統計欄位，並受細部權限保護。
      deprecated: true
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/stats:
    get:
      summary: 取得個人統計數字
      operationId: getMyStats
      tags: [users]
      description: |
        一次回傳會員中心首頁所需的全部統計數字。

        `book_count` 僅計入狀態為 `on_sale` 與 `reserved` 的書籍，
        已售出與已下架者不計入。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      balance: { type: string, description: 代幣餘額。尚未建立錢包時回傳 0。, example: '1250.00' }
                      book_count: { type: integer, description: 上架中的書籍數, example: 4 }
                      favorite_count: { type: integer, description: 收藏數, example: 12 }
                      unread_notification_count: { type: integer, example: 3 }
                      cart_count: { type: integer, description: 購物車項目數, example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/level:
    get:
      summary: 取得會員等級與點數
      operationId: getMyLevel
      tags: [users]
      description: |
        點數計算方式：

        ```
        points = max(0, 完成訂單數 × 10 + bonus_points)
        ```

        `bonus_points` 為管理員調整的補正值，可為負數，
        調整端點為 `PATCH /api/admin/members/{id}/level`。

        `current_level` 為點數已達門檻的最高等級；`next_level` 為下一個尚未達成的
        等級，已達最高等級時為 `null`。

        > 呈現升級進度時應以本級區間計算，即
        > `(points − current_level.min_points) / (next_level.min_points − current_level.min_points)`。
        > 直接以 `points / next_level.min_points` 計算會使高等級的進度恆近滿格。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      points: { type: integer, description: 目前總點數, example: 320 }
                      completed_orders: { type: integer, description: 以買家身分完成的訂單數, example: 32 }
                      current_level:
                        allOf: [{ $ref: '#/components/schemas/MemberLevel' }]
                        nullable: true
                      next_level:
                        allOf: [{ $ref: '#/components/schemas/MemberLevel' }]
                        nullable: true
                        description: 已達最高等級時為 null。
                      points_to_next: { type: integer, description: 距離下一等級所需點數，已達最高等級時為 0, example: 180 }
                      levels:
                        type: array
                        description: 全部等級，依 min_points 遞增排序。
                        items: { $ref: '#/components/schemas/MemberLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me:
    put:
      summary: 更新個人檔案
      operationId: updateMyProfile
      tags: [users]
      description: |
        部分更新：僅異動請求中帶入的欄位，其餘維持原值。

        `gender` 帶入未列於列舉的值時將被忽略，不回傳錯誤。
        `birthday` 帶入空字串或 `null` 代表清除生日。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 50, example: 小明 }
                bio: { type: string, example: 喜歡看推理小說 }
                phone: { type: string, example: '0912345678' }
                birthday: { type: string, format: date, nullable: true, example: '1999-09-14' }
                gender: { type: string, enum: [male, female, other, undisclosed] }
                avatar_url:
                  type: string
                  description: 一般無須帶入，請改用 `POST /api/users/me/avatar` 上傳。
            example: { nickname: 小明, bio: 喜歡看推理小說, birthday: '1999-09-14', gender: male }
      responses:
        '200':
          description: 更新成功，回傳異動後的公開欄位。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 個人檔案已更新 }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/avatar:
    post:
      summary: 上傳個人頭像
      operationId: uploadMyAvatar
      tags: [users]
      description: |
        上傳圖片並同步將 `avatar_url` 寫回使用者資料，無須另行呼叫更新個人檔案。

        檔案存放於 `/uploads/avatars/`，檔名由時間戳與隨機碼組成。
        回傳為相對路徑，用戶端須自行組合 API origin。舊有的頭像檔案不會刪除。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary, description: 圖片檔。用戶端應先裁切為正方形再上傳。 }
      responses:
        '200':
          description: 上傳成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 頭像已更新 }
                  data: { $ref: '#/components/schemas/User' }
        '400':
          description: 未帶入檔案。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請選擇要上傳的圖片 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/password:
    put:
      summary: 更改密碼
      operationId: changeMyPassword
      tags: [users]
      description: |
        須通過目前密碼驗證。新密碼規則與註冊相同：8 字元以上，須同時包含英文字母與數字，
        且不得與目前密碼相同。每位使用者 15 分鐘內最多嘗試 10 次。

        變更後，這個帳號先前簽發的所有 Token 立即失效（其他裝置會收到 401 `TOKEN_REVOKED`），
        其他裝置的工作階段一併登出。回應附上一組新 Token，沿用目前裝置的工作階段，
        用戶端須取代本機儲存的舊 Token。

        這個帳號的全部推播裝置（含目前裝置）同時清除，App 取得新 Token 後須重新呼叫
        `POST /api/push/devices` 登記。

        目前密碼錯誤回傳 400 而非 401，避免用戶端誤判為登入失效而登出。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, example: old_password123 }
                new_password: { type: string, format: password, minLength: 8, example: new_password456 }
      responses:
        '200':
          description: 密碼已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 密碼已更新，其他裝置需要重新登入 }
                  data:
                    type: object
                    properties:
                      token: { type: string, description: 取代舊 Token 的新 Token。 }
        '400':
          description: 欄位缺漏、新密碼不符規則，或目前密碼錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                欄位缺漏:
                  value: { success: false, message: 請填寫目前密碼與新密碼 }
                密碼太短:
                  value: { success: false, message: 新密碼長度至少 8 個字元 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/qrcode:
    get:
      summary: 取得個人分享 QR Code 資料
      operationId: getMyQrCode
      tags: [users]
      description: |
        回傳供編碼為 QR Code 的網址。伺服器不產生圖片，圖像由用戶端自行繪製。

        `qr_data` 採用 `https://` 連結而非 `savemybook://` 自訂 scheme，
        以確保裝置內建相機可正常辨識。掃描後開啟 `GET /u/{id}` 公開網頁，
        再由該頁面提供 deep link 導向應用程式。

        網址的 origin 取自環境變數 `PUBLIC_WEB_URL`；未設定時回退為本 API 的 origin。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer, example: 12 }
                      nickname: { type: string, example: 小明 }
                      avatar_url: { type: string, nullable: true }
                      qr_data:
                        type: string
                        description: 供編碼為 QR Code 的完整網址。
                        example: https://api.savemybook.today/u/12
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/share/{token}:
    get:
      summary: 以分享權杖取得使用者
      operationId: getUserByShareToken
      tags: [users]
      description: |
        App 掃描個人 QR Code（`https://<host>/u/<token>`）或開啟 `savemybook://u/<token>` 時，
        以權杖換取公開資料，回傳欄位與查詢他人時相同。停權、黑名單或已刪除的帳號回傳 404。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: 使用者編號。
        example: 12

    get:
      summary: 取得指定使用者
      operationId: getUserById
      tags: [users]
      description: |
        任何已登入者皆可查詢。查詢本人或由管理員查詢時回傳完整個人檔案；
        查詢他人時僅回傳 `user_id`、`nickname`、`avatar_url`、`bio`、`role`、`created_at`，
        不含 Email、電話與生日。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      summary: 更新指定使用者
      operationId: updateUserById
      tags: [users]
      description: |
        僅本人或管理員可異動，可更新的欄位少於 `PUT /api/users/me`。

        > 一般情況請使用 `PUT /api/users/me`，該端點支援生日、性別等完整欄位。
      deprecated: true
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                bio: { type: string }
                phone: { type: string }
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 使用者資料更新成功 }
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 嘗試異動他人資料。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 存取被拒，您無權限修改他人的資料 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: 刪除使用者
      operationId: deleteUserById
      tags: [users]
      description: |
        自資料表實際刪除，非軟刪除。僅限具備 `can_manage_members` 權限的管理員執行，
        且不得刪除自己或其他管理員。一般使用者刪除帳號請使用 `POST /api/users/me/deletion`。

        帳號若仍有進行中的訂單或其他關聯資料，回傳 409。

        > 管理後台停用帳號請改以 `PATCH /api/admin/members/{id}` 將
        > `is_active` 設為 false，不應執行實際刪除。

        需 `sensitive` 範圍的身分驗證（`X-Verify-Token` 標頭）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 使用者已成功刪除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminVerificationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 存在進行中的訂單或其他關聯資料，無法刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此使用者仍有訂單等關聯資料，請改用停權或匿名化 }
        '500': { $ref: '#/components/responses/ServerError' }
