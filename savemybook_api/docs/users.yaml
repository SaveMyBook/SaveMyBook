tags:
  - name: 使用者 (Users)
    description: 處理使用者相關操作的 API 端點 (包含註冊、查詢、修改與刪除)

components:
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: integer
          description: 系統自動產生的使用者 ID
        email:
          type: string
          description: 使用者的電子郵件 (必須是唯一的)
        nickname:
          type: string
          description: 使用者顯示的暱稱
        role:
          type: string
          description: 使用者的身分權限 (例如：buyer_seller, admin 等，需符合資料庫列舉值)
        bio:
          type: string
          description: 使用者的個人簡介
        phone:
          type: string
          description: 使用者的聯絡電話
        created_at:
          type: string
          format: date-time
          description: 帳號建立的時間

paths:
  /api/users:
    get:
      summary: 取得所有使用者
      tags: [使用者 (Users)]
      description: 從資料庫中撈取所有使用者的列表資料。需要 JWT Token。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功取得使用者列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: 存取被拒，未提供 Token
        '500':
          description: 伺服器發生錯誤
          
    post:
      summary: 新增使用者 (註冊)
      tags: [使用者 (Users)]
      description: 建立一名新的使用者。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - nickname
              properties:
                email:
                  type: string
                  example: "test@example.com"
                password:
                  type: string
                  example: "your_password123"
                nickname:
                  type: string
                  example: "王小明"
                role:
                  type: string
                  default: buyer_seller
                  example: "buyer_seller"
      responses:
        '201':
          description: 使用者建立成功
        '400':
          description: 請求失敗 (可能原因：缺少必填欄位、Email 已被註冊)
        '500':
          description: 伺服器發生錯誤

  /api/users/{id}:
    get:
      summary: 根據 ID 取得特定使用者
      tags: [使用者 (Users)]
      description: 傳入 user_id 來取得該名使用者的詳細資料。需要 JWT Token。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: 使用者的 ID (user_id)
      responses:
        '200':
          description: 成功取得使用者資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: 存取被拒，未提供 Token
        '404':
          description: 找不到該使用者
        '500':
          description: 伺服器發生錯誤
          
    put:
      summary: 更新使用者資料
      tags: [使用者 (Users)]
      description: 更新特定使用者的基本資料。需要 JWT Token，且只能修改自己的資料。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: 要更新的使用者 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  example: "新暱稱"
                bio:
                  type: string
                  example: "這是一段新的個人簡介。"
                phone:
                  type: string
                  example: "0912345678"
      responses:
        '200':
          description: 使用者資料更新成功
        '401':
          description: 存取被拒，未提供 Token
        '403':
          description: 無權限修改他人的資料
        '400':
          description: 提供的資料格式錯誤
        '404':
          description: 找不到該使用者
        '500':
          description: 伺服器發生錯誤
          
    delete:
      summary: 刪除使用者
      tags: [使用者 (Users)]
      description: 刪除該名使用者。需要 JWT Token，且只能刪除自己的帳號。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: 要刪除的使用者 ID
      responses:
        '200':
          description: 使用者已成功刪除
        '401':
          description: 存取被拒，未提供 Token
        '403':
          description: 無權限刪除他人的資料
        '404':
          description: 找不到該使用者
        '500':
          description: 伺服器發生錯誤