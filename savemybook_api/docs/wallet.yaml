tags:
  - name: 錢包 (Wallet)
    description: |
      站內代幣錢包，1 代幣等值 1 元。

      餘額變動來源共五種：購書扣款、售出入帳、取消退款、爭議退款，
      以及管理員調整。每筆異動皆寫入 `wallet_transactions` 並記錄異動後餘額，
      帳務具完整可追溯性。

      系統目前未提供儲值與提領端點，代幣由管理員透過
      `POST /api/admin/wallets/{userId}/adjust` 發放。

paths:
  /api/wallet:
    get:
      summary: 取得錢包餘額
      operationId: getWallet
      tags: [錢包 (Wallet)]
      description: |
        首次呼叫時若尚未建立錢包，系統會自動建立（餘額為 0），因此不會回傳 404。

        `pending_income` 為待定收益，即已售出但訂單尚未完成的金額總和。
        該金額尚未計入 `balance`，須待訂單完成後始行轉入。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Wallet'
                      - type: object
                        properties:
                          pending_income:
                            type: string
                            description: 待入帳金額，即訂單狀態為 pending_payment、pending_deposit、deposited 或 pending_pickup 的售出總額。
                            example: '360.00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/wallet/transactions:
    get:
      summary: 取得交易紀錄
      operationId: listWalletTransactions
      tags: [錢包 (Wallet)]
      description: |
        依異動時間遞減排序。異動若關聯至訂單，會一併帶出訂單編號與首本書籍的
        書名與封面，避免用戶端另行查詢。

        金額的正負號代表收支方向：支出為負值，收入為正值。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/WalletTransaction'
                        - type: object
                          properties:
                            orders:
                              type: object
                              nullable: true
                              description: 關聯訂單，僅含首個項目的書名與封面。
                              properties:
                                order_id: { type: integer }
                                order_no: { type: string }
                                order_items:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      books:
                                        type: object
                                        properties:
                                          title: { type: string }
                                          book_images:
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                image_url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/wallet/pending:
    get:
      summary: 取得待定收益明細
      operationId: listPendingIncome
      tags: [錢包 (Wallet)]
      description: |
        列出已售出但款項尚未入帳的訂單，即狀態為 `pending_payment`、
        `pending_deposit`、`deposited` 或 `pending_pickup` 的銷售訂單。

        供賣家掌握待存書與待取件的訂單。無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  total_amount: { type: number, description: 上述訂單的金額總和, example: 720 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
