tags:
  - name: chat
    x-displayName: 聊天室
    description: |
      一對一聊天與群組聊天，支援文字、圖片、語音、商品卡片、書籍預約、代幣轉帳與請款。

      兩位使用者之間僅存在單一一對一聊天室。自不同商品進入聊天時不會另建聊天室，
      而是於既有對話中插入一則商品卡片，以維持對話脈絡完整。

      ## Rooms

      | | 一對一（`direct`） | 群組（`group`） |
      | --- | --- | --- |
      | 建立 | `POST /api/chat/rooms` | `POST /api/chat/groups` |
      | 成員 | 固定為雙方 | 1 至 100 人，建立者為管理員（`owner`），可有多位管理員；任何成員可邀請，僅管理員可移除一般成員與變更權限 |
      | 標題 | 自訂暱稱，未設定時為對方暱稱 | 群組名稱（1 至 50 字） |
      | 刪除 | `DELETE /api/chat/rooms/{id}` 刪除雙方的聊天室 | 同一端點等同退出群組；最後一位成員退出時刪除聊天室 |
      | 預約、商品卡片、封鎖 | 支援 | 不支援，封鎖關係不影響群組 |
      | 轉帳與請款 | 對象預設為對方 | 須指定成員 |

      所有聊天室端點皆以成員身分驗證，已退出或被移除的群組成員回傳 403。
      群組的建立、改名、變更頭貼、邀請、移除、退出與管理員變更會插入一則 `notice` 訊息。
      最後一位管理員退出時由加入最早的成員接任。

      伺服器尚未執行 `migrations/010_chat_mentions_albums.sql` 時，帶有提及的訊息回傳 503 `CHAT_V3_UNAVAILABLE`，
      群組可見範圍改以加入時間判斷；相簿不受影響。

      **釘選**與**自訂暱稱**僅影響請求者本人：每人最多釘選 10 個聊天室；自訂暱稱為 1 至 30 字，
      一對一與群組共用，套用於聊天室標題、訊息的 `meta.aliases`、列表的發送者名稱與推播的發送者名稱。

      伺服器尚未執行 `migrations/009_chat_groups_transfers.sql` 時，一對一聊天照常運作（列表的 `pinned` 固定為 false），
      群組、釘選、自訂暱稱、編輯訊息與轉帳相關端點回傳 503 `CHAT_V2_UNAVAILABLE`。

      ## Message Kinds

      每則訊息除資料表原始欄位外，另帶伺服器解析後的 `kind`、`body`、`payload`，
      用戶端依 `kind` 渲染即可，不必解析 `content`。

      | `kind` | 說明 | 產生方式 |
      | --- | --- | --- |
      | `text` | 文字 | `POST /api/chat/rooms/{roomId}/messages` |
      | `image` | 圖片 | 先上傳至 `POST /api/uploads/chat-image`，再送出訊息 |
      | `album` | 相簿（2 至 20 張圖片） | 逐張上傳至 `POST /api/uploads/chat-image`，再以 `message_type: album` 送出 |
      | `voice` | 語音，最長 120 秒 | 先上傳至 `POST /api/uploads/voice`，再送出訊息 |
      | `book` | 商品卡片 | `POST /api/chat/rooms` 帶入 `book_id` |
      | `reservation` | 預約卡片 | `POST /api/chat/rooms/{roomId}/reservations` |
      | `transfer` | 轉帳或請款卡片 | `POST /api/chat/rooms/{roomId}/transfers`、`POST /api/chat/rooms/{roomId}/transfer-requests` |
      | `recalled` | 已收回的訊息 | `POST /api/chat/rooms/{roomId}/messages/{messageId}/recall` |
      | `notice` | 系統訊息 | 伺服器產生 |

      文字訊息可於送出後 15 分鐘內由本人編輯；文字、圖片、相簿、語音可於 1 小時內由本人收回。

      各 `kind` 對應的 `body` 與 `payload` 格式見 `ChatMessage` 結構。

      ## Polling

      App 在聊天畫面中定期以 `after_id` 帶入目前最新一則的 `message_id` 取得新訊息，
      並依回應的 `meta` 更新介面：

      | 欄位 | 用途 |
      | --- | --- |
      | `read_upto` | 一對一：對方已讀到的、請求者所發送的最後一則訊息編號。群組：其他成員中最大的已讀位置 |
      | `my_last_read_message_id` | 群組：請求者本次標記前的已讀位置，用來放置未讀分隔線；一對一為 `null` |
      | `members_read` | 其他成員的已讀位置，群組用來顯示「已讀 N」；一對一為對方一筆 |
      | `partner_typing` | 一對一：對方是否正在輸入 |
      | `typing_user_ids` | 正在輸入的其他成員 |
      | `aliases` | 請求者為相關成員設定的自訂暱稱，鍵為使用者編號 |
      | `edited` | 近 20 分鐘內被編輯的文字訊息（含更新後的 `mentions`），僅增量更新模式有值，用來替換畫面上已顯示的內容 |
      | `recalled_ids` | 近 70 分鐘內送出（收回時限加 10 分鐘）、之後被收回的訊息編號，用來替換畫面上已顯示的內容 |
      | `reservations` | 一對一雙方之間最近 30 筆預約的最新狀態，用來更新預約卡片；群組為空陣列 |
      | `transfers` | 此聊天室最近 30 筆轉帳與請款的最新狀態，用來更新轉帳卡片 |
      | `room` | 聊天室標題、頭貼與成員數，每次回應皆帶入，用來更新畫面標題 |

      載入歷史訊息時改用 `before_id` 帶入目前最舊一則的 `message_id`，`has_more` 為 false 時停止。

      ## History

      群組成員僅能看到自己加入後的訊息：建立群組時自「建立了群組」的 `notice` 起算，受邀加入（含退出後再次受邀）時
      自該次邀請的 `notice` 起算。可見範圍套用於所有取得訊息的模式、`recalled_ids`、`edited`、`transfers`、
      回覆摘要（原訊息不可見時 `kind` 為 `deleted`）、聊天室列表的最新訊息與未讀數，以及未讀總數。
      回覆、編輯或收回可見範圍之前的訊息，分別回傳 400「找不到要回覆的訊息」與 404。一對一聊天室不受影響。

      ## Mentions

      群組的文字訊息可提及成員。App 於輸入框插入 `@暱稱` 文字，送出時以 `mentions` 標示每段提及文字的位置：

      - 每筆為 `{ user_id, start, length }`，`user_id` 為 `0` 代表提及所有人；最多 20 筆
      - `start`、`length` 以 UTF-16 code unit 計算（與 Dart `String.length` 相同），`length` 為 1 至 60，範圍內的文字須以 `@` 開頭
      - 各範圍不可重疊；同一成員可於不同位置重複提及。回應依 `start` 排序
      - 被提及者須為請求者以外的現任成員
      - `content` 的前後空白會被去除，位置以送出的原始內容計算，伺服器會自動換算

      違反上述規則回傳 400「提及的成員資料不正確」；一對一聊天室帶入提及回傳 400「僅群組聊天室可提及成員」；
      圖片、相簿、語音帶入提及回傳 400「僅文字訊息可提及成員」。

      被提及的成員（提及所有人時為除發送者外的全部現任成員）收到內文為「{發送者} 提及了您：{預覽}」的通知，
      即使已將聊天室設為靜音仍會發送手機推播，推播 `data.mentioned` 為 `"1"`；其他成員維持「{發送者}：{預覽}」並依靜音設定。
      聊天室列表的 `mention_unread` 表示是否有尚未讀取的提及。編輯訊息時可更新提及，但不再發送通知；收回時一併清除。

      ## Reservations

      買家可在與賣家的聊天室中預約對方的書，請賣家保留一段時間。

      ```
      pending ──(賣家接受)──→ confirmed ──(超過 pickup_deadline)──→ expired
         │                     └──(任一方取消)──→ cancelled
         ├──(賣家婉拒／任一方取消)──→ cancelled
         └──(24 小時未回覆)──→ expired
      ```

      - 賣家接受後，`pickup_deadline` 為接受時間加上買家申請的 `hours`（24、48 或 72 小時）。
      - 保留期間書籍狀態仍為 `on_sale`，但其他使用者加入購物車或結帳時回傳 409 `BOOK_RESERVED`；
        預約的買家可正常購買。
      - 賣家接受一筆預約時，同一本書其他 `pending` 的預約自動取消，並通知這些買家。
      - 每位買家同時最多 5 筆 `pending` 或 `confirmed` 的預約，同一本書不能重複申請。
      - 到期由伺服器排程約每 5 分鐘處理一次，書籍仍在架上時通知買家。
      - 建立、接受、婉拒、取消時皆以 `reservation` 類型的站內通知告知對方。

      ## Mute and Block

      - **靜音**僅影響請求者本人：該聊天室的新訊息仍會建立站內通知並計入未讀，但不發送手機推播。
        預約相關通知不受靜音影響。
      - **封鎖**以使用者為單位，封鎖後雙方皆無法在彼此的聊天室傳送訊息、建立預約，也不會看到對方的輸入中狀態。
        既有訊息保留。
      - 封鎖者傳送時回傳 403 `CHAT_BLOCKED`；被封鎖者傳送時回傳與對方帳號停用相同的 400 `RECIPIENT_UNAVAILABLE`，
        不透露自己已被封鎖。
      - 取得訊息時 `meta.can_send` 綜合上述狀態，用戶端可據此停用輸入欄位。
      - 封鎖僅作用於一對一聊天室；群組中的訊息、轉帳與請款不受封鎖影響。群組亦可設定靜音。

      ## Transfers

      成員之間可在聊天室中轉帳代幣或請款，金額為 1 至 100000 的整數，備註上限 100 字。
      直接轉帳與支付請款須帶 `payment` 範圍的 `X-Verify-Token`（見「Verification」一節），
      扣款、入帳、狀態更新與卡片訊息在同一個資料庫交易中完成。

      ```
      transfer：建立即 completed
      request： pending ──(付款方付款)──→ completed
                   ├──(付款方婉拒)──→ declined
                   ├──(請款人取消)──→ cancelled
                   └──(72 小時未處理)──→ expired
      ```

      - 付款方與收款方的錢包各寫入一筆 `transfer_out`、`transfer_in` 交易紀錄。
      - 直接轉帳與請款通知對方；付款與婉拒通知請款人；取消不通知。通知類型為 `message`，關聯 `chat_room`。
      - 請款狀態已被處理（含並行的重複付款）時回傳 409 `TRANSFER_STATE_CHANGED`，不會重複扣款。
      - 一對一時，任一方封鎖另一方的錯誤與傳送訊息相同；對方帳號停用時回傳 400 `RECIPIENT_UNAVAILABLE`。
      - 顯示給使用者的編號請使用 `transfer_no`。

      ## Link Previews

      文字訊息中的網址由 App 呼叫 `GET /api/chat/link-preview` 取得預覽卡片資料，App 不直接連線至第三方網站，
      以免暴露使用者 IP。回傳 `data: null` 時不顯示卡片。

      - 僅抓取 `http`、`https` 且連接埠為 80 或 443 的網址，不接受含帳號密碼的網址。
      - 解析 DNS 後檢查全部位址，任一位址屬於私有、保留、迴路、連結本機、多播或雲端中繼資料範圍（含 IPv4-mapped IPv6、NAT64）即拒絕；
        實際連線綁定已檢查的位址，避免 DNS rebinding。最多轉址 3 次，每次轉址重新檢查。
      - 逾時 5 秒；HTML 最多讀取 1 MB（含解壓縮後），僅處理 `text/html`。
      - 標題取自 `og:title`、`twitter:title`、`<title>`，描述取自 `og:description`、`twitter:description`、`meta name=description`；
        清除 HTML 與控制字元，標題截為 120 字、描述截為 200 字。沒有標題時回傳 `null`。
      - `PUBLIC_WEB_URL` 主機的書籍分享連結（`/b/{share_token}`）不對外抓取，直接查詢資料庫，`kind` 為 `book`；
        書籍已下架、違規或賣家帳號不可用時回傳 `null`。同一主機的其他路徑一律回傳 `null`。
      - 一般網址的結果於伺服器記憶體快取（500 筆，成功 24 小時、失敗 10 分鐘），同一網址同時多個請求只抓取一次。
        書籍連結不快取，下架後立即反映。

      一般網址的 `image_url` 為 `GET /api/chat/link-preview/image` 的代理網址，以伺服器密鑰簽章，無法用來抓取任意網址。
      圖片套用相同的連線檢查，逾時 5 秒、上限 3 MB，只接受 `image/*`（不含 SVG），並以檔頭判斷實際格式。
      App 載入時須帶 `Authorization` 標頭。書籍卡片的 `image_url` 為站內 `/uploads/books/` 路徑。

paths:
  /api/chat/rooms:
    get:
      summary: 取得聊天室列表
      operationId: listChatRooms
      tags: [chat]
      description: |
        包含一對一與群組。已釘選的聊天室依釘選時間遞減排在最前，其餘依最後活動時間遞減排序。
        回應為整併後的格式而非資料表原始欄位，伺服器已判定對話對象並計算未讀則數。無分頁機制。

        `last_message.preview` 為伺服器產生的摘要，可直接顯示；`sender_id`、`sender_name` 與 `is_read`
        可用來顯示發送者前綴與已讀狀態。`mention_unread` 為 true 時可於列表顯示提及標示。
        群組的最新訊息與未讀數僅計入請求者可見範圍內的訊息。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatRoomSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 開啟（或建立）聊天室
      operationId: createChatRoom
      tags: [chat]
      description: |
        與指定使用者建立聊天。聊天室已存在時直接回傳既有的聊天室，
        不會重複建立，因此用戶端可於每次發起對話時直接呼叫。

        帶入 `book_id` 時會於對話中插入一則商品卡片（`kind` 為 `book`）以標示詢問標的。
        若相同卡片已是對話中的最後一則訊息，則不重複插入；書籍不存在時略過卡片。

        對方帳號已停權或列入黑名單時回傳 400 `RECIPIENT_UNAVAILABLE`。
        任一方封鎖另一方時不插入商品卡片；被對方封鎖且尚無聊天室時同樣回傳 400 `RECIPIENT_UNAVAILABLE`。

        回應僅含 `room_id`，取得後請呼叫
        `GET /api/chat/rooms/{roomId}/messages` 載入訊息。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, description: 對話對象的使用者編號，不得為請求者自身。, example: 8 }
                book_id:
                  type: integer
                  nullable: true
                  description: 帶入時於對話中插入該書籍的商品卡片。
                  example: 101
            example: { user_id: 8, book_id: 101 }
      responses:
        '200':
          description: 成功。新建聊天室與回傳既有聊天室皆為 200。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 7 }
        '400':
          description: 參數錯誤，或對方帳號無法接收訊息。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少參數:
                  value: { success: false, message: 請指定聊天對象 }
                對象為請求者自身:
                  value: { success: false, message: 無法與自己建立聊天室 }
                對方帳號停用:
                  value: { success: false, message: 對方帳號目前無法接收訊息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 對話對象不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到該使用者 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/unread-count:
    get:
      summary: 取得聊天未讀數
      operationId: getUnreadChatCount
      tags: [chat]
      description: |
        統計全部聊天室中尚未讀取的訊息總數，請求者自行發送的訊息不計入。
        一對一依訊息的已讀狀態計算；群組計算編號大於請求者已讀位置的訊息，已退出的群組不計入。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer, example: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/read-all:
    patch:
      summary: 所有聊天室標為已讀
      operationId: markAllChatRead
      tags: [chat]
      description: 將全部一對一聊天室中由對方發送的未讀訊息標記為已讀，並將請求者在各群組的已讀位置更新至最新訊息。此操作不可復原。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已全部標為已讀。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已全部標為已讀 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{id}:
    delete:
      summary: 刪除聊天室
      operationId: deleteChatRoom
      tags: [chat]
      description: |
        一對一聊天室：刪除範圍及於雙方，聊天室與其下全部訊息均自資料庫移除，
        並非僅自請求者的列表隱藏。此操作不可復原。僅聊天室的兩位成員可執行。

        群組：等同 `POST /api/chat/groups/{roomId}/leave`，回應訊息為「已退出群組」。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              examples:
                一對一:
                  value: { success: true, message: 已刪除聊天室 }
                群組:
                  value: { success: true, message: 已退出群組 }
        '400':
          description: 聊天室編號格式錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請提供聊天室編號 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者非該聊天室的成員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 你沒有權限刪除這個聊天室 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{roomId}/messages:
    parameters:
      - in: path
        name: roomId
        required: true
        schema: { type: integer }
        description: 聊天室編號。
        example: 7

    get:
      summary: 取得訊息
      operationId: listChatMessages
      tags: [chat]
      description: |
        依查詢參數決定取得的範圍，三者同時帶入時優先順序為 `after_id`、`before_id`、`before`：

        | 模式 | 參數 | 取得範圍 | 排序 |
        | --- | --- | --- | --- |
        | 最新訊息 | 皆未帶入 | 最近 `limit` 則 | 由舊至新 |
        | 增量更新 | `after_id` | 編號大於 `after_id` 的最早 `limit` 則 | 由舊至新 |
        | 歷史訊息 | `before_id` | 編號小於 `before_id` 的最近 `limit` 則 | 由舊至新 |
        | 歷史訊息（舊版） | `before` | 早於該時間的最近 `limit` 則 | 由舊至新 |

        三種模式的回應皆已排序為由舊至新，可直接依序渲染。
        增量更新模式下 `has_more` 固定為 false；若回傳則數等於 `limit`，請以最新一則的編號再次呼叫。
        `recalled_ids` 僅在增量更新模式下有值。

        本端點具副作用：一對一會將由對方發送的未讀訊息標記為已讀；群組會將請求者的已讀位置更新為本次回傳的最大訊息編號
        （不會倒退）。回應中的 `is_read` 與 `my_last_read_message_id` 為標記之前的狀態。
        帶入 `mark_read=false` 時兩者皆不更新。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: 單次載入的訊息則數，超過 200 以 200 計。
        - in: query
          name: after_id
          schema: { type: integer, minimum: 0 }
          description: 僅取編號大於此值的訊息，供輪詢新訊息使用。
          example: 301
        - in: query
          name: mark_read
          schema: { type: boolean, default: true }
          description: 設為 `false` 時僅讀取不標記已讀，供聊天列表長按預覽使用，對方不會看到「已讀」。
          example: false
        - in: query
          name: before_id
          schema: { type: integer, minimum: 1 }
          description: 僅取編號小於此值的訊息，供分頁載入歷史訊息使用。
          example: 251
        - in: query
          name: before
          schema: { type: string, format: date-time }
          description: 僅取早於此時間點的訊息。建議改用 `before_id`。
          example: '2025-09-11T14:30:00.000Z'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  partner:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/ChatPartner' }]
                    description: 一對一的對話對象，供顯示聊天室標題與頭像；群組為 `null`。
                  book:
                    type: object
                    nullable: true
                    description: 一對一聊天室最後關聯的商品，可固定呈現於介面頂部；群組為 `null`。
                    properties:
                      book_id: { type: integer }
                      title: { type: string }
                      price: { type: string }
                      book_images:
                        type: array
                        items:
                          type: object
                          properties:
                            image_url: { type: string }
                  meta:
                    type: object
                    properties:
                      read_upto:
                        type: integer
                        description: 一對一為請求者發送、且對方已讀的最後一則訊息編號；群組為其他成員中最大的已讀位置。無則為 0。
                        example: 298
                      my_last_read_message_id:
                        type: integer
                        nullable: true
                        description: 群組中請求者本次標記前的已讀位置；一對一為 `null`。
                        example: 296
                      members_read:
                        type: array
                        description: 其他現任成員的已讀位置；一對一為對方一筆，值同 `read_upto`。
                        items:
                          type: object
                          properties:
                            user_id: { type: integer, example: 8 }
                            last_read_message_id: { type: integer, example: 298 }
                      partner_typing:
                        type: boolean
                        description: 一對一：對方在 6 秒內回報過正在輸入。任一方封鎖另一方時固定為 false；群組固定為 false。
                        example: false
                      typing_user_ids:
                        type: array
                        items: { type: integer }
                        description: 6 秒內回報過正在輸入的其他成員。
                        example: [8]
                      aliases:
                        type: object
                        additionalProperties: { type: string }
                        description: 請求者為聊天室成員與本頁訊息發送者設定的自訂暱稱，鍵為使用者編號。
                        example: { '8': 阿華 }
                      edited:
                        type: array
                        description: 近 20 分鐘內被編輯的文字訊息，僅增量更新模式有值。
                        items:
                          type: object
                          properties:
                            message_id: { type: integer, example: 297 }
                            body: { type: string, example: 修改後的內容 }
                            edited_at: { type: string, format: date-time }
                            mentions:
                              type: array
                              description: 編輯後的提及成員，與 `ChatMessage.mentions` 相同。
                              items: { $ref: '#/components/schemas/ChatMention' }
                      transfers:
                        type: array
                        description: 此聊天室最近 30 筆轉帳與請款，依建立時間遞減排序。
                        items: { $ref: '#/components/schemas/ChatTransfer' }
                      room:
                        type: object
                        description: 聊天室標題資訊，每次回應皆帶入。
                        properties:
                          type: { type: string, enum: [direct, group] }
                          title: { type: string, nullable: true, example: 讀書會 }
                          avatar_url: { type: string, nullable: true }
                          member_count: { type: integer, example: 3 }
                      muted:
                        type: boolean
                        description: 請求者已將此聊天室設為靜音。
                        example: false
                      blocked:
                        type: boolean
                        description: 一對一：請求者已封鎖對話對象。群組固定為 false。
                        example: false
                      can_send:
                        type: boolean
                        description: 請求者目前能否在此聊天室傳送訊息。一對一於對方帳號停用、請求者封鎖對方或被對方封鎖時為 false；群組固定為 true。
                        example: true
                      recalled_ids:
                        type: array
                        items: { type: integer }
                        description: 近 70 分鐘內送出、目前已收回的訊息編號，僅增量更新模式有值。
                        example: [297]
                      has_more:
                        type: boolean
                        description: 是否可能還有更早的訊息。增量更新模式固定為 false。
                        example: true
                      reservations:
                        type: array
                        description: 一對一雙方之間最近 30 筆預約（不論哪一方為買家），依建立時間遞減排序；群組為空陣列。
                        items: { $ref: '#/components/schemas/Reservation' }
                  data:
                    type: array
                    description: 訊息清單，由舊至新排序。
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 送出訊息
      operationId: sendChatMessage
      tags: [chat]
      description: |
        送出訊息，同時更新聊天室的活動時間、清除請求者的輸入中狀態並通知其他成員。
        通知的 `related_type` 為 `chat_room`，`related_id` 為聊天室編號。
        一對一的通知標題為發送者暱稱、內文為預覽；群組的通知標題為群組名稱、內文為「發送者暱稱：預覽」。
        靜音只影響手機推播，站內通知照常建立。

        | `message_type` | `content` | 其他欄位 | 通知內容 |
        | --- | --- | --- | --- |
        | `text`（預設） | 訊息文字，不可為空白，上限 2000 字 | － | 前 100 個字元 |
        | `text`（預設）＋提及 | 同上 | `mentions`（僅群組） | 被提及者為「{發送者} 提及了您：預覽」 |
        | `image` | `POST /api/uploads/chat-image` 回傳的路徑 | － | `[圖片]` |
        | `album` | 2 至 20 個 `POST /api/uploads/chat-image` 回傳的路徑（陣列） | － | `[圖片] 3 張` |
        | `voice` | `POST /api/uploads/voice` 回傳的路徑 | `duration` 必填 | `[語音] 8 秒` |

        圖片（含相簿）與語音的路徑必須分別位於 `/uploads/chat/` 與 `/uploads/voice/`，其他來源的路徑回傳 400。
        單張圖片請使用 `image`。`system` 與其他未列出的值一律回傳 400；商品卡片與預約卡片由專屬端點產生。

        相簿與語音訊息在資料表中以 `system` 型別儲存，回應的 `kind` 分別為 `album`、`voice`。
        提及的規則與通知見「Mentions」一節；伺服器尚未執行資料庫更新 010 時，帶有提及的訊息回傳 503 `CHAT_V3_UNAVAILABLE`。

        一對一時，對方帳號已停權、列入黑名單或已封鎖請求者時回傳 400 `RECIPIENT_UNAVAILABLE`；
        請求者已封鎖對方時回傳 403 `CHAT_BLOCKED`。群組不檢查封鎖關係。
        每位使用者每分鐘最多 60 次，與建立預約、轉帳、請款、建立群組與邀請成員共用計數。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  oneOf:
                    - type: string
                      maxLength: 2000
                    - type: array
                      minItems: 2
                      maxItems: 20
                      items: { type: string }
                  description: 訊息文字，或圖片、語音的相對路徑；相簿為圖片相對路徑的陣列。
                  example: 請問這本還在嗎？
                message_type:
                  type: string
                  enum: [text, image, album, voice]
                  default: text
                mentions:
                  type: array
                  maxItems: 20
                  description: 提及的成員，僅限群組的文字訊息。規則見「Mentions」一節。
                  items: { $ref: '#/components/schemas/ChatMention' }
                  example: [{ user_id: 8, start: 0, length: 3 }]
                reply_to_id:
                  type: integer
                  nullable: true
                  description: 回覆的訊息編號，必須屬於同一聊天室。伺服器尚未執行資料庫更新 008 時忽略此欄位。
                  example: 298
                duration:
                  type: integer
                  minimum: 1
                  maximum: 120
                  description: 語音長度（秒），`message_type` 為 `voice` 時必填，小數四捨五入。
                  example: 8
            examples:
              文字:
                value: { content: 請問這本還在嗎？ }
              提及成員:
                value: { content: '@小華 @所有人 週六見', mentions: [{ user_id: 8, start: 0, length: 3 }, { user_id: 0, start: 4, length: 4 }] }
              圖片:
                value: { message_type: image, content: /uploads/chat/1736512345678-123456789.jpg }
              相簿:
                value: { message_type: album, content: [/uploads/chat/1736512345678-123456789.jpg, /uploads/chat/1736512345679-987654321.jpg] }
              語音:
                value: { message_type: voice, content: /uploads/voice/1736512345678-123456789.m4a, duration: 8 }
      responses:
        '201':
          description: 已送出。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 訊息內容或型別不正確，或對方帳號無法接收訊息。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                內容為空:
                  value: { success: false, message: 訊息內容不可為空 }
                型別不支援:
                  value: { success: false, message: '不支援此訊息類型' }
                圖片未經上傳端點:
                  value: { success: false, message: 圖片請先透過 /api/uploads/chat-image 上傳 }
                相簿張數不正確:
                  value: { success: false, message: 相簿須包含 2 至 20 張圖片 }
                提及不正確:
                  value: { success: false, message: 提及的成員資料不正確 }
                一對一提及:
                  value: { success: false, message: 僅群組聊天室可提及成員 }
                非文字提及:
                  value: { success: false, message: 僅文字訊息可提及成員 }
                回覆的訊息不存在或不可見:
                  value: { success: false, message: 找不到要回覆的訊息 }
                語音過長:
                  value: { success: false, message: 語音最長 120 秒 }
                對方帳號停用:
                  value: { success: false, code: RECIPIENT_UNAVAILABLE, message: 對方帳號目前無法接收訊息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者非該聊天室的成員，或已封鎖對方。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                非成員:
                  value: { success: false, message: 存取被拒 }
                已封鎖對方:
                  value: { success: false, code: CHAT_BLOCKED, message: 您已封鎖此使用者，解除封鎖後才能傳送訊息 }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV3Unavailable' }

  /api/chat/rooms/{roomId}/typing:
    post:
      summary: 回報輸入中狀態
      operationId: setChatTyping
      tags: [chat]
      description: |
        回報請求者正在輸入。狀態保存 6 秒，其他成員於此期間取得訊息時 `meta.typing_user_ids` 包含請求者，
        一對一另以 `meta.partner_typing` 表示。

        使用者持續輸入時建議每 3 至 4 秒呼叫一次；清空輸入框或離開畫面時帶入
        `typing: false` 立即清除。送出訊息時伺服器會自動清除。

        狀態保存在伺服器行程內，重啟後歸零。每位使用者每分鐘最多 40 次。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                typing:
                  type: boolean
                  default: true
                  description: 僅布林值 `false` 會清除狀態，其餘一律視為正在輸入。
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{roomId}/messages/{messageId}/recall:
    post:
      summary: 收回訊息
      operationId: recallChatMessage
      tags: [chat]
      description: |
        收回自己在 1 小時內送出的文字、圖片、相簿或語音訊息。商品卡片、預約卡片與轉帳卡片無法收回。
        群組中已退出的成員無法收回；早於請求者可見範圍的訊息回傳 404。文字訊息的提及一併清除。

        收回後訊息內容直接被取代，原始內容不保留，雙方看到的 `kind` 皆為 `recalled`。
        對方透過增量更新的 `meta.recalled_ids` 得知，或於重新載入訊息時看到。
        已上傳的圖片與語音檔案不會被刪除。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
        - in: path
          name: messageId
          required: true
          schema: { type: integer }
          description: 訊息編號。
          example: 301
      responses:
        '200':
          description: 已收回。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訊息已收回 }
                  data: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 訊息類型無法收回，或已超過 1 小時。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                類型無法收回:
                  value: { success: false, message: 此類訊息無法收回 }
                超過時限:
                  value: { success: false, code: RECALL_WINDOW_PASSED, message: 僅能收回 1 小時內傳送的訊息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 訊息並非請求者發送。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅能收回自己傳送的訊息 }
        '404':
          description: 訊息不存在，或不屬於該聊天室。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此訊息 }
        '409':
          description: 訊息已經收回。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此訊息已收回 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{roomId}/reservations:
    post:
      summary: 預約書籍
      operationId: createReservation
      tags: [chat]
      description: |
        買家在與賣家的一對一聊天室中預約對方上架的書，建立狀態為 `pending` 的預約，
        於聊天室插入一則預約卡片，並通知賣家。群組聊天室回傳 400。

        限制條件：

        - 書籍的賣家必須是這個聊天室的另一位成員，且不能預約自己的書
        - 書籍狀態須為 `on_sale` 且未被下架處分
        - 已被其他買家保留中時回傳 409 `BOOK_RESERVED`
        - 同一本書已有自己 `pending` 或保留中的預約時回傳 409
        - 同時最多 5 筆 `pending` 或 `confirmed` 的預約

        每位使用者每分鐘最多 60 次，與送出訊息共用計數。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id, hours]
              properties:
                book_id: { type: integer, example: 101 }
                hours:
                  type: integer
                  enum: [24, 48, 72]
                  description: 希望賣家保留的時數，自賣家接受時起算。
                  example: 48
                message: { type: string, maxLength: 200, description: 給賣家的備註。, example: 週六下午可以取書 }
            example: { book_id: 101, hours: 48, message: 週六下午可以取書 }
      responses:
        '201':
          description: 已送出預約。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已送出預約，等待賣家回覆 }
                  data: { $ref: '#/components/schemas/Reservation' }
        '400':
          description: 參數錯誤或不符合預約條件。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                保留時數不支援:
                  value: { success: false, message: 保留時間僅接受：24、48、72 小時 }
                預約自己的書:
                  value: { success: false, message: 不能預約自己上架的書 }
                賣家不在聊天室:
                  value: { success: false, message: 只能在和這本書的賣家的聊天室裡預約 }
                書籍無法預約:
                  value: { success: false, message: 這本書目前無法預約 }
                超過上限:
                  value: { success: false, message: 同時最多只能有 5 筆進行中的預約 }
                群組聊天室:
                  value: { success: false, message: 群組聊天室不支援預約 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 聊天室或書籍不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到這本書 }
        '409':
          description: 書籍已被其他買家保留，或已有自己的進行中預約。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                已被其他買家保留:
                  value: { success: false, code: BOOK_RESERVED, message: 《挪威的森林》已經被其他買家預約，保留到 9/16 18:30 }
                等待回覆中:
                  value: { success: false, message: 你已經送出預約，正在等賣家回覆 }
                已保留:
                  value: { success: false, message: 你已經預約了這本書 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/reservations/{id}:
    patch:
      summary: 回覆或取消預約
      operationId: respondReservation
      tags: [chat]
      description: |
        | `action` | 執行者 | 適用狀態 | 結果 |
        | --- | --- | --- | --- |
        | `accept` | 賣家 | `pending` | `confirmed`，設定 `pickup_deadline` |
        | `decline` | 賣家 | `pending` | `cancelled`，`closed_by` 為 `seller` |
        | `cancel` | 買家或賣家 | `pending`、保留中的 `confirmed` | `cancelled`，`closed_by` 為執行者 |

        接受時，書籍須仍為 `on_sale` 且未被其他買家保留；同一本書其他 `pending` 的預約會自動取消並通知其買家。
        每個動作皆通知另一方。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 預約編號。
          example: 14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, decline, cancel], example: accept }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, enum: [已接受預約, 已婉拒預約, 已取消預約], example: 已接受預約 }
                  data: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者不是這筆預約的買賣雙方，或非賣家卻嘗試接受、婉拒。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                非當事人:
                  value: { success: false, message: 這不是你的預約 }
                非賣家:
                  value: { success: false, message: 只有賣家可以回覆預約 }
        '404':
          description: 預約不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到這筆預約 }
        '409':
          description: 預約狀態已變更，或書籍已無法保留。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                狀態已變更:
                  value: { success: false, message: 這筆預約的狀態已經變更，請重新整理 }
                書籍已下架或售出:
                  value: { success: false, message: 這本書已經不在架上，無法接受預約 }
                已被其他買家保留:
                  value: { success: false, code: BOOK_RESERVED, message: 《挪威的森林》已經被其他買家預約，保留到 9/16 18:30 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{roomId}/mute:
    put:
      summary: 設定聊天室靜音
      operationId: setChatRoomMute
      tags: [chat]
      description: |
        設定請求者對此聊天室（一對一或群組）的靜音狀態。靜音後新訊息不發送手機推播，站內通知與未讀數不受影響。
        僅影響請求者本人，對方不會得知。重複設定相同狀態不會出錯。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: boolean, description: true 為靜音，false 為取消靜音。, example: true }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已將此聊天室設為靜音 }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 7 }
                      muted: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatControlsUnavailable' }

  /api/chat/blocks:
    get:
      summary: 取得封鎖名單
      operationId: listChatBlocks
      tags: [chat]
      description: 依封鎖時間遞減排序，無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/UserBrief' }
                        - type: object
                          properties:
                            blocked_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatControlsUnavailable' }

  /api/chat/blocks/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
        description: 對象的使用者編號。
        example: 8

    put:
      summary: 封鎖使用者
      operationId: blockChatUser
      tags: [chat]
      description: |
        封鎖後雙方皆無法傳送訊息給對方，詳見本節開頭說明。重複封鎖不會出錯。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已封鎖。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已封鎖此使用者 }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer, example: 8 }
                      blocked: { type: boolean, example: true }
        '400':
          description: 對象為請求者自身。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 無法封鎖自己 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 使用者不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到該使用者 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatControlsUnavailable' }

    delete:
      summary: 解除封鎖
      operationId: unblockChatUser
      tags: [chat]
      description: 對象不在封鎖名單中時同樣回傳 200。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已解除封鎖。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已解除封鎖 }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer, example: 8 }
                      blocked: { type: boolean, example: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatControlsUnavailable' }

  /api/chat/rooms/{roomId}:
    get:
      summary: 取得聊天室資訊
      operationId: getChatRoom
      tags: [chat]
      description: |
        取得聊天室設定頁所需的資訊。群組回傳現任成員與請求者的角色；一對一回傳雙方與對方的自訂暱稱。
        伺服器尚未執行資料庫更新 009 時仍可取得一對一聊天室資訊（`pinned` 固定為 false）。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ChatRoomDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者不是聊天室的現任成員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 存取被拒 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{roomId}/pin:
    put:
      summary: 釘選聊天室
      operationId: setChatRoomPin
      tags: [chat]
      description: |
        設定請求者對此聊天室的釘選狀態，僅影響請求者本人的列表排序。每人最多釘選 10 個聊天室，
        已退出的群組不計入。重複釘選不會出錯，並保留原本的 `pinned_at`。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean, description: true 為釘選，false 為取消釘選。, example: true }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, enum: [已釘選聊天室, 已取消釘選], example: 已釘選聊天室 }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 7 }
                      pinned: { type: boolean, example: true }
                      pinned_at: { type: string, format: date-time, nullable: true }
        '400':
          description: 參數錯誤，或已達釘選上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                參數錯誤:
                  value: { success: false, message: pinned 必須為布林值 }
                超過上限:
                  value: { success: false, code: PIN_LIMIT, message: 最多僅能釘選 10 個聊天室 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/aliases/{userId}:
    put:
      summary: 設定自訂暱稱
      operationId: setChatAlias
      tags: [chat]
      description: |
        為指定使用者設定只有請求者看得到的顯示名稱，一對一與群組共用。
        `alias` 為空字串或 `null` 時移除。前後空白會被去除，上限 30 字。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
          description: 對象的使用者編號。
          example: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias]
              properties:
                alias: { type: string, nullable: true, maxLength: 30, example: 阿華 }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, enum: [已設定暱稱, 已移除暱稱], example: 已設定暱稱 }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer, example: 8 }
                      alias: { type: string, nullable: true, example: 阿華 }
        '400':
          description: 參數錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                超過長度:
                  value: { success: false, message: 暱稱不可超過 30 個字 }
                對象為自己:
                  value: { success: false, message: 無法為自己設定暱稱 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 使用者不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到該使用者 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/rooms/{roomId}/messages/{messageId}:
    patch:
      summary: 編輯訊息
      operationId: editChatMessage
      tags: [chat]
      description: |
        編輯自己在 15 分鐘內送出的文字訊息，內容為 1 至 2000 字。編輯後 `edited_at` 更新，
        其他成員透過增量更新的 `meta.edited` 得知。一對一時封鎖規則與送出訊息相同。

        群組可一併帶入 `mentions`，規則與送出訊息相同；未帶入或為空陣列時清除原有的提及。
        編輯不會再次發送提及通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
        - in: path
          name: messageId
          required: true
          schema: { type: integer }
          description: 訊息編號。
          example: 301
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 2000, example: '@小華 請問這本書還在嗎？' }
                mentions:
                  type: array
                  maxItems: 20
                  description: 編輯後的提及成員，僅限群組；未帶入時清除。
                  items: { $ref: '#/components/schemas/ChatMention' }
                  example: [{ user_id: 8, start: 0, length: 3 }]
      responses:
        '200':
          description: 已編輯，回傳更新後的訊息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 訊息已編輯 }
                  data: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 內容或提及不正確、訊息不是文字，或已超過 15 分鐘。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                內容為空:
                  value: { success: false, message: 訊息內容不可為空 }
                非文字訊息:
                  value: { success: false, message: 僅能編輯文字訊息 }
                超過時限:
                  value: { success: false, code: EDIT_WINDOW_PASSED, message: 僅能編輯 15 分鐘內傳送的訊息 }
                提及不正確:
                  value: { success: false, message: 提及的成員資料不正確 }
                一對一提及:
                  value: { success: false, message: 僅群組聊天室可提及成員 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 訊息並非請求者發送、請求者不是成員，或一對一已封鎖對方。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅能編輯自己傳送的訊息 }
        '404':
          description: 訊息不存在，或不屬於該聊天室。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此訊息 }
        '409':
          description: 訊息已收回。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此訊息已收回 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV3Unavailable' }

  /api/chat/groups:
    post:
      summary: 建立群組
      operationId: createChatGroup
      tags: [chat]
      description: |
        建立群組聊天室，請求者為管理員（`owner`）。插入「{建立者} 建立了群組」的 `notice` 訊息並通知受邀成員。

        - `member_ids` 為 1 至 50 位成員，不可包含請求者，重複的編號視為一位
        - 成員須為存在且未停權、未列入黑名單的帳號，否則整筆回傳 400
        - `avatar_url` 須為 `POST /api/uploads/chat-image` 回傳的路徑
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, member_ids]
              properties:
                name: { type: string, minLength: 1, maxLength: 50, example: 讀書會 }
                member_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: integer }
                  example: [8, 15]
                avatar_url: { type: string, nullable: true, example: /uploads/chat/1736512345678-123456789.jpg }
      responses:
        '201':
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已建立群組 }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 21 }
        '400':
          description: 參數錯誤或成員無效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                名稱空白:
                  value: { success: false, message: 請輸入群組名稱 }
                人數過多:
                  value: { success: false, message: 一次最多邀請 50 人 }
                包含自己:
                  value: { success: false, message: 成員名單不可包含自己 }
                成員無效:
                  value: { success: false, message: 成員名單包含無法加入群組的帳號 }
                頭貼未經上傳端點:
                  value: { success: false, message: 群組頭貼請先透過 /api/uploads/chat-image 上傳 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/groups/{roomId}:
    patch:
      summary: 修改群組資訊
      operationId: updateChatGroup
      tags: [chat]
      description: |
        任何成員皆可修改群組名稱或頭貼，至少提供一個欄位。實際變更時分別插入
        「{成員} 將群組名稱變更為「…」」、「{成員} 變更了群組頭貼」的 `notice` 訊息；值未變更時不插入。
        `avatar_url` 為 `null` 或空字串時移除頭貼。回傳更新後的聊天室資訊。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 群組的聊天室編號。
          example: 21
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 50, example: 週末讀書會 }
                avatar_url: { type: string, nullable: true, example: /uploads/chat/1736512345678-123456789.jpg }
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已更新群組資訊 }
                  data: { $ref: '#/components/schemas/ChatRoomDetail' }
        '400':
          description: 參數錯誤，或聊天室不是群組。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                未提供欄位:
                  value: { success: false, message: 請提供群組名稱或頭貼 }
                不是群組:
                  value: { success: false, message: 此操作僅適用於群組聊天室 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/groups/{roomId}/members:
    post:
      summary: 邀請成員
      operationId: addChatGroupMembers
      tags: [chat]
      description: |
        任何成員皆可邀請，一次 1 至 50 人，已在群組中的使用者略過；曾退出或被移除的使用者可再次加入。
        加入後群組不可超過 100 人。插入「{成員} 邀請 {A}、{B} 加入群組」的 `notice` 訊息並通知新成員。
        新成員的未讀與可見範圍皆自此則 `notice` 起算，看不到加入前的訊息（見「History」一節）。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 群組的聊天室編號。
          example: 21
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: integer }
                  example: [23, 31]
      responses:
        '200':
          description: 已處理。所選成員皆已在群組中時 `added_user_ids` 為空陣列。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, enum: [已邀請成員加入群組, 所選成員皆已在群組中], example: 已邀請成員加入群組 }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 21 }
                      added_user_ids: { type: array, items: { type: integer }, example: [31] }
        '400':
          description: 參數錯誤、成員無效，或超過成員上限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                成員無效:
                  value: { success: false, message: 成員名單包含無法加入群組的帳號 }
                超過上限:
                  value: { success: false, code: GROUP_MEMBER_LIMIT, message: 群組成員上限為 100 人 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/groups/{roomId}/members/{userId}:
    patch:
      summary: 變更成員權限
      operationId: updateChatGroupMemberRole
      tags: [chat]
      description: |
        管理員（`owner`）將現任成員設為管理員或解除其管理員身分，群組可有多位管理員。無法變更自己的角色。
        實際變更時插入「{管理員} 將 {成員} 設為管理員」或「{管理員} 解除 {成員} 的管理員身分」的 `notice` 訊息；
        角色未變更時直接回傳 200，不插入訊息。回傳更新後的聊天室資訊，格式與 `GET /api/chat/rooms/{roomId}` 相同。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 群組的聊天室編號。
          example: 21
        - in: path
          name: userId
          required: true
          schema: { type: integer }
          description: 要變更權限的使用者編號。
          example: 31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, member], description: '`owner` 為管理員。', example: owner }
      responses:
        '200':
          description: 已變更（或角色未變更）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, enum: [已設為管理員, 已解除管理員身分], example: 已設為管理員 }
                  data: { $ref: '#/components/schemas/ChatRoomDetail' }
        '400':
          description: 參數錯誤、變更自己的角色，或聊天室不是群組。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                角色不正確:
                  value: { success: false, message: '成員角色不正確' }
                變更自己:
                  value: { success: false, message: 無法變更自己的管理員身分 }
                不是群組:
                  value: { success: false, message: 此操作僅適用於群組聊天室 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者不是成員，或不是管理員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅群組管理員可變更成員權限 }
        '404':
          description: 群組不存在，或對象不是現任成員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此使用者不是群組成員 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

    delete:
      summary: 移除成員
      operationId: removeChatGroupMember
      tags: [chat]
      description: |
        僅管理員（`owner`）可移除一般成員；無法移除自己，也無法移除其他管理員（須先解除其管理員身分）。
        被移除者立即失去存取權，其釘選一併移除，並插入「{管理員} 將 {成員} 移出群組」的 `notice` 訊息。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 群組的聊天室編號。
          example: 21
        - in: path
          name: userId
          required: true
          schema: { type: integer }
          description: 要移除的使用者編號。
          example: 31
      responses:
        '200':
          description: 已移除。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已將成員移出群組 }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 21 }
                      user_id: { type: integer, example: 31 }
        '400':
          description: 嘗試移除管理員或自己，或聊天室不是群組。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                移除管理員:
                  value: { success: false, message: 無法移除管理員，請先解除其管理員身分 }
                移除自己:
                  value: { success: false, message: 無法將自己移出群組，請改用退出群組 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者不是成員，或不是管理員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅群組管理員可移除成員 }
        '404':
          description: 群組不存在，或對象不是現任成員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 此使用者不是群組成員 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/groups/{roomId}/leave:
    post:
      summary: 退出群組
      operationId: leaveChatGroup
      tags: [chat]
      description: |
        請求者退出群組並移除其釘選，插入「{成員} 已退出群組」的 `notice` 訊息。
        管理員退出且群組中沒有其他管理員時，由加入最早的現任成員接任；仍有其他管理員時不移交。
        最後一位成員退出時刪除聊天室與全部訊息，`deleted` 為 true。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 群組的聊天室編號。
          example: 21
      responses:
        '200':
          description: 已退出。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已退出群組 }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 21 }
                      deleted: { type: boolean, example: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/rooms/{roomId}/transfers:
    post:
      summary: 轉帳代幣
      operationId: createChatTransfer
      tags: [chat]
      description: |
        請求者將代幣轉給聊天室成員，須帶 `payment` 範圍的 `X-Verify-Token`。參數格式錯誤時先回傳 400，不要求驗證。

        在同一個資料庫交易中扣除請求者餘額（`transfer_out`，說明「轉帳給 {暱稱}」）、增加對方餘額
        （`transfer_in`，說明「{暱稱} 轉帳」）、建立狀態為 `completed` 的轉帳並插入轉帳卡片，
        任一步驟失敗時全部復原。完成後通知收款方。

        一對一可省略 `to_user_id`（即對方）；群組必須指定現任成員。
        每位使用者每分鐘最多 60 次，與送出訊息共用計數。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
        - $ref: '#/components/parameters/VerifyToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                to_user_id: { type: integer, nullable: true, description: 收款方。一對一可省略。, example: 8 }
                amount: { type: integer, minimum: 1, maximum: 100000, example: 180 }
                note: { type: string, nullable: true, maxLength: 100, example: 挪威的森林 }
      responses:
        '201':
          description: 已轉帳。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 轉帳完成 }
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/ChatTransfer' }
                      message: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 參數錯誤、對象無效、餘額不足，或對方無法接收。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                金額錯誤:
                  value: { success: false, message: 金額必須是 1 ~ 100000 之間的整數 }
                對象為自己:
                  value: { success: false, message: 無法轉帳給自己 }
                未指定對象:
                  value: { success: false, message: 請指定對象 }
                對象不是成員:
                  value: { success: false, message: 對象不是此聊天室的成員 }
                餘額不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣餘額不足 }
                對方無法接收:
                  value: { success: false, code: RECIPIENT_UNAVAILABLE, message: 對方帳號目前無法接收訊息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 需要交易驗證、請求者不是成員，或一對一已封鎖對方。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                需要驗證:
                  value: { success: false, code: VERIFICATION_REQUIRED, message: 請輸入交易密碼以完成付款, verification: { scope: payment, methods: [pin, biometric] } }
                已封鎖對方:
                  value: { success: false, code: CHAT_BLOCKED, message: 您已封鎖此使用者，解除封鎖後才能傳送訊息 }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/rooms/{roomId}/transfer-requests:
    post:
      summary: 請款
      operationId: createChatTransferRequest
      tags: [chat]
      description: |
        請求者向聊天室成員請款，建立狀態為 `pending`、72 小時後到期的請款並插入轉帳卡片，通知付款方。
        此時不異動任何餘額，不需交易驗證。

        一對一可省略 `from_user_id`（即對方）；群組必須指定現任成員。封鎖與帳號停用的規則同轉帳。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                from_user_id: { type: integer, nullable: true, description: 付款方。一對一可省略。, example: 8 }
                amount: { type: integer, minimum: 1, maximum: 100000, example: 180 }
                note: { type: string, nullable: true, maxLength: 100, example: 上次代購的書 }
      responses:
        '201':
          description: 已送出請款。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已送出請款 }
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/ChatTransfer' }
                      message: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 參數錯誤、對象無效，或對方無法接收。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                對象為自己:
                  value: { success: false, message: 無法向自己請款 }
                對方無法接收:
                  value: { success: false, code: RECIPIENT_UNAVAILABLE, message: 對方帳號目前無法接收訊息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/transfers/{id}/pay:
    post:
      summary: 支付請款
      operationId: payChatTransferRequest
      tags: [chat]
      description: |
        付款方支付狀態為 `pending` 且未到期的請款，須帶 `payment` 範圍的 `X-Verify-Token`。
        以「狀態仍為 `pending`」為條件更新後才扣款入帳，同一筆請款被重複或並行支付時僅一次成功，
        其餘回傳 409 `TRANSFER_STATE_CHANGED`。餘額不足時請款維持 `pending`。完成後通知請款人。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 轉帳的 `transfer_id`。
          example: 31
        - $ref: '#/components/parameters/VerifyToken'
      responses:
        '200':
          description: 已付款。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 付款完成 }
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/ChatTransfer' }
        '400':
          description: 餘額不足，或請款人帳號無法接收。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                餘額不足:
                  value: { success: false, code: INSUFFICIENT_BALANCE, message: 代幣餘額不足 }
                對方無法接收:
                  value: { success: false, code: RECIPIENT_UNAVAILABLE, message: 對方帳號目前無法接收訊息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 需要交易驗證、請求者不是付款方，或一對一已封鎖請款人。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅付款方可支付此請款 }
        '404':
          description: 請款不存在，或請求者不是當事人。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 找不到此筆請款 }
        '409':
          description: 請款已被處理、已到期，或不是請款。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: TRANSFER_STATE_CHANGED, message: 此筆請款狀態已變更，請重新整理 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/transfers/{id}/decline:
    post:
      summary: 婉拒請款
      operationId: declineChatTransferRequest
      tags: [chat]
      description: 付款方婉拒狀態為 `pending` 且未到期的請款，狀態改為 `declined` 並通知請款人。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 轉帳的 `transfer_id`。
          example: 31
      responses:
        '200':
          description: 已婉拒。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已婉拒請款 }
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/ChatTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者不是付款方。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅付款方可婉拒此請款 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 請款已被處理或已到期。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: TRANSFER_STATE_CHANGED, message: 此筆請款狀態已變更，請重新整理 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/transfers/{id}/cancel:
    post:
      summary: 取消請款
      operationId: cancelChatTransferRequest
      tags: [chat]
      description: 請款人取消狀態為 `pending` 且未到期的請款，狀態改為 `cancelled`，不通知付款方。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 轉帳的 `transfer_id`。
          example: 31
      responses:
        '200':
          description: 已取消。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 已取消請款 }
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/ChatTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者不是請款人。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 僅請款人可取消此請款 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 請款已被處理或已到期。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, code: TRANSFER_STATE_CHANGED, message: 此筆請款狀態已變更，請重新整理 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChatV2Unavailable' }

  /api/chat/link-preview:
    get:
      summary: 取得連結預覽
      operationId: getChatLinkPreview
      tags: [chat]
      description: |
        由伺服器抓取網址的標題、描述與圖片，規則見「Link Previews」一節。
        抓取失敗或不適合預覽時仍回傳 200，`data` 為 `null`。每位使用者每分鐘 30 次。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, maxLength: 2048 }
          description: 訊息中的網址（含 `http://` 或 `https://`）。
          example: https://api.savemybook.today/b/0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: 成功；無法預覽時 `data` 為 `null`。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/LinkPreview' }
                    nullable: true
              examples:
                web:
                  summary: 一般網站
                  value:
                    success: true
                    data:
                      url: https://blog.example.com/used-book-pricing
                      site_name: 書店部落格
                      title: 二手書交易指南
                      description: 如何為舊書訂出合理價格
                      image_url: /api/chat/link-preview/image?u=aHR0cHM6Ly9jZG4uZXhhbXBsZS5jb20vY292ZXIuanBn.Qm9vZ3VzU2lnbmF0dXJlRXhhbXBsZQ
                      kind: web
                book:
                  summary: 站內書籍
                  value:
                    success: true
                    data:
                      url: https://api.savemybook.today/b/0123456789abcdef0123456789abcdef
                      site_name: 救「舊」我的書
                      title: 深入淺出統計學
                      description: 王大明
                      image_url: /uploads/books/1736512345678-987654321.jpg
                      kind: book
                      price: 350
                none:
                  summary: 無法預覽
                  value: { success: true, data: null }
        '400':
          description: 未提供網址或網址超過 2048 字。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請提供網址 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/link-preview/image:
    get:
      summary: 取得連結預覽圖片
      operationId: getChatLinkPreviewImage
      tags: [chat]
      description: |
        以伺服器代為取得預覽圖片，網址由 `GET /api/chat/link-preview` 的 `image_url` 提供，用戶端不應自行組合。
        回應帶 `Cache-Control: private, max-age=86400`。每位使用者每分鐘 120 次。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: u
          required: true
          schema: { type: string }
          description: 伺服器簽章後的圖片網址。
          example: aHR0cHM6Ly9jZG4uZXhhbXBsZS5jb20vY292ZXIuanBn.Qm9vZ3VzU2lnbmF0dXJlRXhhbXBsZQ
      responses:
        '200':
          description: 圖片內容，`Content-Type` 依檔頭判斷。
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 簽章無效或遭竄改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 圖片連結無效 }
        '404':
          description: 無法取得圖片（位址不允許、逾時、超過 3 MB 或格式不符）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 無法載入圖片 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
