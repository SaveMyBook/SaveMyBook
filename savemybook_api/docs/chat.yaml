tags:
  - name: 聊天室 (Chat)
    description: |
      買賣雙方的一對一聊天。

      兩位使用者之間僅存在單一聊天室。自不同商品進入聊天時不會另建聊天室，
      而是於既有對話中插入一則商品卡片，以維持對話脈絡完整。

      商品卡片為 `message_type` 等於 `system` 的訊息，內容格式為
      `[book]` 前綴加一段 JSON：

      ```
      [book]{"book_id":101,"title":"挪威的森林","price":"180.00","image_url":"/uploads/books/a.jpg"}
      ```

      用戶端偵測到 `[book]` 前綴後，解析其後的 JSON 並渲染為卡片。

paths:
  /api/chat/rooms:
    get:
      summary: 取得聊天室列表
      operationId: listChatRooms
      tags: [聊天室 (Chat)]
      description: |
        依最後活動時間遞減排序。回應為整併後的格式而非資料表原始欄位，
        伺服器已判定對話對象並計算未讀則數。無分頁機制。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatRoomSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 開啟（或建立）聊天室
      operationId: createChatRoom
      tags: [聊天室 (Chat)]
      description: |
        與指定使用者建立聊天。聊天室已存在時直接回傳既有的聊天室，
        不會重複建立，因此用戶端可於每次發起對話時直接呼叫。

        帶入 `book_id` 時會於對話中插入一則商品卡片以標示詢問標的。
        若相同卡片已是對話中的最後一則訊息，則不重複插入。

        回應僅含 `room_id`，取得後請呼叫
        `GET /api/chat/rooms/{roomId}/messages` 載入訊息。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, description: 對話對象的使用者編號，不得為請求者自身。, example: 8 }
                book_id:
                  type: integer
                  nullable: true
                  description: 帶入時於對話中插入該書籍的商品卡片。
                  example: 101
            example: { user_id: 8, book_id: 101 }
      responses:
        '200':
          description: 成功。新建聊天室與回傳既有聊天室皆為 200。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      room_id: { type: integer, example: 7 }
        '400':
          description: 參數錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                缺少參數:
                  value: { success: false, message: 請提供 user_id }
                對象為請求者自身:
                  value: { success: false, message: 無法與自己建立聊天室 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/unread-count:
    get:
      summary: 取得聊天未讀數
      operationId: getUnreadChatCount
      tags: [聊天室 (Chat)]
      description: |
        統計全部聊天室中由對方發送且尚未讀取的訊息總數。
        請求者自行發送的訊息不計入。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer, example: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/read-all:
    patch:
      summary: 所有聊天室標為已讀
      operationId: markAllChatRead
      tags: [聊天室 (Chat)]
      description: 將全部聊天室中由對方發送的未讀訊息一併標記為已讀。此操作不可復原。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已全部標為已讀。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已全部標為已讀 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{id}:
    delete:
      summary: 刪除聊天室
      operationId: deleteChatRoom
      tags: [聊天室 (Chat)]
      description: |
        刪除範圍及於雙方：聊天室與其下全部訊息均自資料庫移除，
        並非僅自請求者的列表隱藏。此操作不可復原。

        僅聊天室的兩位成員可執行。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: 聊天室編號。
          example: 7
      responses:
        '200':
          description: 已刪除。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
              example: { success: true, message: 已刪除聊天室 }
        '400':
          description: 聊天室編號格式錯誤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 請提供聊天室編號 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 請求者非該聊天室的成員。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 你沒有權限刪除這個聊天室 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/chat/rooms/{roomId}/messages:
    parameters:
      - in: path
        name: roomId
        required: true
        schema: { type: integer }
        description: 聊天室編號。
        example: 7

    get:
      summary: 取得訊息
      operationId: listChatMessages
      tags: [聊天室 (Chat)]
      description: |
        回傳最近 `limit` 則訊息，已重新排序為由舊至新，可直接依序渲染。

        載入更早的訊息時，將目前最舊一則的 `created_at` 帶入 `before` 參數。

        本端點具副作用：呼叫後會將該聊天室中由對方發送的未讀訊息標記為已讀，
        無須另行呼叫已讀端點。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
          description: 單次載入的訊息則數。
        - in: query
          name: before
          schema: { type: string, format: date-time }
          description: 僅取早於此時間點的訊息，供分頁載入歷史訊息使用。
          example: '2025-09-11T14:30:00.000Z'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  partner:
                    allOf: [{ $ref: '#/components/schemas/UserBrief' }]
                    description: 對話對象的資訊，供顯示聊天室標題與頭像。
                  book:
                    type: object
                    nullable: true
                    description: 該聊天室最後關聯的商品，可固定呈現於介面頂部。
                    properties:
                      book_id: { type: integer }
                      title: { type: string }
                      price: { type: string }
                      book_images:
                        type: array
                        items:
                          type: object
                          properties:
                            image_url: { type: string }
                  data:
                    type: array
                    description: 訊息清單，由舊至新排序。
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      summary: 送出訊息
      operationId: sendChatMessage
      tags: [聊天室 (Chat)]
      description: |
        送出訊息，同時更新聊天室的活動時間並通知對方。
        通知的 `related_type` 為 `chat_room`，`related_id` 為聊天室編號。

        通知內容依訊息型別簡化：圖片顯示為 `[圖片]`、商品卡片顯示為 `[商品]`、
        文字訊息取前 100 個字元。

        傳送圖片時，`message_type` 設為 `image`，`content` 帶入圖片的相對路徑，
        該路徑先經 `POST /api/uploads` 上傳取得。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 訊息內容，不可為空白。`message_type` 為 `image` 時帶入圖片路徑。
                  example: 請問這本還在嗎？
                message_type:
                  type: string
                  enum: [text, image, system]
                  default: text
                  description: 未列於列舉的值一律視為 `text`。
      responses:
        '201':
          description: 已送出。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 訊息內容為空。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, message: 訊息內容不可為空 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
